#textdomain wesnoth-ctl

#--------------------
# Single entry point for the whole magic system: one {./magic/_init.cfg} in an
# add-on's _main.cfg is the complete integration. Everything conditional lives
# here rather than in the host add-on -- which context loads the engine, which
# ships the test scenarios, and the [modification] definition itself.
#
#   Chasing_the_Light : the campaign loads the engine; the campaign's own
#                       [campaign] block still expands MAGIC_SYSTEM__GLOBAL_EVENTS
#                       for its scenarios, since only it can add events there.
#   MULTIPLAYER       : engine plus the three test/demo scenarios.
#   CTL_MAGIC_MOD     : the modification; it loads the engine itself only when
#                       neither of the two above already did.
#   EDITOR            : the unit types only, for the editor's unit palette --
#                       no engine, no Lua, no events.
#--------------------

#ifdef Chasing_the_Light
{./_load.cfg}
#endif

#ifdef MULTIPLAYER
{./_load.cfg}
{./scenarios/98_MP_Test.cfg}
{./scenarios/97_AI_Battle.cfg}
{./scenarios/96_Spell_Test.cfg}
#endif

#ifdef CTL_MAGIC_MOD
#ifndef Chasing_the_Light
#ifndef MULTIPLAYER
{./_load.cfg}
#endif
#endif
{./mod/mod.cfg}
#endif

#ifdef EDITOR
#--------------------
# Elementals, Brazier, Phylactery and the polymorph forms are unit types like
# any other, so the editor should be able to place them. They reach for nothing
# but mainline macros, which means the art path and the [units] block are the
# whole of it -- none of _load.cfg's Lua or spell definitions is pulled in.
#--------------------
[binary_path]
    path=data/add-ons/Chasing_the_Light/magic
[/binary_path]

[+units]
    {./units}
[/units]
#endif

[modification]
    id=ctl_magic_system
    name= _ "Magic System"
    #po: Опис модифікації магічної системи у списку модифікацій
    #po: Без числа заклять навмисно — воно змінюється з кожним оновленням каталогу.
    description= _ "Brings TDG/CtL's spellcasting to any campaign or scenario. Right-click one of your units and choose 'Awaken Magic' to turn it into a caster, then pick its spells freely from the whole catalogue — attacks, spells and passives alike."
    type=hybrid
    require_modification=yes
    define=CTL_MAGIC_MOD

    [options]
        [slider]
            id=ctl_magic_mod_slots
            name= _ "Spell slots per caster"
            description= _ "How many spells each caster chooses. Their spells can be changed later unless that is switched off below."
            min=1
            max=8
            step=1
            default=3
        [/slider]

        [slider]
            id=ctl_magic_mod_casts
            name= _ "Spells cast per turn"
            description= _ "How many spells one caster may cast in a single turn."
            min=1
            max=4
            step=1
            default=1
        [/slider]

        [choice]
            id=ctl_magic_mod_who
            name= _ "Who may become a caster"
            description= _ "Any unit you control, or leaders only."
            default=any
            [item]
                value=any
                name= _ "Any unit"
            [/item]
            [item]
                value=leaders
                name= _ "Leaders only"
            [/item]
        [/choice]

        [choice]
            id=ctl_magic_mod_limit
            name= _ "Casters per side"
            description= _ "How many casters one side may have at a time. A caster that dies frees its place."
            default=3
            [item]
                value=1
                name= _ "1"
            [/item]
            [item]
                value=2
                name= _ "2"
            [/item]
            [item]
                value=3
                name= _ "3"
            [/item]
            [item]
                value=4
                name= _ "4"
            [/item]
            [item]
                value=5
                name= _ "5"
            [/item]
            [item]
                value=6
                name= _ "6"
            [/item]
            [item]
                value=7
                name= _ "7"
            [/item]
            [item]
                value=8
                name= _ "8"
            [/item]
            [item]
                value=9
                name= _ "9"
            [/item]
            [item]
                value=10
                name= _ "10"
            [/item]
            [item]
                value=unlimited
                name= _ "Unlimited"
            [/item]
        [/choice]

        [choice]
            id=ctl_magic_mod_costs
            name= _ "Casting cost"
            description= _ "Spells normally cost experience, gold, hitpoints or the unit's attack. Free casting ignores every cost — the costs are still printed on the spell buttons, they are simply not charged."
            default=free
            [item]
                value=free
                name= _ "Free casting"
            [/item]
            [item]
                value=normal
                name= _ "Normal costs"
            [/item]
        [/choice]

        [slider]
            id=ctl_magic_mod_xp
            name= _ "Experience granted on awakening"
            description= _ "With normal costs, a new caster starts with this much experience to spend on spells. Ignored when casting is free."
            min=0
            max=200
            step=10
            default=40
        [/slider]

        [checkbox]
            id=ctl_magic_mod_change
            name= _ "Spells can be changed later"
            description= _ "Adds a 'Change Spells' button to the casting window, and lets a caster give up magic again (freeing a caster place). Switch off to make every choice final."
            default=yes
        [/checkbox]

        [choice]
            id=ctl_magic_mod_advance
            name= _ "Experience is used for"
            description= _ "Whether a caster spends experience on spells, on spells and AMLAs, or spells and levels up."
            default=levels
            [item]
                value=default
                name= _ "Spells only"
            [/item]
            [item]
                value=amla
                name= _ "Spells + AMLAs"
            [/item]
            [item]
                value=levels
                name= _ "Spells + Level ups"
            [/item]
        [/choice]

        [checkbox]
            id=ctl_magic_mod_ai
            name= _ "Computer players get casters"
            description= _ "Each computer-controlled side's leader becomes a caster with a fixed loadout and casts spells on its own turn."
            default=yes
        [/checkbox]

        [checkbox]
            id=ctl_magic_mod_live
            name= _ "Settings can be changed during play"
            description= _ "Adds a settings button to the spellcasting window, where the host can change the options above without restarting. Switch off to lock the settings for the whole game."
            default=yes
        [/checkbox]
    [/options]

#ifdef CTL_MAGIC_MOD
    # The campaign already adds these to each of its scenarios; everywhere else
    # the modification is what puts the magic system on the map.
#ifndef Chasing_the_Light
    {MAGIC_SYSTEM__GLOBAL_EVENTS}
#endif
    {MAGIC_MOD__EVENTS}
#endif
[/modification]
