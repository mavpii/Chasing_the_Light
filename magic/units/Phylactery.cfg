#textdomain wesnoth-ctl
# Faisim's soul-vessel: a bound skull placed by the Phylactery spell. It does
# nothing on its own (no attack, cannot move). While it stands, Faisim revives at
# it when she is slain; destroy it to make her mortal.
[unit_type]
    id=Phylactery
    name= _ "Phylactery"
    race=undead
    image="units/wesfolk/familiar/familiar-3.png"
    profile="portraits/wesfolk/familiar.webp"
    hitpoints=18
    movement_type=undeadfoot
    movement=0
    max_experience=100
    level=0
    alignment=chaotic
    advances_to=null
    cost=1
    usage=mixed fighter
    do_not_list=yes
    hide_help=yes
    description= _ "A skull of someone Faisim once knew, bound as her soul-vessel. While it stands, death cannot truly claim her — destroy it to make her mortal."
    die_sound=bat-flapping.wav
    [resistance]
        blade=80
        pierce=70
        impact=110
        fire=120
        cold=60
        arcane=140
    [/resistance]
    [standing_anim]
        layer=60
        start_time=0
        [frame]
            image="units/wesfolk/familiar/familiar-[3~1,2~5,4].png:[50,60,80,60,50,60,80,60]"
        [/frame]
    [/standing_anim]
[/unit_type]
