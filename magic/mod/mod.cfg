#textdomain wesnoth-ctl
#
# Magic System — "Free Casters" modification.
#
# Loaded only when the modification is active (CTL_MAGIC_MOD, see _main.cfg).
# The magic system itself is loaded separately, exactly as the campaign and the
# multiplayer scenarios load it; this file only adds the per-scenario glue.

[lua]
    code= <<
        wesnoth.require '~add-ons/Chasing_the_Light/magic/mod/mod.lua'
    >>
[/lua]

#############################
# MAGIC MOD EVENTS
# Expanded inside [modification], so these events are added to every scenario
# the modification is enabled for — the same way [campaign] adds
# MAGIC_SYSTEM__GLOBAL_EVENTS to every scenario of the campaign.
#############################
#define MAGIC_MOD__EVENTS
    #--------------------
    # SETUP
    # Installs the right-click menu item.
    #--------------------
    [event]
        name=prestart
        [magic_mod_setup]
        [/magic_mod_setup]
    [/event]

    #--------------------
    # AI CASTERS
    # On `start`, not prestart: a scenario places its units in its own prestart
    # handler, and handlers run in registration order, so arming any earlier can
    # find an empty map. [modify_ai] here is still well before any AI turn.
    #--------------------
    [event]
        name=start
        [magic_mod_arm_ai]
        [/magic_mod_arm_ai]
    [/event]

    #--------------------
    # MENU REFRESH
    # A menu item's filter keeps whatever $side_number held when the item was
    # created, so the items are rebuilt whenever the turn passes to another side
    # — the same reason caster_set_menu runs on these events. The rest of the
    # filter (side, and the ids already in the caster registry) is matched live,
    # so newly recruited units need no extra refresh.
    #--------------------
    [event]
        name=start,turn refresh
        first_time_only=no
        [magic_mod_menu]
        [/magic_mod_menu]
    [/event]

    #--------------------
    # DESCRIPTION REFRESH
    # refresh_skills is fired (with current_caster set) right after a spell
    # selection is committed, so this is where the caster's dialog text stops
    # asking for a choice and starts explaining how to cast.
    #--------------------
    [event]
        name=refresh_skills
        first_time_only=no
        [magic_mod_refresh_description]
        [/magic_mod_refresh_description]
    [/event]
#enddef
