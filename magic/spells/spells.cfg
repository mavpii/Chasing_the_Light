                        id,affect_self=skirmisher,yes
                    [/skirmisher]
                [/abilities])}
                {EFFECT defense (replace=yes
                    [defense]
                        {FLY_DEFENSE -50} # 50% hit-chance on all terrain
                    [/defense])}
                {EFFECT movement_costs (replace=yes
                    [movement_costs]
                        {FLY_MOVE} # fast movement on most terrains
                    [/movement_costs])}
            [/object]
        [/modify_unit]

        [store_unit]
            {FILTER id=$current_caster}
            variable=levitate_caster
        [/store_unit]
        [if]
        {VARIABLE_CONDITIONAL levitate_caster.level greater_than_equal_to 3}
        [then]
            [modify_unit]
                {FILTER id=$current_caster}
                [object]
                    duration,id=turn,skill_levitate_flight
                    {EFFECT movement (increase=2)}
                [/object]
            [/modify_unit]
        [/then][/if]
        [redraw]
            side=$levitate_caster.side
            clear_shroud=yes
        [/redraw]
        {CLEAR_VARIABLE levitate_caster}
	[/event]
	# kill casters if they were levitating over unwalkable terrain, and is now unable to move
    [event]
        name=skill_levitate_cancel
		first_time_only = no
        [lua]
            code= <<
			    local _ = wesnoth.textdomain "wesnoth-ctl"
                local CasterState = wesnoth.require "~add-ons/Chasing_the_Light/magic/core/state.lua"
                local units = wesnoth.units.find_on_map()

                for i,u in ipairs(units) do
                    if  wml.variables[CasterState.key(u.id)] and wml.variables["side_number"] == u.side then
                        wml.fire.remove_object {
                            object_id = "skill_levitate",
    						id = u.id
                        }
                    end
                end

                units = nil
    	    >>
    	[/lua]
    [/event]
	[event]
        name=turn refresh,skill_levitate_cancel
		first_time_only = no
        [lua]
            code= <<
			    local _ = wesnoth.textdomain "wesnoth-ctl"
                local CasterState = wesnoth.require "~add-ons/Chasing_the_Light/magic/core/state.lua"
                local units = wesnoth.units.find_on_map()

                for i,u in ipairs(units) do
                    if  wml.variables[CasterState.key(u.id)] and wml.variables["side_number"] == u.side then
						local u_temp = wesnoth.units.find_on_map{ id = u.id, defense = 100}[1]
						if u_temp then
                            wml.fire.message {
                                speaker = u.id,
                                message = _"My levitate spell has ended over impassable terrain! I’m falling to my death!"
                            }
                            wml.fire.kill {
                                id = u.id,
                                animate = true,
                                fire_event = true
                            }
                        end
                        u_temp = nil
                    end
                end

                units = nil
    	    >>
    	[/lua]
    [/event]
    [event]
        name=refresh_skills
        first_time_only=no
    	{CHECK_EQUIPPED_SPELL id=$current_caster skill_levitate}
        [if] {VARIABLE_CONDITIONAL equipped_spell_found not_equals yes} {THEN(
            {FIRE_EVENT skill_levitate_cancel}
    	)}
		[/if]
    [/event]
#enddef


