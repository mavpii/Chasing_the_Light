#############################
# MASSHEAL
#############################
#define EVENT_MASSHEAL
    [event]
        name=skill_massheal
        first_time_only=no
		[lua]
            code=<<
                local attacker = wesnoth.units.find_on_map({ id=wml.variables["current_caster"] })[1]
	    		local defenders = wesnoth.units.find_on_map({ 
                    wml.tag.filter_adjacent{ id=attacker.id },
                    wml.tag.filter_side{ wml.tag.allied_with{ side=attacker.side } },
                })
                
                -- animate and deal damage
                local animator = wesnoth.units.create_animator()
				animator:add(  attacker, "healing", "hit", { with_bars=true }  )
				
				animator:run()
                animator:clear()
				
				local animator = wesnoth.units.create_animator()
                for i,defender in ipairs(defenders) do
				    if defender.hitpoints < defender.max_hitpoints then
					    local heal_amount
					    if defender.max_hitpoints - defender.hitpoints < 10 then
					        heal_amount = defender.max_hitpoints - defender.hitpoints
						else heal_amount = 10 end 
                        defender.facing = wesnoth.map.get_relative_dir(defender.x, defender.y, attacker.x, attacker.y)
                        animator:add(  defender, "healed", "hit", { with_bars=true, text=tostring(heal_amount), color={0,255,0} }  )
                        defender.hitpoints = defender.hitpoints + heal_amount
					end
                end
                animator:run()
                animator:clear()
            >>
        [/lua]
	    
	    [redraw][/redraw]

		# skill_massheal_post is fired by the cast system now (see the _pre/_post
		# hooks in MAGIC_SYSTEM.md), at this same point — right after this event.

    [/event]
#enddef

