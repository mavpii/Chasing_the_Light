#############################
# ANIMATIONS
#############################
    [event]
	name=magic_system_add_animations
	first_time_only=no
	
	[store_unit]
	    [filter]
            id=$current_caster
        [/filter]
		variable=current_caster_image
	[/store_unit]
	
	[store_side]
	    [filter]
            id=$current_caster
        [/filter]
		variable=current_caster_side
	[/store_side]

	[object]
        take_only_once=no
		id=magic_system_animations
        duration=forever
        [filter]
            id=$current_caster
        [/filter]
        [effect]
            apply_to=new_animation
			#--------------------
            # MAGIC MISSILE ANIMATION
            #--------------------
            [attack_anim]
			    base_score=-1
                {FILTER_ATTACK name=missile}
                offset=0
                {MAGIC_MISSILE 11 -20}
                {MAGIC_MISSILE_STAFF_FLARE -750 600 11 -20}
                start_time=-800
                {FRAME image=$current_caster_image.image:[100,700,200]}
                {SOUND:HIT_AND_MISS magic-missile-[1~3].ogg magic-missile-[1~3]-miss.ogg -350}
            [/attack_anim]
			#--------------------
            # RAGE ANIMATION
            #--------------------
            [attack_anim]
			    base_score=-1
                {FILTER_ATTACK name=range}
                start_time=-600
                offset=0.0:300,0.0~0.6:200,0.6:50,0.6~0.0:300
                [frame]
                    image="$current_caster_image.image:[100*8]"
                [/frame]
                [frame]
                    image="$current_caster_image.image:50"
                [/frame]
                {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
            [/attack_anim]
			#--------------------
            # LIGHTBEAM ANIMATION
            #--------------------
			[attack_anim]
			    base_score=-1
                {FILTER_ATTACK name=small_lightbeam}
                {MISSILE_FRAME_LIGHT_BEAM}
                start_time=-395
                [frame]
                    image="$current_caster_image.image:75"
                [/frame]
                [frame]
                    image="$current_caster_image.image"
                    halo=halo/holy/halo[6,1,3,5,6].png:[75*4,50]
                [/frame]
                {SOUND:HIT_AND_MISS {SOUND_LIST:HOLY} {SOUND_LIST:HOLY_MISS} -75}
                [frame]
                    image="$current_caster_image.image:50"
                [/frame]
            [/attack_anim]
			#--------------------
            # LEVITATE/FLIGHT ANIMATION
            #--------------------
            [animation]
			    base_score=98
                apply_to=skill_levitate
                {SOUND_FRAME sound=skill-levitate.wav}
                {FRAME image="$current_caster_image.image~ADJUST_ALPHA(if(alpha<=200,alpha*0,alpha)):[50,300,50]"}
                {FRAME submerge,image=0.01,"units/unit-shadow.png~BLIT($current_caster_image.image~ADJUST_ALPHA(if(alpha<=200,alpha*0,alpha))~RC(magenta>$current_caster_side.color),0,-[1,2,3,4]):[100,150,200,250]"}
                {OVERLAY_FRAME halo=halo/saurian-magic-halo-[1~7].png:75}
            [/animation]
            [standing_anim]
			    base_score=98
                {FILTER_OBJECT_ID skill_levitate}
                {FRAME submerge,image=0.01,"units/unit-shadow.png~BLIT($current_caster_image.image~ADJUST_ALPHA(if(alpha<=200,alpha*0,alpha))~RC(magenta>$current_caster_side.color),0,-[4~1,2~8,8~5,5,5~8,8~5]):350"}
            [/standing_anim]
            [movement_anim]
			    base_score=98
                {FILTER_OBJECT_ID skill_levitate}
                {FRAME submerge,image=0.01,"units/unit-shadow.png~BLIT($current_caster_image.image~ADJUST_ALPHA(if(alpha<=200,alpha*0,alpha))~RC(magenta>$current_caster_side.color),0,-4):200"}
            [/movement_anim]
			[standing_anim]
			    base_score=98
                {FILTER_OBJECT_ID skill_levitate}
                {FRAME submerge,image=0.01,"units/unit-shadow.png~BLIT($current_caster_image.image~ADJUST_ALPHA(if(alpha<=200,alpha*0,alpha))~RC(magenta>$current_caster_side.color),0,-[4~1,2~8,8~5,5,5~8,8~5]):350"}
            [/standing_anim]
            [movement_anim]
			    base_score=98
                {FILTER_OBJECT_ID skill_levitate}
                {FRAME submerge,image=0.01,"units/unit-shadow.png~BLIT($current_caster_image.image~ADJUST_ALPHA(if(alpha<=200,alpha*0,alpha))~RC(magenta>$current_caster_side.color),0,-4):200"}
            [/movement_anim]
			#--------------------
            # DISATTACK ANIMATION
            #--------------------
	        [animation]
			    base_score=98
                apply_to=disattack_anim
                start_time=-395
                [frame]
                    image="$current_caster_image.image:75"
                [/frame]
                [frame]
                    image="$current_caster_image.image"
                    halo=halo/holy/halo[6,1,3,5,6].png:[75*4,50]
                [/frame]
                {SOUND:HIT_AND_MISS {SOUND_LIST:HOLY} {SOUND_LIST:HOLY_MISS} -75}
                [frame]
                    image="$current_caster_image.image:50"
                [/frame]
            [/animation]
			#--------------------
            # SMITE ANIMATION
            #--------------------
			[animation]
			    base_score=98
                apply_to=skill_smite
                start_time=-300
                overlay_start_time=-150
                {FRAME image="$current_caster_image.image:75"}
                {FRAME (image="$current_caster_image.image:75"
				sound=explosion.ogg)}
                {FRAME(image="$current_caster_image.image:2000"
                sound={SOUND_LIST:HOLY})}
                {OVERLAY_FRAME layer,image=0,"misc/blank-hex.png~SCALE(256,512)~BLIT( halo/explosion/[1~9].png~CS(255,255,255)~SCALE(256,400), 0,80):300"}
                {FRAME image="$current_caster_image.image:50"}
                {FRAME image="$current_caster_image.image:50"}
            [/animation]
			#--------------------
            # NATURE REVENGE ANIMATION
            #--------------------
			[animation]
			    base_score=98
                apply_to=skill_nature_revenge
                start_time=-300
                overlay_start_time=-150
                {FRAME image="$current_caster_image.image:75"}
                {FRAME (image="$current_caster_image.image:75"
				sound=explosion.ogg)}
                {FRAME(image="$current_caster_image.image:2000")}
                {OVERLAY_FRAME layer,image=0,"misc/blank-hex.png~SCALE(256,512)~BLIT( halo/explosion/[1~9].png~CS(255,255,255)~SCALE(256,400), 0,80):300"}
                {FRAME image="$current_caster_image.image:50"}
                {FRAME image="$current_caster_image.image:50"}
            [/animation]
			#--------------------
            # MAGIC BLAST ANIMATION
            #--------------------
			[attack_anim]
				base_score=-1
                {FILTER_ATTACK (name=magic_blast)}
	        
                start_time=-350
                missile_start_time=-100
                halo_start_time=-250
	        
                [missile_frame]
                    duration=200
                    image="projectiles/darkmissile-n.png"
                    image_diagonal="projectiles/darkmissile-ne.png"
                [/missile_frame]
	        
                {FRAME image=$current_caster_image.image:[100,700,200]}
	        
                [halo_frame]
                    halo="halo/undead/dark-magic-[1~6].png~O(35%):50"
                    halo_y=10
                    halo_x=5
                    auto_vflip=no
                [/halo_frame]
	        
                {SOUND:HIT_AND_MISS magic-dark.ogg magic-dark-miss.ogg -100}
            [/attack_anim]
			#--------------------
            # BEND ANIMATION
            #--------------------
			[animation]
                apply_to=skill_bend_cast
                {SOUND_FRAME sound=rumble.ogg}
                {FRAME image=$current_caster_image.image:[50,300,50]}
	        	{MISSILE_FRAME_ICE}
                {OVERLAY_FRAME halo=halo/saurian-magic-halo-[1~7].png:75}
            [/animation]
			#--------------------
            # SHIELD ANIMATION
            #--------------------
			[animation]
                apply_to=skill_dispel
                # Gather, flare, release. The halo is mainline's Mage of Light
                # cycle; the sprite is washed towards white on the release frame
                # so the light clearly leaves the caster. The beam that lands on
                # the target is placed by the spell event, not here -- a unit
                # animation cannot draw on someone else's hex.
                start_time=-500
                {FRAME (image="$current_caster_image.image:[70*7]"
                halo="halo/holy/halo[6,1~6].png:70"
                halo_x,halo_y=0,-18)}
                {FRAME (image="$current_caster_image.image:180"
                blend_color=255,255,224
                blend_ratio=0.0~0.65
                halo="halo/holy/halo6.png:180"
                halo_x,halo_y=0,-18)}
                {FRAME (image="$current_caster_image.image:220"
                blend_color=255,255,224
                blend_ratio=0.65~0.0)}
            [/animation]
            #--------------------
            # FLASH ANIMATION
            #--------------------
            [animation]
                apply_to=skill_blindflash
                # Hands up, then the powder goes off in the caster's own face --
                # the same muzzle-flash frames the Heir to the Throne alchemist
                # throws, since the cloud on the map is that alchemist's smoke.
                {FRAME image=$current_caster_image.image:[150,100,100,250]}
                {OVERLAY_FRAME (y,halo=-8,"projectiles/muzzle-flash-n-3.png~SCALE(96,96):90")}
                {OVERLAY_FRAME (y,halo=-8,"projectiles/muzzle-flash-[4~14].png~SCALE(120,120):55")}
            [/animation]
            #--------------------
            # SHIELD ANIMATION
            #--------------------
            [animation]
                apply_to=skill_shield
                {SOUND_FRAME sound=skill-shield.wav}
                {FRAME image=$current_caster_image.image:[50,300,50]}
                {OVERLAY_FRAME halo="halo/merfolk/water-halo-[7~1].png~CS(255,255,255)~O(0.8):75"}
                {OVERLAY_FRAME (y,image=-2,halo/shield.png:300
                alpha=0.6~1.0, 1.0, 1.0~0.6)}
            [/animation]
            [standing_anim]
                {FILTER_OBJECT_ID skill_shield}
                {OVERLAY_FRAME (y,image=-2,halo/shield.png:3500
                alpha=0.5:250, 0.5~0.3:1500, 0.3:250, 0.3~0.5:1500)}
            [/standing_anim]
            [movement_anim]
                {FILTER_OBJECT_ID skill_shield}
                {OVERLAY_FRAME (y,image=-2,halo/shield.png:200
                alpha=0.4
                offset="0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200")}
            [/movement_anim]
            [defend]
                {FILTER_OBJECT_ID skill_shield}
                start_time=-175
                {FRAME( image=$current_caster_image.image:50,$current_caster_image.image:250,$current_caster_image.image:50
                halo_y,halo=-2,"halo/shield.png~O(0.4,0.8,1.0,0.9,0.8,0.6,0.4]):50")}
                [if]
                    hits=hit
                    overlay_start_time=-25 {OVERLAY_FRAME sound={SOUND_LIST:HUMAN_HIT}}
                [/if]
            [/defend]
			#--------------------
            # STASIS ANIMATION
            #--------------------
			[animation]
                apply_to=skill_stasis
                {SOUND_FRAME sound=skill-stasis.wav}
                {FRAME image=$current_caster_image.image:[100,350,100]}
                {FRAME image=$current_caster_image.image:[150]}
                {OVERLAY_FRAME  halo="halo/stasis/mystic-magic[1~6,4].png~CS(-255,-255,-255)~O(0.2)~SCALE(60,60):[100*7]"}
                {OVERLAY2_FRAME halo="halo/stasis/mysticaltoad-magic[1~6,4].png~CS(-255,-255,-255)~O(0.15)~SCALE(180,180):[100*7]"}
            [/animation]
			#--------------------
            # CHILL TOUCH ANIMATION
            #--------------------
			[attack_anim]
                {FILTER_ATTACK (name=chill touch)}
                start_time=-250
                {FRAME image=$current_caster_image.image:50}
                {FRAME image=$current_caster_image.image:[100,200]}
                {SOUND:HIT_AND_MISS staff.ogg staff-miss.ogg -125}
                {FRAME image=$current_caster_image.image:50}
                {FRAME image=$current_caster_image.image:50}
                overlay_start_time=-250
                {OVERLAY_FRAME halo="halo/elven/nature-halo[1~8].png~CS(-10,-10,20)~O(0.3):[60*8]"}
            [/attack_anim]
			#--------------------
            # FIREBALL ANIMATION
            #--------------------
			[attack_anim]
                {FILTER_ATTACK name=fireball}
                offset=0
                {MISSILE_FRAME_FIREBALL_XY 11 -20}
                start_time=-575
                {FRAME image=$current_caster_image.image:50}
                {FRAME image=$current_caster_image.image:[100,150,75]}
                {FRAME image=$current_caster_image.image:75}
                {SOUND:HIT_AND_MISS fire.wav fire.wav -375}
            [/attack_anim]
			#--------------------
            # ENERVATE ANIMATION
            #--------------------
			[attack_anim]
                {FILTER_ATTACK name=enervate}
                start_time=-350
                {FRAME sound,image=siphon.ogg,$current_caster_image.image:[50,400,50]}
                overlay_start_time=-350
                {OVERLAY_FRAME  offset,halo=1.0,"halo/elven/nature-halo[8~1].png~CS(50,-30,-50)~O([80%*2,60%,40%,30%,20%*3]):75"}
                [if]
                    hits=yes
                    overlay2_start_time=-200
                    {OVERLAY2_FRAME offset,halo=0.0,"halo/elven/nature-halo[1~8].png~CS(50,-30,-50)~O([20%*3,30%,40%,60%,80%*2]):75"}
                    missile_start_time=-200
                    [missile_frame]
                        image="halo/elven/druid-healing[8~1].png~CS(50,-30,-50):50"
                        offset=1.0~0.0
                    [/missile_frame]
                [/if]
                [else]
                    hits=no
                    missile_start_time=-200
                    [missile_frame]
                        image="halo/elven/druid-healing[8~1].png~CS(50,-30,-50):50"
                        offset=1.0~0.8
                        alpha=1.0~0.0
                    [/missile_frame]
                [/else]
            [/attack_anim]
			#--------------------
            # BLIZZARD ANIMATION
            #--------------------
			[animation]
                apply_to=skill_blizzard
                {SOUND_FRAME sound=skill-blizzard.wav}
                {FRAME image=$current_caster_image.image:100}
                {OVERLAY_FRAME halo="halo/blizzard/[0001~0004].png~CS(150,150,150)~SCALE(144,144):25"}
            [/animation]
            [standing_anim]
                {FILTER_OBJECT_ID skill_blizzard_animation}
                {FRAME image=$current_caster_image.image}
                {OVERLAY_FRAME halo="halo/blizzard/[0004~0130].png~CS(150,150,150)~SCALE(144,144):25"}
            [/standing_anim]
            [animation]
                apply_to=skill_blizzard_end
                {FRAME image=$current_caster_image.image:100}
            [/animation]
			#--------------------
            # COUNTERSPELL ANIMATION
            #--------------------
			[standing_anim]
                {FILTER_OBJECT_ID skill_counterspell_casting}
                sound_start_time=-1250   {SOUND_FRAME sound=skill-counterspell.wav}
                start_time=-1250         {FRAME image=$current_caster_image.image:[150,950,150]}
                overlay_start_time=-900  {OVERLAY_FRAME (image=halo/counterspell/counterspell-aoe.png:900
                auto_hflip,alpha=no,0~1)}
                overlay2_start_time=-900 {OVERLAY2_FRAME (image="halo/counterspell/ucircle-b-[12~23].png~SCALE(120,70):75"
                auto_hflip,alpha=no,0~0.6)}
                overlay3_start_time=-600 {OVERLAY3_FRAME (image="halo/counterspell/ucircle-b-[14~07].png~SCALE(180,105)~CS(-25,-25,-25):75"
                auto_hflip,alpha=no,0~0.4)}
                overlay4_start_time=-300 {OVERLAY4_FRAME (image="halo/counterspell/ucircle-b-[07~10].png~SCALE(264,154)~CS(-100,-100,-100):75"
                auto_hflip,alpha=no,0~0.2)}
            [/standing_anim]
            [movement_anim]
                {FILTER_OBJECT_ID skill_counterspell}
                {OVERLAY_FRAME (auto_hflip,image=no,halo/counterspell/counterspell-aoe.png
                offset=0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200 )}
                {OVERLAY2_FRAME (auto_hflip,alpha,image=no,0.6,"halo/counterspell/ucircle-b-[12~23].png~SCALE(120,70):75"
                offset=0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200 )}
                {OVERLAY3_FRAME (auto_hflip,alpha,image=no,0.4,"halo/counterspell/ucircle-b-[14~07].png~SCALE(180,105)~CS(-25,-25,-25):75"
                offset=0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200 )}
                {OVERLAY4_FRAME (auto_hflip,alpha,image=no,0.2,"halo/counterspell/ucircle-b-[07~10].png~SCALE(264,154)~CS(-100,-100,-100):75"
                offset=0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200 )}
            [/movement_anim]
			#--------------------
            # POLYMORPH ANIMATION
            #--------------------
			[animation]
                apply_to=skill_polymorph
                start_time=-900
                {FRAME image="$current_caster_image.image:100"}
                {FRAME image="$current_caster_image.image~CS(30,60,0):120"}
                {FRAME image="$current_caster_image.image~CS(80,140,0):120"}
                {FRAME image="$current_caster_image.image~CS(160,220,40):140"}
                {FRAME image="$current_caster_image.image~CS(255,255,140):160"}
                {FRAME image="$current_caster_image.image~CS(150,200,60):140"}
                {FRAME image="$current_caster_image.image~CS(60,90,20):120"}

                overlay_start_time=-900
                {OVERLAY_FRAME (
                    auto_hflip=no
                    y=14
                    image="halo/portal_swap/ucircle-frames/circle-g-[01~23].png~CS(150,60,-220)~SCALE(108,81):[40*23]"
                    alpha=0~1:300,1:300,1~0:320
                )}
                overlay2_start_time=-780
                {OVERLAY2_FRAME (
                    auto_hflip=no
                    y=-6
                    image="halo/terror/terrorCW-[20~45].png~O(0.30)~CS(120,220,40)~SCALE(160,160):[30*26]"
                    alpha=0~1:240,1:300,1~0:240
                )}
                overlay3_start_time=-500
                {OVERLAY3_FRAME (
                    halo_x=0
                    halo_y=20~-25
                    halo="halo/teleport-[9,8,1~9].png~CS(60,90,-60):45"
                )}
            [/animation]
            [animation]
                apply_to=skill_polymorph_end
                start_time=-450
                sound_start_time=-450 {SOUND_FRAME sound=skill-polymorph-quiet.wav}
                {FRAME image="$current_caster_image.image~CS(90,130,30):110"}
                {FRAME image="$current_caster_image.image~CS(50,75,15):110"}
                {FRAME image="$current_caster_image.image~CS(20,30,5):110"}
                {FRAME image="$current_caster_image.image:120"}

                overlay_start_time=-450
                {OVERLAY_FRAME (
                    auto_hflip=no
                    y=14
                    image="halo/portal_swap/ucircle-frames/circle-g-[23~01].png~CS(150,60,-220)~SCALE(108,81):[20*23]"
                    alpha=1~0:460
                )}
                overlay2_start_time=-440
                {OVERLAY2_FRAME (
                    halo_x=0
                    halo_y=-25~20
                    halo="halo/teleport-[9,8,1~9].png~CS(60,90,-60):40"
                )}
            [/animation]
			#--------------------
            # DANCING DAGGERS ANIMATION
            #--------------------
			{ONEANIM_DANCING_DAGGERS -  -  () ()}
            {ONEANIM_DANCING_DAGGERS () () -  - }
            {ONEANIM_DANCING_DAGGERS -  () ()  -}
            {ONEANIM_DANCING_DAGGERS () -  -  ()}
            # LIGHTNING ANIMATION
            #--------------------
			{ANIMATIONS_LIGHTNING_SINGLEBOLT 1}
            {ANIMATIONS_LIGHTNING_SINGLEBOLT 2}
            {ANIMATIONS_LIGHTNING_SINGLEBOLT 3}
			#--------------------
            # TIME DILATION ANIMATION
            #--------------------
			[standing_anim]
                {FILTER_OBJECT_ID skill_time_dilation_casting}
                sound_start_time   =-3600 {SOUND_FRAME     sound=skill-time-dilation.wav}
                start_time         =-3600 {FRAME           image=$current_caster_image.image:[100,3600,100]}
                overlay_start_time =-3600 {OVERLAY_FRAME  (x,y,image=   0,   0, "halo/time-dilation/[0001~0072].png:50")}
                overlay2_start_time=-3250 {OVERLAY2_FRAME (x,y,image=-150,  75, "halo/time-dilation/[0001~0072].png~SCALE(108,108)~O(0.7):45")}
                overlay3_start_time=-2900 {OVERLAY3_FRAME (x,y,image= 110,  80, "halo/time-dilation/[0001~0072].png~SCALE(144,144)~O(0.7):40")}
                overlay4_start_time=-2500 {OVERLAY4_FRAME (x,y,image= -40,-130, "halo/time-dilation/[0001~0072].png~SCALE(124,124)~O(0.7):35")}
            [/standing_anim]
			#--------------------
            # CATACLYSM ANIMATION
            #--------------------
			[standing_anim]
                {FILTER_OBJECT_ID skill_cataclysm_casting}
                sound_start_time   =-1400 {SOUND_FRAME    sound=skill-cataclysm.wav}
                start_time         =-1800 {FRAME          image=$current_caster_image.image:[100,1900]}
                overlay_start_time =-1800 {OVERLAY_FRAME  alpha,image=0~1.0,"halo/cataclysm/[0001~0024].png:75"}
                overlay2_start_time= -600 {OVERLAY2_FRAME alpha,image=0~1.0,"halo/cataclysm/cataclysm00-[1~6,1~6].png~CS(-100,-255,-255):50"}
            [/standing_anim]
            [standing_anim]
                {FILTER_OBJECT_ID skill_cataclysm_casted}
                {OVERLAY_FRAME  y,alpha,image=72,0.6~0.0,"halo/cataclysm/sphere/[0001~0024,0001~0024].png~SCALE(800,800)~CS(-100,-100,-100):50"}
                {OVERLAY_FRAME  image=misc/blank-hex.png:99999}
	        
                {OVERLAY2_FRAME yalpha,image=-10,5~0,"halo/cataclysm/explosion/[1~9].png~SCALE(500,500)~CS(-100,-255,-255):100"}
                {OVERLAY2_FRAME image=misc/blank-hex.png:99999}
            [/standing_anim]
			#--------------------
            # DEFAULT ANIMATIONS
            #--------------------
            [leading_anim]
			    base_score=-1 # avoid using this animation if any others apply
                start_time=-250          {FRAME image=$current_caster_image.image:500}
                overlay_start_time=-100  {OVERLAY_FRAME halo_x,halo_y,halo=14,-25,halo/misc/leadership-flare-[1~13].png:20}
            [/leading_anim]
            [recruiting_anim]
			    base_score=-1 # avoid using this animation if any others apply 
                start_time=-250          {FRAME image=$current_caster_image.image:500}
                overlay_start_time=-100  {OVERLAY_FRAME halo_x,halo_y,halo=14,-25,halo/misc/leadership-flare-[1~13].png:20}
            [/recruiting_anim]
			#--------------------
            # HEALING ANIMATION
            #--------------------
	        [healing_anim]
	            base_score=-1 # avoid using this animation if any others apply 
                start_time=-525
                [frame]
                    image="$current_caster_image.image:75"
                [/frame]
                [frame]
                    image="$current_caster_image.image"
                    halo=halo/holy/halo[6,1~6].png:75
                [/frame]
                [frame]
                    image="$current_caster_image.image:75"
                [/frame]
            [/healing_anim]
			#--------------------
            # PRE-TELEPORT ANIMATION
            #--------------------
            [animation]
	            base_score=-1 # avoid using this animation if any others apply 
                apply_to=pre_teleport
                start_time=-1200
	        
                teleport_sparkle_1_start_time=-1200
                teleport_sparkle_2_start_time=-1000
                teleport_sparkle_3_start_time=-800
	        
                [teleport_sparkle_1_frame]
                    duration=800
                    halo=halo/teleport-[9,8,1~9].png
                    halo_x=-10
                    halo_y=30~-30
                [/teleport_sparkle_1_frame]
                [teleport_sparkle_2_frame]
                    duration=800
                    halo=halo/teleport-[9,8,1~9].png
                    halo_x=0
                    halo_y=40~-40
                [/teleport_sparkle_2_frame]
                [teleport_sparkle_3_frame]
                    duration=800
                    halo=halo/teleport-[9,8,1~9].png
                    halo_x=10
                    halo_y=30~-30
                [/teleport_sparkle_3_frame]
	        
                [frame]
                    image="$current_caster_image.image:[200,100*7]"
                [/frame]
                [frame]
                    image="misc/blank-hex.png:300"
                [/frame]
            [/animation]
	        #--------------------
            # POST-TELEPORT ANIMATION
            #--------------------
            [animation]
	            base_score=-1 # avoid using this animation if any others apply 
                apply_to=post_teleport
                start_time=-1200
	        
                teleport_sparkle_1_start_time=-1200
                teleport_sparkle_2_start_time=-1000
                teleport_sparkle_3_start_time=-800
	        
                [teleport_sparkle_1_frame]
                    duration=800
                    halo=halo/teleport-[9,8,1~9].png
                    halo_x=10
                    halo_y=-30~30
                [/teleport_sparkle_1_frame]
                [teleport_sparkle_2_frame]
                    duration=800
                    halo=halo/teleport-[9,8,1~9].png
                    halo_x=0
                    halo_y=-40~40
                [/teleport_sparkle_2_frame]
                [teleport_sparkle_3_frame]
                    duration=800
                    halo=halo/teleport-[9,8,1~9].png
                    halo_x=-10
                    halo_y=-30~30
                [/teleport_sparkle_3_frame]
                [frame]
                    image="misc/blank-hex.png:300"
                [/frame]
                [frame]
                    image="$current_caster_image.image:[100*7,200]"
                [/frame]
            [/animation]
        [/effect]
    [/object]
	
	{CLEAR_VARIABLE current_caster_image}
	{CLEAR_VARIABLE current_caster_side}
	
    [/event]
#enddef