#############################
# EMPATHY
# Passive: at the start of its turn the caster gains 2 XP for every ally its own
# healing ability (Daeola's cures) restores. Healing spells are NOT counted --
# only the ability.
#
# The engine heals a side's units between "side turn" and "turn refresh" and
# fires no event of its own for it (src/play_controller.cpp: side_turn ->
# calculate_healing -> turn_refresh), so those two events are the only hook
# there is: the first records who is about to be healed, the second checks who
# actually gained hitpoints.
#############################
#define EVENT_EMPATHY
    [event]
        name=refresh_skills
        first_time_only=no
        {CHECK_EQUIPPED_SPELL id=$current_caster skill_empathy}
        [if] {VARIABLE_CONDITIONAL equipped_spell_found equals yes} {THEN(
        [object]
            id,take_only_once=skill_empathy,no {FILTER id=$current_caster}
            {EFFECT new_ability ([abilities]
                [dummy]
                    id,name,description=empathy, _"empathy", _"This unit gains 2 XP for every ally its healing ability restores at the start of its turn."
                [/dummy]
            [/abilities])}
        [/object]
        )}
        [/if]
    [/event]

    #--------------------
    # BEFORE THE ENGINE HEALS: remember who this side's Empathy casters are
    # about to heal.
    #--------------------
    [event]
        name=side turn
        first_time_only=no
        [lua]
            code= <<
                local side = wml.variables["side_number"]
                local snapshot = {}

                -- Strongest value of an ability tag ([heals], [regenerate]) a unit carries.
                local function ability_value(u, tag)
                    local abilities = wml.get_child(u.__cfg, "abilities")
                    if not abilities then return 0 end
                    local best = 0
                    for ability in wml.child_range(abilities, tag) do
                        best = math.max(best, tonumber(ability.value) or 0)
                    end
                    return best
                end

                for _, caster in ipairs(wesnoth.units.find_on_map({ side = side, ability = "empathy" })) do
                    local value = ability_value(caster, "heals")
                    if value > 0 then
                        for _, patient in ipairs(wesnoth.units.find_on_map({
                            wml.tag.filter_adjacent{ id = caster.id },
                            wml.tag.filter_side{ wml.tag.allied_with{ side = caster.side } },
                        })) do
                            -- The engine skips the already-full, the petrified and the
                            -- unhealable (src/actions/heal.cpp, calculate_healing).
                            if patient.hitpoints < patient.max_hitpoints
                               and not patient.status.petrified
                               and not patient.status.unhealable then

                                -- Healing terrain, regeneration and every other adjacent
                                -- healer are folded together by taking the MAXIMUM
                                -- (heal.cpp, heal_amount -> update_healing), so this unit
                                -- is only really healed BY THE CASTER when the caster's own
                                -- value beats all of them. Without this check a wounded ally
                                -- on a village would pay out although it heals the same 8 HP
                                -- with the caster standing anywhere else.
                                local rival = 0
                                if patient.side == side then
                                    local terrain = wesnoth.terrain_types[wesnoth.current.map[{ patient.x, patient.y }]]
                                    if terrain then rival = terrain.healing end
                                    rival = math.max(rival, ability_value(patient, "regenerate"))
                                end
                                for _, healer in ipairs(wesnoth.units.find_on_map({
                                    side = side,
                                    wml.tag.filter_adjacent{ x = patient.x, y = patient.y },
                                })) do
                                    if healer.id ~= caster.id then
                                        rival = math.max(rival, ability_value(healer, "heals"))
                                    end
                                end

                                if value > rival then
                                    snapshot[#snapshot + 1] = {
                                        caster = caster.id, x = patient.x, y = patient.y,
                                        hp = patient.hitpoints,
                                    }
                                end
                            end
                        end
                    end
                end

                -- A WML variable, not a Lua local: the turn-start autosave falls
                -- between this event and the one below, and only WML variables
                -- survive a save/load.
                wml.variables["empathy_snapshot"] = nil
                wml.array_access.set("empathy_snapshot", snapshot)
            >>
        [/lua]
    [/event]

    #--------------------
    # AFTER THE ENGINE HEALS: 2 XP per ally that actually gained hitpoints.
    #--------------------
    [event]
        name=turn refresh
        first_time_only=no
        [lua]
            code= <<
                local _ = wesnoth.textdomain "wesnoth-ctl"
                local XP_PER_UNIT = 2 -- keep in step with the ability text above and table.lua

                local snapshot = wml.array_access.get("empathy_snapshot")
                wml.variables["empathy_snapshot"] = nil

                local healed = {}
                for _, entry in ipairs(snapshot) do
                    local patient = wesnoth.units.get(entry.x, entry.y)
                    if patient and patient.hitpoints > entry.hp then
                        healed[entry.caster] = (healed[entry.caster] or 0) + 1
                    end
                end

                for caster_id, units in pairs(healed) do
                    local caster = wesnoth.units.get(caster_id)
                    if caster then
                        local xp = units * XP_PER_UNIT
                        caster.experience = caster.experience + xp
                        wml.fire("floating_text", {
                            x = caster.x, y = caster.y,
                            text = ("<span color='#00bbe6' size='small'>+%d %s</span>"):format(xp, _"XP"),
                        })
                    end
                end
            >>
        [/lua]
    [/event]
#enddef

#############################
# DISPEL -- shown to the player as "Purge"; the id stays skill_dispel, as with
# every other spell here whose display name drifted from its id (skill_disattack
# is "Lightbeam", skill_enervate is "Siphon", skill_soul_siphon is "Drain").
# Adjacent only -- the caster has to stand next to what it unbinds (radius 1 of
# the ranged targeter, so only neighbouring enemies can be picked).
#
# The damage is half of what the target has already lost, so the spell can never
# open a fight -- it adds half again to what the army has already done, and
# finishes anything down to a third of its health. Undead and monsters are hit
# alike; the living are immune, and against them the cast is refunded, not spent.
#############################
#define EVENT_DISPEL
    [event]
        name=skill_dispel_cast
        first_time_only=no
        [lua]
            code= <<
                local target = wesnoth.units.get(wml.variables["unit_to_cast_on_x"],
                                                 wml.variables["unit_to_cast_on_y"])

                -- Undead and monsters alike take half of what they have already
                -- lost. The living have nothing to unbind, so the cast is refunded
                -- below instead of being spent.
                local share = 0
                if target and (target.race == "undead" or target.race == "monster") then
                    share = 0.5
                end

                wml.variables["dispel_amount"] = target
                    and math.floor((target.max_hitpoints - target.hitpoints) * share)
                    or 0
            >>
        [/lua]

        [if] {VARIABLE_CONDITIONAL dispel_amount greater_than 0}
        [then]
            # The caster gathers the light...
            {ANIMATE_UNIT id=$current_caster skill_dispel}

            # ...and it comes down on the target's own hex. The beam is an [item]
            # rather than part of the caster's animation, because that animation
            # can only draw on the caster: a spell about unbinding something over
            # there has to put its light over there. Frame timing is mainline's
            # own light-beam pacing (Dread Lich's death in Eastern Invasion):
            # snap open, hold, fade.
            {SOUND magic-holy-4.ogg}
            [item]
                x,y,name=$unit_to_cast_on_x,$unit_to_cast_on_y,purge_beam
                halo="halo/holy/light-beam-[1~7,6~1].png~SCALE(144,288)~O(0.9):[30*6,140,70*6]"
            [/item]
            [redraw][/redraw]
            {DELAY 420}

            [harm_unit]
                [filter]
                    x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
                [/filter]
                [second_unit]
                    id=$current_caster
                [/second_unit]
                amount=$dispel_amount
                damage_type=arcane
                kill=yes
                animate=yes
                experience=yes
            [/harm_unit]

            [remove_item]
                x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
                image=purge_beam
            [/remove_item]
            [redraw][/redraw]
        [/then]
        [else]
            # A living target, or one that is still unhurt, gives the spell
            # nothing to work on -- so the cast costs nothing.
            [floating_text]
                {FILTER id=$current_caster}
                text=_"<span color='#ff0000' size='x-small'>Nothing to unbind</span>"
            [/floating_text]
            [caster_refund]
                {FILTER id=$current_caster}
                xp=14
                moves=1
            [/caster_refund]
            [caster_restore_casts]
                {FILTER id=$current_caster}
                count=1
            [/caster_restore_casts]
        [/else]
        [/if]

        {CLEAR_VARIABLE dispel_amount}
    [/event]

    [event]
        name=skill_dispel
        first_time_only=no
        {CTL_RANGED_SPELL "$current_caster" 1 "misc/attack.png" false true "skill_dispel_cast" 0 14}
    [/event]
#enddef

#define EVENT_BLINDFLASH
    [event]
        name=skill_blindflash
        first_time_only=no
        {ANIMATE_UNIT id=$current_caster skill_blindflash}
        {SOUND dragonstick.ogg}
        [lua]
            code= <<
                local _ = wesnoth.textdomain "wesnoth-ctl"
                local caster = wesnoth.units.get(wml.variables["current_caster"])
                if not caster then return end

                local BURST  = "halo/blindflash/[0001~0015].png~SCALE(130,110)~GS()~CS(190,190,190)~O(85%):45"
                local FADING = "halo/blindflash/[0009~0015].png~SCALE(170,145)~GS()~CS(190,190,190)~O(35%):45"

                local hexes = { { x = caster.x, y = caster.y } }
                for x, y in wesnoth.current.map:iter_adjacent({ caster.x, caster.y }) do
                    hexes[#hexes + 1] = { x = x, y = y }
                end

                local function place(halo)
                    for _, hex in ipairs(hexes) do
                        wesnoth.wml_actions.item{ x = hex.x, y = hex.y, halo = halo, redraw = false }
                    end
                    wml.fire("redraw")
                end

                local function clear(halo)
                    for _, hex in ipairs(hexes) do
                        wesnoth.interface.remove_item(hex.x, hex.y, halo)
                    end
                    wml.fire("redraw")
                end

                local function blind(x, y)
                    if not wesnoth.units.get(x, y) then return end
                    wml.fire("modify_unit", {
                        wml.tag.filter{ x = x, y = y },
                        wml.tag.object{
                            id = "skill_blindflash_blinded",
                            duration = "turn end", silent = "yes", take_only_once = "no",
                            wml.tag.effect{ apply_to = "remove_attacks" },
                            wml.tag.effect{ apply_to = "zoc", value = "no" },
                            wml.tag.effect{ apply_to = "image_mod", replace = "CS(70,70,40)" },
                            wml.tag.effect{ apply_to = "status", add = "blinded" },
                        },
                    })
                    wesnoth.interface.float_label(x, y, _"blinded", "255,255,190")
                end

                wesnoth.interface.screen_fade({ 255, 255, 255, 255 }, 120)
                local ok, err = pcall(function()
                    place(BURST)
                    for _, hex in ipairs(hexes) do
                        blind(hex.x, hex.y)
                    end
                end)
                wesnoth.interface.screen_fade({ 0, 0, 0, 0 }, 260)
                if ok then
                    wesnoth.interface.delay(350)
                    clear(BURST)
                    place(FADING)
                    wesnoth.interface.delay(250)
                end
                clear(BURST)
                clear(FADING)
                if not ok then error(err) end
            >>
        [/lua]
        [redraw][/redraw]
    [/event]
#enddef

