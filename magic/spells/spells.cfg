#define EVENT_PHYLACTERY
    [event]
        name=skill_phylactery
        first_time_only=no
        {SOUND magic-dark.ogg}
        {ANIMATE_UNIT id=$current_caster skill_phylactery}
        [store_unit]
            [filter]
                id=$current_caster
            [/filter]
            variable=phyl_caster
        [/store_unit]
        # remove any earlier vessel
        [kill]
            id=phylactery_skull
            animate=no
            fire_event=no
        [/kill]
        {REMOVE_OBJECT skill_phylactery id=$current_caster}
        # free hex next to the caster
        [store_locations]
            [filter_adjacent_location]
                x,y=$phyl_caster.x,$phyl_caster.y
            [/filter_adjacent_location]
            [not]
                [filter]
                [/filter]
            [/not]
            variable=skull_dest
        [/store_locations]
        [if] {VARIABLE_CONDITIONAL skull_dest.length greater_than 0}
            [then]
                [unit]
                    id=phylactery_skull
                    type=Phylactery
                    side=$phyl_caster.side
                    x,y=$skull_dest[0].x,$skull_dest[0].y
                    animate=yes
                [/unit]
                [modify_unit]
                    {FILTER id=$current_caster}
                    [object]
                        duration,id=forever,skill_phylactery
                        {EFFECT halo halo="halo/blackportal/0001.png"}
                    [/object]
                [/modify_unit]
            [/then]
            [else]
                # spell cost -- skipped for a free-casting caster
                [caster_refund]
                    {FILTER id=$current_caster}
                    xp=48
                [/caster_refund]
                {CASTER_RESTORE_CASTS_COUNT id=$current_caster 1}
            [/else]
        [/if]
        {CLEAR_VARIABLE phyl_caster}
        {CLEAR_VARIABLE skull_dest}
    [/event]
	
    [event]
        name=last breath
        first_time_only=no
        [filter]
            [filter_wml]
                [modifications]
                    [object]
                        id=skill_phylactery
                    [/object]
                [/modifications]
            [/filter_wml]
        [/filter]
        [if]
            [have_unit]
                id=phylactery_skull
            [/have_unit]
            [then]
                [store_unit]
                    [filter]
                        id=phylactery_skull
                    [/filter]
                    variable=skull_u
                [/store_unit]
                [kill]
                    id=phylactery_skull
                    animate=yes
                    fire_event=no
                [/kill]
                {SOUND magic-dark.ogg}
                [modify_unit]
                    [filter]
                        id=$unit.id
                    [/filter]
                    hitpoints="$($unit.max_hitpoints / 2)"
                [/modify_unit]
                [teleport]
                    [filter]
                        id=$unit.id
                    [/filter]
                    x,y=$skull_u.x,$skull_u.y
                    animate=yes
                [/teleport]
                {REMOVE_OBJECT skill_phylactery id=$unit.id}
                {CLEAR_VARIABLE skull_u}
            [/then]
        [/if]
    [/event]

    [event]
        name=refresh_skills
        first_time_only=no
        {CHECK_EQUIPPED_SPELL id=$current_caster skill_phylactery}
        [if] {VARIABLE_CONDITIONAL equipped_spell_found not_equals yes} {THEN(
            {REMOVE_OBJECT skill_phylactery id=$current_caster}
            [kill]
                id=phylactery_skull
                animate=no
                fire_event=no
            [/kill]
        )}
        [/if]
    [/event]
#enddef

