#define ARMS_FORM ID WNAME WTYPE DMG NUM ICON SPECIALS
    [event]
        name={ID}
        first_time_only=no
        {FIRE_EVENT astral_arms_clear}
        [modify_unit]
            {FILTER id=$current_caster}
            [object]
                duration,id=forever,{ID}_object
                [effect]
                    apply_to=new_attack
                    name={WNAME}
                    type={WTYPE}
                    range=melee
                    damage={DMG}
                    number={NUM}
                    icon={ICON}
                    [specials]
                        {SPECIALS}
                    [/specials]
                [/effect]
            [/object]
        [/modify_unit]
        [event]
            name={ID}_cancel
            {REMOVE_OBJECT {ID} id=$current_caster}
        [/event]
    [/event]
#enddef

