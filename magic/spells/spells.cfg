        {SOUND magic-dark.ogg}
        # the clicked hex is already a free hex beside a qualifying unit (see
        # CTL_STAIN_SPELL below) -- just go there.
        [teleport]
            [filter]
                id=$current_caster
            [/filter]
            x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
            animate=yes
        [/teleport]
    [/event]
    [event]
        name=skill_shadowstep
        first_time_only=no
        {CTL_STAIN_SPELL "$current_caster" 6 1 "misc/swap.png" "all" true "skill_shadowstep_cast" 0 10}
    [/event]
#enddef

#define EVENT_ASTRAL_CHAINS
    [event]
        name=skill_astral_chains_cast
        first_time_only=no
        {ANIMATE_UNIT id=$current_caster skill_astral_chains}
        {SOUND magic-dark.ogg}
        # brief dark halo on the dragged unit as the chains yank it in
        [item]
            x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
            halo="halo/counterspell/counterspell-aoe.png"
            z_order=100
        [/item]
        [redraw][/redraw]
        [delay]
            time=250
        [/delay]
        [remove_item]
            x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
        [/remove_item]
        # free hexes adjacent to the caster
        [store_locations]
            [filter_adjacent_location]
                x,y=$unit_to_modify_x,$unit_to_modify_y
            [/filter_adjacent_location]
            [not]
                [filter]
                [/filter]
            [/not]
            variable=chains_dest
        [/store_locations]
        [if] {VARIABLE_CONDITIONAL chains_dest.length greater_than 0} {THEN(
            [teleport]
                [filter]
                    x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
                [/filter]
                x,y=$chains_dest[0].x,$chains_dest[0].y
                animate=yes
            [/teleport]
        )}
        [else]
            # no free hex beside the caster -- refund, nothing happened
            # xp is a spell cost (skipped for a free-casting caster); the move
            # point is not, so it always comes back
            [caster_refund]
                {FILTER id=$current_caster}
                xp=10
                moves=1
            [/caster_refund]
            {CASTER_RESTORE_CASTS_COUNT id=$current_caster 1}
        [/else]
        [/if]
        {CLEAR_VARIABLE chains_dest}
    [/event]
    [event]
        name=skill_astral_chains
        first_time_only=no
        {CTL_RANGED_SPELL "$current_caster" 4 "misc/swap.png" "all" true "skill_astral_chains_cast" 0 10}
    [/event]
#enddef

