#############################
# BEND NATURE
#############################
#############################
# BEND NATURE -- shared machinery
#
# Every bent hex is remembered together with the terrain it had, and scheduled to
# come back exactly two turns later. One duration for all three elements, and no
# terrain tables: whatever was there is what returns. (This used to differ per
# element -- 0/1/2 turns -- and the "revert" quietly terraformed the map one step
# instead of restoring it: water became ford became dirt, mountains became hills.
# Nothing said so, so the spell reshaped the map behind the player's back.)
#############################
#define EVENT_BEND_NATURE_REVERT_PRE
	{VARIABLE revert_bend_duration 2}
    [lua]
        code= <<
            local revert_bend_turn_detected
            if wml.variables["revert_bend_turn"] then
            for revert_bend_turn_single in wml.variables["revert_bend_turn"]:gmatch("[^,]+") do
                if revert_bend_turn_single == "turn " .. (wml.variables["turn_number"] + wml.variables["revert_bend_duration"]) then
                    revert_bend_turn_detected = true
                end
            end
            end
            
            if not revert_bend_turn_detected then
                wml.variables["revert_bend_turn"] = (wml.variables["revert_bend_turn"] or "") .. ",turn " .. (wml.variables["turn_number"] + wml.variables["revert_bend_duration"])   
            end
            
            local bend_revert_name = "bend_revert_" .. (wml.variables["turn_number"] + wml.variables["revert_bend_duration"])
            
            wml.fire("set_variables", {
                name = bend_revert_name,
                mode = "append",
                wml.tag.value {
                    x = wml.variables["unit_to_cast_on_x"],
                    y = wml.variables["unit_to_cast_on_y"],
                    terrain = wesnoth.get_terrain(wml.variables["unit_to_cast_on_x"], wml.variables["unit_to_cast_on_y"])
                }
            })
        >>
    [/lua]
#enddef

#define EVENT_BEND_NATURE_REVERT_POST
    [event]
        name=turn $revert_bend_turn, revert_bend_now_event ##, victory
        first_time_only=no
        # Nothing bent for this turn -> nothing to shake, nothing to redraw. The
        # event fires on a turn number that some cast scheduled, but a scenario can
        # reach that turn with the queue already emptied (the caster died, the
        # spell was unequipped, another handler fired revert_bend_now_event).
        {FILTER_CONDITION(
            [variable]
                name=bend_revert_$turn_number|.length
                greater_than=0
            [/variable]
        )}

    	{QUAKE (rumble.ogg)}

        [lua]
        code= <<
            local i = 0
            while wml.variables["bend_revert_" .. wml.variables["turn_number"] .. "[" .. i .. "]"] do
                wml.variables["revert_bend_temp" ..  "[" .. i .. "]"] = wml.variables["bend_revert_" .. wml.variables["turn_number"] .. "[" .. i .. "]"]
            	i = i + 1
            end
        >>
        [/lua]

		[foreach]
            array=revert_bend_temp
            [do]
                {DELAY 50}
                # The hex goes back to exactly the terrain it had when it was bent,
                # and whoever Earth turned to stone stands up again.
                {MODIFY_TERRAIN $this_item.terrain $this_item.x $this_item.y}
                [unpetrify]
                   x,y=$this_item.x,$this_item.y
                [/unpetrify]
                [redraw][/redraw]
            [/do]
        [/foreach]

        [lua]
        code= <<
            wml.variables["revert_bend_temp"] = nil
            wml.variables["bend_revert_" .. wml.variables["turn_number"]] = nil

            -- Drop this turn from the schedule as well, so the list only ever
            -- names turns that still have hexes waiting. Without this it grew for
            -- the whole scenario and the event kept firing on spent turns.
            local kept = {}
            for entry in (wml.variables["revert_bend_turn"] or ""):gmatch("[^,]+") do
                if entry ~= "" and entry ~= ("turn " .. wml.variables["turn_number"]) then
                    kept[#kept + 1] = entry
                end
            end
            wml.variables["revert_bend_turn"] = #kept > 0 and ("," .. table.concat(kept, ",")) or nil
        >>
        [/lua]
    [/event]

    #--------------------
    # The "did the caster already play its bending animation this cast" flag is
    # per-cast, but it was only ever set -- never cleared -- so it sat in the save
    # forever. Cleared when the cast finishes (a rose spell fires _cast_post once
    # for the whole chain) and swept every turn, which also covers a cast the
    # player cancelled halfway through the direction picker.
    #--------------------
    [event]
        name=skill_bend_earth_cast_post,skill_bend_water_cast_post,skill_bend_lava_cast_post,turn refresh
        first_time_only=no
        {CLEAR_VARIABLE caster_bend_animation}
    [/event]

	[event]
        name=prestart,victory
        first_time_only=no

        [lua]
        code= <<
            -- Full cleanup, driven by the schedule itself instead of the old
            -- guess-500-turns loop that was commented out: every turn that still
            -- has a queue is named in revert_bend_turn, so clearing exactly those
            -- leaves nothing behind in the save.
            for entry in (wml.variables["revert_bend_turn"] or ""):gmatch("[^,]+") do
                local turn = entry:match("%d+")
                if turn then wml.variables["bend_revert_" .. turn] = nil end
            end

		    wml.variables["revert_bend_turn"] = nil
            wml.variables["revert_bend_temp"] = nil
        >>
        [/lua]
    [/event]
#enddef


#define EVENT_BEND_NATURE_EARTH
    [event]
        name=skill_bend_earth_cast
        first_time_only=no
		
		[if]
		[variable]
		name=caster_bend_animation
		equals=false
		[/variable]
		[then]
		{ANIMATE_UNIT id=$current_caster skill_bend_cast}
		{VARIABLE caster_bend_animation _"true"}
		[/then][/if]
        
		{EVENT_BEND_NATURE_REVERT_PRE}
		
		{QUAKE (rumble.ogg)}
		{DELAY 50}
		{MODIFY_TERRAIN Xue $unit_to_cast_on_x $unit_to_cast_on_y}
		[petrify]
		   x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
	    [/petrify]
		[redraw][/redraw]

    [/event]

    [event]
        name=skill_bend_earth
        first_time_only=no
		
		{VARIABLE caster_bend_animation _"false"}

        {CTL_ROSE_SPELL "$current_caster" 4 "misc/avatar.png" false "skill_bend_earth_cast" 0 12}
    [/event]
#enddef

#define EVENT_BEND_NATURE_WATER
    [event]
        name=skill_bend_water_cast
        first_time_only=no
		
		[if]
		[variable]
		name=caster_bend_animation
		equals=false
		[/variable]
		[then]
		{ANIMATE_UNIT id=$current_caster skill_bend_cast}
		{VARIABLE caster_bend_animation _"true"}
		[/then][/if]
		
		{EVENT_BEND_NATURE_REVERT_PRE}
		
		{QUAKE (rumble.ogg)}
		{DELAY 50}
		# Ww (shallow), not Wot (ocean): deep water is impassable for most infantry,
		# which made Water a second wall instead of a slow -- and the slow it applies
		# only means something if the unit is still standing there.
		{MODIFY_TERRAIN Ww $unit_to_cast_on_x $unit_to_cast_on_y}
		{MODIFY_UNIT (x,y=$unit_to_cast_on_x,$unit_to_cast_on_y) status.slowed yes}
		[redraw][/redraw]
    [/event]
	
    [event]
        name=skill_bend_water
        first_time_only=no
		
		{VARIABLE caster_bend_animation _"false"}

        {CTL_ROSE_SPELL "$current_caster" 4 "misc/avatar.png" false "skill_bend_water_cast" 0 8}
    [/event]
#enddef

#define EVENT_BEND_NATURE_LAVA
    [event]
        name=skill_bend_lava_cast
        first_time_only=no
		
		[if]
		[variable]
		name=caster_bend_animation
		equals=false
		[/variable]
		[then]
		
		{ANIMATE_UNIT id=$current_caster skill_bend_cast}
		{VARIABLE caster_bend_animation _"true"}
		[/then][/if]
		
		{EVENT_BEND_NATURE_REVERT_PRE}

		{QUAKE (rumble.ogg)}
		{DELAY 50}
		{MODIFY_TERRAIN Qlf $unit_to_cast_on_x $unit_to_cast_on_y}

		[lua]
		    code= <<
		        local affected_unit = wesnoth.units.find_on_map{ x = wml.variables["unit_to_cast_on_x"], y = wml.variables["unit_to_cast_on_y"] }[1]
		        if affected_unit then
		            local unit_to_modify = wesnoth.units.find_on_map{ id = wml.variables["current_caster"] }[1]
		            local animator = wesnoth.units.create_animator()
		            local damage = math.floor( 50 * ( 100 - affected_unit:resistance_against("fire", false, affected_unit.x, affected_unit.y) ) / 100 )
		            affected_unit.facing = wesnoth.map.get_relative_dir(affected_unit.x, affected_unit.y, unit_to_modify.x, unit_to_modify.y)
		            animator:add( affected_unit, "defend", "hit", { with_bars = true, text = tostring(damage), color = {255,0,0} } )
		            affected_unit.hitpoints = affected_unit.hitpoints - damage
		            animator:run()
		            animator:clear()

		            if affected_unit.hitpoints <= 0 then
		                wml.fire("set_variables", {
		                    name = "lava_pending_deaths",
		                    mode = "append",
		                    wml.tag.value{ x = affected_unit.x, y = affected_unit.y }
		                })
		            end
		        end
		    >>
		[/lua]

		[redraw][/redraw]

    [/event]

	[event]
	    name=skill_bend_lava_cast_post
		first_time_only=no

		[lua]
		    code= <<
		        local caster = wesnoth.units.find_on_map{ id = wml.variables["current_caster"] }[1]
		        local animator = wesnoth.units.create_animator()
		        local dead = {}
		        local i = 0
		        while wml.variables["lava_pending_deaths[" .. i .. "]"] do
		            local loc = wml.variables["lava_pending_deaths[" .. i .. "]"]
		            local u = wesnoth.units.find_on_map{ x = loc.x, y = loc.y }[1]
		            if u then
		                table.insert(dead, u)
		                animator:add(u, "death", "hit", {})
		            end
		            i = i + 1
		        end
		        animator:run()
		        animator:clear()
		        for _, u in ipairs(dead) do
		            wesnoth.game_events.fire("die", u.loc, caster and caster.loc)
		            wesnoth.units.erase(u)
		        end
		    >>
		[/lua]

		{CLEAR_VARIABLE lava_pending_deaths}
	[/event]

    [event]
        name=skill_bend_lava
        first_time_only=no

		{VARIABLE caster_bend_animation _"false"}

        {CTL_ROSE_SPELL "$current_caster" 4 "misc/avatar.png" false "skill_bend_lava_cast" 0 32}
    [/event]
#enddef

