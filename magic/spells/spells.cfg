#############################
# LEVELED ATTACK
#
# Every attack spell that scales with the caster is the same forty lines with two
# numbers changed, so it lives here once. Three tiers, two thresholds:
#
#     level <  MID          -> LOW_DAMAGE  x LOW_NUMBER
#     level >= MID, < HIGH  -> MID_DAMAGE  x MID_NUMBER
#     level >= HIGH         -> HIGH_DAMAGE x HIGH_NUMBER
#
# A two-tier spell passes the same numbers for MID and HIGH. There is deliberately
# no "below the lowest tier" case: the tiers cover every level, which is what went
# wrong before -- Chain Lightning started at 3 and a level-1 caster equipping it
# silently got no attack at all.
#
# Keep the numbers in step with the spell's description_by_level in table.lua.
#############################
#define SPELL_LEVELED_ATTACK SPELL_ID NAME DESCRIPTION ICON RANGE TYPE MID HIGH LOW_DAMAGE LOW_NUMBER MID_DAMAGE MID_NUMBER HIGH_DAMAGE HIGH_NUMBER SPECIALS
    [event]
        name=refresh_skills
        first_time_only=no
        {CHECK_EQUIPPED_SPELL id=$current_caster {SPELL_ID}}
        [if] {VARIABLE_CONDITIONAL equipped_spell_found equals yes} {THEN(
            [store_unit]
                {FILTER id=$current_caster}
                variable=leveled_attack_caster
            [/store_unit]

            [if]
            {VARIABLE_CONDITIONAL leveled_attack_caster.level less_than {MID}}
            [then]
                {SPELL_ATTACK_OBJECT {SPELL_ID} {NAME} {DESCRIPTION} {ICON} {RANGE} {TYPE} {LOW_DAMAGE} {LOW_NUMBER} ({SPECIALS})}
            [/then]
            [elseif]
            {VARIABLE_CONDITIONAL leveled_attack_caster.level less_than {HIGH}}
            [then]
                {SPELL_ATTACK_OBJECT {SPELL_ID} {NAME} {DESCRIPTION} {ICON} {RANGE} {TYPE} {MID_DAMAGE} {MID_NUMBER} ({SPECIALS})}
            [/then][/elseif]
            [elseif]
            {VARIABLE_CONDITIONAL leveled_attack_caster.level greater_than_equal_to {HIGH}}
            [then]
                {SPELL_ATTACK_OBJECT {SPELL_ID} {NAME} {DESCRIPTION} {ICON} {RANGE} {TYPE} {HIGH_DAMAGE} {HIGH_NUMBER} ({SPECIALS})}
            [/then][/elseif]
            [/if]

            {CLEAR_VARIABLE leveled_attack_caster}
        )}
        [/if]
    [/event]
#enddef

#define SPELL_ATTACK_OBJECT SPELL_ID NAME DESCRIPTION ICON RANGE TYPE DAMAGE NUMBER SPECIALS
    [object]
        id,take_only_once={SPELL_ID},no {FILTER id=$current_caster}
        {EFFECT new_attack (
            name,description,icon={NAME},{DESCRIPTION},{ICON}
            range,type,damage,number={RANGE},{TYPE},{DAMAGE},{NUMBER}
            [specials]
                {SPECIALS}
            [/specials] )}
    [/object]
#enddef

