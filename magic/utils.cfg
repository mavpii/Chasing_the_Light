#textdomain wesnoth-ctl

{./macros.cfg}
{./TRSS.cfg}
{./spells.cfg}

[lua]
code= <<
        --spellcasting(TRSS)
		function wesnoth.custom_synced_commands.on_click_spell_event(Table)
			_G["on_click_spell_event"..Table.type](Table)
		end
		--spellcasting(spellcasting.lua)
		function wesnoth.custom_synced_commands.spellcasting_cost(Table)
    		_G["spellcasting_cost"](Table)
    	end
		wesnoth.require '~add-ons/Chasing_the_Light/magic/core.lua'
	>>
[/lua]

#define MAGIC_SYSTEM__GLOBAL_EVENTS
    {MAGIC_SYSTEM__SPELLS_EVENTS}

    #--------------------
    # FORCE SYNCED NETWORK FLUSH
    # custom_command actions (magic_set_caster, magic_commit) are recorded as
    # undoable, so the engine withholds them from the network until something
    # clears the undo stack (e.g. an attack or end of turn) - see synced_context
    # ::run -> undo_stack->finish_action(!undo_blocked()) and playmp_controller
    # ::send_actions's NON_UNDO_DATA filtering in the Wesnoth engine source.
    # [disallow_undo] forces synced_context::block_undo(true), which clears the
    # stack and sends immediately, so spell selection changes reach other
    # clients without waiting on an unrelated action.
    #--------------------
    [event]
        name=magic_sync_flush
        first_time_only=no
        [disallow_undo][/disallow_undo]
    [/event]

    #--------------------
    # COMMIT SPELL SELECTION
    # Fired (via [do_command]) by dialog.lua after the selection/free-assign dialog
    # closes. Runs on every client and in both synced and unsynced contexts, so the
    # equipped spells are written and abilities re-applied regardless of how the
    # dialog was opened (right-click menu, double-click, "Change Spells", or
    # RESELECT_SKILLS fired from a game event).
    #--------------------
    [event]
        name=magic_commit_selection
        first_time_only=no
        [magic_apply_selection]
            id=$current_caster
            equipped=$magic_apply_equipped
            wait=$magic_apply_wait
        [/magic_apply_selection]
        {CLEAR_VARIABLE magic_apply_equipped}
        {CLEAR_VARIABLE magic_apply_wait}
    [/event]

    #--------------------
    # PREVENT DEFAULT LEVELING
    #--------------------
    [event]
        name=pre advance
        first_time_only=no
		[lua]
        code= <<
			local CasterState = wesnoth.require "~add-ons/Chasing_the_Light/magic/state.lua"
			local advancing_unit = wesnoth.units.find_on_map({x = wml.variables["unit.x"], y = wml.variables["unit.y"]})[1]
			local _ = wesnoth.textdomain "wesnoth-ctl"

			if  wml.variables[CasterState.key(advancing_unit.id)] then
			    advancing_unit.experience = advancing_unit.max_experience - 1
			    if not wml.variables[CasterState.key(advancing_unit.id) .. ".disable_xp_message"] then
			        wml.fire("floating_text", ({x = advancing_unit.x, y = advancing_unit.y, text=(_"<span color='#a308b8' size='small'>Max XP!</span>")}))
				end
				wml.variables[CasterState.key(advancing_unit.id) .. ".disable_xp_message"] = true
			end

			advancing_unit = nil
	    >>
	    [/lua]
    [/event]
	
    #--------------------
    # CASTER LEVELING
    #--------------------
    [event]
        name=advance_caster
        first_time_only=no
		

		{SOUND heal.wav}
		{ANIMATE_UNIT id=$current_caster levelout}

		[object]
            duration=forever
            silent=yes
	    
            [filter]
                id=$current_caster
            [/filter]

            [effect]
                apply_to=hitpoints
                increase_total=6
                heal_full=yes
            [/effect]
	    
            [effect]
                apply_to=max_experience
                increase=20%
            [/effect]
        [/object]
		
    [/event]

    #--------------------
    # PREVENT BADLY-TIMED SPELLS
    #--------------------
    [event]
        name=attack, victory, defeat, exit_hex
        first_time_only=no
        {VARIABLE is_badly_timed yes}
		[allow_undo][/allow_undo]
    [/event]
    [event]
        name=prestart, attack end, enter_hex
        first_time_only=no
        {CLEAR_VARIABLE is_badly_timed}
		[allow_undo][/allow_undo]
    [/event]
    #--------------------
    # NEW TURN RESET
    #--------------------
    [event]
        name=start,turn refresh,victory
        first_time_only=no
		[lua]
        code= <<
            local CasterState = wesnoth.require "~add-ons/Chasing_the_Light/magic/state.lua"
            local units = wesnoth.units.find_on_map()

            for i,u in ipairs(units) do
                if  wml.variables[CasterState.key(u.id)] then
                    if u.side == wml.variables["side_number"] then
                        wml.variables[CasterState.key(u.id) .. ".casts_this_turn"] = nil
                        wml.variables[CasterState.key(u.id) .. ".disable_xp_message"] = nil
                    end
                end
            end

            units = nil

			wml.fire("caster_set_menu")
	    >>
	    [/lua]
    [/event]
	#--------------------
    # REFRESH SKILLS WHEN CASTER PLACED
    #--------------------
	[event]
        name=unit placed
        first_time_only=no
		[lua]
        code= <<
            local CasterState = wesnoth.require "~add-ons/Chasing_the_Light/magic/state.lua"
            if  wml.variables[CasterState.key(wml.variables["unit.id"])] then
			    if not wml.variables[CasterState.key(wml.variables["unit.id"]) .. ".polymorphed"]
				   and not wml.variables["spell_cast_in_progress"] then
				    wml.fire("refresh_skills", ({id = wml.variables["unit.id"]}))
				end
				wml.fire("caster_set_menu")
            end
	    >>
	    [/lua]
    [/event]
#enddef