##base for stain spells: highlight hexes within inner_radius of any qualifying unit
##found within search_radius of the caster (e.g. "free hex beside any enemy in range",
##or "hex guaranteed to catch the enemy that justified it" for an AoE).
[lua]
    code= <<
    function stain_spell(caster_id, search_radius, inner_radius, image, allied_only, ignore_units, event_spell, gold_cancel, xp_cancel)
        local selected_target_hexes = {}
        local seen_hexes = {}

        local unit_to_modify, snapshot = trss_begin_cast(caster_id)
        local cx, cy = snapshot.x, snapshot.y

        local function is_allied(unit, side)
            return wesnoth.sides[unit.side].team_name == wesnoth.sides[side].team_name
        end

        local found_units = {}
        for xx = cx - search_radius, cx + search_radius do
            for yy = cy - search_radius, cy + search_radius do
                if wesnoth.map.distance_between(cx, cy, xx, yy) <= search_radius then
                    local units_here = wesnoth.units.find_on_map({ x = xx, y = yy })
                    if #units_here > 0 then
                        local u = units_here[1]
                        if u.id ~= caster_id and (allied_only == "all"
                            or (allied_only == true and is_allied(u, unit_to_modify.side))
                            or (allied_only == false and not is_allied(u, unit_to_modify.side))) then
                            table.insert(found_units, u)
                        end
                    end
                end
            end
        end

        for _, u in ipairs(found_units) do
            for xx = u.x - inner_radius, u.x + inner_radius do
                for yy = u.y - inner_radius, u.y + inner_radius do
                    if wesnoth.map.distance_between(u.x, u.y, xx, yy) <= inner_radius then
                        local key = xx .. "," .. yy
                        if not seen_hexes[key] then
                            local has_unit = #(wesnoth.units.find_on_map({ x = xx, y = yy })) > 0
                            if not ignore_units or not has_unit then
                                seen_hexes[key] = true
                                spell_place_image(xx, yy, image)
                                table.insert(selected_target_hexes, { x = xx, y = yy })
                            end
                        end
                    end
                end
            end
        end

        function on_click_spell_event_stain(Table)
            for _, target_hex in ipairs(selected_target_hexes) do
                if Table.x == target_hex.x and Table.y == target_hex.y then
                    wml.variables["unit_to_cast_on_x"] = Table.x
                    wml.variables["unit_to_cast_on_y"] = Table.y
                    spell_remove_image(image)
                    wml.fire("redraw")
                    wesnoth.game_events.on_mouse_button = nil

                    wml.variables["distance_between_units"] = (wesnoth.map.distance_between(cx, cy, Table.x, Table.y) * 72)

                    magic_fire_spell_event(event_spell) -- fires <event>_pre / <event> / <event>_post

                    trss_finish_cast(caster_id, unit_to_modify, snapshot)

                    wesnoth.interface.allow_end_turn(true)

                    wesnoth.units.select()
                    return
                end
            end
            trss_cancel_cast(caster_id, unit_to_modify, snapshot, image, xp_cancel, gold_cancel)
        end

        wesnoth.game_events.on_mouse_button = function(screen_x, screen_y, button, pressed)
            if pressed and button == "left" then
                wesnoth.sync.invoke_command("on_click_spell_event", {type="_stain", x=screen_x, y=screen_y})
            end
        end
    end

    >>
[/lua]

