#############################
# CAST SPELL (command-driven)
# Casts a normal (self/automatic) spell by id, deducting its catalogue cost.
# SPELL_ID = e.g. skill_shield, skill_stasis, skill_polymorph_lizard.
#############################
#define CAST_SPELL CASTER SPELL_ID
    [cast_spell]
        [filter]
            {CASTER}
        [/filter]
        spell_id={SPELL_ID}
    [/cast_spell]
#enddef

#############################
# CAST SPELL FREE
# Same as CAST_SPELL but with no cost (cutscenes / scripted events).
#############################
#define CAST_SPELL_FREE CASTER SPELL_ID
    [cast_spell]
        [filter]
            {CASTER}
        [/filter]
        spell_id={SPELL_ID}
        free=yes
    [/cast_spell]
#enddef

#############################
# CAST TARGETED SPELL (TRSS, command-driven)
# Fires a TRSS spell's "<SPELL_ID>_cast" effect directly on hex X,Y — no clicking.
# Deducts the spell's catalogue cost; use CAST_TARGETED_SPELL_FREE for no cost.
# Works for adjacent & ranged effects; "rose" bend_* spells' click-handler extras
# (unit push / lava damage) are not replicated.
#############################
#define CAST_TARGETED_SPELL CASTER SPELL_ID X Y
    [cast_targeted_spell]
        [filter]
            {CASTER}
        [/filter]
        spell_id={SPELL_ID}
        target_x,target_y={X},{Y}
    [/cast_targeted_spell]
#enddef

#define CAST_TARGETED_SPELL_FREE CASTER SPELL_ID X Y
    [cast_targeted_spell]
        [filter]
            {CASTER}
        [/filter]
        spell_id={SPELL_ID}
        target_x,target_y={X},{Y}
        free=yes
    [/cast_targeted_spell]
#enddef

#############################
# CASTER AI SPELL (adaptive AI — targeted)
# Registers a Lua candidate action so AI casters on SIDE will cast a targeted
# (TRSS) spell at the best enemy within RANGE, as part of the AI's normal turn.
#   SIDE   = AI side number
#   SPELL  = spell id (e.g. skill_disattack); fires <SPELL>_cast
#   RANGE  = max hex distance to a target (match the spell's TRSS radius)
#   MODE   = nearest | weakest
#   SCORE  = candidate-action score (~95000 competes with attacks)
# Casts are free by default. Call once per (side, spell), in/after prestart.
#############################
#define CASTER_AI_SPELL SIDE SPELL RANGE MODE SCORE
    [modify_ai]
        side={SIDE}
        action=add
        path=stage[main_loop].candidate_action
        [candidate_action]
            id=ctl_ai_{SIDE}_{SPELL}
            engine=lua
            name=ctl_ai_{SIDE}_{SPELL}
            max_score={SCORE}
            evaluation=<<
                return wesnoth.require("~add-ons/Chasing_the_Light/magic/ai.lua").eval({SIDE}, "{SPELL}", {RANGE}, "{MODE}", {SCORE})
            >>
            execution=<<
                wesnoth.require("~add-ons/Chasing_the_Light/magic/ai.lua").exec({SIDE}, "{SPELL}", {RANGE}, "{MODE}", {SCORE})
            >>
        [/candidate_action]
    [/modify_ai]
#enddef

#############################
# CASTER AI SPELL SELF (adaptive AI — self-cast)
# As CASTER_AI_SPELL but for a self/automatic spell (e.g. skill_shield,
# skill_stasis) cast on the caster itself — no target required.
#############################
#define CASTER_AI_SPELL_SELF SIDE SPELL SCORE
    [modify_ai]
        side={SIDE}
        action=add
        path=stage[main_loop].candidate_action
        [candidate_action]
            id=ctl_ai_self_{SIDE}_{SPELL}
            engine=lua
            name=ctl_ai_self_{SIDE}_{SPELL}
            max_score={SCORE}
            evaluation=<<
                return wesnoth.require("~add-ons/Chasing_the_Light/magic/ai.lua").eval({SIDE}, "{SPELL}", nil, nil, {SCORE}, true)
            >>
            execution=<<
                wesnoth.require("~add-ons/Chasing_the_Light/magic/ai.lua").exec({SIDE}, "{SPELL}", nil, nil, {SCORE}, true)
            >>
        [/candidate_action]
    [/modify_ai]
#enddef

#############################
# CASTER AI (adaptive AI — autonomous)
# One candidate action for the whole side: each AI caster looks at ITS OWN
# equipped spells and picks the most useful one for the current board, using the
# per-spell profiles in ai.lua (add a profile there to enable another spell).
#   SIDE  = AI side number
#   SCORE = candidate-action score (~95000 competes with attacks)
# This is the "it decides for itself" option — no per-spell registration.
#############################
#define CASTER_AI SIDE SCORE
    [modify_ai]
        side={SIDE}
        action=add
        path=stage[main_loop].candidate_action
        [candidate_action]
            id=ctl_ai_auto_{SIDE}
            engine=lua
            name=ctl_ai_auto_{SIDE}
            max_score={SCORE}
            evaluation=<<
                return wesnoth.require("~add-ons/Chasing_the_Light/magic/ai.lua").eval_auto({SIDE}, {SCORE})
            >>
            execution=<<
                wesnoth.require("~add-ons/Chasing_the_Light/magic/ai.lua").exec_auto({SIDE}, {SCORE})
            >>
        [/candidate_action]
    [/modify_ai]
#enddef