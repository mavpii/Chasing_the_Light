#############################
# CASTER RESELECT
# Enables/disables the "Change Spells" button in the cast dialog.
# ACTIVE = yes to enable, no to disable.
#############################
#define CASTER_RESELECT CASTER ACTIVE
    [caster_reselect]
        [filter]
            {CASTER}
        [/filter]
        reselect_allowed={ACTIVE}
    [/caster_reselect]
#enddef

#############################
# CASTER MAX CASTS
# Sets how many spells the caster may cast per turn (default 1).
# N = integer, minimum 1.
#############################
#define CASTER_MAX_CASTS CASTER N
    [caster_max_casts]
        [filter]
            {CASTER}
        [/filter]
        max_casts={N}
    [/caster_max_casts]
#enddef

#############################
# CASTER FREE ASSIGN
# Enables/disables free-assign mode. When enabled, the spell selection dialog
# lets the player pick ANY spell into ANY slot via a picker grid (hover shows
# the description and cost; click selects it into the slot).
# ACTIVE = yes to enable, no to disable.
#############################
#define CASTER_FREE_ASSIGN CASTER ACTIVE
    [caster_free_assign]
        [filter]
            {CASTER}
        [/filter]
        free_assign_allowed={ACTIVE}
    [/caster_free_assign]
#enddef

#############################
# CASTER FREE UNLOCKED (free-pick)
# Enables/disables free-pick mode. Same picker UI as free-assign, but the grid
# is restricted to the caster's UNLOCKED spells only (pick any unlocked spell
# into any slot).
# ACTIVE = yes to enable, no to disable.
#############################
#define CASTER_FREE_UNLOCKED CASTER ACTIVE
    [caster_free_unlocked]
        [filter]
            {CASTER}
        [/filter]
        free_unlocked_allowed={ACTIVE}
    [/caster_free_unlocked]
#enddef