#textdomain wesnoth-ctl

#define AIMAGE SIDE ID TYPE X Y XP COUNT
    [unit]
        id={ID}
        type={TYPE}
        side={SIDE}
        x={X}
        y={Y}
        experience={XP}
    [/unit]
    {VARIABLE aimage_id {ID}}
    {VARIABLE aimage_count {COUNT}}
    [lua]
        code= << ai_battle_roll_loadout(wml.variables["aimage_id"], wml.variables["aimage_count"]) >>
    [/lua]
    {CLEAR_VARIABLE aimage_id}
    {CLEAR_VARIABLE aimage_count}
#enddef

[multiplayer]
    id=97_AI_Caster_Battle
    name= _ "CtL — 7v7 AI Caster Battle"
    map_data="{~add-ons/Chasing_the_Light/magic/maps/97_AI_Battle.map}"
    force_modification=ctl_magic_system

    victory_when_enemies_defeated=yes
    disallow_recall=yes
    carryover_percentage=0

    [side]
        side=1
        controller=ai
        team_name=Team_A
        user_team_name= _ "Order of Mages"
        defeat_condition=no_units_left
        gold=200
        {INCOME 0 0 0}
        fog=no
        shroud=no
        color=red
        [ai]
            aggression=1.0
            caution=0.0
        [/ai]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=Team_B
        user_team_name= _ "Coven of Sorcerers"
        defeat_condition=no_units_left
        gold=200
        {INCOME 0 0 0}
        fog=no
        shroud=no
        color=blue
        [ai]
            aggression=1.0
            caution=0.0
        [/ai]
    [/side]


    [event]
        name=prestart

        [lua]
            code= <<
                local profiles = wesnoth.require "~add-ons/Chasing_the_Light/magic/ai/ai_profiles.lua"
                local catalogue = wesnoth.require "~add-ons/Chasing_the_Light/magic/spells/table.lua"

                local is_subskill, parent_of = {}, {}
                for _, spell in pairs(catalogue.skill_set) do
                    if type(spell) == "table" and spell.subskills then
                        for _, sub in ipairs(spell.subskills) do
                            is_subskill[sub.id] = true
                            parent_of[sub.id]   = spell.id
                        end
                    end
                end

                local pool_set = {}
                for id in pairs(profiles) do
                    pool_set[ is_subskill[id] and parent_of[id] or id ] = true
                end

                local pool = {}
                for id in pairs(pool_set) do pool[#pool + 1] = id end
                table.sort(pool)

                function ai_battle_roll_loadout(id, count)
                    local bag = {}
                    for i, v in ipairs(pool) do bag[i] = v end
                    for i = #bag, 2, -1 do
                        local j = wesnoth.random(i)
                        bag[i], bag[j] = bag[j], bag[i]
                    end

                    local picked = {}
                    for i = 1, math.min(count, #bag) do picked[i] = bag[i] end
                    local list = table.concat(picked, ",")

                    local cfg = {
                        wml.tag.filter{ id = id },
                        unlocked_spells = list,
                        equipped_spells = list,
                    }
                    for i, spell in ipairs(picked) do
                        cfg["spell_group_" .. i] = spell
                    end
                    wml.fire("assign_caster", cfg)

                    wesnoth.interface.add_chat_message("AI Battle", id .. ": " .. list)
                end
            >>
        [/lua]

        {AIMAGE 1 a1 (Red Mage)          4 2 60 4}
        {AIMAGE 1 a2 (White Mage)        4 3 60 4}
        {AIMAGE 1 a3 (Elvish Sorceress)  4 4 60 4}
        {AIMAGE 1 a4 (Saurian Oracle)    4 5 60 4}
        {AIMAGE 1 a5 (Mermaid Priestess) 4 6 60 4}
        {AIMAGE 1 a6 (Dark Sorcerer)     4 7 60 4}
        {AIMAGE 1 a7 (Dwarvish Runesmith) 4 8 60 4}

        {AIMAGE 2 b1 (Red Mage)            14 2 60 4}
        {AIMAGE 2 b2 (White Mage)          14 3 60 4}
        {AIMAGE 2 b3 (Elvish Druid)        14 4 60 4}
        {AIMAGE 2 b4 (Saurian Soothsayer)  14 5 60 4}
        {AIMAGE 2 b5 (Mermaid Siren)       14 6 60 4}
        {AIMAGE 2 b6 (Dark Sorcerer)       14 7 60 4}
        {AIMAGE 2 b7 (Dwarvish Runesmith)  14 8 60 4}

        [modify_unit]
		[filter]
		id=a1
		[/filter]
		canrecruit=yes
		[/modify_unit]
        [modify_unit]
		[filter]
		id=b1
		[/filter]
		canrecruit=yes
		[/modify_unit]

        {CASTER_AI 1 110000}
        {CASTER_AI 2 110000}

        [label] x=4  y=1 text= _ "Order of Mages (AI)"
		[/label]
        [label] x=14 y=1 text= _ "Coven of Sorcerers (AI)"
		[/label]
    [/event]
[/multiplayer]
