#textdomain wesnoth-ctl
[multiplayer]
    id=98_MP_Magic_Test
    name= _ "CtL — Magic System Test"
    map_data="{~add-ons/Chasing_the_Light/magic/maps/98_MP_Test.map}"

    force_modification=ctl_magic_system

    victory_when_enemies_defeated=yes
    disallow_recall=yes
    carryover_percentage=0

    [side]
        side=1
        controller=human
        team_name=Casters_1
        user_team_name= _ "Casters"
        defeat_condition=no_units_left
        gold=120
        {INCOME 0 0 0}
        fog=no
        shroud=no
        {FLAG_VARIANT long}
        color=purple
    [/side]

    [side]
        side=2
        controller=human
        team_name=Casters_2
        user_team_name= _ "Casters"
        defeat_condition=no_units_left
        gold=120
        {INCOME 0 0 0}
        fog=no
        shroud=no
        {FLAG_VARIANT long}
    [/side]
	
	[side]
        side=3
		no_leader = yes
        controller=ai
        team_name=Elementals
		hidden=yes
		allow_player=no
		defeat_condition=never
    [/side]

    [event]
        name=prestart

        [unit]
            id=Mage_1
            name= _ "Bryn"
            type=Swordsman
            experience=40
            canrecruit=no
            side=1
            x=3
            y=6
            {IS_HERO}
        [/unit]

        [unit]
            id=MageHealer_1
            name= _ "Tamsin"
            type=White Mage
            experience=40
            canrecruit=no
            side=1
            x=2
            y=7
            {IS_HERO}
        [/unit]

        [unit]
            id=Faisim_Copy
            name= _ "Faisim"
            type=Dark Sorcerer
			gender=female
            experience=40
            canrecruit=no
            side=2
            x=13
            y=6
            {IS_HERO}
        [/unit]

        [unit]
            id=Mage_2
            name= _ "Orven"
            type=Bandit
            experience=40
            canrecruit=no
            side=2
            x=14
            y=7
            {IS_HERO}
        [/unit]

        [unit]
            id=quintain_mp1
            type=Quintain
            canrecruit=no
            side=3
            x=8
            y=2
        [/unit]
        [unit]
            id=quintain_mp2
            type=Quintain
            canrecruit=no
            side=3
            x=8
            y=6
        [/unit]
        [unit]
            id=quintain_mp3
            type=Quintain
            canrecruit=no
            side=3
            x=8
            y=10
        [/unit]

        [modify_unit]
            [filter]
                side=3
            [/filter]
            moves=0
            max_moves=0
            ai_special=guardian
        [/modify_unit]

        [modify_unit]
            [filter]
                side=1
                canrecruit=yes
            [/filter]
			id=Haralin
            experience=60
            max_experience=90
        [/modify_unit]
        [modify_unit]
            [filter]
                side=2
                canrecruit=yes
            [/filter]
			id=Daeola
            experience=60
            max_experience=90
        [/modify_unit]

        [assign_caster]
            [filter]
                side=1
                canrecruit=yes
            [/filter]
            spell_group_1 = skill_summon
            spell_group_2 = skill_bend
            spell_group_3 = skill_fireball2
            spell_group_4 = skill_blizzard
            unlocked_spells = skill_summon, skill_summon_mud, skill_summon_rock, skill_summon_water, skill_summon_air, skill_summon_fire, skill_bend, skill_bend_earth, skill_bend_water, skill_bend_lava, skill_fireball2, skill_blizzard, skill_nature_revenge, skill_levitate, skill_void_rift, skill_counterspell, skill_shield
            equipped_spells = skill_summon, skill_bend, skill_fireball2, skill_blizzard
            free_unlocked = yes
        [/assign_caster]

        [assign_caster]
            [filter]
                id=Mage_1
            [/filter]
            spell_group_1 = skill_shield
            spell_group_2 = skill_chill_touch
            spell_group_3 = skill_levitate
            spell_group_4 = skill_phantom_flurry
            unlocked_spells = skill_shield, skill_chill_touch, skill_levitate, skill_phantom_flurry
            equipped_spells = skill_shield, skill_chill_touch, skill_levitate, skill_phantom_flurry
        [/assign_caster]

        [assign_caster]
            [filter]
                id=MageHealer_1
            [/filter]
            spell_group_1 = skill_disheal
            spell_group_2 = skill_relocate
            spell_group_3 = skill_massheal
            spell_group_4 = skill_panacea
            unlocked_spells = skill_disheal, skill_relocate, skill_massheal, skill_panacea
            equipped_spells = skill_disheal, skill_relocate, skill_massheal, skill_panacea
        [/assign_caster]

        [assign_caster]
            [filter]
                side=2
                canrecruit=yes
            [/filter]
            spell_group_1 = skill_magic_missile, skill_disattack
            spell_group_2 = skill_swap,          skill_levitate
            spell_group_3 = skill_disheal,       skill_ward
            spell_group_4 = skill_summon
            unlocked_spells = skill_magic_missile, skill_disattack, skill_swap, skill_levitate, skill_disheal, skill_ward, skill_summon, skill_summon_mud, skill_summon_rock, skill_summon_water, skill_summon_air, skill_summon_fire, skill_massheal, skill_counterspell, skill_relocate
            equipped_spells = skill_magic_missile, skill_swap, skill_ward, skill_summon
            free_unlocked = yes
        [/assign_caster]

        [assign_caster]
            [filter]
                id=Faisim_Copy
            [/filter]
            spell_group_1 = skill_astral_arms
            spell_group_2 = skill_shadowstep
            spell_group_3 = skill_astral_chains
            spell_group_4 = skill_haste
            unlocked_spells = skill_astral_arms, skill_arms_astral, skill_arms_blade, skill_arms_spear, skill_arms_mace, skill_arms_daggers, skill_shadowstep, skill_astral_chains, skill_haste
            equipped_spells = skill_astral_arms, skill_shadowstep, skill_astral_chains, skill_haste
        [/assign_caster]

        [assign_caster]
            [filter]
                id=Mage_2
            [/filter]
            spell_group_1 = skill_disattack
            spell_group_2 = skill_smite
            spell_group_3 = skill_stasis
            spell_group_4 = skill_soul_siphon
            unlocked_spells = skill_disattack, skill_smite, skill_stasis, skill_soul_siphon
            equipped_spells = skill_disattack, skill_smite, skill_stasis, skill_soul_siphon
        [/assign_caster]

        {CASTER_STATUS (side=1 canrecruit=yes) yes}
        {CASTER_STATUS (side=2 canrecruit=yes) yes}
        {CASTER_STATUS id=Mage_1,MageHealer_1,Faisim_Copy,Mage_2 yes}

        {CASTER_RESELECT (canrecruit=yes) yes}

        {CASTER_MAX_CASTS (canrecruit=yes) 2}
        {CASTER_MAX_CASTS id=Mage_1 1}
        {CASTER_MAX_CASTS id=MageHealer_1 1}
        {CASTER_MAX_CASTS id=Faisim_Copy 1}
        {CASTER_MAX_CASTS id=Mage_2 1}

    [/event]
[/multiplayer]
