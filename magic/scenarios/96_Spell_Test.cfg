#textdomain wesnoth-ctl

#define SPELL_TEST_ASSERT MESSAGE
    [do_command]
        [fire_event]
            raise=spell_test_failed
        [/fire_event]
    [/do_command]
    {VARIABLE spell_test_error {MESSAGE}}
#enddef

[test]
    id=96_Spell_Test
    name= _ "CtL — Spell Regression Test"
    map_data="{~add-ons/Chasing_the_Light/magic/maps/96_Spell_Test.map}"
    turns=-1
    victory_when_enemies_defeated=no
    is_unit_test=yes

    {DEFAULT_SCHEDULE}

    [side]
        side=1
        controller=human
        team_name=testers
        user_team_name= _ "Testers"
        gold=500
        {INCOME 0 0 0}
        fog=no
        shroud=no
        [unit]
            id=tester
            type=Mage
            side=1
            x=5
            y=5
            experience=0
            canrecruit=yes
        [/unit]
        [unit]
            id=friend
            type=Spearman
            side=1
            x=5
            y=6
        [/unit]
    [/side]

    [side]
        side=2
        controller=ai
        team_name=dummies
        user_team_name= _ "Dummies"
        gold=0
        {INCOME 0 0 0}
        fog=no
        shroud=no
        [unit]
            id=dummy_undead
            type=Soulless
            side=2
            x=6
            y=5
        [/unit]
        [unit]
            id=dummy_living
            type=Spearman
            side=2
            x=6
            y=4
        [/unit]
        [ai]
            passive_leader=yes
        [/ai]
    [/side]

    {MAGIC_SYSTEM__GLOBAL_EVENTS}

    [event]
        name=start

        [lua]
            code= <<
                local catalogue = wesnoth.require "~add-ons/Chasing_the_Light/magic/spells/table.lua"

                local castable, ids = {}, {}
                for _, spell in pairs(catalogue.skill_set) do
                    if type(spell) == "table" and spell.id then
                        if spell.subskills then
                            for _, sub in ipairs(spell.subskills) do
                                castable[#castable + 1] = sub.id
                            end
                        else
                            castable[#castable + 1] = spell.id
                        end
                        ids[#ids + 1] = spell.id
                        for _, sub in ipairs(spell.subskills or {}) do
                            ids[#ids + 1] = sub.id
                        end
                    end
                end
                table.sort(castable)
                table.sort(ids)

                wml.variables["spell_test_total"]  = #castable
                wml.variables["spell_test_failed_count"] = 0
                wml.array_access.set("spell_test_queue",
                    (function() local t = {} for i, id in ipairs(castable) do t[i] = { id = id } end return t end)())

                local all = table.concat(ids, ",")
                wml.fire("assign_caster", {
                    wml.tag.filter{ id = "tester" },
                    spell_group_1   = all,
                    unlocked_spells = all,
                    equipped_spells = all,
                })
                wml.fire("caster_free_casting", {
                    wml.tag.filter{ id = "tester" },
                    free_casting_allowed = "yes",
                })
                wml.fire("caster_max_casts", {
                    wml.tag.filter{ id = "tester" },
                    max_casts = #castable + 10,
                })
            >>
        [/lua]

        [lua]
            code= <<
                local queue = wml.array_access.get("spell_test_queue")
                local failed = {}

                for _, entry in ipairs(queue) do
                    local id = entry.id
                    local tester = wesnoth.units.get("tester")
                    if not tester then
                        failed[#failed + 1] = id .. " (caster gone)"
                        break
                    end

                    tester.hitpoints = tester.max_hitpoints
                    tester.experience = 200
                    tester.moves = tester.max_moves
                    tester.attacks_left = 1

                    local ok, err = pcall(function()
                        wml.fire("cast_spell", {
                            wml.tag.filter{ id = "tester" },
                            spell_id = id,
                            free = "yes",
                        })
                    end)
                    if not ok then
                        failed[#failed + 1] = id .. " -> " .. tostring(err)
                    end

                    local ok2, err2 = pcall(function()
                        wml.fire("cast_targeted_spell", {
                            wml.tag.filter{ id = "tester" },
                            spell_id = id,
                            target_x = 6,
                            target_y = 5,
                            free = "yes",
                        })
                    end)
                    if not ok2 then
                        failed[#failed + 1] = id .. " (targeted) -> " .. tostring(err2)
                    end
                end

                wml.variables["spell_test_failed_count"] = #failed
                if #failed > 0 then
                    wml.variables["spell_test_error"] = table.concat(failed, " | ")
                    std_print("SPELL TEST FAILURES:")
                    for _, line in ipairs(failed) do std_print("  " .. line) end
                else
                    std_print("SPELL TEST: " .. wml.variables["spell_test_total"] .. " spells cast, no errors")
                end
            >>
        [/lua]

        [if]
            [variable]
                name=spell_test_failed_count
                greater_than=0
            [/variable]
            [then]
                [message]
                    speaker=narrator
                    message=_"Spell test FAILED: $spell_test_error"
                [/message]
                [endlevel]
                    result=defeat
                [/endlevel]
            [/then]
            [else]
                [message]
                    speaker=narrator
                    message=_"Spell test passed: $spell_test_total| spells cast without errors."
                [/message]
                [endlevel]
                    result=victory
                    linger_mode=no
                [/endlevel]
            [/else]
        [/if]
    [/event]
[/test]
