#textdomain wesnoth-ctl

#############################
## FRAMELESS SCENE WINDOWS ##
#############################

[window_definition]
    id = ctl_dialogue
    description = "CtL: frameless window for the dialogue overlay."

    [resolution]
        left_border = 0
        right_border = 0
        top_border = 0
        bottom_border = 0

        [background]
            [draw]
            [/draw]
        [/background]

        [foreground]
            [draw]
            [/draw]
        [/foreground]

        [grid]
            [row]
                grow_factor = 1
                [column]
                    horizontal_grow = true
                    vertical_grow = true
                    [grid]
                        id = "_window_content_grid"
                    [/grid]
                [/column]
            [/row]
        [/grid]
    [/resolution]
[/window_definition]

[window_definition]
    id = ctl_dialogue_dismiss
    description = "CtL: dialogue overlay that a click anywhere advances."

    [resolution]
        left_border = 0
        right_border = 0
        top_border = 0
        bottom_border = 0

        [background]
            [draw]
            [/draw]
        [/background]

        [foreground]
            [draw]
            [/draw]
        [/foreground]

        [grid]
            [row]
                grow_factor = 1
                [column]
                    horizontal_grow = true
                    vertical_grow = true
                    [grid]
                        id = "_window_content_grid"
                    [/grid]
                [/column]
            [/row]
            [row]
                grow_factor = 0
                [column]
                    [button]
                        id = "click_dismiss"
                        definition = "ctl_dialogue_hotspot"
                        label = ""
                    [/button]
                [/column]
            [/row]
        [/grid]
    [/resolution]
[/window_definition]

[button_definition]
    id = ctl_dialogue_hotspot
    description = "CtL: zero-chrome click target."

    [resolution]
        min_width = 1
        min_height = 1
        default_width = 1
        default_height = 1

        [state_enabled]
            [draw]
            [/draw]
        [/state_enabled]
        [state_disabled]
            [draw]
            [/draw]
        [/state_disabled]
        [state_focused]
            [draw]
            [/draw]
        [/state_focused]
        [state_pressed]
            [draw]
            [/draw]
        [/state_pressed]
    [/resolution]
[/button_definition]

##################
## DIALOGUE BOX ##
##################

[panel_definition]
    id = ctl_dialogue_box
    description = "CtL: dialogue box backing."

    [resolution]
        min_width = 100
        min_height = 60

        left_border = 22
        right_border = 22
        top_border = 16
        bottom_border = 16

        [background]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 10
                    fill_color = "14, 12, 20, 216"
                    border_color = "186, 172, 125, 150"
                    border_thickness = 1
                [/round_rectangle]
            [/draw]
        [/background]

        [foreground]
            [draw]
            [/draw]
        [/foreground]
    [/resolution]
[/panel_definition]

####################
## CHOICE BUTTONS ##
####################

[button_definition]
    id = ctl_dialogue_choice
    description = "CtL: dialogue choice button."

    [resolution]
        min_width = 220
        min_height = 42

        default_width = 560
        default_height = 42

        text_extra_width = 44
        text_extra_height = 16
        text_font_size = 17
        text_font_style = ""

        [state_enabled]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "30, 27, 38, 190"
                    border_color = "114, 79, 46, 160"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = 22
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "215, 215, 215, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_enabled]

        [state_disabled]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "24, 22, 28, 150"
                    border_color = "90, 84, 72, 90"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = 22
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "124, 118, 106, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_disabled]

        [state_focused]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "58, 50, 40, 225"
                    border_color = "255, 247, 164, 210"
                    border_thickness = 1
                [/round_rectangle]
                [rectangle]
                    x = 0
                    y = 6
                    w = 4
                    h = "(height - 12)"
                    fill_color = "255, 247, 164, 255"
                [/rectangle]
                [text]
                    x = 22
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "255, 250, 214, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_focused]

        [state_pressed]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "86, 72, 50, 235"
                    border_color = "255, 247, 164, 240"
                    border_thickness = 1
                [/round_rectangle]
                [rectangle]
                    x = 0
                    y = 4
                    w = 4
                    h = "(height - 8)"
                    fill_color = "255, 247, 164, 255"
                [/rectangle]
                [text]
                    x = 24
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "255, 252, 240, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 38)"
                [/text]
            [/draw]
        [/state_pressed]
    [/resolution]
[/button_definition]
