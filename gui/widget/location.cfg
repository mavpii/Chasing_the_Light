#textdomain wesnoth-ctl

############################
## FRAMELESS SCENE WINDOW ##
############################

[window_definition]
    id = ctl_location
    description = "CtL: frameless window for the location card."

    [resolution]
        left_border = 0
        right_border = 0
        top_border = 0
        bottom_border = 0

        [background]
            [draw]
                [rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    fill_color = "8, 7, 11, 160"
                [/rectangle]
            [/draw]
        [/background]

        [foreground]
            [draw]
            [/draw]
        [/foreground]

        [grid]
            [row]
                grow_factor = 1
                [column]
                    horizontal_grow = true
                    vertical_grow = true
                    [grid]
                        id = "_window_content_grid"
                    [/grid]
                [/column]
            [/row]
        [/grid]
    [/resolution]
[/window_definition]

###################
## LOCATION CARD ##
###################

[panel_definition]
    id = ctl_location_box
    description = "CtL: location card backing."

    [resolution]
        min_width = 100
        min_height = 60

        left_border = 28
        right_border = 28
        top_border = 20
        bottom_border = 20

        [background]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 10
                    fill_color = "14, 12, 20, 216"
                    border_color = "186, 172, 125, 150"
                    border_thickness = 1
                [/round_rectangle]
            [/draw]
        [/background]

        [foreground]
            [draw]
            [/draw]
        [/foreground]
    [/resolution]
[/panel_definition]

####################
## CHOICE BUTTONS ##
####################

[button_definition]
    id = ctl_location_choice
    description = "CtL: location card choice button."

    [resolution]
        min_width = 190
        min_height = 42

        default_width = 250
        default_height = 42

        text_extra_width = 48
        text_extra_height = 16
        text_font_size = 17
        text_font_style = ""

        [state_enabled]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "30, 27, 38, 190"
                    border_color = "114, 79, 46, 160"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "215, 215, 215, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_enabled]

        [state_disabled]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "24, 22, 28, 150"
                    border_color = "90, 84, 72, 90"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "124, 118, 106, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_disabled]

        [state_focused]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "58, 50, 40, 225"
                    border_color = "255, 247, 164, 210"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "255, 250, 214, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_focused]

        [state_pressed]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "86, 72, 50, 235"
                    border_color = "255, 247, 164, 240"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "255, 252, 240, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_pressed]
    [/resolution]
[/button_definition]
