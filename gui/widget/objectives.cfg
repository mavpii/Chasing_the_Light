#textdomain wesnoth-ctl

##################
## FRAMED SHEET ##
##################

[window_definition]
    id = ctl_objectives
    description = "CtL: framed window for the objectives sheet."

    [resolution]
        left_border = 10
        right_border = 13
        top_border = 10
        bottom_border = 13

        [background]
            [draw]
                [pre_commit]
                    [blur]
                        depth = 8
                    [/blur]
                [/pre_commit]

                [image]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    name = "dialogs/translucent65-background.png~CS(20,22,26)"
                    resize_mode = "tile_highres"
                [/image]

                [image]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height * 0.66)"
                    name = "misc/journeylog-bg.png"
                    resize_mode = "stretch"
                [/image]

                [image]
                    x = 3
                    y = 3
                    w = "(image_width)"
                    h = "(image_height)"
                    name = "dialogs/multi_create/corner.png~O(0.50)~ROTATE(90)"
                [/image]

                [image]
                    x = "(width - image_width - 3)"
                    y = 3
                    w = "(image_width)"
                    h = "(image_height)"
                    name = "dialogs/multi_create/corner.png~O(0.50)~ROTATE(180)"
                [/image]

                [image]
                    x = 3
                    y = "(height - image_height - 3)"
                    w = "(image_width)"
                    h = "(image_height)"
                    name = "dialogs/multi_create/corner.png~O(0.50)"
                [/image]

                [image]
                    x = "(width - image_width - 3)"
                    y = "(height - image_height - 3)"
                    w = "(image_width)"
                    h = "(image_height)"
                    name = "dialogs/multi_create/corner.png~O(0.50)~ROTATE(-90)"
                [/image]
            [/draw]
        [/background]

        [foreground]
            [draw]
            [/draw]
        [/foreground]

        [grid]
            [row]
                grow_factor = 1
                [column]
                    horizontal_grow = true
                    vertical_grow = true
                    [grid]
                        id = "_window_content_grid"
                    [/grid]
                [/column]
            [/row]
        [/grid]
    [/resolution]
[/window_definition]

##################
## CLOSE BUTTON ##
##################

[button_definition]
    id = ctl_objectives_close
    description = "CtL: objectives sheet close button."

    [resolution]
        min_width = 160
        min_height = 40

        default_width = 200
        default_height = 40

        text_extra_width = 48
        text_extra_height = 16
        text_font_size = 17
        text_font_style = ""

        [state_enabled]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "22, 20, 28, 170"
                    border_color = "186, 172, 125, 120"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "215, 215, 215, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_enabled]

        [state_disabled]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "20, 18, 24, 130"
                    border_color = "90, 84, 72, 90"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "124, 118, 106, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_disabled]

        [state_focused]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "58, 50, 40, 215"
                    border_color = "255, 247, 164, 210"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "255, 250, 214, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_focused]

        [state_pressed]
            [draw]
                [round_rectangle]
                    x = 0
                    y = 0
                    w = "(width)"
                    h = "(height)"
                    corner_radius = 6
                    fill_color = "86, 72, 50, 235"
                    border_color = "255, 247, 164, 240"
                    border_thickness = 1
                [/round_rectangle]
                [text]
                    x = "(max((width - text_width) / 2, 0))"
                    y = "(height / 2 - text_height / 2)"
                    w = "(text_width)"
                    h = "(text_height)"
                    font_size = 17
                    color = "255, 252, 240, 255"
                    text = "(text)"
                    text_markup = true
                    maximum_width = "(width - 36)"
                [/text]
            [/draw]
        [/state_pressed]
    [/resolution]
[/button_definition]
