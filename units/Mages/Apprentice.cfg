#textdomain wesnoth-ctl

#define APPRENTICE_IMPULSE_ANIM FRAMES
    [attack_anim]
        [filter_attack]
            name=impulse
        [/filter_attack]
        start_time=-590
        missile_start_time=-200
        halo_start_time=-250
        [frame]
            image={FRAMES}
        [/frame]
        [missile_frame]
            duration=200
            image="projectiles/darkmissile-n.png"
            image_diagonal="projectiles/darkmissile-ne.png"
        [/missile_frame]
        [halo_frame]
            halo="halo/undead/dark-magic-[1~6].png~O(35%):50"
            halo_x,halo_y=5,10
            auto_vflip=no
        [/halo_frame]
        {SOUND:HIT_AND_MISS magic-dark.ogg magic-dark-miss.ogg -200}
    [/attack_anim]
#enddef

[unit_type]
    id=Apprentice
    name= _ "Apprentice"
    race=human
    image="units/mages/apprentice.png"
    profile="portraits/mages/apprentice.png"
    hitpoints=17
    movement_type=smallfoot
    movement=5
    experience=16
    level=0
    alignment=lawful
    advances_to=Battle Mage,Mender
    cost=12
    usage=archer
	#po: Будь-який маг починав свій шлях як ученик, бо ж самому без допомоги більш досвідченого чаклуна практично неможливо зрозуміти сутність магії та навчитися її основ, хіба що новачок має неймовірний талант або його веде вища сила
    description= _"Any future mage begin their journey as an apprentice, because without the help of a more experienced sorcerer it's almost impossible to understand the essence of magic and learn its basics, unless the beginner has an incredible talent or is guided by a higher power."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/mages/apprentice.png" "units/mages/apprentice.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=impulse
        description=_"impulse"
        icon=attacks/mud-missile.png
        type=impact
        range=ranged
        damage=5
        number=2
        specials_list=magical
    [/attack]

    {APPRENTICE_IMPULSE_ANIM "units/mages/apprentice-magic-[1~10].png:[70,70,80,80,90,60,90,80,70,80]"}

    [female]
        name= _ "female^Apprentice"
        gender=female
        image="units/mages/apprentice+female.png"
        profile="portraits/mages/apprentice+female.png"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {DEFENSE_ANIM "units/mages/apprentice+female.png" "units/mages/apprentice+female.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
        {APPRENTICE_IMPULSE_ANIM "units/mages/apprentice+female.png:770"}
    [/female]
[/unit_type]

#undef APPRENTICE_IMPULSE_ANIM
