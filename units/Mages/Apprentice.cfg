#textdomain wesnoth-ctl

#define APPRENTICE_IMPULSE_MISSILE END
            [missile_frame]
                duration=1
            [/missile_frame]
            [missile_frame]
                image="projectiles/impulse[5~10].png~SCALE(40,40)~ROTATE(270):[50*3,60*3]"
                image_diagonal="projectiles/impulse[5~10].png~SCALE(40,40)~ROTATE(326):[50*3,60*3]"
                offset=0.15~{END}:150,{END}:180
            [/missile_frame]
            [missile_frame]
                duration=1
            [/missile_frame]
#enddef

#define APPRENTICE_IMPULSE_ANIM FRAMES
    [attack_anim]
        [filter_attack]
            name=impulse
        [/filter_attack]
        start_time=-590
        offset=0
        [frame]
            image={FRAMES}
        [/frame]
        charge_start_time=-351
        [charge_frame]
            duration=1
        [/charge_frame]
        [charge_frame]
            layer=60
            image="projectiles/impulse[1~4].png~SCALE(40,40):50"
            offset=0.15
            auto_hflip=no
            auto_vflip=no
        [/charge_frame]
        [charge_frame]
            duration=1
        [/charge_frame]
        missile_start_time=-151
        [if]
            hits=yes
            {APPRENTICE_IMPULSE_MISSILE 1.0}
        [/if]
        [else]
            hits=no
            {APPRENTICE_IMPULSE_MISSILE 0.8}
        [/else]
        {SOUND:HIT_AND_MISS magic-dark.ogg magic-dark-miss.ogg -150}
    [/attack_anim]
#enddef

#define APPRENTICE_DEFEND_ANIM IMG HIT_SOUND
    [defend]
        start_time=-200
        [frame]
            image="units/mages/{IMG}-defend-[1~5].png:[60,70,100,70,60]"
        [/frame]
        [if]
            hit_sound_start_time=-25
            hits=hit
            [hit_sound_frame]
                sound={HIT_SOUND}
            [/hit_sound_frame]
        [/if]
    [/defend]
#enddef

[unit_type]
    id=Apprentice
    name= _ "Apprentice"
    race=human
    image="units/mages/apprentice.png"
    profile="portraits/mages/apprentice.png"
    hitpoints=17
    movement_type=smallfoot
    movement=5
    experience=16
    level=0
    alignment=lawful
    advances_to=Battle Mage,Mender
    cost=12
    usage=archer
	#po: Будь-який маг починав свій шлях як ученик, бо ж самому без допомоги більш досвідченого чаклуна практично неможливо зрозуміти сутність магії та навчитися її основ, хіба що новачок має неймовірний талант або його веде вища сила
    description= _"Any future mage begin their journey as an apprentice, because without the help of a more experienced sorcerer it's almost impossible to understand the essence of magic and learn its basics, unless the beginner has an incredible talent or is guided by a higher power."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {APPRENTICE_DEFEND_ANIM apprentice {SOUND_LIST:HUMAN_HIT}}

    [attack]
        name=impulse
        description=_"impulse"
        icon=attacks/mud-missile.png
        type=impact
        range=ranged
        damage=5
        number=2
        specials_list=magical
    [/attack]

    {APPRENTICE_IMPULSE_ANIM "units/mages/apprentice-magic-[1~10].png:[70,70,80,80,90,60,90,80,70,80]"}

    [female]
        name= _ "female^Apprentice"
        gender=female
        image="units/mages/apprentice+female.png"
        profile="portraits/mages/apprentice+female.png"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {APPRENTICE_DEFEND_ANIM apprentice+female {SOUND_LIST:HUMAN_FEMALE_HIT}}
        {APPRENTICE_IMPULSE_ANIM "units/mages/apprentice+female-magic-[1~10].png:[70,70,80,80,90,60,90,80,70,80]"}
    [/female]
[/unit_type]

#undef APPRENTICE_IMPULSE_ANIM
#undef APPRENTICE_IMPULSE_MISSILE
#undef APPRENTICE_DEFEND_ANIM
