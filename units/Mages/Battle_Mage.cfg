#textdomain wesnoth-ctl

#define BATTLE_MAGE_ANIMS IMG HIT_SOUND
    [defend]
        start_time=-200
        [frame]
            image="units/mages/{IMG}-defend-[1~5].png:[60,70,100,70,60]"
        [/frame]
        [if]
            hit_sound_start_time=-25
            hits=hit
            [hit_sound_frame]
                sound={HIT_SOUND}
            [/hit_sound_frame]
        [/if]
    [/defend]

    [attack_anim]
        [filter_attack]
            name=magic_blast
        [/filter_attack]
        start_time=-550
        [frame]
            image="units/mages/{IMG}-magic-[1~7].png:[80,80,90,90,100,110,90]"
        [/frame]
        missile_start_time=-210
        impact_start_time=-1
        [if]
            hits=yes
            [missile_frame]
                image="projectiles/earth_projectile[1~3].png~SCALE(36,36):[50,50,110]"
                offset=0.0~1.0
                y=-8~-20:100,-20~0:110
                auto_hflip=no
                auto_vflip=no
            [/missile_frame]
            [impact_frame]
                duration=1
            [/impact_frame]
            [impact_frame]
                layer=90
                image="projectiles/earth_projectile[4~7].png~SCALE(36,36):[60,60,70,90]"
                offset=1.0
                auto_hflip=no
                auto_vflip=no
            [/impact_frame]
            [impact_frame]
                duration=1
            [/impact_frame]
        [/if]
        [else]
            hits=no
            [missile_frame]
                image="projectiles/earth_projectile[1~3].png~SCALE(36,36):[50,50,110]"
                offset=0.0~0.8
                y=-8~-20:100,-20~0:110
                auto_hflip=no
                auto_vflip=no
            [/missile_frame]
            [impact_frame]
                duration=1
            [/impact_frame]
            [impact_frame]
                layer=90
                image="projectiles/earth_projectile[4~7].png~SCALE(36,36):[60,60,70,90]"
                offset=0.8
                auto_hflip=no
                auto_vflip=no
            [/impact_frame]
            [impact_frame]
                duration=1
            [/impact_frame]
        [/else]
        {SOUND:HIT_AND_MISS sling-big.ogg sling-big-miss.ogg -210}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        start_time=-300
        [frame]
            image="units/mages/{IMG}-melee-[1~4].png:75"
        [/frame]
        [frame]
            image="units/mages/{IMG}-melee-5.png:100"
        [/frame]
        [frame]
            image="units/mages/{IMG}-melee-[6~10].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]
#enddef

[unit_type]
    id=Battle Mage
    name= _ "TODO"
    race=human
    image="units/mages/L1_left.png"
    profile="portraits/mages/L1_left.png"
    hitpoints=25
    movement_type=smallfoot
    movement=5
    experience=44
    level=1
    alignment=lawful
    advances_to=Earthshaker
    cost=20
    usage=mixed fighter
	description= _ "TODO"
    die_sound={SOUND_LIST:HUMAN_DIE}

    [attack]
        name=spear
        description=_"spear"
        icon=attacks/spear.png
        type=pierce
        range=melee
        damage=7
        number=2
        specials_list=firststrike
    [/attack]
    [attack]
        name=magic_blast
        description=_"magic blast"
        icon=attacks/mud-missile.png
        type=impact
        range=ranged
        damage=9
        number=2
        specials_list=magical
    [/attack]

    {BATTLE_MAGE_ANIMS L1_left {SOUND_LIST:HUMAN_HIT}}

	[female]
        name= _ "female^TODO"
        gender=female
        image="units/mages/L1_left+female.png"
        profile="portraits/mages/L1_left+female.png"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {BATTLE_MAGE_ANIMS L1_left+female {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [/female]
[/unit_type]

#undef BATTLE_MAGE_ANIMS
