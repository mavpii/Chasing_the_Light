#textdomain wesnoth-ctl
[unit_type]
    id=Warden
    name= _ "TODO"
    race=human
    image="units/human-magi/silver-mage.png"
    profile="portraits/humans/mage-silver.webp"
    hitpoints=39
    movement_type=smallfoot
    movement=5
    experience=150
    level=2
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=33
    usage=mixed fighter
	description= _ "TODO"
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/human-magi/silver-mage-defend.png" "units/human-magi/silver-mage.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=staff
        description=_"staff"
        icon=attacks/staff-magic.png
        type=impact
        range=melee
        damage=4
        number=2
    [/attack]
    [attack]
        name=pacify
        description=_"pacify"
        icon=attacks/faerie-fire.png
        type=arcane
        range=ranged
        damage=5
        number=3
        specials_list=slow
    [/attack]
    [attack]
        name=chill wave
        description=_"chill wave"
        icon=attacks/iceball.png
        type=cold
        range=ranged
        damage=8
        number=4
        specials_list=magical
    [/attack]

    [attack_anim]
        [filter_attack]
            name=pacify
        [/filter_attack]
        {MISSILE_FRAME_FAERIE_FIRE}
        start_time=-500
        [frame]
            duration=600
        [/frame]
        {SOUND:HIT_AND_MISS magic-faeriefire.ogg magic-faeriefire-miss.ogg -450}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=chill wave
        [/filter_attack]
        {MISSILE_FRAME_CHILL_WAVE 0 -12}
        start_time=-450
        [frame]
            duration=500
            halo=halo/elven/ice-halo[1~5].png:100
        [/frame]
        {SOUND:HIT_AND_MISS magic-faeriefire.ogg magic-faeriefire-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=staff
        [/filter_attack]
        start_time=-250
        [frame]
            duration=500
        [/frame]
        {SOUND:HIT_AND_MISS staff.ogg staff-miss.ogg -125}
    [/attack_anim]
[/unit_type]
