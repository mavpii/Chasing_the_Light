#textdomain wesnoth-ctl

#define EARTHSHAKER_GROUND_FRAMES OFFSET
            [ground_frame]
                duration=1
            [/ground_frame]
            [ground_frame]
                layer=90
                image="projectiles/earthshake/earthshake-[1~21].png:[40*9,60*6,70,60*5]"
                offset={OFFSET}
                y=5
                auto_hflip=no
                auto_vflip=no
            [/ground_frame]
            [ground_frame]
                duration=1
            [/ground_frame]
#enddef

#define EARTHSHAKER_ANIMS IMG HIT_SOUND
    [defend]
        start_time=-200
        [frame]
            image="units/mages/{IMG}-defend-[1~5].png:[60,70,100,70,60]"
        [/frame]
        [if]
            hit_sound_start_time=-25
            hits=hit
            [hit_sound_frame]
                sound={HIT_SOUND}
            [/hit_sound_frame]
        [/if]
    [/defend]

    [attack_anim]
        [filter_attack]
            name=earthshake
        [/filter_attack]
        start_time=-1200
        offset=0
        [frame]
            image="units/mages/{IMG}-magic-[1~15].png:60"
        [/frame]
        ground_start_time=-721
        [if]
            hits=yes
            {EARTHSHAKER_GROUND_FRAMES 1.0}
        [/if]
        [else]
            hits=no
            {EARTHSHAKER_GROUND_FRAMES 0.8}
        [/else]
        {SOUND:HIT_AND_MISS rumble.ogg rumble.ogg -720}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        start_time=-300
        [frame]
            image="units/mages/{IMG}-melee-[1~4].png:75"
        [/frame]
        [frame]
            image="units/mages/{IMG}-melee-5.png:100"
        [/frame]
        [frame]
            image="units/mages/{IMG}-melee-[6~8].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]
#enddef

[unit_type]
    id=Earthshaker
    name= _ "TODO"
    race=human
    image="units/mages/L2_left.png"
    profile="portraits/mages/MageR2M.png"
    hitpoints=43
    movement_type=smallfoot
    movement=5
    experience=150
    level=2
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=34
    usage=mixed fighter
	description= _ "TODO"
    die_sound={SOUND_LIST:HUMAN_DIE}

    [attack]
        name=spear
        description=_"spear"
        icon=attacks/spear.png
        type=pierce
        range=melee
        damage=9
        number=2
        specials_list=firststrike
    [/attack]
    [attack]
        name=earthshake
        description=_"earthshake"
        icon=attacks/mud-glob.png
        type=impact
        range=ranged
        damage=10
        number=3
        specials_list=magical
    [/attack]

    {EARTHSHAKER_ANIMS L2_left {SOUND_LIST:HUMAN_HIT}}

    [female]
        name= _ "female^TODO"
        gender=female
        image="units/mages/L2_left+female.png"
        profile="portraits/mages/MageR2F.png"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {EARTHSHAKER_ANIMS L2_left+female {SOUND_LIST:HUMAN_FEMALE_HIT}}
    [/female]
[/unit_type]

#undef EARTHSHAKER_ANIMS
#undef EARTHSHAKER_GROUND_FRAMES
