#textdomain wesnoth-ctl
[unit_type]
    id=Earthshaker
    name= _ "TODO"
    race=human
    image="units/human-magi/red-mage.png"
    profile="portraits/humans/mage-red.webp"
    hitpoints=43
    movement_type=smallfoot
    movement=5
    experience=150
    level=2
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=34
    usage=mixed fighter
	description= _ "TODO"
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/human-magi/red-mage-defend.png" "units/human-magi/red-mage.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=spear
        description=_"spear"
        icon=attacks/spear.png
        type=pierce
        range=melee
        damage=9
        number=2
        specials_list=firststrike
    [/attack]
    [attack]
        name=earthshake
        description=_"earthshake"
        icon=attacks/mud-glob.png
        type=impact
        range=ranged
        damage=10
        number=3
        specials_list=magical
    [/attack]

    [attack_anim]
        [filter_attack]
            name=earthshake
        [/filter_attack]
        start_time=-450
        missile_start_time=-200
        [missile_frame]
            duration=200
            image="projectiles/stone-large.png"
            image_diagonal="projectiles/stone-large.png"
        [/missile_frame]
        [frame]
            image="units/human-magi/red-mage-attack-magic-[1,2,1].png:[100,400,100]"
        [/frame]
        {SOUND:HIT_AND_MISS rumble.ogg rumble.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        start_time=-250
        [frame]
            duration=500
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]
