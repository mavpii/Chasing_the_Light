#textdomain wesnoth-ctl

# Слабка подоба Джев'яна, яку він ліпить закляттям skill_effigy.
#
# [base_unit] тягне з оригіналу ВСЕ, зокрема standing_anim, recruiting_anim і всі
# три attack_anim -- переписувати їх сюди руками означало б рано чи пізно щось
# загубити. Тут лишаються тільки відмінності.
#
# Блакить накладається не тут, а об'єктом у самому закляттті: [effect]
# apply_to=image_mod фарбує геть усі кадри юніта, а не лише базову картинку.
[unit_type]
    id=Jevyan Effigy
    [base_unit]
        id=Jevyan
    [/base_unit]
    name= _ "Lesser Transmutation"
    hitpoints=52
    level=3
    experience=100
    cost=64
    advances_to=null

    # звичайні резисти: копії мають бути вбивані, інакше гравцеві нема куди бити
    [resistance]
        blade=80
        pierce=80
        impact=80
        fire=110
        cold=50
        arcane=120
    [/resistance]

    # ті самі атаки, що в оригіналу, але вдвічі слабші
    [attack]
        name=touch
        description=_"touch"
        icon=attacks/touch-undead.png
        type=arcane
        range=melee
        damage=5
        number=3
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=chill tempest
        description=_"chill tempest"
        type=cold
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        range=ranged
        damage=7
        number=3
        icon=attacks/iceball.png
    [/attack]
    [attack]
        name=shadow wave
        description=_"shadow wave"
        type=arcane
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        range=ranged
        damage=5
        number=3
        icon=attacks/dark-missile.png
    [/attack]
[/unit_type]
