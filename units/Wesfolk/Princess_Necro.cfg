#textdomain wesnoth-ctl

#define IMGP
~PAL(C9C3BE,889880,6E675C,514A3F,FFFFFF,D2BDA9,A3A7AB,73697E,91822F,5E3535>A64E27,7A2906,4F1E03,231007,C3C1C1,9B9B9B,808080,484848,575757,1B1B1B)#enddef

[unit_type]
    id=Necroprincess
    name= _ "Princess of Battle"
    gender=female
    race=human
    image="units/undead-necromancers/necromancer+female.png{IMGP}"
    profile="portraits/humans/necromancer+female.webp"
    hitpoints=46
    movement_type=smallfoot
    [resistance]
        impact=90
    [/resistance]
    movement=5
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=90
    usage=mixed fighter
    description= _ "Although not actually of royal blood, Wesfolk Princesses play an important role in their wicked society as loyal servants of the Lich-Lords, leading their armies and fulfilling their every demand.
Princesses are not born, but become them after many years of exhausting training, dark rituals and difficult trials, for which they are highly respected by other Wesfolk people and even some of the powerful undead."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "units/undead-necromancers/necromancer+female-defend.png{IMGP}" "units/undead-necromancers/necromancer+female.png{IMGP}" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [attack]
        name=plague staff
        description=_"staff of rage"
        icon=attacks/staff-plague.png
        type=impact
        range=melee
        damage=7
        number=3
        [specials]
			{WEAPON_SPECIAL_BERSERK}
			{WEAPON_SPECIAL_DRAIN}
        [/specials]
    [/attack]
    [attack]
        name=chill wave
        description=_"chill wave"
        type=cold
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        range=ranged
        damage=17
        number=2
        icon=attacks/iceball.png
    [/attack]
        [recruiting_anim]
            [filter_second]
                race=undead
            [/filter_second]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-[1,2].png{IMGP}:75"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-3.png{IMGP}"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-[2,1].png{IMGP}:50"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female.png{IMGP}:1"
            [/frame]
        [/recruiting_anim]
        [attack_anim]
            [filter_attack]
                name=chill wave
            [/filter_attack]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-[1,2].png{IMGP}:75"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-3.png{IMGP}"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-[2,1].png{IMGP}:50"
            [/frame]
        [/attack_anim]
        [attack_anim]
            [filter_attack]
                name=shadow wave
            [/filter_attack]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-[1,2].png{IMGP}:75"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-3.png{IMGP}"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-3.png{IMGP}:250"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female-magic-[2,1].png{IMGP}:50"
            [/frame]
            [frame]
                image="units/undead-necromancers/necromancer+female.png{IMGP}:50"
            [/frame]
        [/attack_anim]
        [attack_anim]
            [filter_attack]
                name=plague staff
            [/filter_attack]
            [frame]
                image="units/undead-necromancers/necromancer+female.png{IMGP}:50"
