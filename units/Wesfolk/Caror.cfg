#textdomain wesnoth-ctl
[unit_type]
    id=Caror
    name= _ "Lich-Lord Caror"
    gender=male
    race=undead
    image="units/wesfolk/caror/dark-lord.png"
    hitpoints=80
    movement_type=undeadfoot
    halo="halo/darkens-aura.png"
    [abilities]
        [illuminates]
    	   id=deillumination
           value=-25
           min_value=-25
           cumulative=no
           name= _ "darkness hand"
           description= _"Darkness hand:
This unit rule to dark forces, and sun not illuminate place, where he stands, never."
           affect_self=yes
        [/illuminates]
    [/abilities]
    movement=6
    experience=200
    level=4
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=100
    usage=mixed fighter
    description= _ ""
    die_sound=lich-die.ogg
    {DEFENSE_ANIM "units/wesfolk/caror/dark-lord-defend.png" "units/wesfolk/caror/dark-lord.png" {SOUND_LIST:LICH_HIT} }
    [attack]
        name=banesword
        description=_"banesword"
        icon=attacks/baneblade.png
        type=blade
        [specials]
            {WEAPON_SPECIAL_DRAIN}
        [/specials]
        range=melee
        damage=8
        number=5
    [/attack]
	##CHANGE
    [attack]
        name=sand storm
        description=_"sand storm"
        type=impact
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        range=ranged
        damage=16
        number=3
        icon=attacks/sand-storm.png
    [/attack]
	##CHANGE
    [attack]
        name=shadow stifle
        description=_"shadow stifle"
        type=arcane
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
	    {WEAPON_SPECIAL_SLOW}
        [/specials]
        range=ranged
        damage=13
        number=2
        icon=attacks/shadow_stifle.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=shadow stifle
        [/filter_attack]
        [missile_frame]
            begin=-100
            end=100
            image="halo/undead/dark-magic-6.png"
            image_diagonal="halo/undead/dark-magic-6.png"
        [/missile_frame]

        [frame]
            begin=-300
            end=-225
            image="units/wesfolk/caror/dark-lord-magic-1.png"
        [/frame]
        [frame]
            begin=-225
            end=-150
            image="units/wesfolk/caror/dark-lord-magic-2.png"
        [/frame]
        [frame]
            begin=-150
            end=-75
            image="units/wesfolk/caror/dark-lord-magic-3.png"
            halo=halo/undead/dark-magic-1.png
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=-75
                end=0
                image="units/wesfolk/caror/dark-lord-magic-3.png"
                sound=magic-dark.ogg
                halo=halo/undead/dark-magic-2.png
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=-75
                end=0
                image="units/wesfolk/caror/dark-lord-magic-3.png"
                sound=magic-dark-miss.ogg
                halo=halo/undead/dark-magic-2.png
            [/frame]
        [/else]
        [frame]
            begin=0
            end=75
            image="units/wesfolk/caror/dark-lord-magic-3.png"
            halo=halo/undead/dark-magic-3.png
        [/frame]
        [frame]
            begin=75
            end=150
            image="units/wesfolk/caror/dark-lord-magic-3.png"
            halo=halo/undead/dark-magic-4.png
        [/frame]

        [frame]
            begin=150
            end=200
            image="units/wesfolk/caror/dark-lord-magic-3.png"
            halo=halo/undead/dark-magic-5.png
        [/frame]
        [frame]
            begin=200
            end=250
            image="units/wesfolk/caror/dark-lord-magic-2.png"
	    halo=halo/undead/dark-magic-6.png
        [/frame]
        [frame]
            begin=250
            end=300
            image="units/wesfolk/caror/dark-lord-magic-1.png"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=banesword
        [/filter_attack]
        [frame]
            begin=-250
            end=-200
            image="units/wesfolk/caror/dark-lord.png"
        [/frame]
        [frame]
            begin=-200
            end=-100
            image="units/wesfolk/caror/dark-lord-sword-1.png"
        [/frame]
        [frame]
            begin=-100
            end=100
            image="units/wesfolk/caror/dark-lord-sword-2.png"
            sound={SOUND_LIST:SWORD_SWISH}
        [/frame]
        [frame]
            begin=100
            end=175
            image="units/wesfolk/caror/dark-lord-sword-3.png"
	    sound=wail-sml.wav
        [/frame]
        [frame]
            begin=175
            end=250
            image="units/wesfolk/caror/dark-lord.png"
        [/frame]
    [/attack_anim]
[/unit_type]
