#textdomain wesnoth-ctl

#define SIEGE_TOWER_IMG NAME
units/wesfolk/siege-tower/siege-tower{NAME}.png#enddef

#define SIEGE_TOWER_ANIMS DIRS SUF
    [standing_anim]
        start_time=0
        direction={DIRS}
        [frame]
            image={SIEGE_TOWER_IMG ({SUF})}:300,{SIEGE_TOWER_IMG ({SUF}-flag-1)}:150,{SIEGE_TOWER_IMG ({SUF}-flag-2)}:150,{SIEGE_TOWER_IMG ({SUF}-flag-3)}:150
        [/frame]
    [/standing_anim]

    [movement_anim]
        start_time=0
        direction={DIRS}
        [frame]
            image={SIEGE_TOWER_IMG ({SUF}-move-[1~3])}:[110*3]
        [/frame]
    [/movement_anim]

    [extra_anim]
        flag=s13_bridge
        start_time=0
        direction={DIRS}
        [frame]
            image={SIEGE_TOWER_IMG ({SUF}-bridge-[1~16])}:[120*5,110*6,120,130*3,700]
        [/frame]
        thud_start_time=1380
        [thud_frame]
            duration=1
            sound=wose-hit.ogg
        [/thud_frame]
    [/extra_anim]

    [defend]
        start_time=-126
        direction={DIRS}
        [frame]
            image={SIEGE_TOWER_IMG ({SUF})}:1,{SIEGE_TOWER_IMG ({SUF}-defend-1)}:80,{SIEGE_TOWER_IMG ({SUF}-defend-2)}:170,{SIEGE_TOWER_IMG ({SUF})}:1
        [/frame]
        [if]
            hit_sound_start_time=-25
            hits=hit
            [hit_sound_frame]
                sound=wose-hit.ogg
            [/hit_sound_frame]
        [/if]
    [/defend]

    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        direction={DIRS}
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/spear-n.png"
            image_diagonal="projectiles/spear-ne.png"
        [/missile_frame]
        start_time=-200
        [frame]
            image={SIEGE_TOWER_IMG ({SUF})}:250
            sound={SOUND_LIST:THROW}
        [/frame]
        {SOUND:HIT spear.ogg -100}
    [/attack_anim]

    [death]
        start_time=0
        direction={DIRS}
        [frame]
            image={SIEGE_TOWER_IMG ({SUF}-die-[1~6])}:[110,110,120,130,150,600]
        [/frame]
    [/death]
#enddef

[unit_type]
    id=Siege Tower
    name= _ "Siege Tower"
    race=mechanical
    image={SIEGE_TOWER_IMG ()}
    hitpoints=100
    movement_type=mounted
    movement=4
    level=2
    experience=120
    cost=40
    alignment=chaotic
    advances_to=null
    hide_help=yes
    do_not_list=yes
    usage=archer
    die_sound=wose-die.ogg
    [resistance]
        blade=60
        pierce=40
        impact=110
        fire=150
        cold=80
        arcane=80
    [/resistance]
    description= _ "TODO"

    [attack]
        name=spear
        description=_"javelin"
        type=pierce
        range=ranged
        damage=5
        number=3
        icon=attacks/javelin-orcish.png
    [/attack]

    {AMLA_DEFAULT}

    {SIEGE_TOWER_ANIMS s,se,sw ()}
    {SIEGE_TOWER_ANIMS n,ne,nw -ne}
[/unit_type]

#undef SIEGE_TOWER_ANIMS
#undef SIEGE_TOWER_IMG
