#textdomain wesnoth-ctl

#define PATH
units/haralin/L3#enddef

[unit_type]
    id=Haralin_L3
    name=_ "Spell Knight"
    race=human
    gender=male
    image="{PATH}/haralin.png"
	profile="portraits/haralin/Haralin_L3.webp"
    hitpoints=56
    movement_type=smallfoot
    movement=5
    experience=90
    {AMLA_DEFAULT}
    level=3
    alignment=lawful
    advances_to=null
    usage=mixed fighter
    description=_"TODO"
    die_sound={SOUND_LIST:HUMAN_OLD_DIE}
    {DEFENSE_ANIM  "{PATH}/haralin.png" "{PATH}/haralin.png" {SOUND_LIST:HUMAN_OLD_HIT} }

    [resistance]
        arcane=80
    [/resistance]

    [attack]
        name=sword
        description=_"sword"
        icon=attacks/sword-steel.png
        type=impact
        range=melee
        damage=8
        number=3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-600
        offset=0.0:300,0.0~0.6:200,0.6:50,0.6~0.0:300
        [frame]
            image="{PATH}/haralin.png:[100*8]"
        [/frame]
        [frame]
            image="{PATH}/haralin.png:50"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]
#undef PATH
[/unit_type]
