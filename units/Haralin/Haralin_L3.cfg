#textdomain wesnoth-ctl

#define PATH
units/haralin/L3#enddef

[unit_type]
    id=Haralin_L3
    name=_ "Spell Knight"
    race=human
    gender=male
    image="{PATH}/haralin.png"
    hitpoints=38
    movement_type=smallfoot
    movement=5
    experience=60
    {AMLA_DEFAULT}
    level=2
    alignment=lawful
    advances_to=null
    usage=mixed fighter
    description=_"TODO"
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM  "{PATH}/haralin.png" "{PATH}/haralin.png" {SOUND_LIST:HUMAN_HIT} }

    [resistance]
        arcane=80
    [/resistance]

    [attack]
        name=staff
        description=_"sword"
        icon=attacks/sword.png
        type=impact
        range=melee
        damage=8
        number=3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=staff
        [/filter_attack]

        start_time=-250
        [frame]
            image="{PATH}/haralin.png:50"
        [/frame]
        [frame]
            image="{PATH}/haralin.png:[100,200]"
        [/frame]
        {SOUND:HIT_AND_MISS staff.ogg staff-miss.ogg -125}
        [frame]
            image="{PATH}/haralin.png:75"
        [/frame]
        [frame]
            image="{PATH}/haralin.png:75"
        [/frame]
    [/attack_anim]
#undef PATH
[/unit_type]
