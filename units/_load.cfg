#textdomain wesnoth-ctl

#--------------------
# Single list of the campaign's unit types, so the campaign and the editor load
# exactly the same set. Whoever includes this must already have the add-on's
# [binary_path] and utils/macros.cfg + utils/abilities.cfg in scope -- the unit
# files call VALUE, ABILITY_DISGUISED, ABILITY_UNDEATH and ABILITY_REFLECT_DAMAGE
# from there; everything else they use is mainline.
#
# The magic system's own unit types (elementals, Brazier, Phylactery, polymorph
# forms) are not listed here -- magic/_init.cfg loads those itself.
#--------------------
[+units]
    {./Haralin}
    {./Daeola}
    {./Asa}
    {./Faisim}
    {./Mages}
    {./Spirits}
    {./Wesfolk}
    {./Monsters}
    {./Others}
[/units]
