#textdomain wesnoth-units
[unit_type]
    id=Nightgaunt_Shield
    name= _ "Nightgaunt"
    race=undead
    image="units/undead-spirit/nightgaunt.png"
    profile=portraits/undead/nightgaunt.webp
    hitpoints=35
    movement_type=undeadspirit
    movement=7
    level=3
    alignment=chaotic
    advances_to=null
    cost=71
    usage=scout
    hide_help=yes
    do_not_list=yes
    die_sound=wail-long.wav

    [attack]
        name=claws
        description=_"claws"
        type=blade
        icon=attacks/claws-shadow.png
        range=melee
        damage=10
        number=3
    [/attack]

    [standing_anim]
        start_time=0
        alpha=0.9
        [frame]
            image="units/undead-spirit/nightgaunt-standing-s-[1~3,2].png:[400*4]"
        [/frame]
    [/standing_anim]

    [attack_anim]
        [filter_attack]
            name=claws
        [/filter_attack]
        offset=0.0:300,0.0~1.0:225,1.0~0.0:225
        alpha=0.8~1.0:525,1.0~0.7:225
        start_time=-525
        [frame]
            image="units/undead-spirit/nightgaunt-attack-[1,2,3a,4a].png:[200*3,125]"
        [/frame]
        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -100}
        [frame]
            image="units/undead-spirit/nightgaunt.png:25"
        [/frame]
    [/attack_anim]
[/unit_type]
