#textdomain wesnoth-ctl
[unit_type]
    id=Child
    name= _ "Child"
    race=human
    gender=male,female
    image="units/islefolk/child.png"
    alignment=lawful
    hitpoints=12
    movement,movement_type=5,smallfoot
    level=0
    usage=scout
	#po: Звичайна людська дитина, що ще ви очікували тут прочитати?
    description= _ "An ordinary human child, what else did you expect to read here?"
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/islefolk/child-defend.png" "units/islefolk/child-defend.png" {SOUND_LIST:HUMAN_HIT} }
    [resistance]
        blade=120
        pierce=120
        impact=120
        arcane=120
        fire=120
        cold=120
    [/resistance]
	[female]
        gender=female
        image="units/islefolk/child_female.png"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {DEFENSE_ANIM "units/islefolk/child_female-defend.png" "units/islefolk/child_female-defend.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [/female]
[/unit_type]
