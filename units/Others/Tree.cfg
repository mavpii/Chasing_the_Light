#textdomain wesnoth-ctl
[unit_type]
    id=Tree Unit
    name= _ "Place of Force"
    ellipse=none
    alignment=neutral
    hitpoints=60
    die_sound=wose-die.ogg
	hide_help=yes
	do_not_list=yes
	race=monster
    movement=0
    level=0
    description= _"TODO"
	
	hp_bar_scaling=0
    xp_bar_scaling=0
    bar_offset_x=10000
    bar_offset_y=10000
    [death]
        start_time=0
        [frame]
            duration=0,"misc/blank-hex.png"
        [/frame]
    [/death]
    [resistance]
        blade=60
        pierce=50
        impact=120
        arcane=120
        fire=80
        cold=120
    [/resistance]

    [event]
        name=last breath
        first_time_only=no
        [filter]
            type=Gate Unit
        [/filter]

        [remove_item]
            x,y=$x1,$y1
        [/remove_item]

        {MODIFY_TERRAIN Ur $x1 $y1}
    [/event]
[/unit_type]
