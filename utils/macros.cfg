#define STORE_SELECTED_UNITS STORE_VARIABLE ID KILL
    [store_unit]
        kill={KILL}
        mode=append
        variable={STORE_VARIABLE}
        [filter]
            id={ID}
        [/filter]
    [/store_unit]
#enddef

#define UNSTORE_SELECTED_UNITS STORE_VARIABLE
    [foreach]
        array={STORE_VARIABLE}
        [do]
            [unstore_unit]
                variable=this_item
                find_vacant=yes
                x=recall
                y=recall
            [/unstore_unit]
            {FULL_HEAL id=$this_item.id}
        [/do]
    [/foreach]

    {CLEAR_VARIABLE {STORE_VARIABLE}}
#enddef

