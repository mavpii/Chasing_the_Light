                [/variable]
                [then]
				    #po: Клянуся Світлом, тільки що ми зробили добру справу, очистивши це нещасне місце від стількох мерзенних речей. Проте ми не маємо відволікатися від головної мети — порятунку Графа Блекмору.
                    {SPEAK haralin _"By the Light, we have just done a good deed by cleansing this wretched place of so many vile things. However, we mustn't be distracted from our main goal, which is to save Count of Blackmore."}
