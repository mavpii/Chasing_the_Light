#define CONVERSATION_CHECK_DISTANCE
    [if]
	[have_unit]
	id=$conversation_speaker1
	[/have_unit]
	[and]
	[have_unit]
	id=$conversation_speaker2
	[/have_unit]
	[/and]
	[then]
    [lua]
        code= <<
    local speaker1_unit = wesnoth.get_units({ id = wesnoth.get_variable("conversation_speaker1") })[1]
	local speaker2_unit = wesnoth.get_units({ id = wesnoth.get_variable("conversation_speaker2") })[1]
	wesnoth.set_variable("distance_between_speakers", wesnoth.map.distance_between(speaker1_unit.x, speaker1_unit.y, speaker2_unit.x, speaker2_unit.y))
    >>
    [/lua]
	[/then]
	[else]
	{VARIABLE distance_between_speakers 999}
	[/else][/if]
#enddef

#define CONVERSATION UNIT1_ID UNIT2_ID START_TURN DELAY STAGE_PROGRESS STAGE1 STAGE2 STAGE3 STAGE4 STAGE5
    [event]
        name,first_time_only=side 1 turn refresh,yes
        [set_variable]
            name={STAGE_PROGRESS}
            value=1
        [/set_variable]

        [set_variable]
            name=conversation_speaker1
            value={UNIT1_ID}
        [/set_variable]

        [set_variable]
            name=conversation_speaker2
            value={UNIT2_ID}
        [/set_variable]

        [set_variable]
            name=next_stage_delay
            value={DELAY}
        [/set_variable]
    [/event]

    [event]
        name,first_time_only=side 1 turn refresh,no
        {FILTER_CONDITION( {VARIABLE_CONDITIONAL turn_number greater_than_equal_to {START_TURN}}  )}

        {CONVERSATION_CHECK_DISTANCE}

        [if]
            [variable]
                name=distance_between_speakers
                less_than_equal_to=2
            [/variable]
            [and]
                [variable]
                    name={STAGE_PROGRESS}
                    equals=1
                [/variable]
            [/and]
            [then]
                {STAGE1}
                [set_variable]
                    name={STAGE_PROGRESS}
                    value=2
                [/set_variable]

                [set_variable]
                    name=next_stage_turn
                    value="$($turn_number + $next_stage_delay)"
                [/set_variable]
            [/then]
			[/if]
        [/event]

        [event]
            name,first_time_only=side 1 turn refresh,no
            {FILTER_CONDITION( {VARIABLE_CONDITIONAL turn_number greater_than_equal_to $next_stage_turn}  )}

            {CONVERSATION_CHECK_DISTANCE}

            [if]
                [variable]
                    name=distance_between_speakers
                    less_than_equal_to=2
                [/variable]
                [and]
                    [variable]
                        name={STAGE_PROGRESS}
                        equals=2
                    [/variable]
                [/and]
                [then]
                    {STAGE2}
                    [set_variable]
                        name={STAGE_PROGRESS}
                        value=3
                    [/set_variable]

                    [set_variable]
                        name=next_stage_turn
                        value="$($turn_number + $next_stage_delay)"
                    [/set_variable]
                [/then]
				[/if]
            [/event]

            [event]
                name,first_time_only=side 1 turn refresh,no
                {FILTER_CONDITION( {VARIABLE_CONDITIONAL turn_number greater_than_equal_to $next_stage_turn}  )}

                {CONVERSATION_CHECK_DISTANCE}

                [if]
                    [variable]
                        name=distance_between_speakers
                        less_than_equal_to=2
                    [/variable]
                    [and]
                        [variable]
                            name={STAGE_PROGRESS}
                            equals=3
                        [/variable]
                    [/and]
                    [then]
                        {STAGE3}
                        [set_variable]
                            name={STAGE_PROGRESS}
                            value=4
                        [/set_variable]

                        [set_variable]
                            name=next_stage_turn
                            value="$($turn_number + $next_stage_delay)"
                        [/set_variable]
                    [/then]
					[/if]
                [/event]

                [event]
                    name,first_time_only=side 1 turn refresh,no
                    {FILTER_CONDITION( {VARIABLE_CONDITIONAL turn_number greater_than_equal_to $next_stage_turn}  )}

                    {CONVERSATION_CHECK_DISTANCE}

                    [if]
                        [variable]
                            name=distance_between_speakers
                            less_than_equal_to=2
                        [/variable]
                        [and]
                            [variable]
                                name={STAGE_PROGRESS}
                                equals=4
                            [/variable]
                        [/and]
                        [then]
                            {STAGE4}
                            [set_variable]
                                name={STAGE_PROGRESS}
                                value=5
                            [/set_variable]

                            [set_variable]
                                name=next_stage_turn
                                value="$($turn_number + $next_stage_delay)"
                            [/set_variable]
                        [/then]
						[/if]
                    [/event]

                    [event]
                        name,first_time_only=side 1 turn refresh,no
                        {FILTER_CONDITION( {VARIABLE_CONDITIONAL turn_number greater_than_equal_to $next_stage_turn}  )}

                        {CONVERSATION_CHECK_DISTANCE}

                        [if]
                            [variable]
                                name=distance_between_speakers
                                less_than_equal_to=2
                            [/variable]
                            [and]
                                [variable]
                                    name={STAGE_PROGRESS}
                                    equals=5
                                [/variable]
                            [/and]
                            [then]
                                {STAGE5}

                                {CLEAR_VARIABLE {STAGE_PROGRESS}}
                                {CLEAR_VARIABLE next_stage_turn}
                                {CLEAR_VARIABLE next_stage_delay}
                                {CLEAR_VARIABLE conversation_speaker1}
                                {CLEAR_VARIABLE conversation_speaker2}
                                {CLEAR_VARIABLE distance_between_speakers}
                            [/then]
							[/if]
                        [/event]

#enddef

