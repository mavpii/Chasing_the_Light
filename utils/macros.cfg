    {SPEAK Penella _"Ouch! We had no other choice! We just... uh... we wanted to survive!"}
	#po: Бачить Світло, жодне життя не варте того, щоб заради нього вбивати незнайомих вам людей, тим паче вчиняючи настільки мерзенний злочин — пожираючи собі подібних. Хай же буде само Світло тобі суддею, бо ж смерть не є достатньою карою!
    {SPEAK haralin _"No life is worth killing your island brethen for, let alone committing such a heinous crime as devouring your own kind. Let the Light itself be your judge, for death is not a sufficient punishment!"}

    [scroll_to_unit]
        id=Penella
    [/scroll_to_unit]

    {DELAY 700}

    #po: Але ж.... УАГХ!...
    {SPEAK Penella _"But.... UGH!!!.."}

    [sound]
        name=lightning.ogg
    [/sound]

    {FLASH_WHITE ()}

    [transform_unit]
        id=Penella
        transform_to=Ghoul
    [/transform_unit]

    #po: АААААААРГХ!
    {SPEAK Penella _"AAAAAAARGH!"}

    [event]
        name=die
        [filter]
            id=Penella
        [/filter]

        {DELAY 600}

        [if]
            [have_unit]
                id=Daeola
            [/have_unit]
            [then]
			    #po: Вчителю, що... Що це таке?..
                {SPEAK Daeola _"Teacher, what... What is this?.."}
            [/then]
            [else]
                [role]
                    side=1
                    role=scared_by_penella
                    [not]
                        id=haralin, Zeham
                    [/not]
                [/role]

                #po: Пане, що... Що це таке сталося?
                {SPEAK_ROLE scared_by_penella _"Master, what... What just happened?"}
            [/else]
			[/if]

            #po: Я й сам не знаю, як... проте, хвала Світлу, схоже, воно знову почуло мій заклик...
            {SPEAK haralin _"I do not know how... but, praise be to the Light, it seems that it has heard my call again..."}

            [if]
                [have_unit]
                    id=bandit_entrance_guard
                    side=5
                [/have_unit]
                [then]
                    [scroll_to_unit]
                        id=bandit_entrance_guard
                    [/scroll_to_unit]

                    {MODIFY_UNIT id=bandit_entrance_guard facing sw} {DELAY 500}
                    {MODIFY_UNIT id=bandit_entrance_guard facing se} {DELAY 500}
 
                    #po: Прокляття, я б помстився за Пенеллу, але еті чаклуни дуже сильні. Треба відступати до інших!
                    {SPEAK bandit_entrance_guard _"Curse it, I’d avenge Penella, but these wizards are too damn strong. We gotta fall back t’ the others!"}

                    [store_unit]
                        [filter]
                            id=bandit_entrance_guard
                        [/filter]
                        variable=bandit_entrance_guard_stored
                        kill=yes
                    [/store_unit]

                    [set_variable]
                        name=is_entrance_guard_alive
                        value= _ "true"
                    [/set_variable]

                    [redraw][/redraw]

                    {DELAY 500}

                    #po: Нас чекатиме битва в печері, ще одна затримка.
                    {SPEAK Asa _"Battle awaits us in the cave — another delay."}
					#po: Це так, однак хоча б прохід всередину вже вільний. Нумо туди, доженемо того поганця!
                    {SPEAK Daeola _"It is true, but at least the passage inside is free. Let's go in there and catch up with that monster!"}

                    [set_variable]
                        name=is_penella_dead
                        value= _ "true"
                    [/set_variable]

                    {05_KILL_ALL_NECRO_AND_BANDITS {05_KILL_ALL_NECRO_AND_BANDITS_VAR_ALL}}
                [/then]
				[/if]
            [/event]

#enddef

#define 05_KILL_ALL_NECRO_AND_BANDITS VARS
