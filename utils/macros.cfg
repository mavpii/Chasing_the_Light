#define 05_KILL_VICTORY
    [hide_unit]
        side=1,2,3,4,5,6
    [/hide_unit]

    {FADE_TO_BLACK}

    [kill]
        side=2,3,4,5,6
    [/kill]

    [put_to_recall_list]
        side=1
        [not]
            id=haralin,Asa,Daeola
        [/not]
    [/put_to_recall_list]

    [teleport]
        [filter]
            id=haralin
        [/filter]
        x,y=14,4
        animate=no
    [/teleport]

    {MODIFY_UNIT id=haralin facing nw}

    [teleport]
        [filter]
            id=Daeola
        [/filter]
        x,y=15,6
        animate=no
    [/teleport]

    {MODIFY_UNIT id=Daeola facing nw}

    [teleport]
        [filter]
            id=Asa
        [/filter]
        x,y=13,5
        animate=no
    [/teleport]

    {MODIFY_UNIT id=Asa facing nw}

    [scroll_to_unit]
        id=Asa
    [/scroll_to_unit]

    {FADE_IN}

    [unhide_unit]
        side=1
    [/unhide_unit]

    [redraw][/redraw]

    {DELAY 1000}

    [move_unit]
        id=Asa
        to_x,to_y=12,3
        fire_event=yes
    [/move_unit]

    {DELAY 500}

    [move_unit]
        id=Daeola
        to_x,to_y=12,3
        fire_event=yes
    [/move_unit]

    [move_unit]
        id=haralin
        to_x,to_y=12,3
        fire_event=yes
    [/move_unit]

#enddef

