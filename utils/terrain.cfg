#textdomain wesnoth-ctl

[terrain_type]
    id=ctl_web
    name= _ "Spiderweb"
    symbol_image=spiderweb/web-tile
    string=^WCtL
    aliasof=_bas,Xt
    mvt_alias=Xt
    editor_group=ctl
[/terrain_type]

[terrain_type]
    symbol_image=chess/nothing
    id=ctl_void
    name= _ "Nothing"
    editor_name= _ "Nothing"
    string=NCtL
    aliasof=Gt
    editor_group=ctl
[/terrain_type]
#define CTL_INVISIBLE_WALL CODE ID NAME
[terrain_type]
    id={ID}
    name={NAME}
    editor_name={NAME}
    string={CODE}
    aliasof=_bas,Xt
    mvt_alias=Xt
    editor_group=ctl
    hide_help=yes
[/terrain_type]
#enddef

{CTL_INVISIBLE_WALL ^FdfX ctl_wall_forest_deciduous_fall ( _ "Forest")}
{CTL_INVISIBLE_WALL ^FmfX ctl_wall_forest_mixed_fall ( _ "Forest")}
{CTL_INVISIBLE_WALL ^EdbX ctl_wall_remains ( _ "Remains")}
{CTL_INVISIBLE_WALL ^EfmX ctl_wall_flowers ( _ "Flowers")}
{CTL_INVISIBLE_WALL ^EcfX ctl_wall_campfire ( _ "Campfire")}

#undef CTL_INVISIBLE_WALL
