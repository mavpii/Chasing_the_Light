#define MODIFICATION_COLORCHANGER_RANDOMIZER_GROUP SIDE TYPE NUMBER RANDOM_CASES_CTL MORPH_LIST
    [event]
        name=unit placed
        first_time_only=no
		[filter]
			side={SIDE}
			type={TYPE}
			[not]
				[filter_wml]
					[modifications]
						[object]
							modification_scale_color_shift=yes
						[/object]
					[/modifications]
				[/filter_wml]
			[/not]
		[/filter]
		{RANDOM {NUMBER}}
		
		[switch]
			variable=random
			{RANDOM_CASES_CTL}
		[/switch]
			
		{MORPH_LIST}

    [/event]
#enddef

