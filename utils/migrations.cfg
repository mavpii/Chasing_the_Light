#textdomain wesnoth-ctl

#define GLOBAL__LEGACY_SPECIALS_MIGRATION
    [event]
        name=preload
        first_time_only=no
        [lua]
            code=<<
                local function legacy(u)
                    for atk in wml.child_range(u.__cfg, "attack") do
                        local specials = wml.get_child(atk, "specials")
                        if specials then
                            for _, sp in ipairs(specials) do
                                local c = sp.contents
                                if c.overwrite_specials or wml.get_child(c, "overwrite") then
                                    return true
                                end
                            end
                        end
                    end
                    return false
                end
                local units = wesnoth.units.find_on_map{}
                for _, u in ipairs(wesnoth.units.find_on_recall{}) do
                    units[#units + 1] = u
                end
                for _, u in ipairs(units) do
                    if legacy(u) then
                        local hp, xp, moves = u.hitpoints, u.experience, u.moves
                        wesnoth.units.rebuild(u)
                        u.hitpoints = math.min(hp, u.max_hitpoints)
                        u.experience = xp
                        u.moves = moves
                    end
                end
            >>
        [/lua]
    [/event]
#enddef
