#textdomain wesnoth-ctl

#define ABILITY_ILLUMINATES20
    # Canned definition of the Illuminates ability to be included in an
    # [abilities] clause.
#arg HALO
""#endarg
    [illuminates]
        id=illumination
        value=20
        max_value=20
        cumulative=no
        name= _ "illuminates"
        female_name= _ "female^illuminates"
        description=  ""
        special_note={INTERNAL:SPECIAL_NOTES_ILLUMINATES}
        affect_self=yes
        halo_image={HALO}
    [/illuminates]
#enddef

#define WEAPON_SPECIAL_REDEMPTION
    [redemption]
        id=redemption
        name= _ "redemption"
        description= _ "This ability turns any defeated creature with a soul to the side of Light with half HP. Doesn't work on skeletons, corpses and mages of Darkness."
    [/redemption]
#enddef

#define ABILITY_DISGUISED
    [disguised]
        id=disguised
        name= _ "disguised"
        description= _ "???"
    [/disguised]
#enddef

#define ABILITY_CURSED
    [cursed]
        id=cursed
        name= _ "cursed"
		#po: Цього бійця було проклято Владикою-Лічом Карором. Його ментальне здоров'я та світосприйняття погіршуватимуться з тим, як дія прокляття зростатиме.
        description= _ "This unit was cursed by Lord-Lich Caror. His mental health and worldview will deteriorate as the curse intensifies."
    [/cursed]
#enddef

#define ABILITY_UNDEATH
    [undeath]
        id=undeath
        name= _ "undeath"
        description= _ "The sheer power of this unit forces all fallen warriors on the battlefield to raise and continue fight on its side as undead."
    [/undeath]
[/abilities]

[event]
    name=die
    first_time_only=no
    [filter]
        race=human
		[not]
		    type=Dark Sorcerer,Necromancer,Dark Adept,Shadow Mage, Rogue Mage, Shadow Lord, Wesfolk Princess, Mage_Portal, {MAGES_ONLY}
		[/not]
    [/filter]
    [filter_second]
        [not]
            type=Walking Corpse,Soulless, Mage_Portal, {MAGES_ONLY}
        [/not]
    [/filter_second]
	[filter_condition]
	    [have_unit]
		    ability=undeath
		[/have_unit]
	[/filter_condition]
	
	[store_unit]
	    [filter]
		    ability=undeath
		[/filter]
		variable=undeath_unit
	[/store_unit]
	
    [unit]
	    name=_"Undead Slave"
        type={ON_DIFFICULTY (Walking Corpse) Soulless Soulless}
        side=$undeath_unit.side
        x=$x1
        y=$y1
        placement=map
        overwrite=yes
        moves=0
        attacks_left=0
        variation=$unit.undead_variation
        animate=yes
		upkeep=loyal
    [/unit]

[/event]	
	
[+abilities] # wmlxgettext: [/abilities]
#enddef

#define ABILITY_REFLECT_DAMAGE VALUE
    [reflect_damage]
        id=reflect_damage
        name=_"sacrifice"
        description=_"All damage dealt to this unit is reflected to its soulbound servants."
        value={VALUE}
    [/reflect_damage] # wmlxgettext: [abilities]
[/abilities]

[event]
    name=unit hits
    id=reflect_onhit1
    first_time_only=no
   
    [filter_second]
        ability=reflect_damage
    [/filter_second]

    {VARIABLE tmp_reflect_damage $damage_inflicted}
    {VARIABLE_OP tmp_reflect_damage multiply $second_unit.abilities.reflect_damage.value}
    {VARIABLE_OP tmp_reflect_damage divide 100}
	
	{FULL_HEAL id=$second_unit.id}
	
	[store_unit]
        [filter]
		    [filter_side]
            [allied_with]
                side=$second_unit.side
            [/allied_with]
			[/filter_side]
			[and]
			    [not]
			        id=$second_unit.id
			    [/not]
			[/and]
        [/filter]
        variable=tmp_reflect_targets
        kill=no
    [/store_unit]
    
	{VARIABLE tmp_reflect_last_index $tmp_reflect_targets.length}
    {VARIABLE_OP tmp_reflect_last_index sub 1}
    {RANDOM 0..$tmp_reflect_last_index}

    {VARIABLE tmp_reflect_target_id $tmp_reflect_targets[$random].id}

    [harm_unit]
        [filter]
		    id=$tmp_reflect_target_id
        [/filter]
        [filter_second]
            id=$unit.id
        [/filter_second]
        amount=$tmp_reflect_damage
        experience=no
        fire_event=yes
        animate=defender
        kill=yes
    [/harm_unit]

    {CLEAR_VARIABLE tmp_reflect_damage}
    {CLEAR_VARIABLE tmp_reflect_targets}
    {CLEAR_VARIABLE tmp_reflect_last_index}
    {CLEAR_VARIABLE tmp_reflect_target_id}
[/event]

[+abilities] # wmlxgettext: [/abilities]
#enddef