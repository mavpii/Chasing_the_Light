#textdomain wesnoth-ctl

# put this here so it can be used by panacea (it's also used in some last breath events)
#define CONTINGENCY_GLOBAL_CONDITIONS
    {AND(
        {VARIABLE_CONDITIONAL skill_contingency equals yes}
		{VARIABLE_CONDITIONAL caster_$current_caster|.polymorphed equals 'dummy'}
        {HAVE_UNIT id=$current_caster} # $current_caster can't cast spells during polymorph, including contingency ##!!! пофіксити
    )}
#enddef

