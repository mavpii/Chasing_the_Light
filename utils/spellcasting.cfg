#define EVENT_COUNTERSPELL
    #------------------------
    # COUNTERSPELL IS CAST
    #------------------------
    # events only support 1 unit with counterspell at a time
    [event]
        name=skill_counterspell
        first_time_only=no
        {FIRE_EVENT skill_illusion_cancel}

        {GIVE_OBJECT_TO id=$current_caster id=skill_counterspell_casting}
        {DELAY 1200} # wait for casting anim to almost-complete

        {GIVE_OBJECT_TO id=$current_caster id=skill_counterspell}
        {REFRESH_COUNTERSPELL_VISUAL}
        {REMOVE_OBJECT skill_counterspell_casting ()}
        {REFRESH_COUNTERSPELLED}
        [event]
            name=skill_counterspell_cancel
            {REMOVE_OBJECT skill_counterspell ()}
            {SOUND skill-polymorph.wav}
            {REFRESH_COUNTERSPELL_VISUAL}
            {REFRESH_COUNTERSPELLED}
        [/event]
    [/event]

    #------------------------
    # COUNTERSPELLER MOVES
    #------------------------
    [event]
        name,first_time_only=moveto,no
        {FILTER_OBJECT_ID skill_counterspell}
        {REFRESH_COUNTERSPELL_VISUAL}
        {REFRESH_COUNTERSPELLED}
        [allow_undo]
        [/allow_undo]
        [on_undo]
            {REFRESH_COUNTERSPELL_VISUAL}
            {REFRESH_COUNTERSPELLED}
        [/on_undo]
    [/event]
    [event]
        name,first_time_only=exit hex,no
        {FILTER_OBJECT_ID skill_counterspell}
        [remove_item]
            image=counterspell_aura
        [/remove_item]
        [allow_undo]
        [/allow_undo]
        [on_undo]
            {REFRESH_COUNTERSPELL_VISUAL}
            {REFRESH_COUNTERSPELLED}
        [/on_undo]
    [/event]
    [event]
        name,first_time_only=die,no
        {FILTER_OBJECT_ID skill_counterspell}
        [remove_item]
            image=counterspell_aura
        [/remove_item]
        {REMOVE_OBJECT counterspelled ()}
    [/event]

    #------------------------
    # COUNTERSPELL MOVES
    #------------------------
    [event]
        name=moveto,unit placed,pre attack
        first_time_only=no
        {FILTER_CONDITION({HAVE_UNIT ({FILTER_WML_OBJECT_ID skill_counterspell})} )}
        {REFRESH_COUNTERSPELLED}
        [allow_undo]
        [/allow_undo]
        [on_undo]
            {REFRESH_COUNTERSPELLED}
        [/on_undo]
    [/event]

    #------------------------
    # DISABLE SPELLCASTING
    #------------------------
    # not sure how to detect objects with lua, so just set a variable instead (which spellcasting.lua can read)
    [event]
        name=skill_counterspell
        first_time_only=no
        {VARIABLE counterspell_active yes}
    [/event]
    [event]
        name=skill_counterspell_cancel
        first_time_only=no
        {CLEAR_VARIABLE counterspell_active}
    [/event]

    #------------------------
    # RESELECT SPELLS
    #------------------------
    [event]
        name=refresh_skills
        first_time_only=no
		{CHECK_EQUIPPED_SPELL id=$current_caster skill_counterspell}
        [if] {VARIABLE_CONDITIONAL equipped_spell_found not_equals yes} {THEN(
            {FIRE_EVENT skill_counterspell_cancel}
		)}
		[/if]
    [/event]
    [event]
        name=victory
        first_time_only=no
        {FIRE_EVENT skill_counterspell_cancel}
    [/event]
#enddef

#############################
# POLYMORPH     — перевірити чи працюватиме з просто transform_unit, тому що теперішня імплементація жахлива
#############################
#define EVENT_POLYMORPH_TYPE NAME TYPE PROFILE
    [event]
        name={NAME}
        first_time_only=no
        [if]    {HAVE_UNIT( id,formula=$current_caster,"(self.moves=0)" {FILTER_ADJACENT(level,is_enemy=1-99,true)} )}
            {OR({HAVE_UNIT( id,formula=$current_caster,"(self.attacks_left=0)" )})}
            {THEN( {VARIABLE zoc_penalty 99} )}
            {ELSE( {VARIABLE zoc_penalty  0} )}
        [/if]

        {FIRE_EVENT skill_illusion_cancel}
		
		{VARIABLE "caster_$current_caster|.polymorphed" 'dummy'}

        # remove $current_caster
        {SOUND skill-polymorph.wav}
        {ANIMATE_UNIT id=$current_caster levelout}

        [if] {HAVE_UNIT id,status=$current_caster,slowed  } {THEN({VARIABLE "caster_$current_caster|.slowed"   yes})} 
		[/if]
        [if] {HAVE_UNIT id,status=$current_caster,poisoned} {THEN({VARIABLE "caster_$current_caster|.poisoned" yes})} 
		[/if]
        [store_unit]
            {FILTER id=$current_caster}
            variable,kill=pre_polymorphed_caster_$current_caster|,yes
			fire_event=no
        [/store_unit]
        [redraw]
        [/redraw]

        # determine portrait
        {VARIABLE profile_suffix "~BLIT($pre_polymorphed_caster_$current_caster|.profile~FL()~O(0.6))"}

        # create animal
        [unit]
            side=$pre_polymorphed_caster_$current_caster|.side
            type={TYPE}
            id,name=$current_caster,$pre_polymorphed_caster_$current_caster|.name
            canrecruit=yes
            profile="{PROFILE}$profile_suffix"
            [filter_recall]
                level=9999 # not allowed to recruit or recall, but still a leader (in case filters check for that)
            [/filter_recall]
            x,y,facing=$pre_polymorphed_caster_$current_caster|.x,$pre_polymorphed_caster_$current_caster|.y,$pre_polymorphed_caster_$current_caster|.facing
            attacks_left=$pre_polymorphed_caster_$current_caster|.attacks_left
            hitpoints=$pre_polymorphed_caster_$current_caster|.hitpoints
            experience=$pre_polymorphed_caster_$current_caster|.experience
            {MODIFICATIONS( [object]
            {EFFECT max_experience set=$pre_polymorphed_caster_$current_caster|.max_experience}
            {EFFECT level set=$pre_polymorphed_caster_$current_caster|.level} # so the spellcasting dialog doesn't break
        [/object] )}
    [/unit]
    [if] {VARIABLE_CONDITIONAL "caster_$current_caster|.slowed"   equals yes} {THEN({MODIFY_UNIT id=$current_caster status.slowed   yes})}
	[/if]
    [if] {VARIABLE_CONDITIONAL "caster_$current_caster|.poisoned" equals yes} {THEN({MODIFY_UNIT id=$current_caster status.poisoned yes})}
	[/if]
    {CLEAR_VARIABLE "caster_$current_caster|.slowed","caster_$current_caster|.poisoned"}

    [modify_unit]
        {FILTER id=$current_caster}
        moves=$( $this_unit.max_moves - ($pre_polymorphed_caster_$current_caster|.max_moves-$pre_polymorphed_caster_$current_caster|.moves) - $zoc_penalty)
    [/modify_unit]
    {CLEAR_VARIABLE zoc_penalty}

    # use $current_caster's literal HP instead of proportional HP scaling, so that polymorphed forms scale as $current_caster levels up and gains hitpoints
    {VARIABLE max_hp_change $pre_polymorphed_caster_$current_caster|.max_hitpoints}
    {STORE_UNIT_VAR id=$current_caster max_hitpoints animal_hp}
    {VARIABLE_OP max_hp_change sub $animal_hp} # I can't figure out how to do this math in [object], and [modify_unit] gets overwritten each combat
    {GIVE_OBJECT_TO id=$current_caster (id={NAME} {EFFECT hitpoints increase_total=$max_hp_change})} # id={NAME} tells lua this ability is cancellable
    {CLEAR_VARIABLE max_hp_change,animal_hp}

    [redraw]
        clear_shroud=yes
    [/redraw]
    {ANIMATE_UNIT id=$current_caster levelin}

    #------------------------
    # BALANCE CHANGES
    #------------------------
    # polymorph is supposed to be about multiple situational forms.
    # Stoat is worse than levitate, Bear is worse than a village, Crab is worse than the shield spell (and ok, Roc is just really really fast)
    # but you get them all at once with Polymorph

    # Stoat (mobility)
    # a cheap, budget mobility option. 6mp, skirmisher, and good movement in snow/ice.
    # Its dodge is unimpressive because of poor resistances, though it might be useful defensively if you're purely fighting saurian augurs or ghosts or something
    [object]
        {FILTER id,type=$current_caster,"Frost Stoat"}
        {EFFECT movement_costs (replace=yes
        [movement_costs]
            frozen,sand,forest,hill,mountain=1,1,1,2,2
        [/movement_costs])}
    [/object]

    # Bear (recovery)
    # a great way to regain HP, and the % of HP even scales as you level up. Bear also gets 70% defense and full movement in mountains, and deals decent damage at night.
    [object]
        {FILTER id,type=$current_caster,"Cave Bear"}
        {EFFECT attack ( #name=fangs
        [set_specials]
            mode=append
            [dummy]
                id,name=consume,_"consume"
                description=_"This unit regains <span color='#00FF00'>30%</span> of its maximum hitpoints whenever it kills a living unit."
            [/dummy]
        [/set_specials])}
    [/object]

    # Crab (tank)
    # a defensive option, with great resistances and decent damage but terrible movement.
    # I find it best used as a replacement for the Shield spell, particularly when you can poison many attackers.

    # Roc (mobility/damage)
    # an outstanding mobility option, and has decent damage as well. I find it best used as a superior Levitate spell.

    [redraw] # refresh fog
    [/redraw]

    #------------------------
    # UN-POLYMORPH
    #------------------------
    [event]
        name={NAME}_cancel  #(lasts until cancelled)
        {SOUND skill-polymorph.wav}
        {ANIMATE_UNIT id=$current_caster levelout}

        [if] {HAVE_UNIT id,status=$current_caster,slowed  } {THEN({VARIABLE "caster_$current_caster|.slowed"   yes})}
		[/if]
        [if] {HAVE_UNIT id,status=$current_caster,poisoned} {THEN({VARIABLE "caster_$current_caster|.poisoned" yes})}
		[/if]
        [store_unit]
            {FILTER id=$current_caster|}
            variable,kill=polymorphed_caster,yes
        [/store_unit]
        [redraw]
        [/redraw]
		
		{CLEAR_VARIABLE caster_$current_caster|.polymorphed}

        [unstore_unit]
            variable=pre_polymorphed_caster_$current_caster|
            find_vacant=yes # otherwise we overwrite any unit at Haralin's old position
        [/unstore_unit]
        [modify_unit]
            {FILTER id=$current_caster}
            x,y,facing=$polymorphed_caster.x,$polymorphed_caster.y,$polymorphed_caster.facing
            hitpoints,experience,attacks_left=$polymorphed_caster.hitpoints,$polymorphed_caster.experience,$polymorphed_caster.attacks_left
            moves=$( $this_unit.max_moves - ($polymorphed_caster.max_moves-$polymorphed_caster.moves) )
        [/modify_unit]
        [if] {VARIABLE_CONDITIONAL "caster_$current_caster|.slowed"   equals yes} {THEN({MODIFY_UNIT id=$current_caster status.slowed   yes})}
		[/if]
        [if] {VARIABLE_CONDITIONAL "caster_$current_caster|.poisoned" equals yes} {THEN({MODIFY_UNIT id=$current_caster status.poisoned yes})}
		[/if]
        {CLEAR_VARIABLE "caster_$current_caster|.slowed","caster_$current_caster|.poisoned"}

        {ANIMATE_UNIT id=$current_caster levelin}
        [redraw]
        [/redraw]
        {CLEAR_VARIABLE pre_polymorphed_caster_$current_caster|,polymorphed_caster}

        [if] {HAVE_UNIT (id,defense=$current_caster,100)} {THEN(
            [message]
                speaker=$current_caster
                message=_"My polymorph spell has ended over impassable terrain! I‘m falling to my death!"
            [/message]
            {KILL id=$current_caster ANIMATE=yes}
            [endlevel]
                result=defeat
            [/endlevel]
        )}
		[/if]
    [/event]
[/event]
#enddef
#define EVENT_POLYMORPH
    {EVENT_POLYMORPH_TYPE skill_polymorph_lizard  (Swamp Lizard) "portraits/monsters/crocodile.webp"}
    {EVENT_POLYMORPH_TYPE skill_polymorph_bear   (Cave Bear  ) "portraits/monsters/bear.webp"}
    {EVENT_POLYMORPH_TYPE skill_polymorph_yeti   (Yeti ) "portraits/monsters/yeti.webp"}
    {EVENT_POLYMORPH_TYPE skill_polymorph_orc    (Orcish Warlord ) "portraits/orcs/warlord.webp"}
    [event] # implement the cave bear's "consume" ability
        name=last breath # not die, because plot units are often {KILL}ed during their last breath
        first_time_only=no
        {FILTER( {NOT trait=undead,elemental} )}
        {FILTER_SECOND_ATTACK special_id=consume}

        {STORE_UNIT_VAR id=$second_unit.id max_hitpoints consume_heal_amount}
        {VARIABLE_OP consume_heal_amount multiply 0.3}
        [heal_unit]
            {FILTER id=$second_unit.id}
            amount,animate=$consume_heal_amount,yes
            restore_statuses=no
        [/heal_unit]
        {CLEAR_VARIABLE consume_heal_amount}
    [/event]
    [event]
        name=refresh_skills
        first_time_only=no
        {FILTER_CONDITION({VARIABLE_CONDITIONAL pre_polymorphed_caster_$current_caster|.length not_equals 0})}
		{CHECK_EQUIPPED_SPELL id=$current_caster skill_polymorph}
        [if] {VARIABLE_CONDITIONAL equipped_spell_found not_equals yes} {THEN(
            {FIRE_EVENT skill_polymorph_lizard_cancel}
            {FIRE_EVENT skill_polymorph_bear_cancel}
            {FIRE_EVENT skill_polymorph_yeti_cancel}
            {FIRE_EVENT skill_polymorph_orc_cancel}
		)}
		[/if]
    [/event]
    [event]
        name=victory
        first_time_only=no
		[lua]
        code= <<
            local units = wesnoth.units.find_on_map()
            
            for i,u in ipairs(units) do
                if  wml.variables["caster_" .. u.id] and wml.variables["caster_" .. u.id .. ".polymorphed"] then
				    wml.variables["current_caster"] = u.id
                    wesnoth.game_events.fire("skill_polymorph_lizard_cancel")
					wesnoth.game_events.fire("skill_polymorph_bear_cancel")
					wesnoth.game_events.fire("skill_polymorph_yeti_cancel")
					wesnoth.game_events.fire("skill_polymorph_orc_cancel")
                end
            end
			
            units = nil
	    >>
	    [/lua]
    [/event]
#enddef

