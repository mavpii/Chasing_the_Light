#############################
# MAGIC MISSILE
#############################
#define EVENT_MAGIC_MISSILE
    [event]
        name=refresh_skills
        first_time_only=no
		{CHECK_EQUIPPED_SPELL id=$current_caster skill_magic_missile}
		[if] {VARIABLE_CONDITIONAL equipped_spell_found equals yes} {THEN(
        [object]
            id,take_only_once=skill_magic_missile,no {FILTER id=$current_caster}
            {EFFECT new_attack (
                name,description,icon=missile,_"missile",attacks/magic-missile.png
                range,type,damage,number=ranged,fire,7,3
                [specials]
                    {WEAPON_SPECIAL_MAGICAL}
                [/specials] )}
            [/object]
		)}
		[/if]
    [/event]
#enddef

#############################
# MAGIC BLAST
#############################
#define EVENT_MAGIC_BLAST
    [event]
        name=refresh_skills
        first_time_only=no
		{CHECK_EQUIPPED_SPELL id=$current_caster skill_magic_blast}
        [if] {VARIABLE_CONDITIONAL equipped_spell_found equals yes} {THEN(
		    [store_unit]
			    {FILTER id=$current_caster}
			    variable=caster_blast_damage
			[/store_unit]
			
			[if]
			{VARIABLE_CONDITIONAL caster_blast_damage.level equals 1}
			[then]
                [object]
                    id,take_only_once=skill_magic_blast,no {FILTER id=$current_caster}
                    {EFFECT new_attack (
                        name,description,icon=magic_blast,_"magic blast",attacks/mud-missile.png
                        range,type,damage,number=ranged,impact,9,2
                        [specials]
                            {WEAPON_SPECIAL_MAGICAL}
			    			[unstable]
                                name= _ "unstable"
                                description= _ "Each time this spell is used for both offense and defense, it drains {ON_DIFFICULTY 1 2 3} hp from its caster."
                            [/unstable]
                        [/specials] )}
                [/object]
			[/then]
			[else]
			    [object]
                    id,take_only_once=skill_magic_blast,no {FILTER id=$current_caster}
                    {EFFECT new_attack (
                        name,description,icon=magic_blast,_"magic blast",attacks/mud-missile.png
                        range,type,damage,number=ranged,impact,9,2
                        [specials]
                            {WEAPON_SPECIAL_MAGICAL}
                        [/specials] )}
                [/object]
			[/else][/if]
			    
			{CLEAR_VARIABLE caster_blast_damage}
		)}
		[/if]
        [/event]
#enddef

