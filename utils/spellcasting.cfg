            image=illusion_aura
        [/remove_item]
        [allow_undo]
        [/allow_undo]
        [on_undo]
            delayed_variable_substitution=yes
            {REFRESH_ILLUSION_VISUAL}
            {REFRESH_ENTHRALLED}
        [/on_undo]
    [/event]

    #------------------------
    # ENTHRALEE MOVES
    #------------------------
