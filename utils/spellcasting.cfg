        {FILTER_ATTACK name=lightning}
        {LIGHTNING_BOLT {DIRECTION_NUMBER} }
        start_time=-300
        {FRAME image=$current_caster_image.image:50}
        {FRAME image=$current_caster_image.image:[125,225,75]}
        {FRAME image=$current_caster_image.image:75}
        {SOUND:HIT_AND_MISS lightning.ogg lightning-miss.ogg -300}
    [/attack_anim]
#enddef

