#############################
# DIS_HEAL
#############################
#define EVENT_DISHEAL
    [event]
        name=skill_disheal_cast
        first_time_only=no

        [if]
            [not]
                [variable]
                    name="unit_to_cast_on_x"
                    equals=$unit_to_modify_x
                [/variable]
                [and]
                    [variable]
                        name="unit_to_cast_on_y"
                        equals=$unit_to_modify_y
                    [/variable]
                [/and]
                [and]
                    [have_unit]
                        id=temple_guard_1
                    [/have_unit]
                [/and]
            [/not]
            [then]
                [animate_unit]
                    flag=healing
                    [filter]
                        id=$current_caster
                    [/filter]
                [/animate_unit]

                [animate_unit]
                    flag=levelin
                    [filter]
                        x,y= $unit_to_cast_on_x, $unit_to_cast_on_y
                    [/filter]
                [/animate_unit]

                [heal_unit]
                    [filter]
                        x,y= $unit_to_cast_on_x, $unit_to_cast_on_y
                    [/filter]
                    amount=8
                    animate=yes
                [/heal_unit]

                [if]
                    [variable]
                        name="is_daeola_healed_exam_mage"
                        equals=false
                    [/variable]
                    [then]
                        {FIRE_EVENT heal_exam_mage}
                    [/then][/if]
                [/then]
                [else]
                    [message]
                        speaker=Daeola
						#po: Ні, я не можу вилікувати себе закляттям, тільки не зараз! Я не відмовлюся від своєї обіцянки — я носитиму свій шрам, поки не стану справжнім магом!
                        message= _ "No, I can't heal myself with a spell, not now! I won't go back on my promise — I'll wear my scar until I'm a real mage!"
                    [/message]
					
					[set_achievement]
                        content_for=Chasing_the_Light
                        id="ctl_selfheal"
                    [/set_achievement]
					
					[lua]
                        code= <<
						    local unit_to_modify = wesnoth.units.find_on_map({id = wml.variables["current_caster"]})[1]
		                    unit_to_modify.experience = unit_to_modify.experience + 6
							unit_to_modify.moves = unit_to_modify.moves + 1
                            wml.variables["caster_" .. wml.variables["current_caster"] .. ".spellcasted_this_turn"] = nil
		                >>
                    [/lua]
                [/else][/if]
            [/event]

    [event]
        name=skill_disheal
        first_time_only=no

		{CTL_RANGED_SPELL "$current_caster" 7 "misc/buff.png" true false "skill_disheal_cast" 0 6}
    [/event]
#enddef

#############################
# DIS_ATTACK
#############################
#define EVENT_DISATTACK
    [event]
        name=skill_disattack_cast
        first_time_only=no

        [set_variable]
            name=repeat_count
            value=3
        [/set_variable]

        [while]
            [variable]
                name=repeat_count
                greater_than=0
            [/variable]
            [and]
                [have_unit]
                    x,y= $unit_to_cast_on_x, $unit_to_cast_on_y
                [/have_unit]
            [/and]

            [do]
                [set_variable]
                    name=miss_or_hit_disattack
                    value=9
                [/set_variable]

                {RANDOM 1..100}
                [if]
                    [variable]
                        name="random"
                        less_than=70
                    [/variable]
                    [then]
                        [set_variable]
                            name=miss_or_hit_disattack
                            value=9
                        [/set_variable]
                        [sound]
                            name= {SOUND_LIST:HOLY}
                            start_time=0
                        [/sound]
                    [/then]
                    [else]
                        [set_variable]
                            name=miss_or_hit_disattack
                            value=0
                        [/set_variable]
                        [sound]
                            name={SOUND_LIST:HOLY_MISS}
                            start_time=0
                        [/sound]
                    [/else][/if]

                    [animate_unit]
                        flag=disattack_anim
                        [filter]
                            id=$current_caster
                        [/filter]

                        [facing]
                            x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
                        [/facing]
                    [/animate_unit]

                    [object]
                        silent=yes
                        duration=turn end
                        [filter]
                            x,y=$unit_to_cast_on_x, $unit_to_cast_on_y
                        [/filter]
                        [effect]
                            apply_to=new_animation
                            [extra_anim]
                                flag=disattack_anim_defender
                                missile_start_time=-150
                                [missile_frame]
                                    halo="halo/holy/light-beam-[1~7,6~1].png:[30*6,130,70*6]"
                                    offset=0.0
                                    auto_vflip=no
                                [/missile_frame]
                            [/extra_anim]
                        [/effect]
                    [/object]

                    [animate_unit]
                        flag=disattack_anim_defender
                        [filter]
                            x,y=$unit_to_cast_on_x, $unit_to_cast_on_y
                        [/filter]
                        [facing]
                            id=$current_caster
                        [/facing]
                    [/animate_unit]

                    [harm_unit]
                        [filter]
                            x,y= $unit_to_cast_on_x, $unit_to_cast_on_y
                        [/filter]
                        [filter_second]
                            id=$current_caster
                        [/filter_second]
                        amount=$miss_or_hit_disattack
                        alignment=lawful
                        damage_type=arcane
                        kill=yes
                        experience=kill
                        fire_event=yes
                        animate=defender

                        [primary_attack]
                            range=ranged
                        [/primary_attack]

                        [secondary_attack]
                            range=ranged
                        [/secondary_attack]
                    [/harm_unit]

                    [set_variable]
                        name=repeat_count
                        add=-1
                    [/set_variable]

                    ##{DELAY 500}
                [/do]
            [/while]

            [if]
                [have_unit]
                    x,y= $unit_to_cast_on_x, $unit_to_cast_on_y
                [/have_unit]
                [then]
                    [store_unit]
                        [filter]
                            x,y=$unit_to_cast_on_x,$unit_to_cast_on_y
                        [/filter]
                        variable=unit_to_cast_on
                    [/store_unit]
                    {VARIABLE unit_level $unit_to_cast_on.level}
                    {CLEAR_VARIABLE unit_to_cast_on}
                    [store_unit]
                        [filter]
                            id=$current_caster
                        [/filter]
                        variable=attacker_var
                    [/store_unit]
                    [modify_unit]
                        [filter]
                            id=$current_caster
                        [/filter]
                        experience="$($attacker_var.experience + $unit_level)"
                    [/modify_unit]
					{CLEAR_VARIABLE attacker_var}
                [/then]
            [/if]
        [/event]

    [event]
        name=skill_disattack
        first_time_only=no

        {VARIABLE TARGET_IMAGE "misc/attack.png"}
		
		{CTL_RANGED_SPELL "$current_caster" 6 "misc/attack.png" false true "skill_disattack_cast" 0 8}
    [/event]
#enddef

