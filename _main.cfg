#textdomain wesnoth-ctl
[textdomain]
    name="wesnoth-ctl"
	path="data/add-ons/Chasing_the_Light/translations"
[/textdomain]

#ifdef Chasing_the_Light
[+language]
    type_any= _ "any"
[/language]

[binary_path]
    path=data/add-ons/Chasing_the_Light
[/binary_path]

[lua]
    code= <<
	    --chess(cotgi.lua)
		function wesnoth.custom_synced_commands.ctl_chess(Table)
			_G["ctl_chess"..Table.type](Table)
		end
		
		wesnoth.require '~add-ons/Chasing_the_Light/lua/mouse_handler.lua'
		
		wesnoth.require '~add-ons/Chasing_the_Light/themes/theme_items.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/popups.lua'
		
		wesnoth.require '~add-ons/Chasing_the_Light/lua/cotgi.lua'
		
		wesnoth.require '~add-ons/Chasing_the_Light/lua/note.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/map.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/outro_teaser.lua'
		
		--from Naia
		on_event                   = wesnoth.require("on_event.lua")
		
		wesnoth.require '~add-ons/Chasing_the_Light/lua/persistent.lua'
		
		wesnoth.require '~add-ons/Chasing_the_Light/lua/boss.lua'
	    
		wesnoth.require '~add-ons/Chasing_the_Light/lua/gui/utils.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/gui/widgets.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/gui/journey_ui.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/gui/journey_ui_extra.lua'
		
		wesnoth.require '~add-ons/Chasing_the_Light/lua/journey/core.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/journey/achievements.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/journey/lore.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/journey/log.lua'
		wesnoth.require '~add-ons/Chasing_the_Light/lua/journey/milestones.lua'
	>>
[/lua]

[lua]
    code = <<
        local journeylog_cfg = wml.get_child(..., "journeylog_config")

        journeylog.register_character_profiles(journeylog_cfg)
        journeylog.register_world_lore_entries(journeylog_cfg)
        journeylog.register_achievements(journeylog_cfg)
    >>
    [args]
        [journeylog_config]
            {./journey}
            {~add-ons/Chasing_the_Light/achievements.cfg}
        [/journeylog_config]
    [/args]
[/lua]

{~add-ons/Chasing_the_Light/utils}
{./magic/utils.cfg}
{~add-ons/Chasing_the_Light/themes}
{~add-ons/Chasing_the_Light/achievements.cfg}
[+units]
    {~add-ons/Chasing_the_Light/units/Haralin}
    {~add-ons/Chasing_the_Light/units/Daeola}
    {~add-ons/Chasing_the_Light/units/Asa}
	{~add-ons/Chasing_the_Light/units/Faisim}
    {~add-ons/Chasing_the_Light/units/Mages}
    {~add-ons/Chasing_the_Light/units/Spirits}
    {~add-ons/Chasing_the_Light/units/Wesfolk}
	{~add-ons/Chasing_the_Light/units/Monsters}
	{~add-ons/Chasing_the_Light/units/Others}
[/units]
{~add-ons/Chasing_the_Light/scenarios}

[color_range]
    id=islefolk
    rgb=a01b59,db8eb2,1f000d,ff5b5b
[/color_range]
#endif

#ifdef EDITOR
[binary_path]
    path=~add-ons/Chasing_the_Light
[/binary_path]

[editor_group]
    id=ctl
    name= _ "Chasing the Light"
    icon="group_custom"
[/editor_group]
{~add-ons/Chasing_the_Light/utils/terrain.cfg}
{~add-ons/Chasing_the_Light/utils/terrain_graphics.cfg}
#endif

[campaign]
    id=Chasing_the_Light
	#po: В гонитві за Світлом | Женучись за Світлом
    name= _ "Chasing the Light"
    abbrev= _ "CtL"
    start_year="201 BW"
    end_year="148 BW"
    icon="data/add-ons/Chasing_the_Light/images/icon.png"
    background="data/add-ons/Chasing_the_Light/images/story/Temple_in_the_Deep.webp"
    define=Chasing_the_Light
    first_scenario=01_Overture

    {CAMPAIGN_DIFFICULTY EASY   "data/add-ons/Chasing_the_Light/images/units/daeola/L0_Apprentice_Unarmed/daeola.png~RC(magenta>red)" ( _ "Apprentice") ( _ "Normal")}
    {CAMPAIGN_DIFFICULTY NORMAL "data/add-ons/Chasing_the_Light/images/units/daeola/L1_Mage/daeola.png~RC(magenta>red)" ( _ "Mage") ( _ "Hard")} {DEFAULT_DIFFICULTY}
    {CAMPAIGN_DIFFICULTY HARD   "data/add-ons/Chasing_the_Light/images/units/daeola/L2/daeola.png~RC(magenta>red)" ( _ "Prophetess") ( _ "Nightmare")}

    #po: В гонитві за Світлом | Женучись за Світлом
    #po: Мирне існування жителів Зеленого Острову вмить перетворилося на жахіття, коли легіони живих мерців прийшли на їхні землі з далекого Заходу. Грайте за Гараліна, молодого селянина з малого села поблизу Чорнотопу, якому одного дня почав чутися таємничий голос, називаючий себе посланцем самого Світла. Чи зможете ви відкрити невідомі до цього сили, змінити хід війни та зберегти свою батьківщину від проклятих Людей Заходу?
	#po: (Важкий рівень, від 18 сценаріїв.)
    description= _ "<span color='#fff7a4' size='larger'>Chasing the Light</span>
<i>Peaceful life of the Green Isle's inhabitants turned into a nightmare in an instant when legions of living dead invaded their land from the far West. Play as Haralin, a young peasant from a small village near Blackmore, who one day began to hear a mysterious voice calling itself messenger of the Light. Can you discover previously unknown powers, turn the tide of war and save your homeland from the hideous Wesfolk?</i>

<span color='#fff7a4'>(Hard level, at least 18 scenarios.)</span>"

