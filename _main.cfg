#-----------------------------------------------------------------------------
# MAGIC SYSTEM MODIFICATION
# Loads the magic system for any game that enables the modification below. The
# system itself is loaded only when nothing else already did it: the campaign
# block loads it for Chasing the Light, the MULTIPLAYER block for every
# multiplayer game. The modification's own glue is always added, so the mod also
# runs alongside the campaign — its casters live next to the scripted ones.
#
# No [+units] here: magic/_init.cfg brings the unit types the spells actually
# need (the elementals, Brazier, Phylactery) and nothing else of the campaign.
#-----------------------------------------------------------------------------
#ifdef CTL_MAGIC_MOD
#ifndef Chasing_the_Light
#ifndef MULTIPLAYER
[binary_path]
    path=data/add-ons/Chasing_the_Light
[/binary_path]
[lua]
    code= <<
        wesnoth.require '~add-ons/Chasing_the_Light/lua/mouse_handler.lua'
    >>
[/lua]
{~add-ons/Chasing_the_Light/utils}
{./magic/_init.cfg}
#endif
#endif
{./magic/mod/mod.cfg}
#endif

