#textdomain wesnoth-ctl
[multiplayer]
    id=98_MP_Magic_Test
    name= _ "CtL — Magic System Test"
    map_data="{~add-ons/Chasing_the_Light/maps/98_MP_Test.map}"

    victory_when_enemies_defeated=yes
    disallow_recall=yes
    carryover_percentage=0

    #--------------------
    # SIDE 1 — Player 1 (Haralin: reselect + 3 spells/turn)
    #--------------------
    [side]
        side=1
        controller=human
        team_name=Casters_1
        user_team_name= _ "Casters"
        defeat_condition=no_units_left
        gold=0
        {INCOME 0 0 0}
        fog=no
        shroud=no
        {FLAG_VARIANT long}
        color=islefolk
    [/side]

    #--------------------
    # SIDE 2 — Player 2 (Daeola: 2 spells/turn)
    #--------------------
    [side]
        side=2
        controller=human
        team_name=Casters_2
        user_team_name= _ "Casters"
        defeat_condition=no_units_left
        gold=0
        {INCOME 0 0 0}
        fog=no
        shroud=no
        {FLAG_VARIANT long}
    [/side]

    #--------------------
    # MAGIC SYSTEM GLOBAL EVENTS
    #--------------------
    {MAGIC_SYSTEM__GLOBAL_EVENTS}

    #--------------------
    # PRESTART
    #--------------------
    [event]
        name=prestart

        [unit]
            id=Haralin_Copy
            type=Haralin_L2
            experience=59
            side=1
            x=3
            y=6
            {IS_HERO}
        [/unit]

        [unit]
            id=Daeola_Copy
            type=Daeola_L1_Mage
            experience=49
            side=2
            x=15
            y=6
            {IS_HERO}
        [/unit]

        [unit]
            id=quintain_mp1
            type=Quintain
            canrecruit=yes
            side=3
            x=9
            y=4
        [/unit]
        [unit]
            id=quintain_mp2
            type=Quintain
            canrecruit=no
            side=3
            x=9
            y=6
        [/unit]
        [unit]
            id=quintain_mp3
            type=Quintain
            canrecruit=no
            side=3
            x=9
            y=8
        [/unit]

        [modify_unit]
            [filter]
                side=3
            [/filter]
            moves=0
            max_moves=0
            ai_special=guardian
        [/modify_unit]

        # --- Caster setup ---
        [assign_caster]
            [filter]
                id=Haralin_Copy
            [/filter]
            spell_group_1 = skill_magic_blast,  skill_summon,          skill_shield,        skill_stasis,        skill_panacea
            spell_group_2 = skill_levitate,      skill_chill_touch,     skill_mnemonic,      skill_find_familiar, skill_bend
            spell_group_3 = skill_fireball2,     skill_glamour,         skill_enervate,      skill_blizzard,      skill_counterspell, skill_polymorph
            spell_group_4 = skill_fireball3,     skill_dancing_daggers, skill_illusion,      skill_animate_fire,  skill_contingency
            spell_group_5 = skill_fireball4,     skill_lightning,       skill_time_dilation, skill_cataclysm
            unlocked_spells = skill_polymorph, skill_magic_blast, skill_summon, skill_shield, skill_chill_touch, skill_levitate, skill_mnemonic, skill_fireball2, skill_glamour, skill_bend, skill_bend_earth
            equipped_spells = skill_summon, skill_bend, skill_fireball2
        [/assign_caster]

        [assign_caster]
            [filter]
                id=Daeola_Copy
            [/filter]
            spell_group_1 = skill_magic_missile, skill_disattack
            spell_group_2 = skill_swap,          skill_levitate
            spell_group_3 = skill_disheal,       skill_ward
            unlocked_spells = skill_magic_missile, skill_disattack, skill_swap, skill_levitate, skill_disheal, skill_ward
            equipped_spells = skill_magic_missile, skill_swap, skill_ward
        [/assign_caster]

        {CASTER_STATUS id=Haralin_Copy,Daeola_Copy yes}

        # Haralin: free reselect + 3 spells/turn
        {CASTER_RESELECT id=Haralin_Copy yes}
        {CASTER_MAX_CASTS id=Haralin_Copy 3}

        # Daeola: 2 spells/turn
        {CASTER_MAX_CASTS id=Daeola_Copy 2}

        [label]
            x=3
            y=4
            text= _ "P1: Haralin — 3 spells/turn + Change Spells"
        [/label]
        [label]
            x=15
            y=4
            text= _ "P2: Daeola — 2 spells/turn"
        [/label]
        [label]
            x=9
            y=3
            text= _ "Targets"
        [/label]
    [/event]
[/multiplayer]
