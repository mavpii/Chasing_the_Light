		type=Spearman
		id=Yencyr
		name=_"Yencyr"
		x,y=10,13
		facing=se
		{IS_HERO}
		color=purple
		controller=null
		team_name=Slaves, Islefolk, Wesfolk
		{FLAG_VARIANT long}
		user_team_name=_"Northern Haven"
	[/side]
	
	[side]
	    side=6
		color=islefolk
		controller=ai
		team_name=Islefolk
		{FLAG_VARIANT long}
		user_team_name=_"United Army"
	[/side]
	
	[event]
	name=prestart
	
	    ##remove juangh and utility units
		[kill]
		    id=Juangh, Daeola, Haralin, father_copy, faisim_copy, zeham_copy, wose_copy, daeola_copy, asa_copy
		    search_recall_list=yes
		[/kill]
		
		####################
		## LIEUTENANT ASA ##
		####################
		{RECALL_XY Asa 34 30}
		{MODIFY_UNIT id=Asa name _"Lieutenant Asa"}
		{MODIFY_UNIT id=Asa profile portraits/asa/asa_chapter3.webp}
		{MODIFY_UNIT id=Asa facing sw}
	
	    ############
		## DAEOLA ##
		############
		[unit]
	    	canrecruit=yes
	    	side,id,name,profile=1,Daeola,_"Daeola",portraits/daeola/daeola_L3.webp
	    	experience={ON_DIFFICULTY 80 70 60}
	        unrenamable=yes
            gender=female
            type=Daeola_L3
	    	facing=se
            x,y=22,29
	    	[modifications]
                [trait]
                    id,name,description=devoted_dummy,_"devoted",_"TODO"
                [/trait]
                [trait]
                    id,name,description=depressed_dummy,_"depressed",_"TODO"
                [/trait]
            [/modifications]
        [/unit]
        {REFRESH_CASTER_ANIMATIONS id=Daeola}
	    
	    [if]
	    [variable]
            name="Daeola_regen_necklace"
            equals=true
	    [/variable]
	    [then]
	        [modify_unit]
	            [filter]
	                id=Daeola
	            [/filter]
	            [abilities]
                    {ABILITY_SELF_HEAL}
                [/abilities]
	        [/modify_unit]
	    [/then][/if]
	    
		#############
		## HARALIN ##
		#############
		[unit]
	    	canrecruit=yes
	    	side,id,name,profile=1,Haralin,_"Haralin",portraits/haralin/Haralin_L3.webp
	    	experience={ON_DIFFICULTY 80 70 60}
	        unrenamable=yes
            gender=male
            type=Haralin_L3
	    	facing=sw
            x,y=34,29
	    	[modifications]
                [trait]
                    id,name,description=loyal_dummy,loyal,_"Zero upkeep."
                [/trait]
                [trait]
                    id,name,description=intelligent_dummy,intelligent,""
                [/trait]
            [/modifications]
        [/unit]
		
		#ПЕРЕРОБИТИ!
		[modify_caster]
		    [filter]
		        id=Haralin
		    [/filter]
		    spell_group_1 = skill_magic_blast,  skill_fireball2,   skill_lightning,          skill_fury,             skill_dancing_daggers 
		    spell_group_2 = skill_levitate,     skill_shield,             skill_polymorph,        skill_regenerate, skill_camouflage, skill_etherealness
		    spell_group_3 = skill_mnemonic,     skill_glamour,     skill_find_familiar,      skill_panacea,          skill_sacrifice,             skill_invincible,    skill_duty
		    spell_group_4 = skill_summon,       skill_bend,        skill_stasis,              skill_blizzard,  skill_terrashift, skill_electrify, skill_golem
		    spell_group_5 = skill_time_dilation,  skill_cataclysm, skill_timezone, skill_reality
		    spell_group_6 = $necklace_spell
		    unlocked_spells = $caster_Haralin.spell_unlocked|,skill_lightning,skill_stasis,skill_panacea
		    equipped_spells = skill_levitate,skill_lightning,skill_stasis,skill_panacea
		[/modify_caster]
		{REFRESH_CASTER_ANIMATIONS id=Haralin}
		
		###########
		## ZEHAM ##
		###########
		{RECALL_LOYAL Zeham 31 32}
		[if]
		[have_unit]
		id=Zeham
	    [/have_unit]
		[then]
		    {MILESTONE zeham_priorities no}
		
		    [store_unit]
                {FILTER id=Zeham}
                variable,kill=Zeham,no
            [/store_unit]
		    
		    [if]
		    [variable]
		    name=Zeham.level
		    less_than_equal_to=2
		    [/variable]
		    [then]
		        {TRANSFORM_UNIT id=Zeham Knight}
		    [/then]
		    [else]
		        {TRANSFORM_UNIT id=Zeham (Grand Knight)}
		    [/else][/if]
		    {FULL_HEAL id=Zeham}
		[/then][/if]
		{MODIFY_UNIT id=Zeham name _"Sir Zeham"}
		{MODIFY_UNIT id=Zeham profile "portraits/humans/grand-knight-2.webp"}
		{MODIFY_UNIT id=Zeham facing sw}
		{MODIFY_UNIT id=Zeham moves Zeham.max_moves}
		{CLEAR_VARIABLE Zeham}
		
