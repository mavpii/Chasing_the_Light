#textdomain wesnoth-ctl

{JOURNAL 10_Retone _"Retone" no}

[scenario]
    id=10_Retone
    name= _ "Retone"
    map_data="{~add-ons/Chasing_the_Light/maps/10_Retone.map}"
	{DEFAULT_SCHEDULE_SECOND_WATCH}
	
	turns=-1
	carryover_percentage=0
    victory_when_enemies_defeated=no
	#next_scenario=

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg revelation.ogg}
	
	[side]
        side=1
        id,defeat_condition=Haralin,never
		shroud=no
		fog=no
        controller=human
        team_name=Islefolk
        {FLAG_VARIANT long}
        user_team_name=_"United Army"
		recruit=Apprentice, Mage, Bowman, Spearman, Heavy Infantryman, Swordsman, Javelineer, Pikeman, Longbowman
		{GOLD 450 450 400}
    [/side]
	{STARTING_VILLAGES_AREA 1 30 32 10}
	
	[side]
	    side=2
		color=blue
		controller=ai
		team_name=Wesfolk
		{FLAG_VARIANT ragged}
		user_team_name=_"Wesfolk Outer Guard"
        [ai]
            [avoid]
                terrain=W*,S*,*^Bsb/
				[or]
				    x=12-35
				    y=20-30
				[/or]
				[or]
				    x=18-21
				    y=17-20
				[/or]
            [/avoid]
        [/ai]
		{GOLD 900 1200 1400}
		{INCOME 30 45 60}
	[/side]
	
	[side]
	    side=3
		type=Barrow Wight
		id=Baron_Bleoran
		name=_"Baron Bleoran"
		side=3
		x,y=36,7
		facing=sw
		canrecruit=yes
		color=blue
		controller=null
		team_name=Wesfolk
		{FLAG_VARIANT undead}
		user_team_name=_"Wesfolk of the Valley"
		[ai]
            [avoid]
                terrain=W*,S*,*^Bsb/
				[or]
				    x=12-35
				    y=20-30
				[/or]
				[or]
				    x=18-21
				    y=17-20
				[/or]
            [/avoid]
        [/ai]
		{GOLD 300 350 400}
		{INCOME 30 45 60}
	[/side]
	{STARTING_VILLAGES_ALL 3}
	
	[side]
	    side=4
		color=blue
		controller=ai
		hidden=yes
		team_name=Wesfolk
		user_team_name=_"Wesfolk"
	[/side]
	
	[side]
	    side=5
		color=blue
		controller=null
		team_name=Wesfolk
		user_team_name=_"Wesfolk Inner Guard"
		[ai]
			grouping=defensive
			leader_aggression=0.1
			passive_leader=yes
			##aggression/caution перемикає подія "side 5 turn" нижче
			aggression=-1
			caution=1

			##не виходять за межі зони охорони
			[avoid]
				[not]
					{S10_RETONE_GUARD_ZONE}
				[/not]
			[/avoid]

			##розходяться по замках зони, а не купчаться на кіпі
			[goal]
				name=target_location
				value=8
				[criteria]
					terrain=C*,K*,C*^*,K*^*
					[and]
						{S10_RETONE_GUARD_ZONE}
					[/and]
				[/criteria]
			[/goal]

			##хто прорвався в зону - пріоритетна ціль, хоч би й у тилу
			[goal]
				name=target
				value=40
				[criteria]
					[filter_side]
						[enemy_of]
							side=5
						[/enemy_of]
					[/filter_side]
					[filter_location]
						{S10_RETONE_GUARD_ZONE}
					[/filter_location]
				[/criteria]
			[/goal]
		[/ai]
		{GOLD 600 800 800}
		{INCOME 30 45 60}
	[/side]
	
