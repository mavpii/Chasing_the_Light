					##вежа, яку вже тримає своя ж сторона, перестає бути ціллю -- інакше
					##move_to_targets безкінечно тягне їх до зайнятого гексу, вони впираються
					##в сусідні клітини й товчуться там замість того, щоб робити щось інше.
					##Вежі під ворогом у списку лишаються: їх треба відбивати.
					[not]
						[filter]
							side=8
						[/filter]
					[/not]
					[and]
						x,y=1,17
						[or]
							x,y=3,20
						[/or]
						[or]
							x,y=7,29
						[/or]
						[or]
							x,y=9,32
						[/or]
					[/and]
				[/criteria]
			[/goal]
		[/ai]
	[/side]
	
