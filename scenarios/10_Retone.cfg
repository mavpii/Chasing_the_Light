	[event]
	name=side 6 turn
	first_time_only=no

		{MODIFY_AI_TRY_DELETE_ASPECT 6 aggression "*"}
		{MODIFY_AI_TRY_DELETE_ASPECT 6 caution "*"}

		[if]
		[have_unit]
			[filter_side]
				[enemy_of]
					side=6
				[/enemy_of]
			[/filter_side]
			[filter_location]
				{S10_RETONE_GUARD_ZONE}
			[/filter_location]
		[/have_unit]
		[then]
			[modify_side]
				side=6
				[ai]
					aggression=0.8
					caution=0.1
				[/ai]
			[/modify_side]
		[/then]
		[else]
			[modify_side]
				side=6
				[ai]
					aggression=-1
					caution=1
				[/ai]
			[/modify_side]
		[/else][/if]
	[/event]
	
