		fog=no
        controller=human
        team_name=Islefolk
        {FLAG_VARIANT long}
        user_team_name=_"United Army"
    [/side]
	
	[side]
	    side=2
		color=blue
		controller=ai
		team_name=Wesfolk
		{FLAG_VARIANT ragged}
		user_team_name=_"Wesfolk"
	[/side]
	
	[side]
