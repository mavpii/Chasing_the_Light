##треба подумати, які активності зайняти гравця
##Можна додати одиноких привидів від ленвана у горах справа
##Зараз: союзники приходять та виносять наг, можна отримати закляття у барона, звільнити селян-рабів, далі приходить Жев'ян і якщо його якось перемогти, то дає закляття
##По суті, движухи достатньо, але треба б побільше діалогів, щоб після масивних по діалогам S8-S9 ці не здавалися пустими. Мб додати розмову між персонажами. Як щодо, між Зегамом та Гараліном?
##Або краще між Асою та Гараліном, щоб підкреслити їхні стосунки
##

