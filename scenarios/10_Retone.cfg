	##################################
	## ПОСТАВА ВНУТРІШНЬОЇ ВАРТИ ##
	##################################
	## чисто в зоні - тримаємо замки і не лізем;
	## хтось прорвався - перемикаємось на зачистку, зокрема й у тилу
	[event]
	name=side 5 turn
	first_time_only=no

		{MODIFY_AI_TRY_DELETE_ASPECT 5 aggression "*"}
		{MODIFY_AI_TRY_DELETE_ASPECT 5 caution "*"}

		[if]
		[have_unit]
			[filter_side]
				[enemy_of]
					side=5
				[/enemy_of]
			[/filter_side]
			[filter_location]
				{S10_RETONE_GUARD_ZONE}
			[/filter_location]
		[/have_unit]
		[then]
			[modify_side]
				side=5
				[ai]
					aggression=0.8
					caution=0.1
				[/ai]
			[/modify_side]
		[/then]
		[else]
			[modify_side]
				side=5
				[ai]
					aggression=-1
					caution=1
				[/ai]
			[/modify_side]
		[/else][/if]
	[/event]
	
