	[event]
	name=new turn
	first_time_only=no
	
		[if]
		[have_unit]
			[filter_side]
				[enemy_of]
					side=9
				[/enemy_of]
			[/filter_side]
			[filter_location]
				{S10_RETONE_ALLY_ISLAND}
			[/filter_location]
		[/have_unit]
		[then]
			[modify_side]
				side=9
				controller=ai
			[/modify_side]
		[/then]
		[else]
			[modify_side]
				side=9
				controller=null
			[/modify_side]
		[/else][/if]
		
		[if]
		[have_unit]
			side=9
			count=7-99
		[/have_unit]
		[then]
			{MODIFY_AI_TRY_DELETE_CANDIDATE_ACTION 9 main_loop recruitment}
		[/then]
		[else]
			{MODIFY_AI_ADD_CANDIDATE_ACTION 9 main_loop ({AI_CA_RECRUITMENT})}
		[/else][/if]
	[/event]
	

