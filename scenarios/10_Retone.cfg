		name=_"Baron Bleoran"
		side=3
		x,y=36,7
		facing=sw
		canrecruit=yes
		color=blue
		controller=ai
		team_name=Wesfolk
		{FLAG_VARIANT undead}
		user_team_name=_"Wesfolk"
	[/side]
	{STARTING_VILLAGES_ALL 3}
	
