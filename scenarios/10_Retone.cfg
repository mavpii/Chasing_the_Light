	## ВИЛАЗКИ ЗА СТІНИ ##
	##########################
	[event]
	name=recruit
	first_time_only=no
	[filter]
	    side=3
	    canrecruit=no
	    [not]
	        type_adv_tree=Ghost
	    [/not]
	[/filter]
	    {MODIFY_UNIT id=$unit.id role s10_home}
	    [fire_event]
	        name=s10_sortie_rebalance
	    [/fire_event]
	[/event]

	[event]
	name=side 3 turn
	first_time_only=no
	    [fire_event]
	        name=s10_sortie_rebalance
	    [/fire_event]
	[/event]

	[event]
	name=s10_sortie_rebalance
	first_time_only=no
	    [lua]
	        code=<<
	            local args = ...
	            local home = wesnoth.units.find_on_map{ side = 3, role = "s10_home" }
	            local out = #wesnoth.units.find_on_map{ side = 5, role = "s10_sortie" }
	            local need = math.floor((#home + out) * args.share) - out
	            table.sort(home, function(a, b) return a.y > b.y end)
	            for i = 1, math.min(need, #home) do
	                wesnoth.wml_actions.modify_unit{
	                    wml.tag.filter{ id = home[i].id },
	                    side = 5,
	                    role = "s10_sortie"
	                }
	            end
	        >>
	        [args]
	            share={S10_SORTIE_SHARE}
	        [/args]
	    [/lua]
	[/event]

