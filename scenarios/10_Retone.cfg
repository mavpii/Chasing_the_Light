			grouping=defensive
			leader_aggression=0.1
			passive_leader=yes
			##aggression/caution перемикає подія "side 5 turn" нижче
			aggression=-1
			caution=1

			##не виходять за межі зони охорони
			[avoid]
				[not]
					{S10_RETONE_GUARD_ZONE}
				[/not]
			[/avoid]

			##розходяться по замках зони, а не купчаться на кіпі
			[goal]
				name=target_location
				value=8
				[criteria]
					terrain=C*,K*,C*^*,K*^*
					[and]
						{S10_RETONE_GUARD_ZONE}
					[/and]
				[/criteria]
			[/goal]

			##хто прорвався в зону - пріоритетна ціль, хоч би й у тилу
			[goal]
				name=target
				value=40
				[criteria]
					[filter_side]
						[enemy_of]
							side=5
						[/enemy_of]
					[/filter_side]
					[filter_location]
						{S10_RETONE_GUARD_ZONE}
					[/filter_location]
				[/criteria]
			[/goal]
		[/ai]
