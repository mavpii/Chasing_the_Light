		user_team_name=_"Nagas"
	[/side]
	{STARTING_VILLAGES_AREA 4 4 27 4}
	
	{STARTING_VILLAGES_AREA 1 30 32 10}
	
	{STARTING_VILLAGES_AREA 5 11 12 6}
	
	[side]
