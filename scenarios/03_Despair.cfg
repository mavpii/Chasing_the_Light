	###################
	## VICTORY EVENT ##
	###################
	[event]
	name=victory, time over
		
		{SOUND lich-die.ogg}

	    [if]
	    [have_unit]
	        id=S2_Leader_1
	        [or]
	            id=S2_Leader_2
	        [/or]
	        [or]
	            id=S2_Leader_3
	        [/or]
	    [/have_unit]
	    [then]
	        {SPEAK Haralin _"Look, all undead are retreating north for some reason, as if something ordered them — perhaps it was the Light that protected us!"}
	    [/then]
	    [else]
	        {SPEAK Haralin _"Look, all undead are retreating north for some reason, probably because we defeated their leaders!"}
	    [/else][/if]
	
	    [lua]
	        code= <<
	            local GOAL_Y = 1      -- нежить відходить на північний край, x будь-який
	            local GOAL_SPREAD = 6 -- у скількох стовпцях довкола шукати найкоротший вихід
	            local MAX_STEPS = 30  -- запобіжник, якщо когось замкнуло й він нікуди не йде

	            local NO_SLIDE = { ["Vampire Bat"] = true, ["Blood Bat"] = true, ["Dread Bat"] = true }

	            local horde = wesnoth.units.find_on_map { side = 2 }
	            if #horde > 0 then
	                local cx, cy = 0, 0
	                for _, u in ipairs(horde) do cx, cy = cx + u.x, cy + u.y end
	                wesnoth.interface.scroll_to_hex(
	                    { math.floor(cx / #horde + 0.5), math.floor(cy / #horde + 0.5) }, false, false, true)
	            end

	            local corpses = wesnoth.units.find_on_map { type = "Walking Corpse,Soulless" }
	            if #corpses > 0 then
	                local anim = wesnoth.units.create_animator()
	                for _, u in ipairs(corpses) do
	                    u.hitpoints = 0
	                    anim:add(u, "death", "kill")
	                end
	                anim:run()
	                for _, u in ipairs(corpses) do
	                    if u.valid == "map" then u:erase() end
	                end
	            end

	            local fleeing = wesnoth.units.find_on_map { side = 2 }

	            local viewer = wesnoth.interface.get_viewing_side()
	            local function hidden(u)
	                return viewer and wesnoth.sides.is_fogged(viewer, { u.x, u.y })
	            end

	            for _, u in ipairs(fleeing) do
	                if hidden(u) then u:erase() end
	            end

	            local map_w = wesnoth.current.map.playable_width
	            local movers = {}
	            for _, u in ipairs(fleeing) do
	                if u.valid == "map" then
	                    local goal, goal_cost
	                    for x = math.max(1, u.x - GOAL_SPREAD), math.min(map_w, u.x + GOAL_SPREAD) do
	                        local path, cost = wesnoth.paths.find_path(u, { x, GOAL_Y },
	                            { ignore_units = true, ignore_teleport = true })
	                        if #path > 0 and (not goal_cost or cost < goal_cost) then
	                            goal, goal_cost = { x, GOAL_Y }, cost
	                        end
	                    end
	                    if goal then table.insert(movers, { unit = u, goal = goal }) end
	                end
	            end

	            for _ = 1, MAX_STEPS do
	                local anim = wesnoth.units.create_animator()
	                local moving, claimed = {}, {}
	                for _, m in ipairs(movers) do
	                    local u = m.unit
	                    if u.valid == "map" then
	                        if u.y <= GOAL_Y or hidden(u) then
	                            u:erase()
	                        else
	                            -- шлях перераховуємо щокроку, тож наступний гекс
	                            -- завжди сусідній і вільний, а орда сама себе обходить
	                            local path = wesnoth.paths.find_path(u, m.goal, { ignore_teleport = true })
	                            local nxt = path[2]
	                            local key = nxt and (nxt[1] .. "," .. nxt[2])
	                            if nxt and not claimed[key] then
	                                claimed[key] = true
	                                u.facing = wesnoth.map.get_relative_dir(u.x, u.y, nxt[1], nxt[2])
	                                if not NO_SLIDE[u.type] then
	                                    anim:add(u, "movement", "hit", { target = nxt })
	                                end
	                                table.insert(moving, { unit = u, next = nxt })
	                            end
	                        end
	                    end
	                end
	                if #moving == 0 then break end
	                anim:run()
	                for _, m in ipairs(moving) do
	                    wesnoth.units.teleport(m.unit, m.next, true, false, false)
	                    -- дійшов до краю або пірнув у туман — зникає одразу
	                    if m.unit.y <= GOAL_Y or hidden(m.unit) then m.unit:erase() end
	                end
	            end

	            local fade = wesnoth.units.create_animator()
	            for _, u in ipairs(fleeing) do
	                if u.valid == "map" then fade:add(u, "pre_teleport", "hit") end
	            end
	            fade:run()
	            for _, u in ipairs(fleeing) do
	                if u.valid == "map" then u:erase() end
	            end
