            [/gold_carryover]
			[note]
			#po: Це останній сценарій глави 'Internal Doubts'
                description= _"This is the final scenario of the chapter 'First Omen'"
            [/note]
        [/objectives]
	[/event]
	
	#################
	## TREE EVENTS ##
	#################
	[event]
	name=moveto
	first_time_only=no
	[filter]
	id=Haralin
	x,y=13,10
	[/filter]
	
	[if]
	[variable]
	name="is_haralin_meditated"
    equals=false
	[/variable]
	[then]
	
	#po: Це те саме місце сили, яке я відчув. Щось підказує мені зосередити всі свої чуття та...
	{SPEAK Haralin _"This is the same place of magic that I felt. Something tells me to focus all my senses and..."}
	
	[if]
    [variable]
    name=unit.experience
    less_than=8
    [/variable]
    [then]
    [modify_unit]
    [filter]
    id=Haralin
    [/filter]
    experience = "$($unit.experience + 8)"
    [/modify_unit]
    [/then][/if]
	
	[put_to_recall_list]
	id=Haralin
	[/put_to_recall_list]
	
	[role]
		side=1
        role=amazed_by_meditation
        [not]
            id=Haralin, Zeham
        [/not]
		[not]
		    type=Spirit Light, Giant Mudcrawler, Mudcrawler
		[/not]
    [/role]
		
	#po: Куди це він подівся?
	{SPEAK_ROLE amazed_by_meditation _"Where did he go?"}
	#po: Я сподіваюся, що цей поганець не вирішив від нас отак втекти!
	{SPEAK Zeham _"I hope that this bastard didn't decide to run away from us like that!"}
	
	{VARIABLE Haralin_Meditate "$($turn_number + 2)"}
	{VARIABLE is_haralin_meditated _"true"}
	
	[/then][/if]
	
	[if]
    [variable]
    name=unit.experience
    less_than=8
    [/variable]
    [then]
    [modify_unit]
    [filter]
    id=Haralin
    [/filter]
    experience = "$($unit.experience + 8)"
    [/modify_unit]
    [/then][/if]
	
	[/event]
	
	[event]
	name= turn $Haralin_Meditate
	
	    {RECALL_XY Haralin 13 10}

	    [lift_fog]
        [filter_side]
            side=1
        [/filter_side]
        x,y=13,10
        radius=2
        [/lift_fog]
	    
	    [scroll_to_unit]
            id=Haralin
        [/scroll_to_unit]
	    
	    {UNLOCK_SPELL id=Haralin skill_summon,skill_summon_mud}
	    {VARIABLE unlock_summon_mud yes}
	    
	    {CLEAR_VARIABLE Haralin_Meditate}
	    
	    #po: Тепер я відчуваю її, відчуваю усю вогку землю, що ситить це болото, відчуваю її рух та розумію... розумію, як підкорити її своїй волі!
	    {SPEAK Haralin _"Now I feel it, I feel all the moist soil that feeds this swamp, I feel its movement and I understand... I understand how to subdue it to my will!"}
	    
	    {FLASH_LIGHTNING ()}
	    
	    [modify_unit]
	        [filter]
	            type=Mudcrawler, Giant Mudcrawler
	        [/filter]
	        side=1
	    [/modify_unit]
	    
	    [reset_fog][/reset_fog]
	    [redraw]
	    side=1
	    clear_shroud = yes
	    [/redraw]
	    
	    [role]
	    	side=1
            role=mudcrawler_speaker
            type=Mudcrawler, Giant Mudcrawler
        [/role]
	    
	    #po: Бульгль-бульгль...!
	    {SPEAK_ROLE mudcrawler_speaker _"Bulgle-bulgle...!"}
	    
	    {DELAY 600}
	    
	    [if]
	    [have_unit]
	    type=Mudcrawler, Giant Mudcrawler
	    [/have_unit]
	    [then]
	    
	    #po: Нічогеньки, стільки чудес, що я вже нічому не дивуюся...
