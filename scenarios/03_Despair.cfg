	###########
	## START ##
	###########
	[event]
	name=start

	    [role]
	    	side=1
            role=peasant_speaker
            [not]
                id=Haralin, Zeham
            [/not]
        [/role]
	
	    {DELAY 1000}
	    
	    #po: Я... Ці прокляті мерці скоро наздоженуть нас... Що ж нам робити?..
	    {SPEAK Haralin _"I... Those damned undead will soon catch up with us. What are we gonna do?.."}
	    #po: Ми вже й самі, вважай, мертві. Оце все 'магія' винна, я вам кажу!
	    {SPEAK Zeham _"We are already almost dead ourselves. It's all the fault of 'magic', I tell you!"}
	    #po: Що ж... наші мисливці мають бути десь тут у болотах. Може, ми об'єднаймося з ними та... Щось вигадаємо, ти обов'язково щось вигадаєш, Гараліне.
	    {SPEAK_ROLE peasant_speaker _"Well... our hunters must be somewhere here in the swamps. Maybe we can join up with them and... Something will come of it, you'll think of something, Haralin."}
	    
	    #po: Вигадаємо? Але що... Ми ледве змогли затримати невеликий загін мерців, але ж їх легіони, я відчуваю це...
	    {SPEAK Haralin _"Shall we? But what... We barely managed to hold off a small group of undead, but there are legions of them, I can feel it..."}
	    #po: Гараліне, не здавайся, відходь далі у болота...
	    {SPEAK_VOICE _"Haralin, don't give up, just retreat further into the swamps..."}
	    
	    {MODIFY_UNIT id=Haralin facing nw} {DELAY 500}
        {MODIFY_UNIT id=Haralin facing ne} {DELAY 500}
	    {MODIFY_UNIT id=Haralin facing nw} {DELAY 500}
	    
	    {SPEAK Haralin _"..."}
	    #po: Іменем Світла, ти маєш це зробити!
	    {SPEAK_VOICE _"In the name of Light, you must do it!"}
	    #po: Так, хай захистить нас Світло... ГЕЙ, ЧИ Є ТУТ ХТОСЬ??? АУУУ!
	    {SPEAK Haralin _"Yes, may the Light protect us... HEY, IS ANYBODY THERE??? HELLO?"}
	    
	    {GENERIC_UNIT 1 (Poacher_Peasant) 6 17}
	    {GENERIC_UNIT 1 (Poacher_Peasant) 10 15}
	    {GENERIC_UNIT 1 (Poacher_Peasant) 6 15}
	    {GENERIC_UNIT 1 (Poacher_Peasant) 3 16}
	    
	    #ifdef EASY
	    {GENERIC_UNIT 1 (Trapper_Peasant) 4 13}
	    #endif
	    #ifdef NORMAL
	    {GENERIC_UNIT 1 (Thug_Peasant) 4 13}
	    #endif
	
	    [unit]
            id=Juangh
	    	type=Bandit_Peasant
	    	#po: Джуанг
	    	name=_ "Juangh"
	    	unrenamable=yes
            side=1
	    	facing=nw
            x=7
            y=14
	    	[modifications]
                {TRAIT_LOYAL}
            [/modifications]
        [/unit]
	    
	    [reset_fog][/reset_fog]
	    [redraw]
	    side=1
	    clear_shroud = yes
	    [/redraw]
	    
	    [scroll_to_unit]
            id=Juangh
        [/scroll_to_unit]
	    
	    {MODIFY_UNIT id=Juangh facing ne} {DELAY 500}
	
	    #po: Ґа? Ви чули щось чи ц' мні почулася?
	    {SPEAK Juangh _"Eh? Y'all hear somethin', or was it just me?"}
	    
	    [role]
	    	side=1
	    	x,y=10,15
            role=hunter2
        [/role]
		
		{MODIFY_UNIT role=hunter2 facing nw}{DELAY 300}
	    
	    #po: Шо, чоловіче, зовсім глухим став? Це ж Гаралін.
	    {SPEAK_ROLE hunter2 _"Have you gone completely deaf, man? It's Haralin."}
	    #po: М, ну мож... ГАРАЛІНЕ, МИ ТУТ. ШО ТАМ?
	    {SPEAK Juangh _"Hm, well mayb'... HARALIN, WE'RE HERE. WHAT'S GOIN' ON?"}
	    #po: Нас почули! НА СЕЛО НАПАЛИ МЕРЦІ ТА ЧАКЛУНИ! МИ ВРЯТУВАЛИ ВСІХ ДІТЕЙ, АЛЕ НАМ ДОВЕЛОСЯ ВІДІЙТИ!
	    {SPEAK Haralin _"We've been heard! THE VILLAGE IS UNDER ATTACK FROM UNDEAD AND SORCERERS! WE SAVED ALL THE CHILDREN, BUT WE HAD TO LEAVE!"}
	    #po: І ЩЕ ВІН САМ ЧАКЛУН! АЛЕ ХОЧА Б ВІД НЬОГО ЯКАСЬ КОРИСТЬ!
        {SPEAK Zeham _"AND HE'S A SORCERER HIMSELF! BUT AT LEAST HE'S SOME USE!"}
	    #po: Мерці, чалкуни... Це шо оті 'західняки'?
	    {SPEAK_ROLE hunter2 _"Undead, magic-slingers... Are those them 'Wesfolk'?"}
	    #po: Схож на те, алє добрє, що хоч люде живі... ЙДІТЬ Н' МІЙ ГОЛОС ТА ОСТЄРЄГАЙТЕСЯ БОЛОТНИХ ТВАРЮК!
	    {SPEAK Juangh _"Looks like it, but at least the folks are still alive... FOLLOW MY VOICE AND WATCH OUT FOR THEM SWAMP CRITTERS AND MUDCRAWLERS!"}
	    #po: Всі чули його, за мною!
	    {SPEAK Haralin _"You all heard him, follow me!"}
	    #po: Добром це не скінчиться...
	    {SPEAK Zeham _"It won't end well..."}
	
	    [objectives]
            [objective]
			   #po: Відступайте глибше в болота
                description=_ "Survive until turns run out"
                condition=win
            [/objective]
			[objective]
                description=_"Defeat as many enemy leaders as possible"
                condition=win
				{BONUS_OBJECTIVE_CAPTION }
            [/objective]
			[objective]
			    #po: Загибель Гараліна
                description= _ "Death of Haralin"
                condition=lose
            [/objective]
			[gold_carryover]
                bonus=no
                carryover_percentage=0
            [/gold_carryover]
			[note]
			    #po: Це останній сценарій глави 'Internal Doubts'
                description= _"This is the final scenario of the chapter 'First Omen'"
            [/note]
        [/objectives]
		
		{MILESTONE juangh_despair yes}
		[if]
		[have_unit]
		id=Zeham
		[/have_unit]
		[then]
		    {MILESTONE zeham_despair yes}
		[/then][/if]
		
		{VARIABLE enemy_deaths 0}
	[/event]
	
	###############
	## TREE HINT ##
	###############
	[event]
	name=turn 2

	    #po: Гараліне, на захід звідси є місце, що випромінює магію, обов'язково навідайся туди.
	    {SPEAK_VOICE _"Haralin, there's a site to the west of here that radiates magic, you should definitely go there."}
		
		[lift_fog]
	        [filter_side]
                side=1
            [/filter_side]
            x,y=13,10
            radius=1
        [/lift_fog]
		
		[scroll_to]
	        x,y=13,10
	    [/scroll_to]
	    
	    {DELAY 1000}
	    
	    [message]
	    	speaker,image=narrator,wesnoth-icon.png
	    	#po: У деяких сценаріях вам зустрічатимуться особливі місця, де Гаралін матиме можливість вивчити нове заклинання. Але будьте уважні — деякі з них можуть заходитися посеред важкодоступної місцевості.
	    	message= _ "In some scenarios, you'll come across special places where Haralin can learn a new spell. But be careful — some of them may be located in the middle of inaccessible terrain."
	    [/message]
		
		[objectives]
            [objective]
                description=_ "Survive until turns run out"
                condition=win
            [/objective]
			[objective]
                description=_"Defeat as many enemy leaders as possible"
                condition=win
				{BONUS_OBJECTIVE_CAPTION }
            [/objective]
			[objective]
                description=$tree_objective_var
