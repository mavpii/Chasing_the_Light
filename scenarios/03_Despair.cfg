	#po: Гараліне, твій шлях зрозумілий, однак він незрозумілий їм. Ім'я Світла, скажи їм, чого бажає твоє серце!
	{SPEAK_VOICE _"Haralin, your path is clear, but they do not understand it. In the name of Light, tell them what your heart desires!"}
	#po: Ні-ні, ні в якому разі, Ваша величносте!.. Моя магія потребує самотності та відданості, Світло не потерпить... гучних збіговиськ. Тому я прошу лише тиху місцину, де я б далі зміг вивчати шлях Світла і... навчити йому інших, вам потрібна ця сила для боротьби з мерцями, мій пане.
	{SPEAK Haralin _"No, no, no way, Your Majesty! My magic requires solitude and devotion, the Light will not tolerate... noisy gatherings. So I ask only for a quiet place where I can continue to study the way of the Light and... teach it to others, you need this power to fight the undead, my lord."}
	#po: Що ж, вже покраще буде це, я все ж виявлю ласку та погоджуся, але скажи — чи не будуть учні твої теж усамітнюватися, замість служби Королям?
	{SPEAK  Addroran _"Very well, this is somewhat better. I shall show mercy and agree. But tell me — will your disciples, too, retreat into seclusion rather than serve the Kings?"}
	#po: Я... я не знаю, мій пане. Кожна людина має свій шлях, тож я певний, що знайдуться і такі, й інші.
	{SPEAK Haralin _"I... I don't know, my lord. Every man has his own way, so I'm sure there will be some, and some others."}
	#po: Гаразд, Гараліне, хоч це й не те зовсім, що почути хотілося нам, проте, як на мою Королівську думку, варто спробувати. Однак обговорено буде все пізніше — наразі маємо прогнати ворогів! За мною, військо, ти, Гараліне, також!
	{SPEAK Addroran _"Though this is not exactly what we wished to hear, in my Royal opinion, it is worth a try. However, all will be discussed later — right now, we must drive back the enemies! Follow me, army, and you too, Haralin!"}
	
