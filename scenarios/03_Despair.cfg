#textdomain wesnoth-ctl
{JOURNAL 03_Despair _"Despair" no}

[scenario]
    id=03_Despair
	#po: Відчай
    name= _ "Despair"
    map_data="{~add-ons/Chasing_the_Light/maps/03_Despair.map}"
	{MODIFICATION_COLORSHIFT_BLACKMORE 1}
	{TURNS 20 25 30}
	{ADD_WEATHER_SNOW}

    victory_when_enemies_defeated=yes
	next_scenario=04_Daeola
	carryover_percentage=0

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg knolls.ogg}
	{EXTRA_SCENARIO_MUSIC the_dangerous_symphony.ogg}
	
	#story
	[story]
	    [if]
		[variable]
            name=s2_haralin_retreat
            not_equals="team"
        [/variable]
		[then]
	        [part]
		        #po: Опинившись за селом, Гараліну зустрілось кілька поранених селян, що ховалися в якійсь напіврозваленій халупі. Почувши, що мерці йдуть до них, перелякані люди вирішили приєднатися до чаклуна.
                story= _ "Once outside the village, Haralin met several wounded villagers in hiding. Hearing that undead were coming to them, the frightened people decided to join the sorcerer."
                {CTL_GREEN_ISLE_ESTEN_BIGMAP}
		    	{OLD_JOURNEY_02}
		    [/part]
		[/then][/if]
	    [part]
		    #po: Тож купка вцілілих селян відходила все глибше у болота, намагаючись утекти від мерців, чиї жахливі голосіння безперестанку чулися позаду, не відстаючи, наближаючись все ближче й ближче з кожною хвилиною. Усі були зневірені, особливо Гаралін, бо хоч якими хоробрими не були його останні слова мерцям, він розумів і відчував, що шансів в них мало, занадто мало...
            story= _ "So the small group of surviving peasants retreated deeper into the swamps, trying to escape the dead, whose terrible wails could be heard close behind them, coming closer and closer every minute. Everyone was in despair, especially Haralin, for no matter how brave his latest words to the Wesfolk were, he knew and felt that villagers had little chance to escape, too little."
            {CTL_GREEN_ISLE_ESTEN_BIGMAP}
			{OLD_JOURNEY_02}
		[/part]
	[/story]
	
	{CTL_GIE_TRACK {JOURNEY_03} }
	
	{SECOND_WATCH}
	
