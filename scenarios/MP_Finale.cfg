#textdomain wesnoth-ctl
[scenario]
    id=MP_Finale
    name= _ "MP Finale"
    map_data="{~add-ons/Chasing_the_Light/maps/08_Quiescence.map}"
	{UNDERGROUND}
	
	turns=-1
	carryover_percentage=0
    victory_when_enemies_defeated=no
	disallow_recall=yes
	theme=Cutscene_Minimal
	#next_scenario=

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg revelation.ogg}
	
	##sides
    [side]
        side=1
        id,defeat_condition=Haralin,never
		shroud=yes
		fog=no
        controller=human
        team_name=Islefolk
		{GOLD 60 50 40}
        {FLAG_VARIANT long}
        user_team_name=_"Haralin's Squad"
#ifdef MULTIPLAYER
        save_id=Haralin
        allow_player=yes
        share_vision=all
        color=teal
        faction=Custom
        faction_lock=yes
#endif
    [/side]

	{CTL_COOP_SIDE (
		shroud=yes
		fog=no
		gold=0
		income=0
	)}

	{CTL_COOP_PRE}
	
	[event]
	name=prestart
	
	{FADE_TO_BLACK}
	
	[/event]
	
	[event]
	name=start
	
	[outro_teaser][/outro_teaser]
	
	{REPLACE_SCENARIO_MUSIC return_to_wesnoth.ogg}
	
	[endlevel] 
        result=victory
        carryover_report=no
        linger_mode=no
		end_credits=no
    [/endlevel]
	
	[/event]

	
[/scenario]