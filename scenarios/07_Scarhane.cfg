	        #po: Підкріплення ворога прибувають, наче їм нема кінця, а ми досі не споромоглися дістатися до копалень на півдні, ще й ряди наші спорожніли. Схоже, нам не залишається вибору іншого, окрім як хоробро стояти на смерть та знищити стільки проклятих західняків, скільки зможемо!
			{SPEAK Count_Edvar _"Enemy reinforcements come as if endless, yet we still have not reached the southern mines, and our ranks grow thin. It seems no choice remains but to stand bravely to the death and smite as many damned Wesfolk as we can!"}
	        #po: Прокляття, Граф має рацію — ми занадто тягнули з відходом і нам вже не вибратися звідси. Королівське завдання провалене, а з ним втрачено і наші надії...
			{SPEAK Haralin _"Damn it, Count Edvar is right — we've taken too long to leave, and there's no way out of here now. The King's task has failed, and with it our hopes..."}
	    [/else][/if]
	[/event]
	
	[event]
	name=victory
	
		{QUAKE (rumble.ogg)}
		{DELAY 500}
		[remove_item]
            x,y=16,56
        [/remove_item]
		[redraw][/redraw]
		{PLACE_IMAGE "scenery/mine-abandoned.png~FL(horiz)" 16 56}
		[redraw][/redraw]
		{DELAY 500}
		
        [message]
	        speaker=narrator
	    	image=portraits/haralin/Haralin_L2.png
	    	caption= _"Haralin"
			#po: Мені вдалося створити прохід, але клянуся Світлом, він довго не протримається, тому всі — негайно за мною!
	        message= _"I have managed to create a passage, but Light be a witness, it won't last long, so everyone, follow me immediately!"
	    [/message]
		
		[store_unit]
            [filter]
                side=1
				[not]
				type=Brazier
				[/not]
            [/filter]
            variable=units_to_move
        [/store_unit]
		
		[foreach]
            array=units_to_move
            [do]
                {VARIABLE x1 $this_item.x}
                {VARIABLE y1 $this_item.y}
		        
                [move_unit]
                    x=$x1
                    y=$y1
		            side=1
                    to_x=16
                    to_y=56
                [/move_unit]
		        
                [put_to_recall_list]
                    x=16
                    y=56
                    side=1
					heal=yes
                [/put_to_recall_list]
            [/do]
        [/foreach]
		
        {CLEAR_VARIABLE units_to_move}
		
		[if]
		[have_unit]
		id=faisim
		[/have_unit]
		[then]
		{DELAY 700}
		
		#po: неймовірно, невелика купка 'магів' вилазить з копальні, проривається до оточеного міста, рятує ватажка, після чого просто тікає.... я відчуваю в цьому щось незвичайне, невже, вони й справді здатні щось змінити?...
		{SPEAK_FAISIM _"unbelievable, a small group of 'mages' get out of the mine, break into the besieged city, rescue the leader and then just run away.... i feel something unusual about this, are they really capable of changing something?..."}
		
		{DELAY 500}
		[/then][/if]
	    
	    [endlevel] 
            result=victory
        [/endlevel]
	[/event]
	
