#textdomain wesnoth-ctl
[scenario]
    id=07_Scarhane
	#po: Скархейн
    name= _ "Scarhane"
    map_data="{~add-ons/Chasing_the_Light/maps/07_Scarhane.map}"
	{DEFAULT_SCHEDULE}
	
	#{MODIFICATION_COLORSHIFT_MIDLANDS 1}
	#{MODIFICATION_COLORSHIFT_UNNAMED 3}
	#{MODIFICATION_COLORSHIFT_WOODLANDOR 4}
	
	{INTRO_AND_SCENARIO_MUSIC revelation.ogg silence.ogg}
	
	{TURNS 3 2 2}
	carryover_percentage=40

    victory_when_enemies_defeated=no
	next_scenario=08_Quiescence
	
	[story]
		[part]
		    #po: Коли вони зайшли далеко в глибини землі, віддалившись від поверхні на достатньо велику глибину, подорож по-справжньому почалася. Як не дивно, хоч Даеола завжди була поруч, невідомий голос більше не замовкав та, майже безперервно лунаючи в Гараліновій голові, продовжував направляти хоробрий загін звивистими шляхами темного підземелля. Проте хай все було добре, чаклуна ніяк не могла полишити дивна думка, а точніше питання — чому?
		    story= _ "When they had gone far into the depths of the earth, the journey truly began. Strangely enough, even though Daeola was always by Haralin's side, the unknown voice never stopped, and, echoing almost continuously in his head, kept on guiding the brave squad through the twisting paths of the dark underground. However, no matter how good everything was, the sorcerer could not leave a strange thought, or rather a question — why?"
		    {CTL_GREEN_ISLE_BIGMAP}
			{OLD_JOURNEY_06}
		[/part]
		[part]
		    #po: Чому цей голос, істота чи щоб це не було, чому воно кардинально змінило свою думку та тепер не виступає проти подорожі та порятунку Графа Чорнотопу? Чому воно без жодних заперечень вказує правильну путь, чому допомагає знаходити їстівні гриби та оминати печерних тварюк? Відповідей Гаралін не знав, та й знати не міг, хіба що... Голос оберігав саме його, хвилювався за долю лише одного мага і більше нікого? Така думка промайнула в голові чоловіка, на що він одразу ж відчув засуджуючий мовчазний тиск голосу і більше нічого.
		    story= _ "Why is this voice, entity, or whatever it is, why has it changed its mind and now doesn't oppose the journey and the rescue of Count of Blackmore? Why does it point the right way without any objections, why does it help him find edible mushrooms and avoid cave creatures? Haralin didn't know the answers, and he couldn't know them, unless... the voice was only protecting him, worried about the fate of only the mage and no one else? This thought flashed through the man's mind, and he immediately felt the voice's judgmental silent pressure and nothing else."
		    {CTL_GREEN_ISLE_BIGMAP}
			{OLD_JOURNEY_06}
		[/part]
		[if]
		[variable]
            name=daeasa_conversation_completed
            equals=true
        [/variable]
		[then]
		    {LOAD_STORY_HERO 
			    #po: Проте загалом все було добре — під час привалів Даеола практикувала нове закляття і навіть трохи спілкувалася з Асою, яка після їхньої розмови в копальнях Естену стала більш говіркою, не забуваючи при цьому про свої обов'язки, завжди знаходячись насторожі.
				#po: Щодо Зегама, то він мандрував мовчки, намагаючись триматися якнайдалі від магів та поближче до солдатів сержанта, хоч час від часу й перекидувався кількома словами з Даелою.
				#po: А ось пану лісовику було доволі погано знаходитися в темних печерах — без жодного доступу до сонячного тепла він сильно страждав, але все одно продовжував рухатися вперед. Магам було шкода бачити його в такому стані, проте вони нічим не могли цьому зарадити, окрім як промовляти зцілювальні закляття, коли це було потрібно.
				#po: Джуанга, як і завжди, нічого не хвилювало: він був готовий йти будь-куди та будь-скільки, якщо йому випаде нагода побитися з мертв'яками чи західняками.
			    ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} _"But overall everything was fine - during the rest stops, Daeola practiced a new spell and even talked a little with Asa, who, after their conversation in the Esten mines, became more talkative, while not forgetting her duties, always on the alert. As for Zeham, he traveled in silence, trying to stay as far away from the mages as possible and closer to the sergeant's soldiers, although he occasionally exchanged a few words with Daeola."}) #Zeham
