	[event]
        name=start
		
		{DELAY 500}
		
		[message]
	        speaker=narrator
	    	image=portraits/asa/asa_chapter2.png
	    	caption= _"Sergeant Asa"
			#po: Чаклуне, ворота не піддаються. Твоє чуття не помилилося?
	        message= _"Sorcerer, the gate won’t budge. Was your sense wrong?"
	    [/message]
		
		[message]
	        speaker=narrator
	    	image=portraits/haralin/Haralin_L2.png
	    	caption= _"Haralin"
			#po: Бачить Світло, сержанте, моє чуття не помиляється, 
			#po: окрім випадків, коли таємничий Голос намагається придушити мою волю.
			#po:  Я впевнений, що ми прийшли саме сюди тому, що зможемо знайти спосіб вибратися на поверхню.
	        message= _"By the Light, sergeant, my senses are never wrong, " + {WHISPER _"quietly^<i>except when a mysterious Voice is trying to suppress my will.</i>"} + _" I'm sure we came exactly here because here we can find a way to get to the surface."
	    [/message]
		
		[message]
	        speaker=narrator
	    	image=portraits/daeola/daeola_L1.png
	    	caption= _"Daeola"
			#po: Однак, Вчителю, як ми вийдемо назовні — ці ворота зачинені наглухо, наче їх не чіпали десятиліттями та вони зрослися з камінням!
	        message= _"But, Teacher, how can we come out — this gate is closed tightly, as if it had not been touched for decades and had fused with the stones!"
	    [/message]
		
		[message]
	        speaker=narrator
	    	image=portraits/haralin/Haralin_L2.png
	    	caption= _"Haralin"
			#po: На жаль, навряд чи це правда: у печері неподалік ми бачили достатньо тіл наших людей. Гадаю, вихід заблоковано ззовні чимось великим, тому мені доведеться скористатися моїм новим закляттям, щоб створити новій прохід. Хай допоможе мені в цьому саме Світло!
	        message= _"Unfortunately, that's hardly true: we've seen enough bodies of our people in the cave nearby. I think the exit is blocked from the outside by something large, so I'll have to use my new spell to create a new passage. May the Light itself help me in this!
...
De profundis terrae, veni ad liberandum!"
	    [/message]
		
