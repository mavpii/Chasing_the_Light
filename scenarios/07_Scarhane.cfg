#define POLYMORPH_BOOK_PICK PICK_BOOK_EVENT
	[if]
	[variable]
	    name=unit.side 
	    equals=1
	[/variable]
    [then]
	    [if]
		[variable]
		name=s7_book_side1_commented
		not_equals=true
		[/variable]
		[then]
	    {CTL_REACTION
        (
		#po: Ім'ям Світла, я вже відчуваю потужне закляття, що містить ця книга, тому я заберу цю книгу з собою.
	    {SPEAK Haralin _"Let Light be a witness, I can already feel the powerful spell this book contains, so I will take it with me."}) #Haralin
        (
		#po: Вчителю, мені вдалося роздобути для вас західняцьку книгу з закляттям!
	    {SPEAK Daeola _"Teacher, I managed to get you a Wesfolk book with a spell!"}
		#po: Гарна робота, Даеоло, проте будь обережнішою — нам поки що невідомо <i>що саме</i> написано в цій книзі.
		{SPEAK Haralin _"Good job, Daeola, but be careful — we don't know <i>what exactly</i> is written in this book yet."}) #Daeola
        (
		#po: Чаклуне, книга для тебе.
	    {SPEAK Asa _"Sorcerer, the book is for you."}
		#po: Клянуся Світлом, сержанте, тебе зовсім не хвилює походження заклять, чи не так?
		{SPEAK Haralin _"By the Light, sergeant, you don't care about the origin of spells at all, do you?"}) #Asa
        (
		#po: Я б краще не торкався цієї клятої західняцької книги, але, схоже, нашому чаклуну вона дуже потрібна, тому хай...
	    {SPEAK Zeham _"I'd rather not touch this damn Wesfolk book, but it seems that our sorcerer really needs it, so fine..."}
		#po: Ім'ям Світла, Зегаме, я й не очікував, що ти наважишся підібрати її. Хай там як, я тобі вдячний.
		{SPEAK Haralin _"By the Light, Zeham, I did not expect you to pick it up. I'm grateful, though."}) #hater
        (
		#po: Ого, чаклунская кніга!... Чув, Гараліне, я цей... я забєраю її для тєбя!...
	    {SPEAK Juangh _"Well I’ll be darned, a magic' book!... Hear that, Haralin? I’m takin’ it for ya, I am!"}
		#po: Дякую вам, пане Джуанг, хай благословить вас Світло.
		{SPEAK Haralin _"Thank you, sir Juangh, and may the Light bless you."}) #Juangh
        (
		#po: Є виробом з дерева це, не відчуваємо від нього ми темряви також, з собою заберемо тому.
	    {SPEAK Dolmannumbil _"A thing of wood, this is... darkness from it, we feel not... with us, we shall take it then."}) #wose
        (
		#po: Пане Гараліне, а ось і книга, яку ви хотіли отримати.
	    {SPEAK unit _"Master Haralin, here is the book you wanted to get."}) #others
        }
		{VARIABLE s7_book_side1_commented _"true"}
		[/then][/if]
	    
	    {PICK_BOOK_EVENT}
	[/then]
	[else]
	    [if]
		{VARIABLE_CONDITIONAL unit.id not_equals Count_Edvar}
		[and]
		{VARIABLE_CONDITIONAL unit.id not_equals s7_guard_1}
		[/and]
		[and]
		{VARIABLE_CONDITIONAL unit.id not_equals s7_guard_2}
		[/and]
		[then]
	    {RANDOM 1..100}
        [if]
		{VARIABLE_CONDITIONAL "random" less_than 70}
        [then]
		#small fee for picking the book	
		[message]
            speaker=unit
			#po: Я можу підібрать цю книгу, але не за просто так. Раптом вона проклята чи ще щось!
            message= _ "I can pick up this book, but not for nothing. Cause maybe it's cursed or something!"
            [option]
			    #po: Добре, хай буде так.
                label= _ "All right, so be it. (give {ON_DIFFICULTY 15 20 20} gold)."
                [command]
				    [store_gold]
					side=1
					[/store_gold]
					
					[if]
					[variable]
					name=gold
					greater_than_equal_to={ON_DIFFICULTY 15 20 20}
					[/variable]
					[then]
				    
				    [sound]
                        name=gold.ogg
                    [/sound]
					
				    [gold]
                        side=1
                        amount=-{ON_DIFFICULTY 15 20 20}
                    [/gold]
					
					[redraw][/redraw]
					
					{PICK_BOOK_EVENT}
					[/then]
					[else]
					#po: У вас немає {ON_DIFFICULTY 15 20 20} золота, не намагайтеся мене обдурити!
					{SPEAK unit _"You don't have {ON_DIFFICULTY 15 20 20} gold, don't try to fool me!"}
					[/else][/if]
		        [/command]
            [/option]
            [option]
			    #po: Можливо, хтось інший не вигадуватиме казок про 'прокляття'.
			    label= _ "Perhaps someone else will not make up stories about 'curses'."
                [command]
                ##nothing
                [/command]
            [/option]
        [/message]
		[/then]
		[elseif]
		{VARIABLE_CONDITIONAL "random" greater_than 90}
		[then]
		##agree to pick up the book
		#po: Я чув, що нашим чаклунам потрібна ця книга, тому я підберу її для них.
		{SPEAK unit _"I have heard that friendly sorcerers need this book, so I will pick it up for them."}
		{PICK_BOOK_EVENT}
		[/then][/elseif]
		[else]
		##rejection
		#po: Я навіть пальцем не торкнуся цієї західняцької книги, шукайте іншого дурня!
		{SPEAK unit _"I won't even touch this Wesfolk book with my finger, look for another fool!"}
		[/else][/if]
		{CLEAR_VARIABLE "random"}
		[/then]
		[else]
		[if]
		{VARIABLE_CONDITIONAL s7_count_guards_commented not_equals true}
		[then]
		#po: Проклята книга з західняцькими закляттям. Клянуся честю, що ніщо на світі не змусить мене навіть кинути погляд свій на неї.
		{SPEAK unit _"Accursed tome of Wesfolk incantations. I swear upon my honor — naught in this world shall compel me even to cast a glance upon it."}
		{VARIABLE s7_count_guards_commented _"true"}
		[/then][/if]
		[/else][/if]
	[/else][/if]
#enddef
	
