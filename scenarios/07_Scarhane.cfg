	[/then]
	[elseif]
	[variable]
	name=unit.side
	equals=2
	[/variable]
	[then]
	{VARIABLE s7_undead_zombie_name _"Fallen Defender"}
	[/then]
	[/elseif]
	[else]
	{VARIABLE s7_undead_zombie_name _"Wesfolk Servant"}
	[/else][/if]

    [unit]
	    name=$s7_undead_zombie_name
        type=Walking Corpse
        side=3
        x=$x1
        y=$y1
        placement=map
        overwrite=yes
        moves=0
        attacks_left=0
        variation=$unit.undead_variation
        animate=yes
		upkeep=loyal
    [/unit]
	
	{VARIABLE s7_risen_undead_x $x1}
	{VARIABLE s7_risen_undead_y $y1}
	
	{FIRE_EVENT s7_rise_dead}

    [/event]

	##time over
	[event]
	name=time over
	    [if]
	    [variable]
        name=turn_number
	    less_than_equal_to=3
	    [/variable]
	    [then]
	        {SPEAK haralin _"Прокляття, нам не вдалося захопити ворожий табір вчасно. Я відчуваю, що тепер ми ніяк не зможемо розгорнути наші сили і вороги просто задавлять нас числом!"}
	    [/then]
		[elseif]
		[variable]
		name=scarhane_door_opens
		equals=true
		[/variable]
		[then]
		    [fire_event] 
                name=victory
            [/fire_event]
		[/then]
		[/elseif]
	    [else]
	        {SPEAK blackmore_king _"Підкріплення ворога прибувають, наче їм нема кінця, а ми досі не споромоглися дістатися до копалень на півдні, ще й ряди наші спорожніли. Схоже, нам не залишається вибору іншого, окрім як хоробро стояти на смерть та знищити стільки проклятих західняків, скільки зможемо!"}
	        {SPEAK haralin _"Прокляття, Граф має рацію — ми занадто тягнули з відходом і нам вже не вибратися звідси. Королівське завдання провалене, а з ним втрачено і наші надії..."}
	    [/else][/if]
	[/event]
	
	[event]
	name=victory
	
	    ##гаралін відкриває двері і переможна катсцена
        {SPEAK narrator _"ТЕСТ ПЕРЕМОГА"}
	    
	    [endlevel] 
            result=victory
        [/endlevel]
	[/event]
	
	##втрата каравану
	[event]
	name=die
	[filter]
	type=Caravan
	[/filter]
	
	##коментар від Графа
	{SPEAK blackmore_king _"Цілий караван з беззахисними біженцями дістався проклятим західнякам на поживу їхнім огидним мерцям! Мало того, що ми втратили багатьох людей Острову, так ще й вороги незабаром отримають велике мертве підкріплення — це неприпустимо!"}
	
	[endlevel] 
        result=defeat
    [/endlevel]
	
	[/event]
	
	##смерть Графа
	[event]
	name=last breath
	[filter]
	    id=blackmore_king
	[/filter]
	
	    {SPEAK blackmore_king _"Аргх... І це все, на що ти здатен? Своєю атакою викликав лише мій правед-... укгггггх..."}
	    {SPEAK haralin _"Хай помилує нас Світло — прокляті західняки-таки дісталися до Графа Чорнотопу! Ми не змогли нічим зарадити і тому Королівське завдання провалено!"}
	    
	    [endlevel] 
            result=defeat
        [/endlevel]
	[/event]
	
