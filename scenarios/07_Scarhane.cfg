#define POLYMORPH_BOOK_PICK PICK_BOOK_EVENT
	
	[if]
	[variable]
	    name=unit.side 
	    equals=1
	[/variable]
    [then]
	    {CTL_REACTION
        (
	    {SPEAK haralin _""}) #haralin
        (
	    {SPEAK Daeola _""}) #Daeola
        (
	    {SPEAK Asa _""}) #Asa
        (
	    {SPEAK Zeham _""}) #hater
        (
	    {SPEAK Juangh _""}) #Juangh
        (
	    {SPEAK Dolmannumbil _""}) #wose
        (
	    {SPEAK unit _""}) #others
        }
	    
	    {PICK_BOOK_EVENT}
	[/then]
	[else]
	    [if]
		{VARIABLE_CONDITIONAL unit.id not_equals blackmore_king}
		[and]
		{VARIABLE_CONDITIONAL unit.id not_equals s7_guard_1}
		[/and]
		[and]
		{VARIABLE_CONDITIONAL unit.id not_equals s7_guard_2}
		[/and]
		[then]
	    {RANDOM 1..100}
        [if]
		{VARIABLE_CONDITIONAL "random" less_than 70}
        [then]
		#small fee for picking the book	
		[message]
            speaker=unit
            message= _ "плати"
            [option]
                label= _ "Так. (give {ON_DIFFICULTY 15 20 20 } gold)."
                [command]
				    [sound]
                        name=gold.ogg
                    [/sound]
					
				    [gold]
                        side=1
                        amount=-{ON_DIFFICULTY 15 20 20 }
                    [/gold]
					
					[redraw][/redraw]
					
					{PICK_BOOK_EVENT}
		        [/command]
            [/option]
            [option]
			    label= _ "Ні"
                [command]

                [/command]
            [/option]
        [/message]
		[/then]
		[elseif]
		{VARIABLE_CONDITIONAL "random" greater_than 90}
		[then]
		##agree to pick up the book
		{SPEAK unit _"Я візьму"}
		{PICK_BOOK_EVENT}
		[/then][/elseif]
		[else]
		##rejection
		{SPEAK unit _"відмова"}
		[/else][/if]
		{CLEAR_VARIABLE "random"}
		[/then]
		[else]
		##відмова від графа/охоронців(комент одноразовий)
		[if]
		{VARIABLE_CONDITIONAL s7_count_guards_commented not_equals true}
		[then]
		{SPEAK unit _"відмова короля"}
		{VARIABLE s7_count_guards_commented _"true"}
		[/then][/if]
		[/else][/if]
	[/else][/if]
#enddef
	
