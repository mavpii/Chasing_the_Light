<i>Пам'ятайте, що ви завжди можете змінити свій вибір скориставшись меню за правою кнопкою миші.</i>"
		            [/message]
                    [modify_side]
                    side=2
                    controller=$control_edvar
                    [/modify_side]
			
		        [/command]
            [/option]
            [option]
