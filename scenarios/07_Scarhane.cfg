#textdomain wesnoth-ctl
[scenario]
    id=07_Scarhane
	#po: Скархейн
    name= _ "Scarhane"
    map_data="{~add-ons/Chasing_the_Light/maps/07_Scarhane.map}"
	{DEFAULT_SCHEDULE}
	
	#{MODIFICATION_COLORSHIFT_MIDLANDS 1}
	#{MODIFICATION_COLORSHIFT_UNNAMED 3}
	#{MODIFICATION_COLORSHIFT_WOODLANDOR 4}
	
	{INTRO_AND_SCENARIO_MUSIC revelation.ogg silence.ogg}
	
	{TURNS 3 2 2}
	carryover_percentage=40

    victory_when_enemies_defeated=no
	dissalow_recall=no
	next_scenario=08_Quiescence
	
	[story]
		[part]
		    story= _ "Коли вони зайшли далеко в глибини землі, віддалившись від поверхні на достатньо велику глибину, подорож по-справжньому почалася. Як не дивно, хоч Даеола завжди була поруч, невідомий голос більше не замовкав та, майже безперервно лунаючи в Гараліновій голові, продовжував направляти хоробрий загін звивистими шляхами темного підземелля. Проте хай все було добре, чаклуна ніяк не могла полишити дивна думка, а точніше питання — чому?"
		    {CTL_GREEN_ISLE_BIGMAP}
			{OLD_JOURNEY_06}
		[/part]
		[part]
		    story= _ "Чому цей голос, істота чи щоб це не було, чому воно кардинально змінило свою думку та тепер не виступає проти подорожі та порятунку Графа Чорнотопу? Чому воно без жодних заперечень вказує правильну путь, чому допомагає знаходити їстівні гриби та оминати печерних тварюк? Відповідей Гаралін не знав, та й знати не міг, хіба що... Голос оберігав саме його, хвилювався за долю лише одного мага і більше нікого? Така думка промайнула в голові чоловіка, на що він одразу ж відчув засуджуючий мовчазний тиск голосу і більше нічого."
		    {CTL_GREEN_ISLE_BIGMAP}
			{OLD_JOURNEY_06}
		[/part]
		[if]
		[variable]
            name=daeasa_conversation_completed
            equals=true
        [/variable]
		[then]
		    {LOAD_STORY_HERO ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham"}) #Zeham
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Wose"}) #Wose
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Juangh"}) #Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham Wose Juangh"}) #Zeham Wose Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham Wose"}) #Zeham Wose
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham Juangh"}) #Zeham Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Wose Juangh"}) #Wose Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "None"}) #none
		    }
		[/then]
		[else]
		    {LOAD_STORY_HERO ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham"}) #Zeham
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Wose"}) #Wose
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Juangh"}) #Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham Wose Juangh"}) #Zeham Wose Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham Wose"}) #Zeham Wose
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Zeham Juangh"}) #Zeham Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "Wose Juangh"}) #Wose Juangh
		        ({STORY_MACRO {CTL_GREEN_ISLE_BIGMAP} {OLD_JOURNEY_06} "None"}) #none
		    }
		[/else][/if]
		[part]
		    story= _ "Кінець подорожі."
		    {CTL_GREEN_ISLE_BIGMAP}
			{OLD_JOURNEY_06}
		[/part]
    [/story]
	
