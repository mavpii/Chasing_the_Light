                    id=$s7_sl_strd_back.id
                    name=$s7_sl_strd_back.name
			    	unrenamable=yes
			    	hitpoints=$s7_sl_strd.hitpoints
                    experience=$s7_sl_strd_back.experience
                    canrecruit=$s7_sl_strd_back.canrecruit
					[if]
					[variable]
					name=s7_sl_strd_back.id
					equals=faisim
					[/variable]
					[then]
					profile="portraits/wesfolk/faisim.png"
					[/then][/if]
                    [modifications]
                        [insert_tag]
                            name=trait
                            variable=$s7_sl_strd.modifications.trait
                        [/insert_tag]
                    [/modifications]
                [/unit]
			    
			    [set_extra_recruit]
                    id=faisim
                    extra_recruit=Poacher, Trapper, Rogue Mage, Arcane Enforcer, Footpad, Thief, Wesfolk Fighter, Wesfolk Marauder
                [/set_extra_recruit]
			
			[/then][/if]
			
			[if]
			[have_unit]
			id=s7_shadow_mage
			[/have_unit]
			[then]
			
			    [scroll_to_unit]
			    id=s7_shadow_mage
			    [/scroll_to_unit]
			    
			    {DELAY 700}
			    
			    {SOUND skill-polymorph.wav}
			    {ANIMATE_UNIT (id=s7_shadow_mage) levelout}
			    
			    [store_unit]
                    [filter]
                        id=s7_shadow_mage
                    [/filter]
			    
                    kill=yes
                    variable=s7_sm_strd_back
                [/store_unit]
			    
			    [redraw]
                [/redraw]
                
                [unit]
                    type=Shadow Mage
                    side=3
			    	gender=$s7_sm_strd_back.gender
                    x,y=$s7_sm_strd_back.x,$s7_sm_strd_back.y
                    id=$s7_sm_strd_back.id
                    name=$s7_sm_strd_back.name
			    	hitpoints=$s7_sm_strd.hitpoints
