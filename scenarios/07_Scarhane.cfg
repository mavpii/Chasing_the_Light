	#po: Гарний удар, старий. Молодший був би ти хай би на років сорок, узяв би без роздумів до війська свого.
	{SPEAK Count_Edvar _"A fine strike, old man. Were you but forty years younger, without hesitation I would have taken you into my ranks."}
	#po: Ґа, шо?... Не чую я отсюдова...
	{SPEAK Juangh _"Huh, what’s that ya said?... Can’t hear ya from over here..."}) #Juangh
