    ##enemies morph back
    [event]
        name=side 8 turn refresh
        first_time_only=no

        {VARIABLE temp $turn_number}
        {VARIABLE_OP temp modulo 6}

        [if]
        [variable]
            name=temp
            equals=1
        [/variable]
        [variable]
            name=turn_number
            greater_than_equal_to=4
        [/variable]
        [then]

            [redraw][/redraw]
			
			[if]
			[have_unit]
