#textdomain wesnoth-ctl

#--------------------------------------------------------------------
# Local helper: create a unit and turn it into a caster with a spell set.
# SPELLS (and a multi-word TYPE) must be wrapped in (parentheses) at the call
# site because they contain spaces/commas.
#--------------------------------------------------------------------
#define AIMAGE SIDE ID TYPE X Y XP SPELLS
    [unit]
        id={ID}
        type={TYPE}
        side={SIDE}
        x={X}
        y={Y}
        experience={XP}
    [/unit]
    [assign_caster]
        [filter]
            id={ID}
        [/filter]
        spell_group_1 = {SPELLS}
        unlocked_spells = {SPELLS}
        equipped_spells = {SPELLS}
    [/assign_caster]
#enddef

[multiplayer]
    id=97_AI_Caster_Battle
    name= _ "CtL — 7v7 AI Caster Battle"
    map_data="{~add-ons/Chasing_the_Light/maps/97_AI_Battle.map}"

    victory_when_enemies_defeated=yes
    disallow_recall=yes
    carryover_percentage=0

    #--------------------
    # SIDE 1 — Order of Mages (AI). Both sides default to Computer so you can
    # just watch the AI casters fight; take over a side in the lobby if you like.
    #--------------------
    [side]
        side=1
        controller=ai
        team_name=Team_A
        user_team_name= _ "Order of Mages"
        defeat_condition=no_units_left
        gold=200
        {INCOME 0 0 0}
        fog=no
        shroud=no
        color=red
        [ai]
            aggression=1.0
            caution=0.0
        [/ai]
    [/side]

    #--------------------
    # SIDE 2 — Coven of Sorcerers (AI)
    #--------------------
    [side]
        side=2
        controller=ai
        team_name=Team_B
        user_team_name= _ "Coven of Sorcerers"
        defeat_condition=no_units_left
        gold=200
        {INCOME 0 0 0}
        fog=no
        shroud=no
        color=blue
        [ai]
            aggression=1.0
            caution=0.0
        [/ai]
    [/side]

    #--------------------
    # MAGIC SYSTEM GLOBAL EVENTS
    #--------------------
    {MAGIC_SYSTEM__GLOBAL_EVENTS}

    #--------------------
    # PRESTART
    #--------------------
    [event]
        name=prestart

        # ===== SIDE 1 — Order of Mages (7 different L2 casters, varied races) =====
        {AIMAGE 1 a1 (Red Mage)          4 2 60 (skill_disattack, skill_smite, skill_shield)}        # nuker
        {AIMAGE 1 a2 (White Mage)        4 3 60 (skill_disheal, skill_massheal, skill_shield)}       # healer
        {AIMAGE 1 a3 (Elvish Sorceress)  4 4 60 (skill_counterspell, skill_blizzard, skill_levitate)}# controller
        {AIMAGE 1 a4 (Saurian Oracle)    4 5 60 (skill_nature_revenge, skill_disattack, skill_shield)}# aoe
        {AIMAGE 1 a5 (Mermaid Priestess) 4 6 60 (skill_disheal, skill_time_dilation, skill_shield)}  # support
        {AIMAGE 1 a6 (Dark Sorcerer)     4 7 60 (skill_summon, skill_disattack, skill_shield)}       # summoner
        {AIMAGE 1 a7 (Dwarvish Runesmith) 4 8 60 (skill_polymorph, skill_shield, skill_levitate)}    # bruiser

        # ===== SIDE 2 — Coven of Sorcerers (7 different L2 casters, varied races) =====
        {AIMAGE 2 b1 (Red Mage)            14 2 60 (skill_cataclysm, skill_disattack, skill_shield)}  # artillery
        {AIMAGE 2 b2 (White Mage)          14 3 60 (skill_disheal, skill_massheal, skill_flight)}     # healer
        {AIMAGE 2 b3 (Elvish Druid)        14 4 60 (skill_illusion, skill_blizzard, skill_shield)}    # controller
        {AIMAGE 2 b4 (Saurian Soothsayer)  14 5 60 (skill_massheal, skill_smite, skill_shield)}       # battle-priest
        {AIMAGE 2 b5 (Mermaid Siren)       14 6 60 (skill_summon, skill_disheal, skill_shield)}       # summoner
        {AIMAGE 2 b6 (Dark Sorcerer)       14 7 60 (skill_disattack, skill_nature_revenge, skill_stasis)} # nuker
        {AIMAGE 2 b7 (Dwarvish Runesmith)  14 8 60 (skill_polymorph, skill_counterspell, skill_levitate)} # bruiser

        # one nominal leader per side so MP is happy (defeat_condition handles loss)
        [modify_unit]
		[filter]
		id=a1
		[/filter]
		canrecruit=yes
		[/modify_unit]
        [modify_unit]
		[filter]
		id=b1
		[/filter]
		canrecruit=yes
		[/modify_unit]

        # let each caster cast twice per turn — more to watch
        {CASTER_MAX_CASTS (side=1) 2}
        {CASTER_MAX_CASTS (side=2) 2}

        # ===== turn the AI on: each side's casters pick the best of their own spells =====
        {CASTER_AI 1 110000}
        {CASTER_AI 2 110000}

        [label] x=4  y=1 text= _ "Order of Mages (AI)"
		[/label]
        [label] x=14 y=1 text= _ "Coven of Sorcerers (AI)"
		[/label]
    [/event]
[/multiplayer]
