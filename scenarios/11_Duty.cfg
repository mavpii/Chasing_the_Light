	{INTRO_AND_SCENARIO_MUSIC revelation.ogg revelation.ogg}
	
	[story]
	[part]
		story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Кілька днів тому, біля ворожої столиці, я зійшлася в бою зі справжнім чудовиськом, з самим Владикою-Лічом. Я безліч разів чула, як західняки шанобливо кличуть його 'Майстром Жев'яном' та поважають за майстерність в бою, я ж побачила перед собою лише невимовно бридку суміш з безліччю рук, ніг, хвостів, навіть крил."
        {CTL_GREEN_ISLE_BIGMAP}
		{OLD_JOURNEY_09}
	    {OLD_JOURNEY 421 459}
	    {OLD_JOURNEY 433 435}
	    {OLD_JOURNEY 441 404}
	    {OLD_JOURNEY 451 380}
	    {OLD_JOURNEY 465 362}
	    {OLD_JOURNEY 472 336}
	    {OLD_JOURNEY 468 310}
	    {OLD_BATTLE 467 287}
	[/part]
	[part]
		story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Зізнаюсь, коли я виступила проти цього Жев'яна, мені стало страшно; я не хотіла битися з цією <i>твариною</i>, однак я була <i>змушена</i>, заради людей нашого Острову. Не знаю як, але мені навіть вдалося добряче підсмажити його закляттями Світла, й йому довелося тікати до стін західняцької столиці. Що правда, я теж отримала кілька поранень й відступила з поля бою, залишивши воїнів та інших магів продовжувати наступ вже без мене."
        {CTL_GREEN_ISLE_BIGMAP}
		{OLD_JOURNEY_09}
	    {OLD_JOURNEY 421 459}
	    {OLD_JOURNEY 433 435}
	    {OLD_JOURNEY 441 404}
	    {OLD_JOURNEY 451 380}
	    {OLD_JOURNEY 465 362}
	    {OLD_JOURNEY 472 336}
	    {OLD_JOURNEY 468 310}
	    {OLD_BATTLE 467 287}
	[/part]
	[part]
		story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Зараз я можу сказати, що мої рани не настільки тяжкі, якими здалися тоді й я могла б просто зцілити себе та продовжити бій, але ж... я завжди думаю — що станеться якщо <i>я</i> загину? Хіба Вчитель, Гаеніс та інші маги зможуть впоратися без <i>мене</i>? Хіба не всі кажуть, що саме <i>я</i> це єдина надія всього Острову?... Хай там як, ця битва в минулому, я вже нічого не можу змінити..."
        {CTL_GREEN_ISLE_BIGMAP}
		{OLD_JOURNEY_09}
	    {OLD_JOURNEY 421 459}
	    {OLD_JOURNEY 433 435}
	    {OLD_JOURNEY 441 404}
	    {OLD_JOURNEY 451 380}
	    {OLD_JOURNEY 465 362}
	    {OLD_JOURNEY 472 336}
	    {OLD_JOURNEY 468 310}
	    {OLD_BATTLE 467 287}
	[/part]
    [/story]
