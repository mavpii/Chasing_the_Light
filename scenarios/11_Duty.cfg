#textdomain wesnoth-ctl
[scenario]
    id=11_Duty
    name= _ "Duty"
    map_data="{~add-ons/Chasing_the_Light/maps/11_Duty.map}"
	{DEFAULT_SCHEDULE}
	
	turns=40
	carryover_percentage=0
    victory_when_enemies_defeated=no
	#disallow_recall=yes
	#theme=Cutscene_Minimal
	#next_scenario=12_Burden?

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg revelation.ogg}
	
	
	#[story]
    #    [part]
	#	    story= _ ""
    #        {CTL_GREEN_ISLE_BIGMAP}
	#	[/part]
	#[/story]
	#
	#{CTL_GI_TRACK {JOURNEY_10} }
	
	[side]
        side=1
        id,defeat_condition=Daeola,never
		shroud=no
		fog=no
        controller=human
        team_name=Islefolk
        {FLAG_VARIANT long}
        user_team_name=_"Field Hospital"
    [/side]
	
	{PLACE_IMAGE "units/human-loyalists/spearman-death4.png~RC(magenta>red)" 15 16}
	
	#loyalists
	duelist-die8
	spearman-death4
	fencer-die5
	lieutenant-die-9
	pikeman-die-5
	horseman-se-die5
	horseman-ne-die5
	knight-ne-die5
	knight-se-die5
	peasant-die10
	
	#magi
	mage+female-die-16
	mage-die-16
	
	
	#outlaws
	thief+female-die-7
	thief-die-7
	trapper-die-8
	adept-die8	
	
	#undead
	deathblade-dying-7
	archer-die-13
	revenant-dying-7
	skeleton-dying-7
	
	
	
	[event]
	name=prestart
	
	[kill]
	id=Daeola
	[/kill]
	
	[unit]
		canrecruit=yes
		side,id,name,profile=1,Daeola,_"Daeola",portraits/daeola/daeola_L2.png
		experience={ON_DIFFICULTY 80 70 60}
	    unrenamable=yes
        gender=female
        type=Daeola_L2
        x,y=51,27
		[modifications]
            [trait]
                id,name,description=devoted_dummy,_"devoted",_"TODO"
            [/trait]
            [trait]
                id,name,description=depressed_dummy,_"depressed",_"TODO"
            [/trait]
        [/modifications]
    [/unit]
    {REFRESH_CASTER_ANIMATIONS id=Daeola}
	
	[if]
	[variable]
        name="Daeola_regen_necklace"
        equals=true
	[/variable]
	[then]
	    [modify_unit]
	        [filter]
	            id=Daeola
	        [/filter]
	        [abilities]
                {ABILITY_SELF_HEAL}
            [/abilities]
	    [/modify_unit]
	[/then][/if]
	
	[/event]
	
	[event]
	name=start
	
	[/event]

	
[/scenario]