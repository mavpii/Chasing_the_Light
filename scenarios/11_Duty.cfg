Esten’s fallen, undead things all ‘round, an’ our own folk gone full mad! They done kilt our master, an’ then they started eatin’ people — P E O P L E!!! Me an’ a few o’ mine, we makin’ a run fer the spider tunnel. They say beasts took over part o’ the mines there, like that bastard Caror cursed the land, but we’ll break through!</b></span>"
_"Король" s11_king}

    #Граф Чорнотопу
	{S11_LETTERS 6 2 _"<span font-family='Oldania ADF Std' font-size='26000' color='black'><b>From the notes of unnamed miner.
		
Esten’s fallen, undead things all ‘round, an’ our own folk gone full mad! They done kilt our master, an’ then they started eatin’ people — P E O P L E!!! Me an’ a few o’ mine, we makin’ a run fer the spider tunnel. They say beasts took over part o’ the mines there, like that bastard Caror cursed the land, but we’ll break through!</b></span>"
_"Граф" daecount_conversation_completed}

    #Аса
	{S11_LETTERS 9 4 _"<span font-family='Oldania ADF Std' font-size='26000' color='black'><b>From the notes of unnamed miner.
		
Esten’s fallen, undead things all ‘round, an’ our own folk gone full mad! They done kilt our master, an’ then they started eatin’ people — P E O P L E!!! Me an’ a few o’ mine, we makin’ a run fer the spider tunnel. They say beasts took over part o’ the mines there, like that bastard Caror cursed the land, but we’ll break through!</b></span>"
_"Аса" daeasa_conversation_completed}
	
	
	#exit tent
	[event]
	name=moveto
	first_time_only=yes
	[filter]
	id=Daeola
	[filter_location]
	x,y=10,1
	radius=2
	[/filter_location]
	[/filter]
	
	[cancel_action][/cancel_action]
	
	    [hide_unit][/hide_unit]
	    [kill]
	    [not]
	    id=Daeola
	    [/not]
	    [not]
	    x,y=recall,recall
	    [/not]
	    fire_event=no
	    [/kill]
	    {FADE_TO_BLACK}
	        
	    {DELAY 500}
		
		##видаляємо всі поставлені зображення
		[remove_item][/remove_item]
	    
	    ##телепорт в угол карти, щоб її випадково не кинуло в recall list при зміні на меншу мапу
	    [teleport]
	    [filter]
	    id=Daeola
	    [/filter]
	    x,y=1,1
	    [/teleport]
	        
        [replace_map]
            map_file=11_Duty.map
	    	expand=yes
            shrink=yes
        [/replace_map]
        [redraw][/redraw]
		
	    [teleport]
	    [filter]
	    id=Daeola
	    [/filter]
	    x,y=51,27
	    [/teleport]
	    [scroll_to_unit]
	    id=Daeola
	    immediate=yes
	    [/scroll_to_unit]
	    
	    {DELAY 500}
	    
	    [unhide_unit][/unhide_unit]

		[modify_unit]
		[filter]
		id=Daeola
		[/filter]
		moves=6
		[/modify_unit]
		
		[modify_side]
	    [filter]
	    side=1
	    [/filter]
	    shroud=no
	    fog=no
	    [/modify_side]
		
		#розставити дружніх юнітів та декорації
		{FIRE_EVENT s11_tent_exit}
		
		[reset_fog][/reset_fog]
	    [redraw]
	    side=1
	    clear_shroud = yes
	    [/redraw]
	        
	    {FADE_IN}
		
		{DELAY 500}
		
		#вступна катсцена
		{FIRE_EVENT s11_tent_exit_cutscene}
		
		{VARIABLE is_Daeola_free_move _"false"}

	[/event]
	
	[event]
	name=s11_tent_exit
	
	
	[allow_end_turn][/allow_end_turn] 
	
	[/event]
	
	[event]
	name=s11_tent_exit_cutscene
	
	
	[/event]


	
[/scenario]