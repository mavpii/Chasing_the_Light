		#po: Ім'ям Світла, ти маєш подивитися. Негайно!
		{SPEAK_VOICE _"<i>In the name of Light, you have to see it. Now!</i>"}
		
		{MOVE_UNIT id=Haralin 20 2}
		
		{DELAY 1000}
		
		{PLACE_IMAGE (items/book5.png) 20 1}
		
		{DELAY 500}
		
		#po: У таборі цього розбійника є якась книга. Я якраз нещодавно навчився читати, а книги коштують багато грошей, тож...
		{SPEAK Haralin _"There is a book in this bandit's camp. I have just recently learnt to read, and books cost a lot of money, so..."}
		
		{MOVE_UNIT id=Haralin 20 1}
		
		[remove_item]
            x,y=20,1
            image="items/book5.png"
        [/remove_item]
		
		#po: <i>(роздивляється книгу)</i> Я вперше бачу такі літери, в нас так не пишуть, але я відчуваю, що від цієї книги віє силою. Може, в ній я дізнаюся про ту дивну силу?
		{SPEAK Haralin _"<i>(looking at the book)</i> It's the first time I've seen such letters, we don't write like that here, but I also feel that this book radiates power. Maybe in it I will learn about that strange power?"}
		#po: О! Тут ще є сувої якісь. Написано 'с-ло-в-ни-к' і поряд ота дивна мова. Мені це знадобиться!
		{SPEAK Haralin _"Оh! There are also some scrolls here. It's written 'd-i-c-t-i-o-n-a-r-y' and there's this odd language next to it. Think I'm going to need this!"}
		{SPEAK_VOICE _"..."}
		
		{MODIFY_UNIT id=Haralin facing nw} {DELAY 500}
		{MODIFY_UNIT id=Haralin facing ne} {DELAY 500}
		
		#po: Нікому не варто про це знати чи бачити, я не хочу проблем.
		{SPEAK Haralin _"No one needs to know or see this, I don't want any problems."}
		
		{MOVE_UNIT id=Haralin 20 18}
		
		{CLEAR_VARIABLE who_attacked_by_book_master}
		{CLEAR_VARIABLE book_master_attacked}
    [/event]
	
	##time over event
	[event]
	name= time over
	
	    #po: Прокляття, схоже, ці селюки виявилися сильнішими, ніж ми гадали. Забираймося звідси!
	    {SPEAK Book_Master _"Damn, it seems these peasants are stronger than we thought. Let's get out of here!"}
		
		[store_unit]
            [filter]
                side=2
            [/filter]
            variable=units_to_move
        [/store_unit]
		
		[foreach]
            array=units_to_move
            [do]
                {VARIABLE x1 $this_item.x}
                {VARIABLE y1 $this_item.y}
		        
                [move_unit]
                    x=$x1
                    y=$y1
		            side=2
                    to_x=27
                    to_y=1
                [/move_unit]
		        
                [kill]
                    x=27
                    y=1
                    side=2
                [/kill]
            [/do]
        [/foreach]

        {CLEAR_VARIABLE units_to_move}
		
		#po: Перемога, ура! Так, так, забирайтеся звідси!
		{SPEAK Haralin _"Victory, yay! Yes, yes, get out of here!"}
		#po: Та й, та не галасуй ти так... Гайда в село.
		{SPEAK Andrin _"Aye, stop making so much noise... Let's go to the village."}

		[message]
            speaker,image=narrator,wesnoth-icon.png
			#po: Хоч селяни й перемогли цього разу, але зовсім незабаром вони зіткнулися з силою, котру не змогли подолати, ніхто не зміг.
            message=_"Although the peasants won this time, they soon faced a force that they could not overcome, no one could."
        [/message]
		
		[endlevel] 
            result=defeat
        [/endlevel]
	
	[/event]
	
