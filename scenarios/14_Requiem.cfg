			id=Haralin
			[filter_adjacent]
				id=Caror
			[/filter_adjacent]
		[/filter]
		[filter_condition]
			[variable]
				name=s14_phase
				equals=3
			[/variable]
		[/filter_condition]

		{VARIABLE s14_phase 4}

