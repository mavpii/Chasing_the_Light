#define S14_TELEPORT ID X Y
	[lua]
		code=<<
			local args = ...
			local c = wesnoth.units.find_on_map{ id = args.id }[1]
			if c then
				local x, y = args.x, args.y
				if c.x ~= x or c.y ~= y then x, y = wesnoth.paths.find_vacant_hex(x, y, c) end
				wml.variables.s14_tp_x = x
				wml.variables.s14_tp_y = y
			end
		>>
		[args]
			id={ID}
			x={X}
			y={Y}
		[/args]
	[/lua]
	[teleport]
		[filter]
			id={ID}
		[/filter]
		x,y=$s14_tp_x,$s14_tp_y
		animate=yes
	[/teleport]
#enddef

#define S14_LANDING_INTERVAL
{ON_DIFFICULTY 5 4 3}#enddef

#define S14_SHIP ID TYPE X Y
	[unit]
		id={ID}
		type={TYPE}
		side=8
		role=s14_fleet
		x,y={X},{Y}
		facing=w
		animate=yes
		[modifications]
			{TRAIT_LOYAL}
			[object]
				[effect]
					apply_to=remove_attacks
				[/effect]
				[effect]
					apply_to=movement
					set=0
				[/effect]
			[/object]
		[/modifications]
	[/unit]
#enddef

#define S14_ANIM FILTER FLAG ANIM_WML
	[object]
		silent=yes
		[filter]
			{FILTER}
		[/filter]
		[effect]
			apply_to=new_animation
			[extra_anim]
				flag={FLAG}
				{ANIM_WML}
			[/extra_anim]
		[/effect]
	[/object]
#enddef

#define S14_PLAY_GROUP ROLE FLAG
	[lua]
		code=<<
			local args = ...
			local anim = wesnoth.units.create_animator()
			for _, u in ipairs(wesnoth.units.find_on_map{ role = args.role }) do
				anim:add(u, args.flag, "hit")
			end
			anim:run()
		>>
		[args]
			role={ROLE}
			flag={FLAG}
		[/args]
	[/lua]
#enddef

#define S14_GARRISON SIDE TYPE X Y
	[unit]
		type={TYPE}
		side={SIDE}
		x,y={X},{Y}
		[modifications]
			{TRAIT_LOYAL}
			[object]
				[effect]
					apply_to=movement
					set=0
				[/effect]
			[/object]
		[/modifications]
	[/unit]
#enddef

#define S14_SCHEDULE SIDE NAME DELAY
	{VARIABLE s14_next_{NAME} $turn_number}
	{VARIABLE_OP s14_next_{NAME} add {DELAY}}
	[event]
		name=side {SIDE} turn $s14_next_{NAME}
		{FIRE_EVENT s14_{NAME}}
	[/event]
#enddef

#define S14_NO_ATTACKS_ON_CAROR
	[aspect]
		id=attacks
		[facet]
			invalidate_on_gamestate_change=yes
			[filter_enemy]
				[not]
					id=Caror
				[/not]
			[/filter_enemy]
		[/facet]
	[/aspect]
#enddef

#define S14_TARGET SIDE ID VALUE
	[modify_ai]
		side={SIDE}
		action=add
		path=goal[]
		[goal]
			[criteria]
				id={ID}
			[/criteria]
			value={VALUE}
		[/goal]
	[/modify_ai]
#enddef

#define S14_RITUAL_RUSH SIDE
	{MODIFY_AI_ADD_GOAL {SIDE} (
		[goal]
