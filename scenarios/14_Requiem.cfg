			id=Caror
		[/scroll_to_unit]

		{SPEAK Haralin _"ТЕСТ s14_face_to_face"}
		{SPEAK Caror _"ТЕСТ s14_face_to_face"}

		###############
		## ПРОКЛЯТТЯ ##
		###############
		[lua]
			code=<<
				local h = wesnoth.units.find_on_map{ id = "Haralin" }[1]
				local c = wesnoth.units.find_on_map{ id = "Caror" }[1]
				local opposite = { n = "s", s = "n", ne = "sw", sw = "ne", nw = "se", se = "nw" }
				local toward = wesnoth.map.get_relative_dir(h.x, h.y, c.x, c.y)
				local away = opposite[toward]
				local path = {}
				local x, y = h.x, h.y
				for i = 1, 3 do
					local nxt = wesnoth.map.get_direction(x, y, away)
					x, y = nxt.x, nxt.y
					if not wesnoth.current.map:on_board(x, y) then break end
					table.insert(path, { x, y })
				end
				local n, lx, ly = 0, h.x, h.y
				for i = #path, 1, -1 do
					local px, py = path[i][1], path[i][2]
					local cost = h:movement_on(wesnoth.current.map[{ px, py }])
					if not wesnoth.units.get(px, py) and cost < 99 then
						n, lx, ly = i, px, py
						break
					end
				end
				wml.variables.s14_throw_n = n
				wml.variables.s14_throw_x = lx
				wml.variables.s14_throw_y = ly
				wml.variables.s14_throw_face = toward
				wml.variables.s14_h_x = h.x
