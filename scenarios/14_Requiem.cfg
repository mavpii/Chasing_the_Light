			description= _ "Death of Caror (Lenvan will bring him back with the Ruby of Fire)"
			condition=lose
		[/objective]
		[objective]
			#po: Флот західняків причалює до мису (хід $s14_fleet_arrival)
			description= _ "The Wesfolk fleet docks at the cape (turn $s14_fleet_arrival)"
