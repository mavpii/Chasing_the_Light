			[/have_unit]
		[/filter_condition]

		[lua]
			code=<<
				local wp = { {31,44}, {27,44}, {23,44}, {19,44}, {15,44}, {12,43} }
				local escort = { {"s14_ship_2", 1, 0}, {"s14_ship_3", 1, -1}, {"s14_ship_4", 2, 1}, {"s14_ship_5", 3, 0}, {"s14_ship_6", 3, -1}, {"s14_ship_7", 4, 1} }
				local ship = wesnoth.units.find_on_map{ id = "s14_flagship" }[1]
				local t0 = wml.variables.s14_fleet_start
				local t1 = wml.variables.s14_fleet_arrival
				local i = math.floor((wesnoth.current.turn - t0) * (#wp - 1) / (t1 - t0)) + 1
				if i > #wp then i = #wp end
				if i < 1 then i = 1 end
				local p = wp[i]
				if ship.x ~= p[1] or ship.y ~= p[2] then
					wml.fire("move_unit", { id = "s14_flagship", to_x = p[1], to_y = p[2], fire_event = false })
					for _, e in ipairs(escort) do
						local u = wesnoth.units.find_on_map{ id = e[1] }[1]
						if u then
							local tx, ty = wesnoth.paths.find_vacant_hex(p[1] + e[2], p[2] + e[3], u)
							wml.fire("move_unit", { id = e[1], to_x = tx, to_y = ty, fire_event = false })
						end
					end
				end
				wml.variables.s14_fleet_docked = (i == #wp)
			>>
		[/lua]

