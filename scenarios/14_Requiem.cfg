				local moved = {}
				for _, r in ipairs(ring) do
					local u = wesnoth.units.get(r[1], r[2])
					if u and not (u.side == 5 and u.type == r[3]) then
						u:extract()
						table.insert(moved, u)
					end
				end
				for _, r in ipairs(ring) do
					local u = wesnoth.units.get(r[1], r[2])
					if u then
						u.role = "s14_ring"
					else
						wml.fire("unit", { type = r[3], side = 5, x = r[1], y = r[2], role = "s14_ring", animate = true, upkeep = "loyal", facing = "n" })
					end
				end
				for _, u in ipairs(moved) do
					local nx, ny = wesnoth.paths.find_vacant_hex(14, 33, u)
					u:to_map(nx, ny)
				end
			>>
