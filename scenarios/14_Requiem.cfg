			carryover_percentage=40
		[/gold_carryover]
	[/objectives]
#enddef

#define S14_EDVAR_MUST_LIVE
	[objective]
		#po: Смерть Графа Едвара
		description= _ "Death of Count Edvar"
		condition=lose
	[/objective]
#enddef

#define S14_OBJECTIVES_RITUAL SILENT
	{S14_OBJECTIVES {SILENT} (
		[objective]
			#po: Проведіть ритуал: Граф Едвар на моноліті, Файсім поруч, ще $s14_ritual_left ходів поспіль
			description= _ "Perform the ritual: Count Edvar on the monolith, Faisim next to him, $s14_ritual_left more turns in a row"
			condition=win
		[/objective]
		{S14_EDVAR_MUST_LIVE}
		[note]
			#po: Ритуал просувається в кінці вашого ходу. Якщо Граф зійде з моноліта або Файсім відійде, лічба почнеться спочатку.
			description= _ "The ritual advances at the end of your turn. If the Count leaves the monolith or Faisim steps away, it starts over."
		[/note]
		[note]
			#po: Поки моноліт не обернено, Карор виходить із замку та б’ється сам. Якщо він упаде від відповіді на власну атаку, то відступить до замку.
			description= _ "Until the monolith is turned, Caror leaves his castle to fight. If he falls to a counterattack on his own attack, he retreats to his castle."
		[/note]
		[note]
			#po: Щойно почнеться ритуал, вороги отримають додаткове золото.
			description= _ "As soon as the ritual begins, the enemy receives extra gold."
		[/note]
	)}
#enddef

#define S14_OBJECTIVES_SEAL SILENT
	{S14_OBJECTIVES {SILENT} (
		[objective]
			#po: Підведіть Гараліна впритул до Карора, щоб завершити печать
			description= _ "Bring Haralin next to Caror to complete the seal"
			condition=win
		[/objective]
		[note]
			#po: Моноліт прикував Карора до замку. Він не може ні рухатися, ні атакувати, але все ще вербує.
			description= _ "The monolith has chained Caror to his castle. He can neither move nor attack, but he still recruits."
		[/note]
	)}
#enddef

