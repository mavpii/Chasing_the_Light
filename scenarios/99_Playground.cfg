#textdomain wesnoth-ctl
[lua]
		code=<< journeylog.register_scenario_wml(...) >>
		[args]
			id=99_Playground
			title=_"Playground"
			abbrev="CtL"
		[/args]
	[/lua]

[scenario]
    id=99_Playground
    name= _ "Playground"
    map_data="{~add-ons/Chasing_the_Light/maps/99_Playground.map}"

    victory_when_enemies_defeated=yes
    disallow_recall=yes
    carryover_percentage=0

    [side]
        side=1
        id,defeat_condition=Daeola,never

        [unit]
            name= _ "Daeola"
            unrenamable=yes
            canrecruit=no
            id=Daeola_Copy
            type=Daeola_L2_Mage
		    experience=49
            [status]
                unhealable=yes
            [/status]
            side=1
            x=8
            y=7
            {IS_HERO}
        [/unit]

        gold=10000
        {INCOME 0 0 0}
        controller=human
        team_name=Islefolk
        shroud=no
        fog=no
        {FLAG_VARIANT long}
        user_team_name=_"Islefolk"
    [/side]

    [side]
        side=2
        {GOLD 0 0 0}
        {INCOME 0 0 0}
        controller=ai
        color=white
        shroud=no
        fog=no
        team_name=Elementals
        user_team_name=_ "Elementals"
        [ai]
            aggression=1.0
        [/ai]
    [/side]

    [side]
        side=3

        {GOLD 0 0 0}
        {INCOME 0 0 0}
        color=red
        controller=ai
        team_name=Islefolk
        shroud=no
        fog=no
        {FLAG_VARIANT long}
        user_team_name=_"Islefolk"
        [ai]
            passive_leader=yes
        [/ai]
    [/side]

    #prestart
    [event]
        name=prestart

        [label]
            x=11
            y=9
            text= "Test: Free Pick (unlocked only)"
        [/label]

        [label]
            x=10
            y=9
            text= "Test: Free Assign (full catalogue)"
        [/label]
        [unit]
            id=Haralin_Copy
            type=Haralin_L2
			experience=59
            side=1
            x=10
            y=4
			{IS_HERO}
        [/unit]

        [unit]
            id=mage_3
            type=Mage Healer
            side=3
            x=7
            y=4
        [/unit]

        [unit]
            id=mage_4
            type=Mage
            gender=female
            side=3
            x=6
            y=2
        [/unit]

        [unit]
            id=mage_5
            type=Mage
            side=3
            x=4
            y=3
        [/unit]

        [unit]
            id=mage_6
            type=Mage
            gender=female
            side=1
            x=1
            y=7
        [/unit]

        [unit]
            id=mage_7
            type=Mage
            side=1
            x=2
            y=4
        [/unit]

        [unit]
            id=mage_8
            type=Mage
            gender=female
            side=3
            x=4
            y=8
        [/unit]

        [unit]
            id=quintain1
            type=Quintain
            side=2
            x=9
            y=11
        [/unit]

        [unit]
            id=quintain2
            type=Quintain
			canrecruit=yes
            side=2
            x=8
            y=13
        [/unit]

        [unit]
            id=quintain3
            type=Quintain
            side=2
            x=14
            y=10
        [/unit]

        [unit]
            id=proto_netcaster
            type=Wesfolk Netcaster Prototype
            side=1
            x=1
            y=13
        [/unit]

        [unit]
            id=proto_champion
            type=Wesfolk Champion Prototype
            side=1
            x=1
            y=12
        [/unit]

        [unit]
            id=proto_fighter
            type=Wesfolk Fighter Prototype
            side=1
            x=3
            y=13
        [/unit]

        [unit]
            id=proto_taskmaster
            type=Wesfolk Taskmaster Prototype
            side=1
            x=3
            y=12
        [/unit]

        [unit]
            id=proto_flagellant
            type=Wesfolk Flagellant Prototype
            side=1
            x=3
            y=11
        [/unit]

        [unit]
            id=proto_reaper
            type=Wesfolk Reaper Prototype
            side=1
            x=4
            y=12
        [/unit]

        [modify_unit]
            [filter]
                side=2,3
            [/filter]
            ai_special=guardian
        [/modify_unit]

        [modify_unit]
            [filter]
                side=2,3
            [/filter]
            moves=0
            max_moves=0
        [/modify_unit]
		
		[assign_caster]
		[filter]
		id=Daeola_Copy
		[/filter]
		spell_group_1 =   skill_magic_missile, skill_swap, skill_empathy
		spell_group_2 =   skill_disattack, skill_healing, skill_ward, skill_interdict
		spell_group_3 =   skill_dazzle, skill_blindflash, skill_disheal, skill_illuminate
		spell_group_4 =   skill_lightbeam, skill_redemption, skill_smite, skill_massheal
		unlocked_spells = skill_magic_missile, skill_swap, skill_empathy, skill_disattack, skill_healing, skill_ward, skill_interdict, skill_dazzle, skill_blindflash, skill_disheal, skill_illuminate, skill_lightbeam, skill_redemption, skill_smite, skill_massheal
	    equipped_spells =  skill_magic_missile, skill_disattack, skill_dazzle, skill_lightbeam
		[/assign_caster]
		
		[assign_caster]
		[filter]
		id=Haralin_Copy
		[/filter]
		spell_group_1 = skill_magic_blast,  skill_summon,           skill_shield,         skill_stasis,        skill_panacea
		spell_group_2 = skill_levitate,     skill_chill_touch,        skill_mnemonic,       skill_find_familiar, skill_bend
		spell_group_3 = skill_fireball2,    skill_glamour,          skill_enervate,       skill_blizzard,      skill_counterspell, skill_polymorph
		spell_group_4 = skill_dancing_daggers,  skill_contingency
		spell_group_5 = skill_lightning,        skill_time_dilation,  skill_cataclysm
		unlocked_spells = skill_polymorph, skill_polymorph_lizard, skill_polymorph_orc, skill_magic_blast,  skill_summon, skill_summon_mud, skill_summon_rock, skill_shield, skill_chill_touch,  skill_levitate, skill_mnemonic, skill_fireball2, skill_glamour, skill_bend, skill_bend_earth
		equipped_spells = skill_summon, skill_bend, skill_polymorph
		[/assign_caster]
		
		{CASTER_STATUS id=Daeola_Copy,Haralin_Copy yes}

		[unit]
			id=enemy_caster
			type=Mage
			side=2
			x=8
			y=4
			experience=48
			ai_special=guardian
			moves=0
			max_moves=0
		[/unit]
		[assign_caster]
			[filter]
			id=enemy_caster
			[/filter]
			spell_group_1   = skill_disattack
			spell_group_2   = skill_shield
			unlocked_spells = skill_disattack, skill_shield
			equipped_spells = skill_disattack, skill_shield
		[/assign_caster]
		{CASTER_AI 2 110000}

		[label]
			x=8
			y=4
			text= "Enemy AI caster: end turn"
		[/label]
    [/event]

	[event]
        name=moveto
        [filter]
            x,y=11,9
        [/filter]

        [message]
            speaker=narrator
            message= _ "Free Pick test: choose freely, but only from unlocked spells."
        [/message]

		{CASTER_FREE_UNLOCKED id=Haralin_Copy yes}
		{RESELECT_SKILLS id=Haralin_Copy}
    [/event]
	[event]
        name=moveto
        [filter]
            x,y=10,9
        [/filter]

        [message]
            speaker=narrator
            message= _ "Free Assign test: pick ANY spell from the whole catalogue."
        [/message]

		{CASTER_FREE_ASSIGN id=Daeola_Copy yes}
		{RESELECT_SKILLS id=Daeola_Copy}
    [/event]
[/scenario]