#textdomain wesnoth-ctl
[lua]
		code=<< journeylog.register_scenario_wml(...) >>
		[args]
			id=99_Playground
			title=_"Playground"
			abbrev="CtL"
		[/args]
	[/lua]

[scenario]
    id=99_Playground
    name= _ "Playground"
    map_data="{~add-ons/Chasing_the_Light/maps/99_Playground.map}"

    victory_when_enemies_defeated=yes
    dissalow_recall=yes
    carryover_percentage=0

    [side]
        side=1
        id,defeat_condition=Daeola,never

        [unit]
            name= _ "Daeola"
            unrenamable=yes
            canrecruit=no
            id=Daeola_Copy
            type=Daeola_L1_Mage
		    experience=49
            [status]
                unhealable=yes
            [/status]
            side=1
            x=8
            y=7
            {IS_HERO}
        [/unit]

        gold=10000
        {INCOME 0 0 0}
        controller=human
        team_name=Islefolk
        shroud=no
        fog=no
        {FLAG_VARIANT long}
        user_team_name=_"Islefolk"
    [/side]

    [side]
        side=2
        {GOLD 0 0 0}
        {INCOME 0 0 0}
        controller=ai
        color=white
        shroud=no
        fog=no
        team_name=Elementals
        user_team_name=_ "Elementals"
        [ai]
            aggression=1.0
        [/ai]
    [/side]

    [side]
        side=3

        {GOLD 0 0 0}
        {INCOME 0 0 0}
        color=red
        controller=ai
        team_name=Islefolk
        shroud=no
        fog=no
        {FLAG_VARIANT long}
        user_team_name=_"Islefolk"
        [ai]
            passive_leader=yes
        [/ai]
    [/side]

    #prestart
    [event]
        name=prestart

        [label]
            x=8
            y=9
            text= "Unlock TRSS spells!"
        [/label]

        [label]
            x=11
            y=9
            text= "Test: Free Pick (unlocked only)"
        [/label]

        [label]
            x=10
            y=9
            text= "Test: Free Assign (full catalogue)"
        [/label]

        [label]
            x=13
            y=9
            text= "Test: Lock/Unlock subskills"
        [/label]

        [label]
            x=15
            y=9
            text= "Test: Back to group menu"
        [/label]

        [label]
            x=16
            y=9
            text= "Test: Choose Later flag"
        [/label]

        [label]
            x=12
            y=10
            text= "Test: Cast Spell cmd (Shield)"
        [/label]

        [label]
            x=13
            y=10
            text= "Test: Cast Targeted cmd (Summon)"
        [/label]

        [unit]
            id=Haralin_Copy
            type=Haralin_L2
			experience=59
            side=1
            x=10
            y=4
			{IS_HERO}
        [/unit]

        [unit]
            id=mage_3
            type=Mage Healer
            side=3
            x=7
            y=4
        [/unit]

        [unit]
            id=mage_4
            type=Mage
            gender=female
            side=3
            x=6
            y=2
        [/unit]

        [unit]
            id=mage_5
            type=Mage
            side=3
            x=4
            y=3
        [/unit]

        [unit]
            id=mage_6
            type=Mage
            gender=female
            side=1
            x=1
            y=7
        [/unit]

        [unit]
            id=mage_7
            type=Mage
            side=1
            x=2
            y=4
        [/unit]

        [unit]
            id=mage_8
            type=Mage
            gender=female
            side=3
            x=4
            y=8
        [/unit]

        [unit]
            id=quintain1
            type=Quintain
            side=2
            x=9
            y=11
        [/unit]

        [unit]
            id=quintain2
            type=Quintain
			canrecruit=yes
            side=2
            x=8
            y=13
        [/unit]

        [unit]
            id=quintain3
            type=Quintain
            side=2
            x=14
            y=10
        [/unit]

        [modify_unit]
            [filter]
                side=2,3
            [/filter]
            ai_special=guardian
        [/modify_unit]

        [modify_unit]
            [filter]
                side=2,3
            [/filter]
            moves=0
            max_moves=0
        [/modify_unit]
		
		[assign_caster]
		[filter]
		id=Daeola_Copy
		[/filter]
		spell_group_1 =   skill_magic_missile, skill_disattack
		spell_group_2 =   skill_swap, skill_levitate
		spell_group_3 =   skill_disheal, skill_ward, skill_empathy
		unlocked_spells = skill_magic_missile, skill_disattack, skill_swap, skill_levitate, skill_disheal, skill_ward, skill_empathy
	    equipped_spells =  skill_magic_missile, skill_swap, skill_ward
		[/assign_caster]
		
		[assign_caster]
		[filter]
		id=Haralin_Copy
		[/filter]
		spell_group_1 = skill_magic_blast,  skill_summon,           skill_shield,         skill_stasis,        skill_panacea
		spell_group_2 = skill_levitate,     skill_chill_touch,        skill_mnemonic,       skill_find_familiar, skill_bend
		spell_group_3 = skill_fireball2,    skill_glamour,          skill_enervate,       skill_blizzard,      skill_counterspell, skill_polymorph
		spell_group_4 = skill_dancing_daggers,  skill_illusion,       skill_contingency
		spell_group_5 = skill_lightning,        skill_time_dilation,  skill_cataclysm
		unlocked_spells = skill_polymorph, skill_polymorph_lizard, skill_polymorph_orc, skill_magic_blast,  skill_summon, skill_summon_mud, skill_summon_rock, skill_shield, skill_chill_touch,  skill_levitate, skill_mnemonic, skill_fireball2, skill_glamour, skill_bend, skill_bend_earth
		equipped_spells = skill_summon, skill_bend, skill_polymorph
		[/assign_caster]
		
		{CASTER_STATUS id=Daeola_Copy,Haralin_Copy yes}

		# --- TEST: Faisim — Astral Arms (conjure weapon, subskills) ---
		# Double-click Faisim and pick a weapon form (Astral / Blade / Spear / Mace /
		# Daggers). Each grants a melee attack with its own type + trick;
		# only one conjured weapon at a time.
		[unit]
			id=Faisim_Test
			type=Faisim Disguised
			name=_"Faisim"
			side=1
			x=6
			y=6
			{IS_HERO}
		[/unit]
		[assign_caster]
			[filter]
			id=Faisim_Test
			[/filter]
			spell_group_1   = skill_astral_arms
			spell_group_2   = skill_shadowstep
			spell_group_3   = skill_phantom_flurry
			spell_group_4   = skill_astral_chains
			spell_group_5   = skill_haste
			unlocked_spells = skill_astral_arms, skill_shadowstep, skill_phantom_flurry, skill_astral_chains, skill_haste
			equipped_spells = skill_astral_arms, skill_shadowstep, skill_phantom_flurry, skill_astral_chains, skill_haste
		[/assign_caster]
		{CASTER_STATUS id=Faisim_Test yes}
		{CASTER_MAX_CASTS id=Faisim_Test 4}
		[label] x=6 y=6 text= "Faisim: Astral Arms + Group 3"
		[/label]

		# --- TEST: Faisim — Groups 2 (wards) & 4 (soul/flame) ---
		# Double-click to cast: Veil Ward / Bloodbound Vigor / Soul Knit / Phantom
		# Guard (self buffs, toggle off by recasting); Soul Siphon / Oblivion /
		# Void Rift (TRSS — click a target/hex); Phylactery (toggle full-heal/turn).
		[unit]
			id=Faisim_Test2
			type=Faisim Disguised
			name=_"Faisim (G2/G4)"
			side=1
			x=5
			y=8
			experience=119
			{IS_HERO}
		[/unit]
		[assign_caster]
			[filter]
			id=Faisim_Test2
			[/filter]
			spell_group_1 = skill_veil_ward
			spell_group_2 = skill_bloodbound_vigor
			spell_group_3 = skill_soul_knit
			spell_group_4 = skill_phantom_guard
			spell_group_5 = skill_soul_siphon
			spell_group_6 = skill_oblivion
			spell_group_7 = skill_void_rift
			spell_group_8 = skill_phylactery
			unlocked_spells = skill_veil_ward, skill_bloodbound_vigor, skill_soul_knit, skill_phantom_guard, skill_soul_siphon, skill_oblivion, skill_void_rift, skill_phylactery
			equipped_spells = skill_veil_ward, skill_bloodbound_vigor, skill_soul_knit, skill_phantom_guard, skill_soul_siphon, skill_oblivion, skill_void_rift, skill_phylactery
		[/assign_caster]
		{CASTER_STATUS id=Faisim_Test2 yes}
		{CASTER_MAX_CASTS id=Faisim_Test2 6}
		[label] x=5 y=8 text= "Faisim: Groups 2 & 4"
		[/label]

		# --- TEST: autonomous adaptive AI caster (HOSTILE side 2) ---
		# An enemy mage on side 2 (Elementals — hostile to the player) equipped with
		# TWO spells: disattack (ranged arcane damage) and shield (self buff).
		# {CASTER_AI 2} lets it look at its own equipped spells and pick the most
		# useful one each turn (ai_profiles.lua). Haralin_Copy (side 1) sits at 10,4
		# (2 hexes away), so the enemy zaps him with disattack (damage out-values a
		# self shield while a target is in range), paying 8 XP per cast. END YOUR
		# TURN to watch it choose and cast on the player on its own.
		[unit]
			id=enemy_caster
			type=Mage
			side=2
			x=8
			y=4
			experience=48
			ai_special=guardian
			moves=0
			max_moves=0
		[/unit]
		[assign_caster]
			[filter]
			id=enemy_caster
			[/filter]
			spell_group_1   = skill_disattack
			spell_group_2   = skill_shield
			unlocked_spells = skill_disattack, skill_shield
			equipped_spells = skill_disattack, skill_shield
		[/assign_caster]
		{CASTER_AI 2 110000}

		[label]
			x=8
			y=4
			text= "Enemy AI caster: end turn"
		[/label]
    [/event]
	
    [event]
        name=moveto
        [filter]
            x,y=8,9
        [/filter]
		
		[unlock_milestone]
		milestone=daeola_oldwood
		notification=yes
	[/unlock_milestone]
	
	[unlock_milestone]
		milestone=priorities_end
		notification=yes
	[/unlock_milestone]
		
		{CASTER_STATUS id=Daeola_Copy,Haralin_Copy yes}
		{RESELECT_SKILLS id=Haralin_Copy}

		# --- TEST: нові апгрейди ---
		# Haralin_Copy отримує вільний reselect і 3 касти за хід
		#{CASTER_RESELECT id=Haralin_Copy yes}
		{CASTER_MAX_CASTS id=Haralin_Copy 3}
		# Daeola_Copy — тільки мультикаст (2), без reselect
		{CASTER_MAX_CASTS id=Daeola_Copy 2}
		#{CASTER_FREE_ASSIGN (id=Haralin_Copy) yes}
    [/event]
	
	# --- TEST: Free Pick (free_unlocked) ---
	# Крок на 11,9 вмикає режим вільного вибору, обмежений РОЗБЛОКОВАНИМИ
	# заклями Haralin_Copy, і одразу відкриває діалог вибору.
	# Очікувано в пікері:
	#   • присутні всі розблоковані закляття — навіть ті, яких НЕМАЄ в його групах
	#     (skill_polymorph_lizard, skill_summon_mud, skill_summon_rock, skill_bend_earth);
	#   • відсутні заблоковані закляття з його груп
	#     (skill_stasis, skill_panacea, skill_enervate, skill_cataclysm тощо).
	[event]
        name=moveto
        [filter]
            x,y=11,9
        [/filter]

        [message]
            speaker=narrator
            message= _ "Free Pick test: choose freely, but only from unlocked spells."
        [/message]

		{CASTER_FREE_UNLOCKED id=Haralin_Copy yes}
		{RESELECT_SKILLS id=Haralin_Copy}
    [/event]

	# --- TEST: Free Assign (full catalogue) ---
	# Крок на 10,9 вмикає вільний вибір з УСІХ заклять каталогу для Daeola_Copy.
	# Очікувано: у пікері присутні всі закляття гри, а не лише розблоковані.
	[event]
        name=moveto
        [filter]
            x,y=10,9
        [/filter]

        [message]
            speaker=narrator
            message= _ "Free Assign test: pick ANY spell from the whole catalogue."
        [/message]

		{CASTER_FREE_ASSIGN id=Daeola_Copy yes}
		{RESELECT_SKILLS id=Daeola_Copy}
    [/event]

	# --- TEST: Lock / Unlock subskills ---
	# Крок на 13,9 блокує підзакляття "Stone" і розблоковує "Water" у Haralin_Copy.
	# Очікувано (подвійний клік по Haralin → режим кастування, закляття Summon):
	#   • "Stone" тепер показується як "Locked";
	#   • "Water" тепер показується звичайно (8g 8xp).
	[event]
        name=moveto
        [filter]
            x,y=13,9
        [/filter]

		{LOCK_SPELL id=Haralin_Copy skill_summon_rock}
		{UNLOCK_SPELL id=Haralin_Copy skill_summon_water}

        [message]
            speaker=narrator
            message= _ "Locked Stone, unlocked Water. Double-click Haralin to check the Summon subskills."
        [/message]
    [/event]

	# --- TEST: Back to group menu (disable free modes) ---
	# Крок на 15,9 вимикає обидва вільні режими — діалог вибору повертається до
	# звичайних випадаючих меню по групах.
	[event]
        name=moveto
        [filter]
            x,y=15,9
        [/filter]

		{CASTER_FREE_ASSIGN id=Haralin_Copy no}
		{CASTER_FREE_UNLOCKED id=Haralin_Copy no}

        [message]
            speaker=narrator
            message= _ "Free modes disabled: back to the per-group menu selection."
        [/message]

		{RESELECT_SKILLS id=Haralin_Copy}
    [/event]

	# --- TEST: Choose Later flag ---
	# Крок на 16,9 відкриває вибір для Daeola_Copy. Натисни "Choose Later" — має
	# виставитись wait_to_select_spells=yes, і подвійний клік по Daeola знову
	# відкриє РЕЖИМ ВИБОРУ (а не кастування), поки вибір не підтверджено.
	[event]
        name=moveto
        [filter]
            x,y=16,9
        [/filter]

        [message]
            speaker=narrator
            message= _ "Choose Later test: click 'Choose Later', then double-click Daeola — it should reopen in selection mode."
        [/message]

		{RESELECT_SKILLS id=Daeola_Copy}
    [/event]

	# --- TEST: Cast Spell (command-driven, non-TRSS) ---
	# Крок на 12,10 змушує Haralin_Copy накласти Shield на себе через WML-тег,
	# без діалогу. (free=yes — без витрат, через макрос CAST_SPELL_FREE.)
	[event]
        name=moveto
        [filter]
            x,y=12,10
        [/filter]

        [message]
            speaker=narrator
            message= _ "Command cast: Haralin casts Shield on himself via [cast_spell]."
        [/message]

		{CAST_SPELL_FREE id=Haralin_Copy skill_shield}
    [/event]

	# --- TEST: Cast Targeted Spell (command-driven, TRSS) ---
	# Крок на 13,10 змушує Haralin_Copy призвати Mudcrawler на гекс 16,10 через
	# WML-тег, без інтерактивного вибору цілі.
	[event]
        name=moveto
        [filter]
            x,y=13,10
        [/filter]

        [message]
            speaker=narrator
            message= _ "Command cast: Haralin summons a Mudcrawler at 16,10 via [cast_targeted_spell]."
        [/message]

		{CAST_TARGETED_SPELL_FREE id=Haralin_Copy skill_summon_mud 14 9}
    [/event]

	[event]
        name=moveto
        [filter]
            x,y=8,8
        [/filter]
		
				[message]
		type=Mudcrawler,Giant Mudcrawler
		message= _"Буль-буль"
		[/message]
		
        [message]
            speaker=narrator
            message= _ "No spells unlocked!"
        [/message]

        [refresh_skills]
		id=Haralin
		[/refresh_skills]
    [/event]
[/scenario]