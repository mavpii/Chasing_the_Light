#textdomain wesnoth-ctl
[scenario]
    id=08_Quiescence
	#po: Спокій
    name= _ "Quiescence"
    map_data="{~add-ons/Chasing_the_Light/maps/08_Quiescence.map}"
	{UNDERGROUND}
	
	turns=-1
	carryover_percentage=0
    victory_when_enemies_defeated=no
	dissalow_recall=yes
	theme=Cutscene
	next_scenario=09_New_Journey

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg knolls.ogg} ##можливо замінити, бо тон сценарію тепер не той
	
	[story]
		[part]
		    story= _ "Як тільки усі маги та солдати опинилися всередині копальні, Гаралін одразу зруйнував вхід, щоб західняки з мерцями не мали можливості переслідувати їх. Далі він наказав усім залишатися на місці, пояснивши, що 'одержимий' Граф Чорнотопу може бути вкрай небезпечним, після чого поспішно подався в печерні глибини; наодинці, щоб ніхто не дізнався не дізнався про існування Голосу, якщо це й справді справа рук цієї істоти."
	       {CTL_GREEN_ISLE_BIGMAP}
			{OLD_JOURNEY_07}
		[/part]
    [/story]
	
	{CTL_GI_TRACK {JOURNEY_08} }
	
	##sides
    [side]
        side=1
        id,defeat_condition=haralin,never
		shroud=yes
		fog=no
        controller=human
        team_name=Islefolk
		{GOLD 60 50 40}
        {FLAG_VARIANT long}
        user_team_name=_"Haralin's Squad"
    [/side]
	
	[side]
        side=2
		color=red
		hidden=yes
		controller=ai
        team_name=Scarhane
		{FLAG_VARIANT long}
		#po: Захисники Скархейну
        user_team_name=_ "Defenders of Scarhane"
    [/side]

    [side]
        side=3
		id=voice
		color=white
		controller=ai
		hidden=yes
        team_name=Voice
		{GOLD 100 125 150}
        {FLAG_VARIANT undead}
		[ai]
            leader_aggression=1
        [/ai]
    [/side]
	
	[side]
        side=4
		color=white
		controller=null
		hidden=yes
        team_name=Voice
        {FLAG_VARIANT undead}
    [/side]

    ##prestart
    [event]
        name=prestart
		
		[disallow_end_turn][/disallow_end_turn]
		
		{RECALL_XY haralin 39 5}
		{MODIFY_UNIT id=haralin facing sw}
		
		[hide_unit][/hide_unit]

		[scroll_to]
		x,y=42,1
		[/scroll_to]
		
		{CASTER_STATUS id=haralin false}
		
		{VARIABLE is_haralin_free_move _"true"}
	
    [/event]

    ##start 
	[event]
        name=start
		
		[move_unit_fake]
	    type=Haralin_L2
		side=1
	    x=43,42,40,40,40,39
		y=1,1,2,3,4,5
	    [/move_unit_fake]
		
		[unhide_unit][/unhide_unit]
		
		[objectives]
		    [objective]
                description= _"Знайдіть Графа Чорнотопу"
                condition=win
            [/objective]
			[objective]
                description= _"Death of Haralin"
                condition=lose
            [/objective]
            [gold_carryover]
                bonus=no
                carryover_percentage=0
            [/gold_carryover]
			[note]
                description= _"Це останній сценарій глави 'Internal Doubts'"
            [/note]
        [/objectives]
		
	[/event]
	
	##переписати до внутрішнього діалогу
	##1st monolog event
    [event]
    name=moveto
    [filter]
        x=33-37
        y=5-9
    [/filter]
        {SPEAK haralin _"Як же незвично... Після стількох років не відчувати присутності того дивного голосу в своїй голові, наче давно втрачена воля різко повернулася до мене."} 
    [/event]
    
    ##2st monolog event
    [event]
    name=moveto
    [filter]
        x=28-32
        y=7-10
    [/filter]
        {SPEAK haralin _"Проте мені знайоме це відчуття — воно виникало завжди, коли поруч зі мною була Даеола та Голос одразу ж перетворювався на тихий нерозбірливий гомін. Чи через це <i>воно</i> попереджувало не брати мою ученицю в цю подорож?"}
    [/event]
    
    ##3st monolog event
    [event]
    name=moveto
    [filter]
    x=23-27
    y=7-12
    [/filter]
        {SPEAK haralin _"Невже вона настільки обдарована магією, що сама її присутність здатна..? Проте нехай, зараз не до цього. Що я збираюся робити, коли наздожену Графа Чорнотопу та <i>те, що оволоділо ним</i>? Бачить Світло, я не знаю жодних заклять, які могли б мені допомогти."}
    [/event]
	
	##voice event part1
	[event]
	name=moveto
	[filter]
