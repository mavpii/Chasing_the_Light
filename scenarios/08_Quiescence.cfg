        x=33-37
        y=5-9
    [/filter]
        {SPEAK haralin _"Як же незвично... Після стількох років не відчувати присутності того дивного голосу в своїй голові, наче давно втрачена воля різко повернулася до мене."} 
    [/event]
    
    ##2st monolog event
    [event]
    name=moveto
    [filter]
        x=28-32
        y=7-10
    [/filter]
        {SPEAK haralin _"Проте мені знайоме це відчуття — воно виникало завжди, коли поруч зі мною була Даеола та Голос одразу ж перетворювався на тихий нерозбірливий гомін. Чи через це <i>воно</i> попереджувало не брати мою ученицю в цю подорож?"}
    [/event]
    
