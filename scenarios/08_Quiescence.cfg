	    id=Daeola
	    to_x=27
	    to_y=9
	    [/move_unit]
	    {SPEAK Daeola _"Ні-ні, навіть чути про це не хочу.. ... Невже дійсно це <i>я</i> маю вам казати, що ви поводитеся нерозсудливо та необачно!?.."}
	    {DELAY 600}
	    [move_unit]
	    id=Daeola
	    to_x=26
	    to_y=9
	    [/move_unit]
	    #Даеола має запропонувати свою допомогу. Перенести змінну розмови в кінець S7
	    {SPEAK Daeola _"Ще з печер Естену я помітила, що ви понад все переймаєтеся безпекою нашого загону і... мене, я помітила це. Однак прошу вас, ви не маєте битися наодинці, щоб захистити всіх, тому, будь ласка, дозвольте допомогти вам!"}
	    
	    [scroll_to_unit]
	    id=haralin
	    [/scroll_to_unit]
	    {SPEAK haralin _"(посміхнувся) Клянуся Світлом, все ж цієї подорожі було достатньо, щоб ти нарешті подорослішала, Даеоло — ти майже не схожа на те дурне дівчисько, що завдавало мені стільки клопоту в святилищі. І саме тому я не можу втратити, ні тебе, ні будь-кого іншого!"}
	    
	    {ANIMATE_UNIT id=haralin skill_bend_cast}
	    {QUAKE (rumble.ogg)}
	    {DELAY 50}
	    {MODIFY_TERRAIN Xue 20 12}
