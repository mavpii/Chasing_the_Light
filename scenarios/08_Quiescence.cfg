	#po: Ось ми й нарешті зустрілися, Гараліне... Чи відомо тобі, що сьогодні виповнилося рівно 34 роки з того злощасного дня, як прокляті західняки висадилися на Зелений Острів та розпочали свою війну проти людей Світла?
	{SPEAK voice _"So we finally met, Haralin... Do you know that it's been exactly 34 years since that fateful day when the damned Wesfolk landed on the Green Isle and started their war against the people of the Light?"} ##32 роки в кампанії і 2 до цього
	#po: (відсахується) Щ-що це... що ти таке?..
	{SPEAK Haralin _"(flinches) What... what are you?.."}
	#po: Що сталося, Гараліне? Певно не так ти уявляв собі посланця Світла, точно не як мертву та понівічену душу, чи не так?
	{SPEAK voice _"What happened, Haralin? Surely this isn't how you imagined the messenger of the Light, certainly not as a dead and tormented soul, am I right?"}
	#po: К-клянуся Світлом, ти не можеш бути посланцем Світла, <i>я</i> відчуваю це!
	{SPEAK Haralin _"Let Light be a witness, you can't be a messenger of Light, <i>I</i> can feel it!"}
	#po: Ти помиляєшся, Гараліне, тому що той, хто <i>не має хисту до магії</i>, не здатний відчувати такі речі. Певно, тебе це дивує — Гаралін Перший, найперший маг Зеленого Острову, насправді фальшивка, що не здатна відчути ні магію, ні її волю!
	{SPEAK voice _"You are wrong, Haralin, because those who have no talent for magic are incapable of feeling such things. This may surprise you — Haralin the First, the very first mage of the Green Isle, is in fact a fake, incapable of feeling either magic or its will!"}
	#po: Кожного разу, коли ти <i>відчував</i> небезпечу чи місця сили, Гараліне, хіба то не мій голос звучав у твоїй голові, хіба не мої слова вказували тобі вірний шлях усюди, куди б ти не пішов?
	{SPEAK voice _"Every time you felt danger or places of force, Haralin, wasn't it my voice that sounded in your head, weren't it my words that showed you the right path wherever you went?"}
	{MODIFY_UNIT (id=Haralin) facing se} {DELAY 500}
	{MODIFY_UNIT (id=Haralin) facing sw} {DELAY 500}
	#po: (хапається за голову) Прокляття... я помічав, що з моїм чуттям завжди було щось не те... воно працювало зовсім не так як в моїх учнів, але... як це взагалі можливо?...
	{SPEAK Haralin _"(grabbing his head) Damn... I noticed that there was always something wrong with my senses... they didn't work the same way as my students', but... how is that even possible?"}
	#po: Це надзвичайна рідкість, Гараліне, але часом трапляється таке, що на одне тіло припадає <i>дві душі</i>. Невідомо, що є причиною, проте в кінці-кінців залишається лише одна душа, яка бере повний контроль, а інша просто... засинає навіки...
	{SPEAK voice _"It's extremely rare, Haralin, but sometimes it happens that one body has <i>two souls</i>. The reason for this is unknown, but in the end only one soul remains, taking complete control, while the other simply... falls asleep forever..."}
	#Я... я взагалі нічого не розумію... Якщо ти й справді моя <i>Друга Душа</i>, чому ж ти не спиш вічним сном?
	{SPEAK Haralin _"I... I don't get it... If you're indeed my <i>Second Soul</i>, why aren't you in eternal sleep?"}
	{MODIFY_UNIT (id=voice) name _"Second Soul"}
	#po: Від тебе й не очікувалося розуміння, Гараліне, тож просто знай: 34 роки тому щось пробудило мене, коли щось назвичайно могутнє прибуло з-за Великого Океану, з далекого Заходу.
