	    	canrecruit=yes
            [modifications]
                {TEAM_COLOR_OVERRIDE (id=Edvar) purple}
            [/modifications]
	    [/unit]
	    {DELAY 500}
		#po: Ця подорож, святилище та й навіть вивчення магії — до всього цього мене привів хтось чи <i>щось</i>, наче жодне моя дія не мала значення. Клянуся Світлом, понад усе на світі я й справді прагну, щоб усіх проклятих західняків було знищено, проте... Чому я не йду своїм власним шляхом?
	    {SPEAK Haralin _"This journey, the temple and even the studying of magic — someone or <i>something</i> led me to all of this, as if none of my actions ever mattered. Let Light be a witness, I truly desire the death of all the damned Wesfolk, but... Why am I not chasing my own path?"}
	    {DELAY 500}
	    [move_unit]
	    id=Haralin
	    to_x=15
	    to_y=13
		fire_event=yes
	    [/move_unit]
	
