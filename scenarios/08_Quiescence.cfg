	    [put_to_recall_list]
	    id=Daeola
	    [/put_to_recall_list]
	    [redraw][/redraw]
	    
        {DELAY 1000}
	    {MODIFY_UNIT id=haralin facing sw} {DELAY 500}
	    {SPEAK haralin _"Мушу зізнатися, що я не хочу робити цього наодинці, не хочу ризикувати своїм життям, знаючи, що нікого нема поруч. Я не маю вибору та мушу це зробити, бо це якось пов'язано з Голосом, проте... Чи взагалі мав я колись вибір?"}
	    {DELAY 500}
	    [move_unit]
	    id=haralin
	    to_x=18
	    to_y=13
		fire_event=yes
	    [/move_unit]
	    #spawn Count
	    [unit]
            side=2
            id=blackmore_king
            name=_"Count Edvar" 
            x,y=11,13
            unrenamable=yes	
            type=Royal Warrior
			facing=ne
	    	hitpoints=1
            experience=78
	    	canrecruit=yes
            [modifications]
                {TEAM_COLOR_OVERRIDE (id=blackmore_king) purple}
            [/modifications]
	    [/unit]
	    {DELAY 500}
	    {SPEAK haralin _"Ця подорож, святилище та й навіть вивчення магії — до всього цього мене привів хтось чи <i>щось</i>, наче жодне моя дія не мала значення. Клянуся Світлом, понад усе на світі я й справді прагну, щоб усіх проклятих західняків було знищено, проте... Чому я не йду своїм власним шляхом?"}
	    {DELAY 500}
	    [move_unit]
	    id=haralin
	    to_x=15
	    to_y=13
		fire_event=yes
	    [/move_unit]
	
	[/event]
	
