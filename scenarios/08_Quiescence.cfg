	{SPEAK voice _"Це надзвичайна рідкість, Гараліне, але часом трапляється таке, що на одне тіло припадає <i>дві душі</i>. Невідомо, що є причиною, проте в кінці-кінців залишається лише одна душа, яка бере повний контроль, а інша просто... засинає навіки..."}
