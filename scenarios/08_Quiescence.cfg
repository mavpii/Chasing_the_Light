	#po: Скажи мені, ім'ям Світла, навіщо ти розповідаєш все це? Немає жодної моєї вини в тому, що тобі <i>не пощастило</i>, як і жодному виправданню тому, що через твій вплив я не зміг врятувати батька, змарнував безліч років у святилищі і врешті-решт опинився тут!
