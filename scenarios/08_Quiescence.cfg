#textdomain wesnoth-ctl
{JOURNAL 08_Quiescence _"Quiescence" no}

[scenario]
    id=08_Quiescence
	#po: Спокій
    name= _ "Quiescence"
    map_data="{~add-ons/Chasing_the_Light/maps/08_Quiescence.map}"
	{UNDERGROUND}
	
	turns=-1
	carryover_percentage=0
    victory_when_enemies_defeated=no
	theme=Cutscene
	next_scenario=09_Stormvale

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg knolls.ogg} ##можливо замінити, бо тон сценарію тепер не той
	
	[story]
		[part]
		    #po: Як тільки усі маги та солдати опинилися всередині копальні, Гаралін одразу зруйнував вхід, щоб західняки з мерцями не мали можливості переслідувати їх. Далі він наказав усім залишатися на місці, пояснивши, що 'одержимий' Граф Чорнотопу може бути вкрай небезпечним, після чого поспішно подався в печерні глибини; наодинці, щоб ніхто не дізнався не дізнався про існування Голосу, якщо це й справді справа рук цієї істоти.
		    story= _ "As soon as all the mages and soldiers were inside the mine, Haralin immediately destroyed the entrance so that the Wesfolk and their undead couldn't pursue them. He then commanded everyone to stay where they were, explaining that the 'possessed' Count of Blackmore could be extremely dangerous, and then hastily made his way into the depths of the cave, alone, so that no one would learn of the existence of the Voice, if it was indeed the work of this entity."
	       {CTL_GREEN_ISLE_BIGMAP}
			{OLD_JOURNEY_07}
		[/part]
    [/story]
	
	{CTL_GI_TRACK {JOURNEY_08} }
	
	##sides
    [side]
        side=1
        id,defeat_condition=Haralin,never
		shroud=yes
		fog=no
        controller=human
        team_name=Islefolk
		{GOLD 60 50 40}
        {FLAG_VARIANT long}
        user_team_name=_"Haralin's Squad"
    [/side]
	
	[side]
        side=2
		color=islefolk
		controller=ai
		hidden=yes
        team_name=Scarhane
		{FLAG_VARIANT long}
		#po: Захисники Скархейну
        user_team_name=_ "Enemy Unknown"
    [/side]

    [side]
        side=3
		id=voice
		color=white
		controller=ai
        team_name=Voice
		{GOLD 100 125 150}
        {FLAG_VARIANT undead}
		[ai]
            leader_aggression=1
        [/ai]
		user_team_name=_ "Enemy Unknown"
    [/side]
	
	[side]
        side=4
		color=white
		controller=null
		hidden=yes
        team_name=Voice
        {FLAG_VARIANT undead}
    [/side]

    ##prestart
    [event]
        name=prestart
		
		[disallow_end_turn][/disallow_end_turn]
		
		{RECALL_XY Haralin 39 5}
		{MODIFY_UNIT id=Haralin facing sw}
		
		[hide_unit][/hide_unit]

		[scroll_to]
		x,y=42,1
		[/scroll_to]
		
		{CASTER_STATUS id=Haralin false}
		[if]
		[variable]
		name=Haralin_learn_Polymorph_Elite
		equals=true
		[/variable]
		[then]
		{UNLOCK_SPELL id=Haralin skill_polymorph,skill_polymorph_lizard,skill_polymorph_bear,skill_polymorph_orc}
		{EQUIP_SPELL id=Haralin skill_polymorph}
		[/then][/if]

		[if]
		[variable]
		name=Haralin_learn_Polymorph
		equals=true
		[/variable]
		[then]
		{UNLOCK_SPELL id=Haralin skill_polymorph,skill_polymorph_lizard,skill_polymorph_bear}
		{EQUIP_SPELL id=Haralin skill_polymorph}
		[/then][/if]
		
		{UNLOCK_SPELL id=Haralin skill_bend_water}
		
		{VARIABLE is_Haralin_free_move _"true"}
	
    [/event]

    ##start 
	[event]
        name=start
		
		[move_unit_fake]
	    type=Haralin_L2
		side=1
	    x=43,42,40,40,40,39
		y=1,1,2,3,4,5
	    [/move_unit_fake]
		
		[unhide_unit][/unhide_unit]
		
		[objectives]
		    [objective]
			    #po: Знайдіть Графа Чорнотопу
                description= _"Find Count of Blackmore"
                condition=win
            [/objective]
			[objective]
                description= _"Death of Haralin"
                condition=lose
            [/objective]
            [gold_carryover]
                bonus=no
                carryover_percentage=0
            [/gold_carryover]
			[note]
			#po: Це останній сценарій глави 'Internal Doubts'
                description= _"This is the final scenario of the chapter 'Internal Doubts'"
            [/note]
        [/objectives]
		
	[/event]
	
	##переписати до внутрішнього діалогу
	##1st monolog event
    [event]
    name=moveto
    [filter]
        x=33-37
        y=5-9
    [/filter]
	    #po: Як же незвично... Після стількох років не відчувати присутності того дивного голосу в своїй голові, наче давно втрачена воля різко повернулася до мене.
        {SPEAK Haralin _"How unusual... After so many years of not feeling the presence of that strange voice in my head, it was as if my long-lost will had suddenly returned to me."} 
    [/event]
    
    ##2st monolog event
    [event]
    name=moveto
    [filter]
        x=28-32
        y=7-10
    [/filter]
	    #po: Проте мені знайоме це відчуття — воно виникало завжди, коли поруч зі мною була Даеола та Голос одразу ж перетворювався на тихий нерозбірливий гомін. Чи через це <i>воно</i> попереджувало не брати мою ученицю в цю подорож?
        {SPEAK Haralin _"However, I am familiar with this feeling — it always arose when Daeola was near me, and the Voice immediately turned into a quiet, indistinct buzz. Was that why <i>it</i> warned me not to take my student on this journey?"}
    [/event]
    
    ##3st monolog event
    [event]
    name=moveto
    [filter]
    x=23-27
    y=7-12
    [/filter]
	    #po: Невже вона настільки обдарована магією, що сама її присутність здатна..? Проте нехай, зараз не до цього. Що я збираюся робити, коли наздожену Графа Чорнотопу та <i>те, що оволоділо ним</i>? Бачить Світло, я не знаю жодних заклять, які могли б мені допомогти.
        {SPEAK Haralin _"Is she so gifted with magic that her mere presence can...? But never mind that now. What am I going to do when I catch up with Count of Blackmore and <i>whatever has taken hold of him</i>? Let Light be a witness, I don't know any spells that could help me."}
    [/event]
	
	##voice event part1
	[event]
	name=moveto
	[filter]
	x=12-22
	y=6-14
	[/filter]
	
	    [move_unit]
	    id=Haralin
	    to_x=19
	    to_y=13
	    [/move_unit]
	    
	    {DELAY 600}
	    
	    {RECALL_XY Daeola 32 8}
	    {MODIFY_UNIT id=Daeola profile "portraits/daeola/daeola_L1.png"}
	    
	    [move_unit]
	    id=Daeola
	    to_x=28
	    to_y=8
	    [/move_unit]
	    
	    [scroll_to_unit]
	    id=Daeola
	    [/scroll_to_unit]
	    
		#po: Вчителю, почекайте, будь ласка, почекайте мене! Якщо в Графа й справді вселився злий дух, вам може знадобитися моя магія Світла!
	    {SPEAK Daeola _"Teacher, please wait, wait for me! If Count really is possessed by an evil spirit, you are going to need my magic of Light!"}
	    
	    [scroll_to_unit]
	    id=Haralin
	    [/scroll_to_unit]
	    
	    {MODIFY_UNIT id=Haralin facing nw} {DELAY 500}
	    {MODIFY_UNIT id=Haralin facing ne} {DELAY 500}
	    
		#po: Клянуся Світлом, зараз я не можу наразити Даеолу на цю небезпеку, особливо коли я не знаю, чи не справа рук це Голосу. Та й вона не має ніколи дізнатися про його існування.
	    {SPEAK Haralin ({WHISPER _"quietly^<i>Let Light be a witness, I can't expose Daeola to this danger now, especially when I don't know if it is the Voice's doing. Besides, she must never know of its existence.</i>"} + _"
...")}
	
	    [scroll_to_unit]
	    id=Daeola
	    [/scroll_to_unit]
		#po: Невже ви... збираєтеся рятувати Графа самостійно? Ви ж навіть не знаєте з чим маєте справу: прокляттям, злим духом чи ще чимось гіршим!
	    {SPEAK Daeola _"Are you really... going to save the Count on your own? You don't even know what you're dealing with: a curse, an evil spirit, or something even worse!"}
	    #po: Послухай, Даеоло...
		{SPEAK Haralin _"Listen, Daeola..."}
	    {DELAY 600}
	    [move_unit]
	    id=Daeola
	    to_x=27
	    to_y=9
	    [/move_unit]
		#po: Ні-ні, навіть чути про це не хочу.. ... Невже дійсно це <i>я</i> маю вам казати, що ви поводитеся нерозсудливо та необачно!?..
	    {SPEAK Daeola _"No, no, I don't even want to hear about it... ... Do <i>I</i> really have to tell you that you are acting recklessly and unwisely!"}
	    {DELAY 600}
	    [move_unit]
	    id=Daeola
	    to_x=26
	    to_y=9
	    [/move_unit]
	    #po: Ще з печер Естену я помітила, що ви понад все переймаєтеся безпекою нашого загону і... мене, я помітила це. Однак прошу вас, ви не маєте битися наодинці, щоб захистити всіх, тому, будь ласка, дозвольте допомогти вам!
	    {SPEAK Daeola _"Back in the caves of Esten, I noticed that you really care about the safety of our squad and. . . me. I noticed that. But please, you don't have to fight alone to protect everyone, so just let me help you!"}
	    
	    [scroll_to_unit]
	    id=Haralin
	    [/scroll_to_unit]
		#po: (посміхнувся) Клянуся Світлом, все ж цієї подорожі було достатньо, щоб ти нарешті подорослішала, Даеоло — ти майже не схожа на те дурне дівчисько, що завдавало мені стільки клопоту в святилищі. І саме тому я не можу втратити, ні тебе, ні будь-кого іншого!
	    {SPEAK Haralin _"(smiled) Let Light be a witness, this journey was enough to finally make you mature, Daeola — you're almost unrecognizable from that silly girl who caused me so much trouble at the temple. And that's why I can't lose you or anyone else!"}
	    
	    {ANIMATE_UNIT id=Haralin skill_bend_cast}
	    {QUAKE (rumble.ogg)}
	    {DELAY 50}
	    {MODIFY_TERRAIN Xue 20 12}
		[redraw][/redraw]
		{QUAKE (rumble.ogg)}
	    {DELAY 50}
	    {MODIFY_TERRAIN Xue 21 12}
		[redraw][/redraw]
		{QUAKE (rumble.ogg)}
	    {DELAY 50}
	    {MODIFY_TERRAIN Xue 22 11}
		[redraw][/redraw]
		{QUAKE (rumble.ogg)}
	    {DELAY 50}
	    {MODIFY_TERRAIN Xue 23 11}
		[redraw][/redraw]
	    
	    [place_shroud]
	    [filter_side]
            side=1
        [/filter_side]
            x=24-45
	        y=1-12
        [/place_shroud]
	    [put_to_recall_list]
	    id=Daeola
	    [/put_to_recall_list]
	    [redraw][/redraw]
	    
        {DELAY 1000}
	    {MODIFY_UNIT id=Haralin facing sw} {DELAY 500}
		#po: Мушу зізнатися, що я не хочу робити цього наодинці, не хочу ризикувати своїм життям, знаючи, що нікого нема поруч. Я не маю вибору та мушу це зробити, бо це якось пов'язано з Голосом, проте... Чи взагалі мав я колись вибір?
	    {SPEAK Haralin _"I must admit that I don't want to do this alone, I don't want to risk my life knowing that there is no one around. I just have no choice and I have to do it, because it's somehow related to the Voice, but... Did I ever have a choice?"}
	    {DELAY 500}
	    [move_unit]
	    id=Haralin
	    to_x=18
	    to_y=13
		fire_event=yes
	    [/move_unit]
	    #spawn Count
	    [unit]
            side=2
            id=Edvar
            name=_"Count Edvar" 
            x,y=11,13
            unrenamable=yes	
            type=Royal Warrior
			facing=ne
	    	hitpoints=1
