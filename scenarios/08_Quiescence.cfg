		{QUAKE (rumble.ogg)}
	    {DELAY 50}
	    {MODIFY_TERRAIN Xue 22 11}
		[redraw][/redraw]
		{QUAKE (rumble.ogg)}
	    {DELAY 50}
	    {MODIFY_TERRAIN Xue 23 11}
		[redraw][/redraw]
	    
