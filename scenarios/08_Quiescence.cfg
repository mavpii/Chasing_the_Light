	{SPEAK voice _"Ти помиляєшся, Гараліне, тому що той, хто <i>не має хисту до магії</i>, не здатний відчувати такі речі. Певно, тебе це дивує — Гаралін Перший, найперший маг Зеленого Острову, насправді фальшивка, що не здатна відчути ні магію, ні її волю!"}
	{SPEAK voice _"Кожного разу, коли ти <i>відчував</i> небезпечу чи місця сили, Гараліне, хіба то не мій голос звучав у твоїй голові, хіба не мої слова вказували тобі вірний шлях усюди, куди б ти не пішов?"}
