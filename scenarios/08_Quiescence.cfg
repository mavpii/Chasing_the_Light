	{MODIFY_UNIT (id=Haralin) moves 0}
	
	##частина діалогу в fire_event
	#po: Дякую, батьку. Я неймовірно радий чути твій голос, хоча й знаю, що це насправді не ти. Проте тепер мені точно відомо як саме <i>ми</i> зможемо перемогти цю потвору!
	{SPEAK Haralin _"Thank you, Father. I am so happy to hear your voice, even though I know it's not really you. But now I know for sure how <i>we</i> can defeat this monster!"}
	{MODIFY_UNIT (id=Haralin) facing sw} {DELAY 500}
