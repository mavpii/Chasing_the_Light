	    [scroll_to_unit]
	    id=haralin
	    [/scroll_to_unit]
	    
	    {MODIFY_UNIT id=haralin facing nw} {DELAY 500}
	    {MODIFY_UNIT id=haralin facing ne} {DELAY 500}
	    
	    {SPEAK haralin ({WHISPER _"quietly^<i>Клянуся Світлом, зараз я не можу наразити Даеолу на цю небезпеку, особливо коли я не знаю, чи не справа рук це Голосу. Та й вона не має ніколи дізнатися про його існування.</i>"} + _"
...")}
	
	    [scroll_to_unit]
	    id=Daeola
	    [/scroll_to_unit]
	    {SPEAK Daeola _"Невже ви... збираєтеся рятувати Графа самостійно? Ви ж навіть не знаєте з чим маєте справу: прокляттям, злим духом чи ще чимось гіршим!"}
