	#define S8_VOICE_TELEPORT
	
	{FLASH_WHITE ()}
	
	{RANDOM 14..32}
	{VARIABLE voice_teleport_x $random}
	{RANDOM 10..18}
	{VARIABLE voice_teleport_y $random}
	
	[unpetrify]
		id=voice
    [/unpetrify]
	
	[teleport]
	[filter]
	id=voice
	[/filter]
	x=$voice_teleport_x
	y=$voice_teleport_y
	[/teleport]
	
	{NPC_LOOK_AT_UNIT haralin $voice_teleport_x $voice_teleport_y}
	
	{CLEAR_VARIABLE voice_teleport_x}
	{CLEAR_VARIABLE voice_teleport_y}
	
	#enddef
	
	#voice escape bend
	[event]
	name=skill_bend_earth_cast
	first_time_only=no
	
    [store_unit]
        [filter]
            id=voice
        [/filter]
        variable=voice_position
    [/store_unit]
	
	[if]
	[variable]
	name=unit_to_cast_on_x
	equals=$voice_position.x
	[/variable]
	[and]
	[variable]
	name=unit_to_cast_on_y
	equals=$voice_position.y
	[/variable]
	[/and]
	[then]
	
	[if]
	[variable]
	name=caught_voice_in_bend
	equals=false
	[/variable]
	[then]
	{SPEAK voice _"Гараліне, бачить Світло, необачно було гадати, що на мене подіють <i>МОЇ</i> ж закляття!"}
	{VARIABLE caught_voice_in_bend _"true"}
	[/then]
	[/if]
	
	{S8_VOICE_TELEPORT}
	
	{CLEAR_VARIABLE voice_position}
	
	[set_achievement]
        content_for=Chasing_the_Light
        id="ctl_voice_bend"
    [/set_achievement]
	
	[/then][/if]
    [/event]
	
	#voice teleports if has low hp
	[event]
	name=attack end
	first_time_only=no
	
	[store_unit]
        [filter]
            id=voice
        [/filter]
        variable=voice_health
    [/store_unit]
	
	[if]
	[variable]
	name=voice_health.hitpoints
	less_than=60
	[/variable]
	[and]
	[variable]
	name=voice_teleported_60
	not_equals=true
	[/variable]
	[/and]
	[then]
	    {S8_VOICE_TELEPORT}
	    
	    [gold]
            side=3
            amount={ON_DIFFICULTY 25 40 60}
        [/gold]
		
		{MODIFY_UNIT id=voice hitpoints 60}
		
	    [if]
	    [variable]
	        name=side_number
	        equals=3
	    [/variable]
	    [then]
	        {VOICE_CASTLE_RENEW}
	    [/then][/if]
		
		{VARIABLE voice_teleported_60 _"true"}
	[/then][/if]
	
	[if]
	[variable]
	name=voice_health.hitpoints
	less_than=30
	[/variable]
	[and]
	[variable]
	name=voice_teleported_30
	not_equals=true
	[/variable]
	[/and]
	[then]
	    {S8_VOICE_TELEPORT}
	    
	    [gold]
            side=3
            amount={ON_DIFFICULTY 30 45 65}
        [/gold]
		
		{MODIFY_UNIT id=voice hitpoints 30}
	
	    [if]
	    [variable]
	        name=side_number
	        equals=3
	    [/variable]
	    [then]
	        {VOICE_CASTLE_RENEW}
	    [/then][/if]
		
		{VARIABLE voice_teleported_30 _"true"}
	[/then][/if]
	
	{CLEAR_VARIABLE voice_health}
	
	[/event]
	
