	#po: Я аж ніяк не звинувачую тебе, Гараліне, але все ж кожної миті я думаю лише про одне — що було б, якби це тіло було моїм з самого початку, а ти був лише безтілесним духом? У якому положенні ми були б зараз?
	{SPEAK voice _"I don't blame you at all, Haralin, but every moment I think only one thing — what if this body had been mine from the beginning, and you were just a incorporeal spirit? Where would <i>we</i> be now?"}
	
	{DELAY 500}
	
	{SPEAK Haralin _". ."}
	
	{DELAY 500}
	
	{SPEAK Haralin _"o o"}
	
	{DELAY 500}
	
	{SPEAK Haralin _"O O"}
	
	{DELAY 500}
	
	#po: Клянуся Світлом, тепер я розумію до чого ти ведеш — ти хочеш захопити моє тіло, чи не так? Так само, як ти це зробило з Графом Чорнотопу!
	{SPEAK Haralin _"Let Light be a witness, now I understand what you're leading up to — you want to take over my body, don't you? Just like you did with Count of Blackmore!"}
	#po: Знову маєш рацію, Гараліне. Мені й справді не хотілося, щоб все дійшло до цього, але... розумієш, ти просто не лишив мені вибору...
	{SPEAK voice _"You're right again, Haralin. I really didn't want this to happen, but... you see, you just didn't leave me any choice..."}
	#po: Що ти маєш на увазі, кажучи 'не лишив вибору'? Який взагалі вибір може мати мертвий привид, який ніколи не жив та не мав обирати?
	{SPEAK Haralin _"What do you mean by 'didn't leave any choice'? What choice can a ghost have, who never lived and never had to choose?"}
	#po: Насправді моя душа вже давно змирилася з думкою, що я ніколи не зможу жити як людина, ніколи не зможу доторкнутися до чогось чи відчути бодай щось, окрім вічного холоду. Проте...
	{SPEAK voice _"In fact, my soul has long since accepted that I will never be able to live like a human being, never be able to touch anything or feel anything except eternal cold. However..."}
	{DELAY 700}
	#po: Проте що??..
	{SPEAK Haralin _"However what??.."}
	#po: ... мені хотілося, щоб <i>ми</i> мали те життя, яке мені ніколи не судилося мати. Так і було протягом багатьох років, але потім ти майже припинив прислуховуватися до мене та почав чинити як тобі самому схочеться...
	{SPEAK voice _"... I wanted <i>us</i> to have the life that I was never destined to have. That's how it was for many years, but then you almost stopped listening to me and started doing whatever you wanted..."}
	#po: Іншими словами, тобі не вдалося вічно тримати мене під своїм впливом, щоб жити так, як хочеться саме тобі.
	{SPEAK Haralin _"In other words, you failed to keep me under your control forever so that I would live the way you wanted to."}
	{DELAY 700}
	#po: З твоєї точки зору, безсумнівно, все виглядає саме так, Гараліне, тому не буду цього заперечувати. Проте годі балачок — ще трохи й ти побачиш, як твої ж власні спогади змусять тебе відступитися! Подивися навколо, Гараліне, це тіло вже майже належить <i>мені</i>!
	{SPEAK voice _"From your point of view, no doubt, everything looks exactly like that, Haralin, so I won't argue with you. But enough talk — in a moment you will see how your own Memories will force you to give up! Look around, Haralin, this body almost belongs to <i>me</i> already!"}
	{MODIFY_UNIT (id=Haralin) facing se} {DELAY 500}
	{MODIFY_UNIT (id=Haralin) facing sw} {DELAY 500}
	#po: (сміється) Бачить Світло, лише цих твоїх слів було достатньо, щоб я зрозумів як саме мені перемогти в цій химерній битві! <i>Я маю повернути контроль хоча би над частиною спогадів, чи щоб це не було, та з їхньою допомогою знищити тебе!</i>
	{SPEAK Haralin _"(laughs) By the Light, just those words of yours were enough for me to understand how to win this bizarre battle! <i>I must regain control of at least some of my Memories, whatever they may be, and use them to destroy you!</i>"}
	
