			#po: Гараліне, ти й справді прийшов сюди зовсім один, як і очікувалося. Це було вкрай нерозумне рішення, тобі й самому це відомо...
            message=_"Haralin, you really did come here alone, as expected. It was an extremely unwise decision, as you yourself know..."
        [/message]
		#po: Хай помилує мене Світло, як і на вході до копальні, лише одна істота могла сказати щось подібне та це точно не Граф Чорнотопу. Невже це дійсно... дійсно <i>ти</i> в його тілі?!
		{SPEAK Haralin _"May the Light have mercy on me, just like at the mine entrance, only one entity could say something like that, and it definitely isn't the Count of Blackmore. Could it really be... really <i>you</i> in his body?!"}
	
