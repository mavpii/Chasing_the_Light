	    [/then]
	    [else]
	        {SPEAK Daeola _"Вітаю, чоловіче, розкажи мені, що сталося, й я допоможу своєю магією."}
	    [/else][/if]
	    {SPEAK 09_Apprehension_Peasant_Hut_Peasant_1 _"Я копав у подвалє диру, шоб було де збирігати врожай, як от я пробив стіну та натрапіл на какую-то печеру. Оттудова я одразу почув якісь дуже страшні звуки й там, наче, хто-та бігаєт."}
		{SPEAK Daeola _"І що це виявилося, невже страшні злі духи?"}
		{SPEAK 09_Apprehension_Peasant_Hut_Peasant_1 _"Саме так, пані, я тоже подумав, що це всьо злиє духі! Я зразу ж замкнув двері до погрєбу, але вночі я чую як вони там шкребуться та пищать вночі."}
	    {SPEAK Daeola _"..."}
	    {SPEAK Daeola _"Добре, я розберуся з цим твоїм 'прокляттям', але, ім'ям Світла — наступного разу позбуватимешся від пацюків сам."}
	    {SPEAK 09_Apprehension_Peasant_Hut_Peasant_1 _"Дякую, пані, вєліке дякую! Осьо, тримайте ключи от мого погребу! (передає ключ від закритих дверей)"}
	    
	    #завдання на підвал отримано
	    {VARIABLE s9_basement_accepted _"true"}
	    
	    {VARIABLE s9_quest_4 _"Дослідіть підвал переляканого селянина"}
