	[then]
	
    {SPEAK Daeola _"Вітаю, пані. Я блукаю Долиною у пошуках тих, хто потребує допомоги Світла. Чи тобі щось потрібно?"}
	{DELAY 500}
	{SPEAK Aeothyll _"Даеоло?... Невже це і справді ти, у моїй хаті?"}
	{DELAY 500}
	{SPEAK Daeola _"Зажди-но... Ім'ям Світла, я маю відчуття, наче знаю тебе..."}
	{SPEAK Aeothyll _"Ти ніколи нє вирізнялася гарною памят'ю, Даеоло, але ж забути свою найкращу подругу?..."}
	{DELAY 500}
	{SPEAK Daeola _"Аеотіль!"}
	{SPEAK Daeola _"Я не бачила тебе хтозна-скільки часу! Ти ж тоді була з сім'єю у Чорнотопі, коли напали мерці, так?"}
	{SPEAK Aeothyll _"Моя сім'я втекла звідти до Південної Бухти, де ми багато років жили у бідному таборі неподалік від міста. А потім ми з чоловіком та його двома братами перебралися до Долини Штормів, бо тутешній Король обіцяв багато гарної землі переселенцям."}
	{SPEAK Aeothyll _"Ми живемо тут вже більше двадцяти років і, хоч я час від часу згадую про рідне село, я повністю щаслива тут: маю велику сім'ю, гарний будинок та поле, а Королівські війська надійно охороняють усі входи в Долину, тому тут ніколи не було жодного західняка."}
	{SPEAK Daeola _"Я рада, що хоч когось з нашого села все склалося добре. Інші або загинули на війні, або ще продовжують боротися..."}
	{SPEAK Aeothyll _"Я гадала, шо ви всі й загинули тієї ночі, поки кілька років тому нє почула розповіді про магію, 'Світло' та якусь Пророчицю на ім'я Даеола, що творить чудеса та рятує людей. Я не знала чи це ти, проте знайоме ім'я дало мнє надію, і ось ти тут."}
	{DELAY 500}
	{SPEAK Aeothyll _"А як щодо тебе, Даеоло? У тєбє теж, певно, вже є сім'я?"}
	{SPEAK Daeola _"Я слуга Світла, Аеотіль — весь свій час я витрачаю на війну з Темрявою, тому не маю ні спокою, ні дому, ні сім'ї, ні коханої людини..."}
	{DELAY 500}
	{SPEAK Aeothyll _"Ох, тобі не позаздриш..."}
	{SPEAK Daeola _"Так... Це страшний тягар, проте я змушена продовжувати боротьбу, щоб інші могли мати спокійні життя, далеко від мерців та темних чаклунів..."}
	{SPEAK Aeothyll _"І за це ми всі навіки вдячні тєбє, Даеоло. Ви, маги, врятували багато життів і зараз успєшно звільнюєте Зелений Острів."}
	{SPEAK Daeola _"Аеотіль... Я-... Хоча хай, тобі зараз потрібна хоч якась допомога?"}
	{SPEAK Aeothyll _"Насправді нє, у мене все чудово. Але якщо ти прям дуже хочеш щось зробити, можеш покликати моїх дітей додому, вони мають бути десь у долині."}
	
	{VARIABLE s9_child_home_tasked _"true"}
	
	{VARIABLE s9_quest_3 _"Поверніть дітей Аеотіль додому"}
	
	{VARIABLE s9_child_home_tasked _"true"}
	
	{S9_UPDATE_OBJECTIVES no}
	[/then]
	[else]
