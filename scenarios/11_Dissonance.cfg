	#define S11_SIGNPOST_REACTION
	    [if]
        [variable]
            name=S11_SIGNPOST_REACTED
            not_equals=true
        [/variable]
        [then]
        
	         ##коментарій, що написи є дуже древніми та пошкодженими
            {HD_REACTION
        		({SPEAK Haralin _"Написи на цьому дороговказі були зроблені ще задовго до вторгнення проклятих західняків: дерево вже старе та трухляве."}) #Haralin
        		({SPEAK Daeola _"Цей дороговказ виглядає дуже старим. Його було встановлено ще задовго до того, як мерці захопили та спустошили ці землі."}) #Daeola
        		({SPEAK unit _"Нам нема жодної користі від цих древніх написів: їх встановили ще до західняків."}) #Others
        	}
	     	
	     	{VARIABLE S11_SIGNPOST_REACTED _"true"}
        
        [/then][/if]
	#enddef
	
	{SIGNPOSTS_LABELS 1 17 3 _"Шлях далі веде до Північної Гавані.
На дорозі зустрічаються жорстокі бандити та варвари, будьте обережні!" ({S11_SIGNPOST_REACTION})}
    {SIGNPOSTS_LABELS 1 14 28 _"Подорожній, ти входиш у землі незалежного міста Анґвадок!
Якщо є чужинцем ти, поважай наші закони, інакше голова твоя опиниться на палі." ({S11_SIGNPOST_REACTION})}

## В часи мерців, у лиха мить
## Твій погляд втомлений глядить
## Йдучи пліч-о-пліч з темним злом
## Відчуєш Дар своїм нутром
## Поглянеш ти ускрізь ліса,
## Крізь хати спалені дотла
## Й коли достане сил тобі,
## Той Дар ти зможеш віднайти

##In times of woe, when dead men rise,
##You watch it all with weary eyes.
##While dark evil walks at your right,
##You'll sense the Gift by inner sight.
##You'll look through forests all around,
##Through homes the foe burned to the ground,
##And if you have the strength you need,
##That Gift is yours to find indeed.

    ####################
	## MONOLITH EVENT ##
	####################
	[event]
	name=moveto
	first_time_only=no
	[filter]
	x,y=24,48
	side=1
	[/filter]
	
	[if]
	[variable]
	name=unit.id
	equals=Haralin,Daeola
	[/variable]
	[and]
	[variable]
	name=s11_monolith_commented
	not_equals=true
	[/variable]
	[/and]
	[then]
	
	[message]
	image=scenery/monolith3.png
	speaker=narrator
	message=_"This ancient monolith has an engraving written in a language that has long been forgotten and lost to time. $unit.name doesn't understand a thing either, but just by looking at the ancient writing, they begin to hear an unknown voice, like a distant echo:
<i>
   In times of woe, when dead men rise,
   You watch it all with weary eyes.
   While dark evil walks at your right,
   You'll sense the Gift by inner sight.
   You'll look through forests all around,
   Through homes the foe burned to the ground,
   And if you have the strength you need,
   That Gift is yours to find indeed.
</i>"
	[/message]

	[if]
	[variable]
	name=Iahralin_blessing
	equals=true
	[/variable]
	[then]
	
	    ##додаткові коментарі, що розкривають локацію
	
	[/then][/if]
	
	
	#{MILESTONE s11_monolith yes}
	{VARIABLE s11_monolith_commented _"true"}
	
	[/then]
	[elseif]
	[variable]
	name=s11_monolith_commented_others
	not_equals=_"true"
	[/variable]
	[then]
	[message]
	image=scenery/monolith3.png
	speaker=narrator
	message=_"This ancient monolith has an engraving written in a language that has long been forgotten and lost to time."
	[/message]
	
	        {HD_REACTION
        		({SPEAK Haralin _"TEST"}) #Haralin
        		({SPEAK Daeola _"TEST"}) #Daeola
        		({SPEAK Selyn _"TEST"}) #Selyn
        		({SPEAK unit _"TEST"}) #Others
        	}
	
	{VARIABLE s11_monolith_commented_others _"true"}
	
	[/then][/elseif][/if]
	
	[/event]
	
