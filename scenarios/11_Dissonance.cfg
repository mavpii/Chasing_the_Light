#textdomain wesnoth-ctl
{JOURNAL 11_Dissonance _"Dissonance" no}

[scenario]
    id=11_Dissonance
    name= _ "Dissonance"
    map_data="{~add-ons/Chasing_the_Light/maps/11_Dissonance.map}"
