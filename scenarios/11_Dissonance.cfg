	    {RECALL_XY Zeham 15 3}
	    {MOVE_UNIT id=Zeham 9 11}
	    {RECALL_XY Dolmannumbil 15 3}
	    {MOVE_UNIT id=Dolmannumbil 13 15}
		
		[scroll_to]
	        x,y=13,14
	    [/scroll_to]
	    
	    ##гарнізон повідомляє про прибуття військових острів`ян
	    
	    ##герої приходять, Аса бере контроль над містом
	    
	    
	    ##вирішують розділитися. Аса та Зегам залишаються, щоб запевнитися, що вони втримають оборону переправи й не пустять західняків назад
	    
	    {SPEAK Asa _"TEST"}
		
		{MODIFY_UNIT id=Asa side 3}
		
		[if]
		[have_unit]
		    id=Zeham
		[/have_unit]
		[then]
		
		    {SPEAK Zeham _"TEST"}
			
			{MODIFY_UNIT id=Zeham side 3}
			
			{DELAY 700}
		
		[/then][/if]
		
		##Лісовик залишається, щоб не дозволити мерцям пройти до лісу та осквернити його знову
		[if]
		[have_unit]
		    id=Dolmannumbil
		[/have_unit]
		[then]
		
		    {SPEAK Dolmannumbil _"TEST"}
			
			{MODIFY_UNIT id=Dolmannumbil side 3}
			
			{DELAY 700}
		
		[/then][/if]
		
		{SPEAK Haralin _"TEST"}
		{SPEAK Daeola _"TEST"}
		
