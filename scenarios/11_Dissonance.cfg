	###########
	## START ##
	###########
	[event]
	name=start
	
	    {DELAY 500}
		
	    {SPEAK S11_Pikeman _"TEST"}
	    
	    {RECALL_XY Haralin 15 3}
	    {MOVE_UNIT id=Haralin 13 13}
	    {RECALL_XY Asa 15 3}
	    {MOVE_UNIT id=Asa 15 13}
	    {RECALL_XY Daeola 15 3}
	    {MOVE_UNIT id=Daeola 11 14}
	    {RECALL_XY Zeham 15 3}
	    {MOVE_UNIT id=Zeham 9 11}
	    {RECALL_XY Dolmannumbil 15 3}
	    {MOVE_UNIT id=Dolmannumbil 13 15}
		
		[scroll_to]
	        x,y=13,14
	    [/scroll_to]
	    
	    ##гарнізон повідомляє про прибуття військових острів`ян
	    
	    ##герої приходять, Аса бере контроль над містом
	    
	    
	    ##вирішують розділитися. Аса та Зегам залишаються, щоб запевнитися, що вони втримають оборону переправи й не пустять західняків назад
	    
	    {SPEAK Asa _"TEST"}
		
		{MODIFY_UNIT id=Asa side 2}
		
		[if]
		[have_unit]
		    id=Zeham
		[/have_unit]
		[then]
		
		    {SPEAK Zeham _"TEST"}
			
			{MODIFY_UNIT id=Zeham side 2}
			
			{DELAY 700}
		
		[/then][/if]
		
		##Лісовик залишається, щоб не дозволити мерцям пройти до лісу та осквернити його знову
		[if]
		[have_unit]
		    id=Dolmannumbil
		[/have_unit]
		[then]
		
		    {SPEAK Dolmannumbil _"TEST"}
			
			{MODIFY_UNIT id=Dolmannumbil side 2}
			
			{DELAY 700}
		
		[/then][/if]
		
		{SPEAK Haralin _"TEST"}
		{SPEAK Daeola _"TEST"}
		
		#18,62
		[remove_shroud]
	        [filter_side]
                side=1
            [/filter_side]
            x,y=18,62
            radius=1
        [/remove_shroud]
		
		{HIGHLIGHT_IMAGE 18 62 items/gohere.png ()}
		
	    {DELAY 500}
	
	[/event]
	
	######################
	## SIGNPOSTS LABELS ##
	######################
	#define S11_SIGNPOST_REACTION
	    [if]
        [variable]
            name=S11_SIGNPOST_REACTED
            not_equals=true
        [/variable]
        [then]
        
	         ##коментарій, що написи є дуже древніми та пошкодженими
            {HD_REACTION
        		({SPEAK Haralin _"TEST"}) #Haralin
        		({SPEAK Daeola _"TEST"}) #Daeola
        		({SPEAK Selyn _"TEST"}) #Selyn
        		({SPEAK unit _"TEST"}) #Others
        	}
	     	
	     	{VARIABLE S11_SIGNPOST_REACTED _"true"}
        
        [/then][/if]
	#enddef
	
	{SIGNPOSTS_LABELS 1 17 3 _"Шлях далі веде до Північної Гавані.
На дорозі зустрічаються жорстокі бандити та варвари, будьте обережні!" ({S11_SIGNPOST_REACTION})}
    {SIGNPOSTS_LABELS 1 14 28 _"Подорожній, ти входиш у землі незалежного міста Північної Гавані!
Якщо є чужинцем ти, поважай наші закони, інакше голова твоя опиниться на палі." ({S11_SIGNPOST_REACTION})}
	
