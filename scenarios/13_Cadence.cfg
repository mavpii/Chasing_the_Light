	[/event]

	[event]
		name=s13_reveal_check
		first_time_only=no
		[lua]
			code=<<
				local function on(v) return v == true or v == "yes" end
				local f = wesnoth.units.find_on_map{ id = "Faisim" }[1]
				wml.variables.s13_revealed_now = 0
				if not f then return end
				local sites = wml.array_access.get("s13_sites")
				local found = 0
				for _, site in ipairs(sites) do
					if not on(site.revealed) and not on(site.destroyed)
						and wesnoth.map.distance_between(f.x, f.y, site.x, site.y) <= 5 then
						local x, y = wesnoth.paths.find_vacant_hex(site.x, site.y)
						wml.fire("unit", { type = "Caror Monolith", id = site.id, side = 6, role = "s13_monolith", upkeep = "loyal", x = x, y = y, animate = true })
						site.revealed = true
						site.x, site.y = x, y
						found = found + 1
						wml.variables.s13_revealed_x = x
						wml.variables.s13_revealed_y = y
					end
				end
				wml.array_access.set("s13_sites", sites)
				wml.variables.s13_revealed_now = found
			>>
		[/lua]
		[if]
			[variable]
				name=s13_revealed_now
				greater_than=0
			[/variable]
			[then]
				[sound]
					name=magic-dark.ogg
				[/sound]
				[scroll_to]
					x,y=$s13_revealed_x,$s13_revealed_y
				[/scroll_to]
				{SPEAK_FAISIM _"ТЕСТ s13_monolith_revealed"}
			[/then]
		[/if]
	[/event]

