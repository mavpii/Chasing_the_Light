				if not rawget(_G, "s13_harm_wrapped") then
					rawset(_G, "s13_harm_wrapped", true)
					local base = wesnoth.wml_actions.harm_unit
					wesnoth.wml_actions.harm_unit = function(cfg)
						for _, m in ipairs(wesnoth.units.find_on_map{ role = "s13_monolith" }) do m.status.s13_spellbound = true end
						base(cfg)
						for _, m in ipairs(wesnoth.units.find_on_map{ role = "s13_monolith" }) do m.status.s13_spellbound = false end
					end
				end
