		{CLEAR_VARIABLE s13_sites}
		[lua]
			code=<<
				local h = wml.get_child(..., "hexes")
				local xs, ys = tostring(h.x), tostring(h.y)
				local sites, i = {}, 0
				local yl = {}
				for v in ys:gmatch("%d+") do yl[#yl + 1] = tonumber(v) end
				for v in xs:gmatch("%d+") do
					i = i + 1
					sites[i] = { id = "s13_monolith_" .. i, x = tonumber(v), y = yl[i], revealed = false, destroyed = false }
				end
				wml.array_access.set("s13_sites", sites)
			>>
			[args]
				[hexes]
					{S13_MONOLITH_HEXES}
				[/hexes]
			[/args]
		[/lua]

