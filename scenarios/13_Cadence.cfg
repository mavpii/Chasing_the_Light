#define S13_OBJECTIVES_MONOLITHS SILENT
	{S13_OBJECTIVES (
		silent={SILENT}
		[objective]
			#po: Знищіть моноліти Карора (залишилось: $s13_monoliths_left)
			description= _ "Destroy Caror’s monoliths (left: $s13_monoliths_left)"
			condition=win
		[/objective]
		[objective]
			#po: Отримати перевагу над ворогом, поки стоїть хоч один моноліт (Карор втече)
			description= _ "Gain the upper hand while any monolith still stands (Caror escapes)"
			condition=lose
		[/objective]
		[note]
			#po: Перевагу буде отримано, коли ви та ваші союзники здолаєте ще $s13_units_to_slay ворогів.
			description= _ "The upper hand is gained once you and your allies defeat $s13_units_to_slay more enemies."
		[/note]
		[note]
			#po: Поки стоїть хоч один моноліт, Карор може телепортуватися до нього та уникнути загибелі.
			description= _ "While at least one monolith stands, Caror can teleport to it and escape death."
		[/note]
		[note]
			#po: Якщо Файсім не рухатиметься цілий хід, вона підкаже, де шукати найближчий моноліт.
			description= _ "If Faisim does not move for a whole turn, she will hint where to look for the nearest monolith."
		[/note]
		[note]
			#po: Облогові вежі прокладають мости через рів та стають таборами західняків. Знищіть драуга, що охороняє такий табір.
			description= _ "Siege towers bridge the moat and turn into Wesfolk camps. Destroy the draug guarding such a camp."
		[/note]
	)}
#enddef

