#define S13_REFRESH_OBJECTIVES SILENT
	[if]
		[variable]
			name=s13_phase
			equals=1
		[/variable]
		[then]
			{S13_OBJECTIVES_MONOLITHS {SILENT}}
		[/then]
		[else]
