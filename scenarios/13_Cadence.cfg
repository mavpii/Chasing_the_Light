		[lua]
			code=<<
				local sites = wml.array_access.get("s13_sites")
				for _, site in ipairs(sites) do
					local x, y = wesnoth.paths.find_vacant_hex(site.x, site.y)
					site.x, site.y = x, y
					site.revealed = true
				end
				wml.array_access.set("s13_sites", sites)
			>>
		[/lua]
