			facing=nw
			role=s13_tower
			animate=yes
			[modifications]
				{TRAIT_LOYAL}
			[/modifications]
		[/unit]
		[micro_ai]
			side=6
			ai_type=goto
			action=add
			ca_id=s13_tower_goto_{SITE}
			ca_score=300000
			[filter]
				id=s13_tower_{SITE}
			[/filter]
			[filter_location]
				x,y={SX},{SY}
			[/filter_location]
		[/micro_ai]
		{FIRE_EVENT s13_tower_spotted}
	[/event]

	[event]
		name=moveto
		first_time_only=no
		[filter]
			id=s13_tower_{SITE}
			x,y={SX},{SY}
		[/filter]
		{FIRE_EVENT s13_tower_build_{SITE}}
	[/event]

	[event]
		name=s13_tower_build_{SITE}
		first_time_only=no
		[micro_ai]
			side=6
			ai_type=goto
			action=delete
			ca_id=s13_tower_goto_{SITE}
		[/micro_ai]
		[scroll_to]
			x,y={SX},{SY}
		[/scroll_to]
		[animate_unit]
			[filter]
				id=s13_tower_{SITE}
			[/filter]
			flag=s13_bridge
			[facing]
				x,y={BX},{BY}
			[/facing]
		[/animate_unit]
		{S13_CAMP_HEX {BRIDGE} {BX} {BY}}
		[kill]
			id=s13_tower_{SITE}
			animate=no
			fire_event=no
		[/kill]
		{S13_CAMP_HEX Ket {SX} {SY}}
		{S13_CAMP_HEX Ce {C1X} {C1Y}}
		{S13_CAMP_HEX Ce {C2X} {C2Y}}
		[unit]
			type=Draug
			id=s13_draug_{SITE}
			side=6
			x,y={SX},{SY}
			canrecruit=yes
			role=s13_tower_guard
			ai_special=guardian
			animate=yes
			[modifications]
				{TRAIT_LOYAL}
			[/modifications]
		[/unit]
		[gold]
			side=6
			amount={S13_CAMP_GOLD}
		[/gold]
		{VARIABLE s13_camp_{SITE} yes}
		{FIRE_EVENT s13_tower_camp_built}
	[/event]

	[event]
		name=die
		first_time_only=no
		[filter]
			id=s13_draug_{SITE}
		[/filter]
		{VARIABLE s13_camp_{SITE} no}
		{MODIFY_TERRAIN Gd^Edb {SX} {SY}}
		{MODIFY_TERRAIN Gd^Edb {C1X} {C1Y}}
		{MODIFY_TERRAIN Gd^Edb {C2X} {C2Y}}
		[redraw]
		[/redraw]
		{FIRE_EVENT s13_tower_camp_destroyed}
		{S13_SCHEDULE tower_spawn_{SITE} {S13_TOWER_RESPAWN}}
	[/event]

	[event]
		name=die
		first_time_only=no
		[filter]
			id=s13_tower_{SITE}
		[/filter]
		[micro_ai]
			side=6
			ai_type=goto
			action=delete
			ca_id=s13_tower_goto_{SITE}
		[/micro_ai]
		{FIRE_EVENT s13_tower_destroyed}
		{S13_SCHEDULE tower_spawn_{SITE} {S13_TOWER_RESPAWN}}
	[/event]
#enddef

