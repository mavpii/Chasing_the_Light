	[event]
		name=side 6 turn refresh
		first_time_only=no
		[filter_condition]
			[variable]
				name=s13_phase
				equals=1
			[/variable]
			[variable]
				name=s13_finale
				not_equals=yes
			[/variable]
			[have_unit]
				id=Caror
			[/have_unit]
		[/filter_condition]
		[switch]
			variable=s13_caror_state
			[case]
				value=home
				[if]
					[variable]
						name=turn_number
						greater_than_equal_to=$s13_caror_next
					[/variable]
					[then]
						{FIRE_EVENT s13_caror_raid}
					[/then]
					[else]
						{MODIFY_UNIT id=Caror moves 0}
					[/else]
				[/if]
			[/case]
			[case]
				value=raid
				[if]
					[variable]
						name=turn_number
						greater_than_equal_to=$s13_caror_back
					[/variable]
					[then]
						{VARIABLE s13_caror_state return}
						{FIRE_EVENT s13_caror_return}
					[/then]
				[/if]
			[/case]
			[case]
				value=return
				{FIRE_EVENT s13_caror_return}
			[/case]
		[/switch]
	[/event]

	[event]
		name=s13_caror_return
		first_time_only=no
		{S13_CAROR_GOTO_OFF}
		{S13_PICK_MONOLITH caror}
		[if]
			[variable]
				name=s13_pick_x
				greater_than=0
			[/variable]
			[then]
				{VARIABLE s13_caror_site_x $s13_pick_x}
				{VARIABLE s13_caror_site_y $s13_pick_y}
				{VARIABLE s13_caror_late $s13_caror_back}
				{VARIABLE_OP s13_caror_late add 2}
				[if]
					[have_unit]
						id=Caror
						[filter_location]
							x,y=$s13_caror_site_x,$s13_caror_site_y
							radius=1
						[/filter_location]
					[/have_unit]
					[or]
						[variable]
							name=turn_number
							greater_than_equal_to=$s13_caror_late
						[/variable]
					[/or]
					[then]
						{FIRE_EVENT s13_caror_go_home}
					[/then]
					[else]
						[micro_ai]
							side=6
							ai_type=goto
							action=add
							ca_id=s13_caror_goto
							ca_score=300000
							[filter]
								id=Caror
							[/filter]
							[filter_location]
								x,y=$s13_caror_site_x,$s13_caror_site_y
								radius=1
							[/filter_location]
						[/micro_ai]
						{VARIABLE s13_caror_goto yes}
					[/else]
				[/if]
				{CLEAR_VARIABLE s13_caror_late}
			[/then]
			[else]
				{VARIABLE s13_caror_state stranded}
			[/else]
		[/if]
	[/event]

	[event]
		name=moveto
		first_time_only=no
		[filter]
			id=Caror
