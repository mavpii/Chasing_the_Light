#define S13_SPAWN_NEAR NEAR TYPE
	[lua]
		code=<<
			local a = ...
			local c = wesnoth.units.find_on_map{ id = a.near }[1]
			local u = wesnoth.units.create{ type = a.type, side = 1 }
			local x, y = wesnoth.paths.find_vacant_hex(c.x, c.y, u)
			wml.variables.s13_spawn_x = x
			wml.variables.s13_spawn_y = y
		>>
		[args]
			near={NEAR}
			type={TYPE}
		[/args]
	[/lua]
	[unit]
		type={TYPE}
		side=1
		x,y=$s13_spawn_x,$s13_spawn_y
		facing=s
		animate=yes
	[/unit]
#enddef

