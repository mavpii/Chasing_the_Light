	[event]
		name=s13_faisim_hint
		first_time_only=no
		[lua]
			code=<<
				local function on(v) return v == true or v == "yes" end
				local f = wesnoth.units.find_on_map{ id = "Faisim" }[1]
				local best, best_d
				if f then
					for _, site in ipairs(wml.array_access.get("s13_sites")) do
						if not on(site.destroyed) then
							local d = wesnoth.map.distance_between(f.x, f.y, site.x, site.y)
							if not best_d or d < best_d then best, best_d = site, d end
						end
					end
				end
				wml.variables.s13_hint_id = best and best.id or nil
			>>
		[/lua]
		[switch]
