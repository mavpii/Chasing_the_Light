		[/else]
	[/if]
#enddef

#define S13_PICK_MONOLITH MODE
	[lua]
		code=<<
			local args = ...
			local function on(v) return v == true or v == "yes" end
			local anchor = wesnoth.units.find_on_map{ id = "Haralin" }[1]
			local best, best_d
			for _, site in ipairs(wml.array_access.get("s13_sites")) do
				if not on(site.destroyed) then
					local d = anchor and wesnoth.map.distance_between(anchor.x, anchor.y, site.x, site.y) or 0
					if args.mode == "far" then d = -d end
					if not best_d or d < best_d then best, best_d = site, d end
				end
			end
			if best then
				wml.variables.s13_pick_x = best.x
				wml.variables.s13_pick_y = best.y
			else
				wml.variables.s13_pick_x = nil
				wml.variables.s13_pick_y = nil
			end
		>>
		[args]
			mode={MODE}
		[/args]
	[/lua]
#enddef

#define S13_DAMAGED_SIEGE
	[lua]
		code=<<
			local hp = { 0.55, 0.8, 0.65, 0.9, 0.45, 0.7, 0.85, 0.6, 0.75, 0.5 }
			local xp = { 0.1, 0.35, 0.6, 0.2, 0.75, 0.4, 0.15, 0.5, 0.3, 0.65 }
			local units = wesnoth.units.find_on_map{ side = "3,4,5,6,7,8,9,10,12", canrecruit = false }
			table.sort(units, function(a, b) if a.x ~= b.x then return a.x < b.x end return a.y < b.y end)
			for i, u in ipairs(units) do
				u.hitpoints = math.max(1, math.floor(u.max_hitpoints * hp[(i - 1) % #hp + 1]))
				u.experience = math.floor(u.max_experience * xp[(i - 1) % #xp + 1])
			end
		>>
	[/lua]
#enddef

