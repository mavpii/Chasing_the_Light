	[event]
		name=side 6 turn $s13_next_{NAME}
		{FIRE_EVENT s13_{NAME}}
	[/event]
#enddef

#define S13_COUNT_MONOLITHS
	[lua]
		code=<<
			local function on(v) return v == true or v == "yes" end
			local sites = wml.array_access.get("s13_sites")
			local dead = wml.variables["unit.id"]
			local left = 0
			for _, site in ipairs(sites) do
				if site.id == dead then site.destroyed = true end
				if not on(site.destroyed) then left = left + 1 end
			end
			wml.array_access.set("s13_sites", sites)
			wml.variables.s13_monoliths_left = left
		>>
	[/lua]
#enddef

