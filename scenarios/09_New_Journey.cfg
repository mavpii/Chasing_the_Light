	{MODIFY_UNIT x,y=8,25 facing se}
	{NAMED_GENERIC_UNIT 2 (Heavy Infantryman) 10 24 09_New_Journey_Global_Heavy_Infantryman_4 ()}
	{MODIFY_UNIT x,y=10,24 facing sw}
	
	{NAMED_GENERIC_UNIT 2 (Spearman) 9 20 09_New_Journey_Global_Spearman_1 ()}
	{MODIFY_UNIT x,y=9,20 facing se}
	
	#найманці
	{NAMED_GENERIC_UNIT 2 (Crossbowman) 3 24 09_New_Journey_Global_Crossbowman_1 ()}
	{MODIFY_UNIT x,y=3,24 facing se}
	{MODIFY_UNIT x,y=3,24 canrecruit yes}
	
	{NAMED_GENERIC_UNIT 2 (Crossbowman) 6 22 09_New_Journey_Global_Crossbowman_2 ()}
	{MODIFY_UNIT x,y=6,22 facing se}
	{NAMED_GENERIC_UNIT 2 (Crossbowman) 7 22 09_New_Journey_Global_Crossbowman_3 ()}
	{MODIFY_UNIT x,y=7,22 facing sw}
	
	#селяни на полі
	{NAMED_GENERIC_UNIT 2 (Peasant) 31 17 09_New_Journey_Global_Peasant_1 ()}
	{MODIFY_UNIT x,y=31,17 facing se}
	{NAMED_GENERIC_UNIT 2 (Peasant) 32 18 09_New_Journey_Global_Peasant_2 ()}
	{MODIFY_UNIT x,y=32,18 facing nw}
	
	#рандомний селянин
	{NAMED_GENERIC_UNIT 2 (Peasant) 18 18 09_New_Journey_Global_Peasant_3 ()}
	{MODIFY_UNIT x,y=18,18 facing sw}
	
	#дитина квестодавець
	{NAMED_GENERIC_UNIT 2 (Child) 14 14 09_New_Journey_Global_Child_1 ()}
	{MODIFY_UNIT x,y=14,14 facing se}
	
	##охоронці замку
	{NAMED_GENERIC_UNIT 2 (Royal Guard) 24 18 09_New_Journey_Global_Royal_Guard_1 ()}
	{MODIFY_UNIT x,y=24,18 facing se}
	
	{NAMED_GENERIC_UNIT 2 (Royal Guard) 26 18 09_New_Journey_Global_Royal_Guard_2 ()}
	{MODIFY_UNIT x,y=26,18 facing sw}
	
	{NAMED_GENERIC_UNIT 2 (Royal Guard) 25 17 09_New_Journey_Global_Royal_Guard_3 ()}
	{MODIFY_UNIT x,y=25,17 facing sw}
	
	{NAMED_GENERIC_UNIT 2 (Royal Warrior) 25 18 09_New_Journey_Global_Royal_Warrior_1 ()}
	{MODIFY_UNIT x,y=25,18 facing sw}
	{MODIFY_UNIT x,y=25,18 canrecruit yes}
	
	##усі села захоплені
	{CAPTURE_VILLAGES 1 1 1 100}
	
	[/event]
	
	#######################################
	######   INTERACTABLE OBJECTS
	
	{S9_SIGNPOSTS_LABELS _"Outskirts of Stormvale" 10,2 _"Північ — дикі та знищені війною землі. Будьте обережні, рушаючи далі!
Південь — Королівство Долини Штормів, яке радо прийме біженців зі спустошених земель." ()}
	{S9_SIGNPOSTS_LABELS _"Outskirts of Stormvale" 16,18 _"Північ — застава, за якою лежать дикі та знищені війною землі.
Схід — головне місто Долини Штормів та замок Його Величності.
Захід — початок гірського перевалу, що проведе до Королівств Серединних Земель." ()}
	
