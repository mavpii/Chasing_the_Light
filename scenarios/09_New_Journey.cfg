Огорджене плетеним парканом подвір'я має невеликі овочеві
грядки та посаджені задля краси квіти.

But its door seems to be locked."
	[/change_location]
	[/event]
	
	### HOUSE_3(18,17)
	{S9_LOAD_LOCATION _"Outskirts of Stormvale" _"Rural house" _"На березі озера Даеола знаходить звичайну хатину,
яка скоріше за все належить якомусь селянину та його сім'ї.

Ця будівля повністю збудована з дерева, починаючи з міцних 
стін та закінчуючи дахом, з якого стирчить кам'яний димар.
Огорджене плетеним парканом подвір'я має посаджені задля
краси квіти, а також невеликий причал для риболовлі.

Would you like to go inside?" "locations/house3_oil.png~BLIT("locations/frame.png",0,0)" 09_New_Journey_Rural_House.map 18,17 0 1,18}
	
	### FARMER'S HOUSE(34,16)
	{S9_LOAD_LOCATION _"Outskirts of Stormvale" _"Farmhouse" _"На сході від міста, вже поблизу високих гір, Даеола
знаходить розкішні поля, а також будинок фермера біля них.

На відміну від інших селянських хат, ця будівля цілком
збудована з каменю, майже без використання дерева. Огорджене
плетеним парканом подвір'я має посаджені задля краси квіти, а
також має вхід до пшеничних полів, що годують усе Королівство.

Would you like to go inside?" "locations/farmhouse_oil.png~BLIT("locations/frame.png",0,0)" 09_New_Journey_Farmhouse.map 34,16 0 2,19}
	
	### FISHERMAN'S HOUSE(29,11)
	{S9_LOAD_LOCATION _"Outskirts of Stormvale" _"Fisherman's cabin" _"На березі озера Даеола знаходить невелику самотню хатину,
що скоріше за все належить якомусь рибалці чи відлюднику.

Ця зроблена з соснового дерева будівля підіймається над
водою завдяки кільком десяткам високих палей, з усіх боків
її оточує високий очерет, а на причалі недбало розкидані
різноманітні рибацькі снасті та приладдя.

Would you like to go inside?" "locations/fisherman.png~BLIT("locations/frame.png",0,0)" 09_New_Journey_Fisherman.map 29,11 0 22,1}
	
	### SUSPICIOUS HOUSE(15,12) - FAISIM
	{S9_LOAD_LOCATION _"Outskirts of Stormvale" _"Suspicious house" _"Даеола підходить до сільського дому, який, незважаючи на
охайне подвір'я та розкішне поле пшениці поза ним, виглядає
вкрай підозріло.

Вікна цієї хати вибиті або пошкоджені, на частині стін
видніються сліди нещодавньої пожежі, а напіввідчинені
двері,з неприємним скрипом трохи гойдаються зі сторони
в сторону, наче запрошуючи чаклунку зайти всередину.

Would you like to go inside?" "locations/faisim_house_oil.png~BLIT("locations/frame.png",0,0)" 09_New_Journey_Faisim_House.map 15,12 0 15,19}
	
	### CURSED MEADOW(27,7)
	{S9_LOAD_LOCATION _"Outskirts of Stormvale" _"The Cursed Meadow" _"Блукаючи лісом, чуття привело Даеолу до місця сили, що
випромінювало доволі потужну магію Темряви.

Це була темна поляна посеред лісу, де чомусь зовсім не
було життя: трава тут повністю випалена якоюсь невідомою
силою, скрізь панує густий непроглядний туман, а вдалині,
посеред поляни, видніється величезне мертве дерево. 

Would you like to go inside?" "locations/meadow_oil.png~BLIT("locations/frame.png",0,0)" 09_New_Journey_Meadow.map 27,7 0 23,18}

