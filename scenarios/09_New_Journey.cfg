#textdomain wesnoth-ctl
[scenario]
    id=09_New_Journey
	#po: Нова подорож
    name= _ "New Journey"
    map_data="{~add-ons/Chasing_the_Light/maps/09_New_Journey__Global.map}"
	{DEFAULT_SCHEDULE}
	
	turns=-1
	carryover_percentage=0
    victory_when_enemies_defeated=no
	theme=Cutscene
	#next_scenario=10_Faisim

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg revelation.ogg}
	
	
#	[story]
#		[part]
#            #po: newlines at the beginning help to (depending on the screne size) center this vertically. The space at the end stops the last letter from getting cut off
#			#po: В гонитві за Світлом | Женучись за Світлом
#			#po: Частина Перша
#            title=_"<span font_family='Oldania ADF Std' size='90000'>
#
#
#<i>Story continued in: </i>
#“Chasing the Light: Chapter III”
# 
#</span>"
#            title_alignment=center
#        [/part]
#	[/story]
	
	[side]
        side=1
        id,defeat_condition=Daeola,never
		shroud=no
		fog=no
        controller=human
        team_name=Islefolk
		gold=0
        {FLAG_VARIANT loyalist}
        user_team_name=_"Daeola's Wanderers"
    [/side]
	
	[side]
        side=2
		color=red
		shroud=no
		fog=no
        controller=null
        team_name=Islefolk
        {FLAG_VARIANT loyalist}
    [/side]
	
	[side]
        side=3
		color=white
		shroud=no
		fog=yes
        controller=ai
        team_name=Monsters
    [/side]
	
	[event]
	name=prestart
	
	[unit]
		canrecruit=yes
		side,id,name,profile=1,Daeola,_"Daeola",portraits/daeola/daeola_L2.png
	    unrenamable=yes
        gender=female
        type=Daeola_L2
        x,y=22,20
    [/unit]
    {REFRESH_CASTER_ANIMATIONS id=Daeola}
	
	[if]
	[variable]
        name="Daeola_regen_necklace"
        equals=true
	[/variable]
	[then]
	    [modify_unit]
	        [filter]
	            id=Daeola
	        [/filter]
	        [abilities]
                {ABILITY_SELF_HEAL}
            [/abilities]
	    [/modify_unit]
	[/then][/if]
	
    {MODIFY_UNIT id=Daeola facing ne}
	{MODIFY_UNIT id=Daeola experience {ON_DIFFICULTY 80 70 60}}
	
	[scroll_to_unit]
	    id=Daeola
	    immediate=yes
	[/scroll_to_unit]
	
	{FIRE_EVENT 09_New_Journey__Global.map}
	
	[/event]
	
	[event]
	name=start
	
	{VARIABLE s9_current_location _"Outskirts of Stormvale"}
	{VARIABLE is_Daeola_free_move _"true"}
	
	{SPEAK Daeola _"TEST"}
	
	[/event]
	
	#free move
	[event]
        name=moveto
        first_time_only=no
        [filter]
            id=Daeola
        [/filter]
		{FILTER_CONDITION( {VARIABLE_CONDITIONAL is_Daeola_free_move equals true}  )}
		
        {MODIFY_UNIT (x,y=$x1,$y1) moves 6}
        {MODIFY_UNIT (x,y=$x1,$y1) attacks_left 1}
		[place_shroud][/place_shroud]
		[redraw]
	    side=1
	    clear_shroud = yes
	    [/redraw]
    [/event]
	
	#S9_LOAD_LOCATION LOC_NAME_CURRENT LOC_NAME_NEXT LOC_DESCRIPTION_NEXT IMAGE_PATH MAP_PATH XY_ENTRANCE XY_EXIT
	#вхід у місто з основної локації
	

