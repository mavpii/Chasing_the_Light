    #free move
	[event]
        name=moveto
        first_time_only=no
        [filter]
            id=Daeola
        [/filter]
		{FILTER_CONDITION( {VARIABLE_CONDITIONAL is_Daeola_free_move equals true}  )}
		
        {MODIFY_UNIT (x,y=$x1,$y1) moves 6}
        {MODIFY_UNIT (x,y=$x1,$y1) attacks_left 1}
		[place_shroud][/place_shroud]
		[redraw]
	    side=1
	    clear_shroud = yes
	    [/redraw]
    [/event]
[/scenario]