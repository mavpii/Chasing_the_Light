	#######################################
	######   INTERACTABLE OBJECTS
	
	{S9_SIGNPOSTS_LABELS _"Outskirts of Stormvale" 10,2 _"Північ — дикі та знищені війною землі. Будьте обережні, рушаючи далі!
Південь — Королівство Долини Штормів, яке радо прийме біженців зі спустошених земель." ()}
	{S9_SIGNPOSTS_LABELS _"Outskirts of Stormvale" 16,18 _"Північ — застава, за якою лежать дикі та знищені війною землі.
Схід — головне місто Долини Штормів та замок Його Величності.
Захід — початок гірського перевалу, що проведе до Королівств Серединних Земель." ()}
	
	#######################################
	
	#######################################
	######   TALKS WITH NPCS
	
	##івенти по типу коментарів та розмов з нпс
    ##two crossbowmen 
	#S9_TALK NPC_ID NPC_X NPC_Y FIRSTTIMEONLY WML
	
	#define S9_XBOW_COMMENT XBOWMAN
	[if]
	[variable]
	name=s9_crossbowman_hired
	equals=true
	[/variable]
	[and]
	[variable]
	name=s9_crossbowman_hired_comment
	not_equals=true
	[/variable]
	[/and]
	[then]
	
	{SPEAK {XBOWMAN} _"Тільки-но дай сигнал, пані, й ми підемо з тобою хоч на край світу, хех."}
	
	{VARIABLE s9_crossbowman_comment _"true"}
	{VARIABLE s9_crossbowman_hired_comment _"true"}
	[/then][/if]	
	
	[if]
	[variable]
	name=s9_crossbowman_comment
	not_equals=true
	[/variable]
	[then]
	
	{SPEAK {XBOWMAN} _"Гей ти, чаклунко, побалакай з нашим ватажком: може захочєш скористатся нашими послугами."}
	
	{VARIABLE s9_crossbowman_comment _"true"}
	[/then][/if]
	#enddef
	
	
	{S9_TALK _"Outskirts of Stormvale" 09_New_Journey_Global_Crossbowman_2 6 22 no (
	
	{S9_XBOW_COMMENT 09_New_Journey_Global_Crossbowman_2}
	
	)}
	{S9_TALK _"Outskirts of Stormvale" 09_New_Journey_Global_Crossbowman_3 7 22 no (
	
	{S9_XBOW_COMMENT 09_New_Journey_Global_Crossbowman_3}	
	
	)}
	
	#Crossbowman leader
    {S9_TALK _"Outskirts of Stormvale" 09_New_Journey_Global_Crossbowman_1 3 24 no (
	
	[if]
	[variable]
	name=s9_crossbowman_hired
	not_equals=true
	[/variable]
	[then]
	
	
	
	
	#completed var
	[if]
	[variable]
	name=s9_search_xbow
	not_equals=true
	[/variable]
	[then]
	    {SPEAK Daeola _"Доброго дня, чоловіче, ти тут головний серед найманців?"}
		{SPEAK 09_New_Journey_Global_Crossbowman_1 _"Так, а ви, певно, пані Даеола? Чутки про за ваші подвиги та добрі справи дійшли навіть сюди."}
		{SPEAK Daeola _"Король Долини Штормів порадив, що було б добре, якби твої люди доєдналися до мого походу на північ. Скільки коштує вас найняти?"}
		{SPEAK 09_New_Journey_Global_Crossbowman_1 _"Ми б не хотіли прислужуватися чаклунам, проте лише заради вас ми допоможемо усього за 100 золотих."}
		{SPEAK Daeola _"За ці гроші я можу найняти з десяток сильних воїнів, а ви лише гарні в дальньому бою. Не хочеш скинути ціну, заради мене?"}
		{SPEAK 09_New_Journey_Global_Crossbowman_1 _"Хай, але якщо ви спочатку знайдете одну важливу річ. Мій товариш Алин загубив свій арбалет десь на північ від нашого табору, якщо принесете його — поступлюся на половину плати."}
	    {SPEAK Daeola _"Домовилися, я негайно вирушу на пошуки."}
		
        ##CHANGE objectives
	
	    {VARIABLE s9_search_xbow _"true"}
		
		##TEST
		##{VARIABLE s9_found_xbow _"true"}
	[/then]
	#додати повторне пояснення локації арбалету
	[elseif]
	[variable]
	name=s9_search_xbow
	equals=true
	[/variable]
	[and]
	[variable]
	name=s9_found_xbow
	equals=true
	[/variable]
	[/and]
	[then]
	
	    {SPEAK 09_New_Journey_Global_Crossbowman_1 _"Чудово, ви якимось дивом вдалося знайти арбалет мого товариша. Це було нелегко, чи не так?"}
	    {SPEAK Daeola _"Допомога жителям Зеленого Острову приносить мені радість, тому ні, зовсім неважко."}
	    
	    [message]
            speaker=09_New_Journey_Global_Crossbowman_1
            message= _ "Хай там як, я знижу ціню за наші послуги — 5 досвідчених арбалетчиків усього за ЗМІНИТИ золотих."
            [option]
                label= _ "Ім'ям Світла, сподіваюся, що це будуть недарма витрачені кошти."
                [command]
	    		    [store_gold]
	    			side=1
	    			[/store_gold]
	    			
	    			[if]
	    			[variable]
	    			name=gold
	    			greater_than_equal_to=50 ##CHANGE
	    			[/variable]
	    			[then]
	    			
	                [sound]
                        name=gold.ogg
                    [/sound]
	    			
	    		    [gold]
                        side=1
                        amount=-50 ##CHANGE
                    [/gold]
	    			[redraw][/redraw]			
	    		
	    		    {SPEAK 09_New_Journey_Global_Crossbowman_1 _"Радий мати з вами справу, обіцяю, ви не не пошкодуєте про цю угоду. Тож коли ми відправляємося в дорогу?"}
	                {SPEAK Daeola _"Я ще маю справи у Долині Штормів, тому твоєму загону доведеться трохи зачекати."}
	                {SPEAK 09_New_Journey_Global_Crossbowman_1 _"Як скажете, пані чаклунко."}
	                {VARIABLE s9_crossbowman_hired _"true"}
	    			
	    			[/then]
	    			[else]
	    			
	    			{SPEAK 09_New_Journey_Global_Crossbowman_1 _"Здається, ви не розчули мене: я сказав, що наші послуги коштують ЗМІНИТИ золотих... Приходьте, коли у вас буде потрібна сума."}
	    			
	    			[/else][/if]
	            [/command]
            [/option]
            [option]
	    	    label= _ "Я досі не впевнена, що це найкраща витрата золота..."
                [command]
	    		    {SPEAK 09_New_Journey_Global_Crossbowman_1 _"Якщо все ж передумаєте, я чекатиму тут."}
                [/command]
            [/option]
        [/message]
	
	[/then][/elseif]
	[else]
	    {SPEAK 09_New_Journey_Global_Crossbowman_1 _"Алин казав, що загубив арбалет десь на півночі від табору, тому гадаю, вам потрібно пошукати десь там."}
	[/else][/if]
	
	
	
	
	[/then]
	[else]
	
	{SPEAK 09_New_Journey_Global_Crossbowman_1 _"Наші мечі та арбалети готові служити вам, пані Даеоло — тільки-но подайте сигнал, й ми рушимо з вами хоч на край світу."}
	
	[/else][/if]
	
	)}
	
	#Child
	{S9_TALK _"Outskirts of Stormvale" 09_New_Journey_Global_Child_1 14 14 no ()}
	
	#Peasants
	{S9_TALK _"Outskirts of Stormvale" 09_New_Journey_Global_Peasant_3 18 18 yes ()}
	
	{S9_TALK _"Outskirts of Stormvale" 09_New_Journey_Global_Peasant_1 31 17 no ()}
	{S9_TALK _"Outskirts of Stormvale" 09_New_Journey_Global_Peasant_2 32 18 no ()}
