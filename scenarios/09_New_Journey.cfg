	### STORMVALE(25,19)
	{S9_LOAD_LOCATION _"Outskirts of Stormvale" _"The city of Stormvale" _"Daeola sees a large wooden palisade in front of her, behind
which stone houses and a large royal castle can be found.

This is the main city of Stormvale, which was founded only
about 40 years ago from refugees of the Northern Kingdoms,
which fell under the onslaught of the Wesfolk and their
legions of undead.

Would you like to go inside?" "locations/stormvale.png~BLIT("locations/frame.png",0,0)" 09_New_Journey_Castle_Main.map 25,19 0 12,14}
	
	### HOUSE_1(22,18)
	{S9_LOAD_LOCATION _"Outskirts of Stormvale" _"Village hut" _"Неподалік від міста Даеолі зустрічається звичайна хатина,
яка скоріше за все належить якомусь селянину та його сім'ї.

Ця будівля повністю збудована з дерева, починаючи з міцних 
стін та закінчуючи дахом, з якого стирчить кам'яний димар.
Огорджене плетеним парканом подвір'я має невеликі овочеві
грядки та посаджені задля краси квіти.

Would you like to go inside?" "locations/house1_oil.png~BLIT("locations/frame.png",0,0)" 09_New_Journey_Peasant_Hut.map 22,18 0 23,10}
	
