	##################
	## CAMP RUINS ##
	##################
	[event]
	    name=preload
	    first_time_only=no
	    [lua]
	        code=<<
	            local tents = { Vct = true, Vdt = true, Vdr = true }

            function s12_walk(id, xs, ys)
                local xl, yl = {}, {}
                for v in xs:gmatch("%d+") do xl[#xl + 1] = tonumber(v) end
                for v in ys:gmatch("%d+") do yl[#yl + 1] = tonumber(v) end
                for w = 1, #xl do
                    local u = wesnoth.units.get(id)
                    if not u then return end
                    local path = wesnoth.paths.find_path(u, xl[w], yl[w], { ignore_units = false })
                    if not path or #path < 2 then
                        wesnoth.wml_actions.move_unit{ id = id, to_x = xl[w], to_y = yl[w], fire_event = false }
                        wesnoth.wml_actions.redraw{ side = "1,2", clear_shroud = true }
                    else
                        for k = 2, #path do
                            local step = path[k]
                            wesnoth.wml_actions.move_unit{ id = id, to_x = step.x or step[1], to_y = step.y or step[2], fire_event = false }
                            wesnoth.wml_actions.redraw{ side = "1,2", clear_shroud = true }
                        end
                    end
                end
            end

	            function s12_ruin_hex(x, y)
	                local code = wesnoth.current.map[{ x, y }]
	                local base, overlay = code:match("^([^%^]*)%^?(.*)$")
	                if base:match("^[CK]") then
	                    if overlay:match("^Qh") then
	                        wesnoth.wml_actions.terrain{ x = x, y = y, terrain = "Rb^" .. overlay }
	                        wesnoth.wml_actions.item{ x = x, y = y, image = "scenery/rubble.png" }
	                    else
	                        wesnoth.wml_actions.terrain{ x = x, y = y, terrain = "Rb^Dr" }
	                    end
	                    return true
	                elseif overlay:match("^V") then
	                    wesnoth.wml_actions.terrain{ x = x, y = y, terrain = base }
	                    local image = tents[overlay] and "scenery/tent-ruin-1.png"
	                        or ("scenery/village-human-burned" .. ((x + y) % 4 + 1) .. ".png")
	                    wesnoth.wml_actions.item{ x = x, y = y, image = image }
	                    return true
	                elseif overlay == "Ecf" or overlay == "Ebn" then
	                    wesnoth.wml_actions.terrain{ x = x, y = y, terrain = base .. "^" .. (overlay == "Ecf" and "Edb" or "Eb") }
	                    return true
	                end
	                return false
	            end
	        >>
	    [/lua]
	[/event]

