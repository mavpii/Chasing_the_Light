	##half hp and random xp for wounded units
	[event]
	name=recruit
	first_time_only=no
	    [filter]
		    side=1
		[/filter]
		
		{VARIABLE_OP random_hitpoints rand ("$($unit.max_hitpoints/3)".."$($unit.max_hitpoints/2)")}
        {VARIABLE_OP random_experience rand (1.."$($unit.max_experience/2)")}

        [modify_unit]
		    [filter]
			    id=$unit.id
			[/filter]
			hitpoints=$random_hitpoints
			experience=$random_experience
		[/modify_unit]
        {CLEAR_VARIABLE random_hitpoints,random_experience}	
	[/event]
	
