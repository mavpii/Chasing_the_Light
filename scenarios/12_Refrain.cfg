	##########################
	## DEFENSE TURN COUNTER ##
	##########################
#define S12_DEFENSE_TURN_DISPATCH EVENT PREFIX
	[event]
	    name={EVENT}
	    first_time_only=no
	    [filter_condition]
	        [variable]
	            name=s12_defense_start
	            greater_than=0
	        [/variable]
	    [/filter_condition]

	    {VARIABLE s12_defense_turn "$($turn_number - $s12_defense_start + 1)"}

	    [fire_event]
	        name={PREFIX}$s12_defense_turn
	    [/fire_event]
	[/event]
#enddef
	{S12_DEFENSE_TURN_DISPATCH (new turn) s12_turn_}
	{S12_DEFENSE_TURN_DISPATCH (side 4 turn) s12_side4_turn_}
	{S12_DEFENSE_TURN_DISPATCH (side 6 turn) s12_side6_turn_}
#undef S12_DEFENSE_TURN_DISPATCH
	
	#####################
	## AI RECRUIT CAPS ##
	#####################
#define S12_RECRUIT_CAP SIDE CAP RECRUIT_LIST
	[event]
	    name=side {SIDE} turn
	    first_time_only=no
	    
	    [if]
	        [have_unit]
	            side={SIDE}
	            count={CAP}-999
	        [/have_unit]
	        [then]
	            [set_recruit]
	                side={SIDE}
	                recruit=""
	            [/set_recruit]
	        [/then]
	        [else]
	            [set_recruit]
	                side={SIDE}
	                recruit={RECRUIT_LIST}
	            [/set_recruit]
	        [/else]
	    [/if]
	[/event]
#enddef
