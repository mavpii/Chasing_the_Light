##Гаралін та Даеола приходять через ліс, трошки балакають та виходять до застави
##Там вони бачать трупи гарнізону, відчувають, що щось не так, бачать, що трупи зовсім недавні, і далі мають відбитися від тіней та дістатися до табору
##Першу тінь Даеола зносить у катсцені, рятуючи Гараліна, а далі вже геймплейно вони мають дістатися до місця використовуючи Варди та ще якісь закляття для захисту
##Вони добираються до табору, там поранені та маги які розставили світильники щоб захиститися від духів. Вони явно індикують, що знають це закляття від Даеоли
## Даеола піднімає бар'єр навколо бази, підсилюючи захист. Тобто, вона не з нуля створює його, а просто підсилє вже існуючі закляття, тому що все ж для неї однієї це було б надто потужно, навіть для лвл3
##Починається оборона по плану. Йде ще одна розмова Д+Г, скріптована, де вони обговорюють шанси на перемогу та можливість самопожертви, обов'язково згадується, що ніч триває аномально довго
##Приходить Ленван. Вони говорять. Він впізнає них. Гараліна, тому що бачив його колись давно на переправі у Скархейна та відчував його другу душу. Даеолу, бо багато про неї чув як від острів'ян, так і від західняків
##Він пропонує їм приєднатися та покінчити з війно, після відмови демонструє свою силу, підіймаючи усі трупи на карті. потім руйнує бар'єр
##Гараліна та Даеолу важко ранять, інших убивають та починається катсцена. Вони важкопоранені знаходяться посеред зруйнованого табору, повністю оточені людьми та мерцями Ленвана
##Ленван спокушає Даеолу, щоб вона доєдналася до нього. пропонує різні штуки та помилувати Гараліна та усіх її близьких. Даеола згадує розмови з Гараліном, Файсім
##Вона робить вигляд, ніби вже готова погодитися. Гаралін розуміє, що відбувається. Ленван підходить до неї ближче, далі вона бере руку Ленвана та раптом заявляє, що
##цьому ніколи не бувати. Вона викрикує закляття та простір починає блимати та трястися. Ленван кричить своїм людям, щоб вони забиралися якнайдалі, проте запізно - Даеола черпає невідому силу зі свого обруча,
##світильники на мапі загоряються та вона підірває себе дуже потужною магією світла.
##Перед вибухом помітно, що Гаралін зникає в телепорті
##Все трясеться, все біле, але коли все розвіюється... Скрізь випалена земля, зруйновані будівлі, озера лави... Усі західняки мертві,
##але Ленван стоїть посеред кратеру, лише з невеликим пораненням в 1-10 хп
##Кілька секунд нічого не відбувається, абсолютна тиша. Далі Ленван оглядається навколо, жалкує, що все його військо, майже всі його люди
##загинули. Він вважає, що це було варто того, щоб знищити Пророчицю Світла та Першого мага Острову.
##Він каже, що нарешті все скінчено, але для перемоги ще потрібен час, тому він уходить на північ і сценарій закінчується

