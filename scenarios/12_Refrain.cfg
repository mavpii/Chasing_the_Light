	###################
	## ENERGY SHIELD ##
	###################
	[event]
	    name=enter hex
	    id=s12_shield_breach
	    first_time_only=no
	    [filter]
	        side=1
	    [/filter]
	    [filter_condition]
	        [have_location]
	            x,y=$x2,$y2
	            [and]
	                {S12_SHIELD_AREA}
	            [/and]
	        [/have_location]
	        [not]
	            [have_location]
	                x,y=$x1,$y1
	                [and]
	                    {S12_SHIELD_AREA}
	                [/and]
	            [/have_location]
	        [/not]
	    [/filter_condition]
	
	    {VARIABLE S12_Shield_Breach yes}
	    [cancel_action][/cancel_action]
	[/event]
	
	[event]
	    name=moveto
	    id=s12_shield_punish
	    first_time_only=no
	    [filter]
	        side=1
	    [/filter]
	    [filter_condition]
	        [variable]
	            name=S12_Shield_Breach
	            boolean_equals=yes
	        [/variable]
	    [/filter_condition]
	
	    {CLEAR_VARIABLE S12_Shield_Breach}
	
	    [if]
	        [not]
	            [have_location]
	                x,y=$x1,$y1
	                [and]
	                    {S12_SHIELD_AREA}
	                [/and]
	            [/have_location]
	        [/not]
	        [then]
	            [store_locations]
	                x,y=$x1,$y1
	                radius=1
	                [not]
	                    x,y=$x1,$y1
	                [/not]
	                [not]
	                    [filter][/filter]
	                [/not]
	                [not]
	                    terrain=X*,*^X*
	                [/not]
	                [not]
	                    {S12_SHIELD_AREA}
	                [/not]
	                variable=s12_shield_gaunt_hexes
	            [/store_locations]
	
	            [if]
	                [variable]
	                    name=s12_shield_gaunt_hexes.length
	                    greater_than=0
	                [/variable]
	                [then]
	                    {VARIABLE_OP s12_shield_gaunt_i rand "0..$($s12_shield_gaunt_hexes.length-1)"}
	
	                    [unit]
	                        side=4
	                        id=s12_shield_gaunt
	                        type=Nightgaunt_Shield
	                        x,y=$s12_shield_gaunt_hexes[$s12_shield_gaunt_i].x,$s12_shield_gaunt_hexes[$s12_shield_gaunt_i].y
	                        animate=yes
	                    [/unit]
	
	                    [harm_unit]
	                        {FILTER id=$unit.id} {FILTER_SECOND id=s12_shield_gaunt}
	                        [primary_attack]
	                            name=claws
	                        [/primary_attack]
	                        amount=25
	                        animate,kill,fire_event=yes,yes,yes
	                        experience=no
	                    [/harm_unit]
	
	                    [kill]
	                        id=s12_shield_gaunt
	                        animate=no
	                    [/kill]
	                [/then]
	                [else]
	                    [harm_unit]
	                        {FILTER id=$unit.id}
	                        amount=25
	                        animate,kill,fire_event=yes,yes,yes
	                        experience=no
	                    [/harm_unit]
	                [/else]
	            [/if]
	
	            {MODIFY_UNIT id=$unit.id moves 0}
	            {CLEAR_VARIABLE s12_shield_gaunt_hexes,s12_shield_gaunt_i}
	        [/then]
	    [/if]
	[/event]
	
