	    {MODIFY_UNIT id=Haralin facing se}
	    {MODIFY_UNIT id=Daeola facing se}

	    [lua]
	        code=<<
	            local args = ...
	            local walk = {}
	            for _, loc in ipairs(wesnoth.map.find(wml.get_child(args, "walk"))) do
	                walk[loc.x * 1000 + loc.y] = true
	            end
	            local twin = { Fdf = "FdfX", Fmf = "FmfX", Edb = "EdbX", Efm = "EfmX", Ecf = "EcfX" }
	            local hero = wesnoth.units.get("Haralin")
	            local walls, seen = {}, {}
	            for key in pairs(walk) do
	                local x, y = key // 1000, key % 1000
	                for _, n in ipairs(wesnoth.map.find{ wml.tag["and"]{ x = x, y = y, radius = 1 } }) do
	                    local k = n.x * 1000 + n.y
	                    if not walk[k] and not seen[k] then
	                        seen[k] = true
	                        local code = wesnoth.current.map[{ n.x, n.y }]
	                        if hero:movement_on(code) < 99 then
	                            local base, overlay = code:match("^([^%^]*)%^?(.*)$")
	                            local new_overlay = twin[overlay] or "Xo"
	                            table.insert(walls, { x = n.x, y = n.y, terrain = code })
	                            wesnoth.wml_actions.terrain{ x = n.x, y = n.y, terrain = base .. "^" .. new_overlay }
	                        end
	                    end
	                end
	            end
	            wml.array_access.set("s12_walls", walls)
	        >>
	        [args]
	            [walk]
	                {S12_WALK_AREA}
	            [/walk]
	        [/args]
	    [/lua]
