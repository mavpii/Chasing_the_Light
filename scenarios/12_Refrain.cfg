	        name=s12_barrier_repel
	    [/fire_event]
	[/event]

	[event]
	    name=s12_barrier_repel
	    id=s12_shield_repel
	    first_time_only=no

	    [lua]
	        code=<<
	            local args = ...
	            local tr = wesnoth.textdomain "wesnoth-ctl"
	            local area = wesnoth.map.find(wml.get_child(args, "area"))
	            local inside = {}
	            for _, loc in ipairs(area) do
	                inside[loc.x * 1000 + loc.y] = true
	            end
	            local function is_inside(x, y)
	                return inside[x * 1000 + y] == true
	            end
	            local function passable(x, y)
	                local t = wesnoth.current.map[{ x, y }]
	                return t ~= nil and not t:find("^X") and not t:find("%^X")
	            end
	            local function free(x, y)
	                return passable(x, y) and wesnoth.units.get(x, y) == nil
	            end

	            local pref_id = wml.variables["s12_breach_id"]
	            local pref_x = wml.variables["s12_breach_x"]
	            local pref_y = wml.variables["s12_breach_y"]
	            wml.variables["s12_breach_id"] = nil
	            wml.variables["s12_breach_x"] = nil
	            wml.variables["s12_breach_y"] = nil

	            local ids = {}
	            for _, u in ipairs(wesnoth.units.find_on_map{ side = "1,2" }) do
	                if not is_inside(u.x, u.y) and not u.status.petrified
	                    and u.type ~= "Brazier" and u.type ~= "Brazier_Duty" then
	                    table.insert(ids, u.id)
	                end
	            end

	            for _, id in ipairs(ids) do
	                local u = wesnoth.units.get(id)
	                local gx, gy
	                for _, loc in ipairs(wesnoth.map.find{
	                    wml.tag["and"]{ x = u.x, y = u.y, radius = 1 },
	                    wml.tag["not"]{ x = u.x, y = u.y }
	                }) do
	                    if not gx and not is_inside(loc.x, loc.y) and free(loc.x, loc.y) then
	                        gx, gy = loc.x, loc.y
	                    end
	                end

	                if gx then
	                    wesnoth.wml_actions.unit{
	                        side = 4, id = "s12_shield_gaunt", type = "Nightgaunt_Shield",
	                        x = gx, y = gy, animate = true
	                    }
	                    wesnoth.wml_actions.harm_unit{
	                        wml.tag.filter{ id = id },
	                        wml.tag.filter_second{ id = "s12_shield_gaunt" },
	                        wml.tag.primary_attack{ name = "claws" },
	                        amount = 25, animate = true, kill = true, fire_event = true, experience = false
	                    }
	                    wesnoth.wml_actions.kill{ id = "s12_shield_gaunt", animate = true, fire_event = false }
	                else
	                    wesnoth.wml_actions.harm_unit{
	                        wml.tag.filter{ id = id },
	                        amount = 25, animate = true, kill = true, fire_event = true, experience = false
	                    }
	                end

	                u = wesnoth.units.get(id)
	                if u and u.valid == "map" and not is_inside(u.x, u.y) then
	                    local tx, ty
	                    if id == pref_id and pref_x and free(pref_x, pref_y) then
	                        tx, ty = pref_x, pref_y
	                    else
	                        local best
	                        for _, loc in ipairs(area) do
	                            if free(loc.x, loc.y) then
	                                local d = wesnoth.map.distance_between(u.x, u.y, loc.x, loc.y)
	                                if not best or d < best then
	                                    best, tx, ty = d, loc.x, loc.y
	                                end
	                            end
	                        end
	                    end
	                    if tx then
	                        wesnoth.interface.delay(700)
	                        if not wml.variables["s12_shield_warned"] then
	                            wml.variables["s12_shield_warned"] = true
	                            wesnoth.wml_actions.message{ speaker = id, message = tr"TEST" }
	                        end
	                        wesnoth.wml_actions.move_unit{ id = id, to_x = tx, to_y = ty, fire_event = false }
	                    end
	                    u = wesnoth.units.get(id)
	                    if u then
	                        u.moves = 0
	                    end
	                end
	            end
	        >>
	        [args]
	            [area]
	                {S12_SHIELD_AREA}
	            [/area]
	        [/args]
	    [/lua]
	[/event]
#enddef

##Гаралін та Даеола приходять через ліс, трошки балакають та виходять до застави
##Там вони бачать трупи гарнізону, відчувають, що щось не так, бачать, що трупи зовсім недавні, і далі мають відбитися від тіней та дістатися до табору
##Першу тінь Даеола зносить у катсцені, рятуючи Гараліна, а далі вже геймплейно вони мають дістатися до місця використовуючи Варди та ще якісь закляття для захисту
##Вони добираються до табору, там поранені та маги які розставили світильники щоб захиститися від духів. Вони явно індикують, що знають це закляття від Даеоли
## Даеола піднімає бар'єр навколо бази, підсилюючи захист. Тобто, вона не з нуля створює його, а просто підсилє вже існуючі закляття, тому що все ж для неї однієї це було б надто потужно, навіть для лвл3
##Починається оборона по плану. Йде ще одна розмова Д+Г, скріптована, де вони обговорюють шанси на перемогу та можливість самопожертви, обов'язково згадується, що ніч триває аномально довго
##Приходить Ленван. Вони говорять. Він впізнає них. Гараліна, тому що бачив його колись давно на переправі у Скархейна та відчував його другу душу. Даеолу, бо багато про неї чув як від острів'ян, так і від західняків
##Він пропонує їм приєднатися та покінчити з війно, після відмови демонструє свою силу, підіймаючи усі трупи на карті. потім руйнує бар'єр
##Гараліна та Даеолу важко ранять, інших убивають та починається катсцена. Вони важкопоранені знаходяться посеред зруйнованого табору, повністю оточені людьми та мерцями Ленвана
##Ленван спокушає Даеолу, щоб вона доєдналася до нього. пропонує різні штуки та помилувати Гараліна та усіх її близьких. Даеола згадує розмови з Гараліном, Файсім
##Вона робить вигляд, ніби вже готова погодитися. На фоні загоряються світильники. Гаралін розуміє, що відбувається. Ленван підходить до неї ближче, далі вона бере руку Ленвана та раптом заявляє, що
##цьому ніколи не бувати. Вона викрикує закляття та простір починає блимати та трястися. Але Ленван перебиває її закляття, каже що все бачить та вбиває її. Після цього він хоче вже вбити Гараліна,
##але він зникає в телепорті Ленван оглядається, дуже злий і коментує, що догадується чих рук це може бути справа, але каже, що розбереться з цим пізніше. І в будь-якому разі йому вдалося знищити Пророчицю Світла
##він уходить на північ і сценарій закінчується

