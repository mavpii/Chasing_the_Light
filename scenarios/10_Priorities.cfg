		{SPEAK Haralin _"Я гадав, що якщо зійдуся з Карором у дуелі, то зможу його перемогти й виправити все, але ця підла потвора наслала на мене прокляття і вбила Джуанга."}
		{SPEAK Asa _"Але хіба прокляття діє на тебе, Гараліне? Минуло вже більше години, а Старого Джуанга воно перетворило на чудовисько миттєво..."}
		[/then]
		[else]
		{SPEAK Haralin _"Я гадав, що якщо зійдуся з Карором у дуелі, то зможу його перемогти й виправити все, але ця підла потвора вчепилася в мене та наслала прокляття."}
		{SPEAK Asa _"Але хіба прокляття діє на тебе? Минуло вже більше години, інших воно перетворює на чудовиськ миттєво..."}
		[/else][/if]
		
		{SPEAK Haralin _"Воно діє, <i>я відчуваю</i> це... Поки мені вдається сповільнювати його силою Світла, але... схоже, це лише відтягування неминучого..."}
