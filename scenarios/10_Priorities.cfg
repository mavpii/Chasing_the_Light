		{S10_RECALL_UNITS 35 8 Swordsman      }
		{S10_RECALL_UNITS 38 14 Swordsman     }
		{S10_RECALL_UNITS 40 13 Longbowman    }
		{S10_RECALL_UNITS 39 16 Bandit_Peasant}
