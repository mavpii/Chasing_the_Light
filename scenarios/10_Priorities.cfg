#textdomain wesnoth-ctl
{JOURNAL 10_Priorities _"Priorities" no}

[scenario]
    id=10_Priorities
    name= _ "Priorities"
    map_data="{~add-ons/Chasing_the_Light/maps/10_Priorities.map}"
	
	{MODIFICATION_COLORSHIFT_MIDLANDS 3}

    victory_when_enemies_defeated=no
	next_scenario=11_Duty
	turns={ON_DIFFICULTY 8 6 4}
	carryover_percentage=0
	theme=Cutscene
	{RAIN}

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg into_the_shadows.ogg}
	
	[story]
        [part]
		#po: Поки Даеола готувалася прийняти участь у поході, що мав остаточно визначати долю цієї війни, на іншому кінці Зеленого Острову події складалися зовсім не на користь сторони Світла...
		    story= _ "While Daeola was preparing to take part in the campaign that would ultimately decide the fate of this war, on the other side of the Green Isle, events were unfolding not in favour of the side of Light..."
            {CTL_GREEN_ISLE_BIGMAP}
			 {OLD_BATTLE 765 623}
		[/part]
		[part]
		#po: Війську Південної Бухти не лише не вдалося відігнати ворогів від Чистих Вод, навпаки — воно зазнало нищівної поразки через могуть західняцьких чаклунів та їхнє число, а його головнокомандувача було поранено. І тепер залишки цього війська відчайдушно відступали вглиб Вічноосіннього Лісу, тікаючи від орд мерців та проклятих острів'ян на чолі з самим Владикою-Лічом Карором.
		    story= _ "Not only did the army of Southbay fail to drive the enemies away from Clearwater Port, but it suffered a crushing defeat with its commander wounded. And now the remnants of this army were desperately retreating deep into the depths of Everwindy Forest, fleeing from the hordes of undead and Cursed Islefolk led by Lich-Lord Caror himself."
            {CTL_GREEN_ISLE_BIGMAP}
			 {OLD_BATTLE 765 623}
		[/part]
	[/story]
	
	{CTL_GI_TRACK {JOURNEY_10} }
	
	{DEFAULT_SCHEDULE_DUSK}
	
	[side]
	    side=1
		color=red
	    id,defeat_condition=Haralin,never
        {GOLD 100 75 50}
        {INCOME 20 15 10}
        controller=human
        team_name=Islefolk
        shroud=yes
        fog=no
        {FLAG_VARIANT long}
        user_team_name=_"Haralin's Army"
    [/side]
	{STARTING_VILLAGES_ALL 1}

    [side]
        side=2
		controller=ai
        shroud=yes
        fog=no
        team_name=Wesfolk
		#po: Західняцькі загарбники
        user_team_name=_ "Wesfolk Invaders"
        {FLAG_VARIANT undead}
        recruit=Wesfolk Fighter, Skeleton, Skeleton Archer, Footpad, Walking Corpse
		[ai]
            aggression=1.0
			simple_targeting=yes
        [/ai]
    [/side]
	
	[side]
        side=3
		controller=ai
		color=black
        shroud=yes
        fog=no
        team_name=Wesfolk,Islefolk
        user_team_name=_ "Cursed Army"
        {FLAG_VARIANT undead}
        recruit=Wesfolk Fighter, Skeleton, Skeleton Archer, Footpad, Walking Corpse
		[ai]
            aggression=1.0
			simple_targeting=yes
        [/ai]
    [/side]
	
	[side]
        side=4
		controller=null
		color=islefolk
        shroud=yes
        fog=no
		hidden=yes
        team_name=Islefolk
    [/side]
	
    [event]
    name=prestart
	
        [objectives]
			[objective]
                description=_ "Destroy the vanguard of the enemy army"
                condition=win
            [/objective]
			[objective]
			    #po: Загибель Гараліна
                description= _ "Death of Haralin"
                condition=lose
            [/objective]
			[objective]
			    #po: Загибель Аси
                description= _ "Death of Asa"
                condition=lose
            [/objective]
            [gold_carryover]
                carryover_percentage=0
            [/gold_carryover]
        [/objectives]
		
		##starting spawns
		
		{RECALL_XY Haralin 49 4}
	    [store_unit]
            {FILTER id=Haralin}
            variable,kill=Haralin,yes
        [/store_unit]
		[unit]
            type,name=Haralin_L3,_"Haralin"
			id=Haralin
			hitpoints=35
			gander=male
			canrecruit=yes
            unrenamable=yes
            x,y,profile=$Haralin.x,$Haralin.y,portraits/haralin/Haralin_L3.png
			[modifications]
                [trait]
                    id,name,description=loyal_dummy,loyal,_"Zero upkeep."
                [/trait]
                [trait]
                    id,name,description=intelligent_dummy,intelligent,""
                [/trait]
            [/modifications]
        [/unit]
        {CLEAR_VARIABLE Haralin}
        {MODIFY_UNIT id=Haralin facing sw}
		{MODIFY_UNIT id=Haralin experience ({ON_DIFFICULTY 80 70 60})}
        [set_extra_recruit]
            id=Haralin
            extra_recruit=Apprentice, Mage, Bowman, Fencer, Spearman
        [/set_extra_recruit]
		
		{VARIABLE Haralin_unlocked_spells $caster_Haralin.spell_unlocked}
		
		#Певну кількість заклять з TDG було прибрано, тому що від них не було ніякої користі або вони не пасували Гараліну
		[modify_caster]
		[filter]
		id=Haralin
		[/filter]
		##атаки
		spell_group_1 = skill_magic_blast,  skill_fireball2,   skill_lightning,          skill_rage,             skill_dancing_daggers 
		##пов'язане з рухом, захисні                                           
		##skill_regenerate за досвід відновлює все здоров'я
		##skill_camouflage невидимість вибір (вночі, в лісі, в селах. Активується кнопками як у поліморфа)
		#skill_etherealness ультимативне - полишити тіло(створюється фантом, яким можна рухатися, поки тіло чілить)
		spell_group_2 = skill_levitate,     skill_flight,      skill_shield,             skill_polymorph,        skill_regenerate, skill_camouflage, skill_etherealness
		#support закляття
		##Активне skill_sacrifice(обирається ціль через TRSS(ворожа чи своя) - якщо вона помирає впродовж 2 ходів стається вибух)
		##Активне skill_invincible обраний юніт стає невразливим на час свого ходу
		##Пасивне skill_duty(померлі союзники повертаються як мерці, високорівневі привиди, ультимативний)
		spell_group_3 = skill_mnemonic,     skill_glamour,     skill_find_familiar,      skill_panacea,          skill_sacrifice,             skill_invincible,    skill_duty
		#елементальні закляття 
		#skill_blizzard відкривається у S14 
		#skill_terrashift наносить шкоду усім довкола(reused Nature's Revenge)
		#skill_electrify(якщо ворог стоїть поряд з іншими ворогами, то вони отримують 60 чи 80 відсотків його шкоди після атаки гараліна)
		#skill_golem великий голем з h2tt(ультимативне)
		spell_group_4 = skill_summon,       skill_bend,        skill_stasis,              skill_blizzard,  skill_terrashift, skill_electrify, skill_golem
		#Катаклізми
		##, Eternal Timezone(зміна ToD на обрану до кінця сценарію)
		## Викривлення реальності(перетворює мапу на щось інше(терейн поверхності, мертві юніти гараліна на лоялістів)
		spell_group_5 = skill_time_dilation,  skill_cataclysm, skill_timezone, skill_reality
		spell_group_6 = $necklace_spell
		unlocked_spells = $Haralin_unlocked_spells|,skill_flight,skill_lightning,skill_stasis,skill_panacea
		equipped_spells = skill_flight,skill_lightning,skill_stasis,skill_panacea
		#spellcasting_allowed = false
		[/modify_caster]
		{REFRESH_CASTER_ANIMATIONS id=Haralin}
		{CASTER_STATUS id=Haralin false}
		
		{RECALL_XY Asa 50 4}
		
	    [modify_unit]
		    [filter]
		        id=Asa
		    [/filter]
		    name=_"Lieutenant Asa"
			profile=portraits/asa/asa_chapter3.png
			facing=sw
	    [/modify_unit]
		
		{RECALL_XY Zeham 50 2}
		[if]
		[have_unit]
		id=Zeham
	    [/have_unit]
		[then]
		
		{MILESTONE zeham_priorities no}
		
		[store_unit]
            {FILTER id=Zeham}
            variable,kill=Zeham,no
        [/store_unit]
		
		[if]
		[variable]
		name=Zeham.level
		less_than_equal_to=2
		[/variable]
		[then]
		    {TRANSFORM_UNIT id=Zeham Knight}
		[/then]
		[else]
		    {TRANSFORM_UNIT id=Zeham (Grand Knight)}
		[/else][/if]
		{FULL_HEAL id=Zeham}
		[/then][/if]
		{MODIFY_UNIT id=Zeham name _"Sir Zeham"}
		{MODIFY_UNIT id=Zeham profile "portraits/humans/grand-knight-2.webp"}
		{MODIFY_UNIT id=Zeham facing sw}
		{MODIFY_UNIT id=Zeham moves Zeham.max_moves}
		{CLEAR_VARIABLE Zeham}
		
		{RECALL_XY Dolmannumbil 52 4}
		[object]
            silent=yes
            duration=forever
	    	[filter]
	    	    id=Dolmannumbil
	    	[/filter]
            [effect]
                apply_to=image_mod
	          	add=PAL(fefe72,f5da30,0b7a6d,235355,b3f08b,68c552,4cc934,81a435,718204,466818,3b5f0e,0d3d02,1f4b1f > f5c37a,e7805e,826e2f,47213c,f6d39b,e7c767,e7c767,ae6a42,904d39,75491e,75491e,321d0b,75491e)	
            [/effect]
        [/object]
		{MODIFY_UNIT id=Dolmannumbil facing sw}
		{MODIFY_UNIT id=Dolmannumbil type "Wose Shaman"}
		
		[if]
		[have_unit]
		id=Dolmannumbil
		[/have_unit]
		[then]
		
		{MILESTONE wose_priorities no}
		
		[/then]
		[/if]
		
		{RECALL_XY Juangh 5 5}
		##якщо він підбирав молоток у S6, то він загинув під Чистими Водами, інакше просто пішов на пенсію та помер біля Південної Бухти
		[if]
		[have_unit]
		id=Juangh
		[/have_unit]
		[then]
		
		{VARIABLE juangh_alive _"true"}
		
		[if]

		[variable]
		name=juangh_got_hammer
		equals=yes
		[/variable]
		[then]
		    {MILESTONE juangh_dead_priorities_2 no}
		[/then]
		[else]
		    {MILESTONE juangh_dead_priorities_1 no}
		[/else][/if]
		
		[kill]
		id=Juangh
		[/kill]
		
		[/then][/if]
		
	    ##вбиваємо копії з S8 та Даеолу
		[kill]
		id=Daeola, father_copy, faisim_copy, zeham_copy, wose_copy, daeola_copy, asa_copy
		search_recall_list=yes
		[/kill]
		
		##прибираємо імена в духів, як знак їхньої деградації
		[modify_unit]
		[filter]
		type=Spirit Light
		search_recall_list=yes
		[/filter]
		name=""
		[/modify_unit]

		[hide_unit][/hide_unit]
		
		[scroll_to]
	        x,y=50,3
	    	immediate=yes
	    [/scroll_to]
		
    [/event]
	  
	[event]
	name=start
	
	    ##початкова катсцена
