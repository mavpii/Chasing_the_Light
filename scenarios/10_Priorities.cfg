			{DELAY 500}
			{SPEAK Zeham _"..!"}
			{SPEAK Zeham _"Я зрозумів, що задумали прокляті чаклуни: вони усвідомили, що Королі лишили весь Південь Острову майже беззахисним, і вирішили скористатися цим, щоб легко захопити два найбільших міста, Чисті Води та Південну Бухту."}
