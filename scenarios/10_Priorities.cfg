			{SPEAK Haralin _"Зегаме, чому б тобі не віднести вістку до Південної Бухти? Серед нашого загону ти єдиний вершник."}
			{SPEAK Zeham _"Ні, я нізащо не покину вас з Асою, до того ж мій кінь надто втомлений..."}
