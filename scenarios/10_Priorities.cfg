	##random hp and xp for cursed units
	[event]
	name=unit placed
	first_time_only=no
    [filter]
	    side=3
	[/filter]
	{FILTER_CONDITION(
        {VARIABLE_CONDITIONAL s10_last_stand_active equals true}
    )}
			
		{VARIABLE_OP random_hitpoints rand (12.. "$($unit.max_hitpoints - 3)")}
        {VARIABLE_OP random_experience rand (1.."$($unit.max_experience - 10)")}

        [modify_unit]
		    [filter]
			    id=$unit.id
			[/filter]
			hitpoints=$random_hitpoints
			experience=$random_experience
			[status]
                unhealable=yes
            [/status]
		[/modify_unit]
        {CLEAR_VARIABLE random_hitpoints,random_experience}	
	[/event]
	
	##random xp for undead units
	[event]
	name=unit placed
	first_time_only=no
    [filter]
	    side=2
	[/filter]
	{FILTER_CONDITION(
        {VARIABLE_CONDITIONAL s10_last_stand_active equals true}
    )}
			
		{VARIABLE_OP random_experience rand (1.."$($unit.max_experience - 10)")}

        [modify_unit]
		    [filter]
			    id=$unit.id
			[/filter]
			experience=$random_experience
			[status]
                unhealable=yes
            [/status]
		[/modify_unit]
        {CLEAR_VARIABLE random_hitpoints,random_experience}	
	[/event]
	
