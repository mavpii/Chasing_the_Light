		[if]
		[have_unit]
		id=Zeham
		[/have_unit]
		[then]
		
		{DELAY 500}
		
		[store_unit]
		[filter]
		id=Zeham
		[/filter]
		variable=zeham_type
		[/store_unit]
		
		[move_unit_fake]
		type=$zeham_type.type
		x=54,53,52,51,50
		y=1,2,2,2,2
		side=9
		image_mods=PAL(FFFFFF,C6E7E7,94C6C6,638C94,31526B,182931,C5CFDA,66A5B2 > ECECEC,A8A098,78655A,4D4541,2C2623,1F1C1A,78655A,4D4541)~RC(magenta>reef)
		[/move_unit_fake]
		
		[unhide_unit]
		id=Zeham
		[/unhide_unit]
		
		{CLEAR_VARIABLE zeham_type}
		
		[/then][/if]
		
		#якщо є лісовик
		[if]
		[have_unit]
		id=Dolmannumbil
		[/have_unit]
		[then]
		
		{DELAY 500}
		
		[store_unit]
		[filter]
		id=Dolmannumbil
		[/filter]
		variable=wose_type
		[/store_unit]
		
		[move_unit_fake]
		type=$wose_type.type
		x=54,54,53,53,52
		y=1,2,3,4,4
		side=1
		image_mods=PAL(fefe72,f5da30,0b7a6d,235355,b3f08b,68c552,4cc934,81a435,718204,466818,3b5f0e,0d3d02,1f4b1f > f5c37a,e7805e,826e2f,47213c,f6d39b,e7c767,e7c767,ae6a42,904d39,75491e,75491e,321d0b,75491e)	
		[/move_unit_fake]
		
		[unhide_unit]
		id=Dolmannumbil
		[/unhide_unit]
		
		{CLEAR_VARIABLE wose_type}
		
		[/then][/if]
		
		{DELAY 500}
		
		#po: Це повний провал...
		{SPEAK Haralin _"It's a total disaster..."}
		{SPEAK Asa _"..."}
		{DELAY 500}
		[if]
		[have_unit]
		id=Zeham
		[/have_unit]
		[then]
		{SPEAK Zeham _"..."}
		{DELAY 500}
		[/then][/if]
		
		#po: Коли ворог переважає десять до одного, важко перемогти.
		{SPEAK Asa _"When enemy outnumbers ten to one, it's difficult to win."}
		
		{DELAY 500}
		
		[if]
		[variable]
		name=juangh_alive
		equals=true
		[/variable]
		[and]
		[variable]
		name=juangh_got_hammer
		equals=yes
		[/variable]
		[/and]
		[then]
		#po: Я гадав, що якщо зійдуся з Карором у дуелі, то зможу його перемогти й виправити все, але ця підла потвора наслала на мене прокляття і вбила Джуанга.
		{SPEAK Haralin _"I thought that if I faced Caror in a duel, I could defeat him and fix everything, but that vile monster cursed me and killed Juangh..."}
		#po: Прокляття не діє на тебе, Гараліне? Минуло більше години, а Старого Джуанга воно перетворило на чудовисько миттєво.
		{SPEAK Asa _"Doesn't the curse affect you, Haralin? It's been over an hour; it turned old Juangh into a monster instantly."}
		[set_achievement]
            content_for=Chasing_the_Light
            id="ctl_end_juangh"
        [/set_achievement]
		
		{MILESTONE wose_priorities no}
		[/then]
		[else]
		#po: Я гадав, що якщо зійдуся з Карором у дуелі, то зможу його перемогти й виправити все, але ця підла потвора вчепилася в мене та наслала прокляття.
		{SPEAK Haralin _"I thought that if I faced Caror in a duel, I could defeat him and fix everything, but that vile monster clung to me and cast a curse..."}
		#po: Прокляття не діє на тебе? Минуло більше години, інших воно перетворює на чудовиськ миттєво.
		{SPEAK Asa _"Doesn't the curse affect you, Haralin? It's been over an hour; it turns others into monsters instantly."}
		[/else][/if]
		
		#po: Воно діє, <i>я відчуваю</i> це... Поки мені вдається сповільнювати його силою Світла, але... схоже, це лише відтягування неминучого...
		{SPEAK Haralin _"It's in effect, <i>I feel</i> it... So far, I've been able to slow it down with the power of Light, but... it seems like it's just delaying the inevitable..."}
		{DELAY 500}
		#po: Даеола може вилікувати тебе?
		{SPEAK Asa _"Can Daeola heal you?"}
		#po: Не маю сумнівів... Проте хай, головне не це — за нами зараз женеться ледь не усе західняцьке військо Карора і нам не втекти від нього...
		{SPEAK Haralin _"I have no doubt... However, that's not the point — almost the entire Wesfolk army of Caror is chasing us now, and we can't escape from it..."}
		[if]
		[have_unit]
		id=Zeham
		[/have_unit]
		[then]
		#po: Невже західняки просто покинули Чисті Води, щоб просто погнатися за 'найважливішим' чаклуном всього Зеленого Острову?
		    {SPEAK Zeham _"Did the Wesfolk really leave Clearwater Port just to chase after the 'most important' sorcerer on the whole Green Isle?"}
			#po: Гадаю, що вони залишили якусь невелику частину, щоб і далі тримати місто в облозі, проте всі інші рушили по дорозі до Південної Бухти.
			{SPEAK Haralin _"I think they left a small part to continue besieging the city, but everyone else headed for Southbay."}
			{DELAY 500}
			{SPEAK Zeham _"..."}
			{DELAY 500}
			{SPEAK Zeham _"..!"}
			#po: Схоже, вони усвідомили, що Королі лишили весь Південь Острову майже беззахисним, і вирішили скористатися цим, щоб легко захопити два найбільших міста, Чисті Води та Південну Бухту...
			{SPEAK Zeham _"They seem to have realised that the Kings had left the entire South of the Isle almost defenceless, and decided to take advantage of this to easily capture the two largest cities, Clearwater Port and Southbay..."}
		    #po: На успіх наступу на ворожу столицю було покладено забагато надій...
			{SPEAK Asa _"Too much hope was placed on the assault on their capital..."}
		    {DELAY 500}
			#po: Хай там як, ми тут і зараз... Що ми робитимемо, Асо, Зегаме?
			{SPEAK Haralin _"Regardless, we are here and now... What shall we do, Asa, Zeham?"}
			#po: Нам треба попередити Південну Бухту та інші Королівства про небезпеку, а самим лишитися, щоб стримати ворога скільки зможемо.
			{SPEAK Zeham _"We must somehow warn Southbay and the other Kingdoms of danger, while we stay behind to hold back the enemy as long as we can."}
			#po: Згода, ми маємо заплатити за нашу поразку.
			{SPEAK Asa _"Agreed. We must pay for our defeat."}
			{DELAY 500}
			{MODIFY_UNIT id=Haralin facing se}{DELAY 500}
			{MODIFY_UNIT id=Haralin facing sw}{DELAY 500}
			#po: Прокляття... Схоже, це справді єдине, що нам залишається робити — прислужники Карора занадто швидкі: ми ледь встигнемо дійти й до старої застави, як вони наздоженуть нас...
			{SPEAK Haralin _"Damn... Seems that this is really the only thing left for us to do — Caror's servants are too fast: we will barely have time to reach the old outpost before they catch up with us..."}
			#po: Зегаме, чому б тобі не віднести вістку до Південної Бухти? Серед нашого загону ти єдиний вершник.
			{SPEAK Haralin _"Zeham, why don't you carry the message to Southbay? You are the only rider left in our army."}
			#po: Ні, я нізащо не покину вас з Асою, до того ж мій кінь надто втомлений...
			{SPEAK Zeham _"No, I will never leave you and Asa, besides, my horse is too tired..."}
			#po: Гараліне, у тебе є закляття польоту.
			{SPEAK Asa _"Haralin, you have a flight spell."}
		[/then]
		[else]
		    #po: Невже західняки просто покинули Чисті Води?
		    {SPEAK Asa _"Did the Wesfolk just abandon Clearwater Port?"}
