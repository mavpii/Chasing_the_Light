	#tree macro
	#define S10_TREE_EVENT X1 Y1 X2 Y2 PATH_X2 PATH_Y2 X3 Y3 PATH_X3 PATH_Y3
	[event]
	name=moveto
	first_time_only=no
	[filter]
	type=Wose, Wose Shaman, Spirit Light, Mage, Red Mage, White Mage, Mage, Haralin_L3, Apprentice, Mage Healer, Mudcrawler, Giant Mudcrawler, Elemental Rock, Elemental Water, familiar_Haralin
	x,y={X1},{Y1}
    [/filter]
	[filter_condition]
	    {VARIABLE_CONDITIONAL s10_last_stand_active not_equals true}
	[/filter_condition]
	
	    [if]
	    [variable]
	    name=s10_tree_visited
	    not_equals=true
	    [/variable]
	    [then]
		    {MODIFY_UNIT id=$unit.id facing sw}
	        {SPEAK $unit.id _"Ось одне з місць сили... Мені лиш треба зосередити всі свої чуття та...  ...!"}
	    [/then][/if]
		
		{DELAY 500}
	    
	    #moveto до наступного вільного дерева, якщо нема, то перемога
	    [if]
	    [not]
	    [have_unit]
	    x,y={X2},{Y2}
	    type=Wose, Wose Shaman, Spirit Light, Mage, Red Mage, White Mage, Mage, Haralin_L3, Apprentice, Mage Healer, Mudcrawler, Giant Mudcrawler, Elemental Rock, Elemental Water, familiar_Haralin
	    [/have_unit]
	    [/not]
	    [then]
	    [move_unit_fake]
	    type=Elemental Air
	    x={PATH_X2}
	    y={PATH_Y2}
	    side=1
	    [/move_unit_fake]
	    
	    [/then]
	    [elseif]
	    [not]
	    [have_unit]
	    x,y={X3},{Y3}
	    type=Wose, Wose Shaman, Spirit Light, Mage, Red Mage, White Mage, Mage, Haralin_L3, Apprentice, Mage Healer, Mudcrawler, Giant Mudcrawler, Elemental Rock, Elemental Water, familiar_Haralin
	    [/have_unit]
	    [/not]
	    [then]
	    [move_unit_fake]
	    type=Elemental Air
	    x={PATH_X3}
	    y={PATH_Y3}
	    side=1
	    [/move_unit_fake]
	    [/then]
	    [/elseif]
	    [else]
	    
	    {SPEAK Haralin _"Тепер духам нікуди тікати, їм  не залишається жодного вибору, окрім як підкоритися мені!"}
		
		{FLASH_LIGHTNING ()}
	
	    [unit]
		type=Elemental Air
		side=1
		x,y={X1},{Y1}
		[/unit]
		
		[unit]
		type=Elemental Air
		side=1
		x,y={X2},{Y2}
		[/unit]
		
		[unit]
		type=Elemental Air
		side=1
		x,y={X3},{Y3}
		[/unit]
	
	    [reset_fog][/reset_fog]
	    [redraw]
	    side=1
	    clear_shroud = yes
	    [/redraw]
	
	    {DELAY 600}

	    {VARIABLE_OP avatar add 1}
	    [progress_achievement]
            content_for=Chasing_the_Light
            id="ctl_avatar"
            amount=1
            limit=$avatar
        [/progress_achievement]
	    
	    [set_variable]
            name=tree_objective_var
	    	#po: (додатково) Дослідити загадкові місця сили
            value=_ "<span strikethrough='true'>(optional) Explore the mysterious places of force</span>"
        [/set_variable]
		
	    {SPEAK Zeham _"Чудово, Гараліне, тепер ти зможеш дути на ворогів вітерцем, щоб їм не було спекотно. Жартую, духи повітря нам і справді знадобляться."}
		
		[objectives]
	    	[objective]
                description=_ "Знищіть авангард ворожої армії"
                condition=win
            [/objective]
	    	[objective]
                description=$tree_objective_var
                condition=win
            [/objective]
	    	[objective]
	    	    #po: Загибель Гараліна
                description= _ "Death of Haralin"
                condition=lose
            [/objective]
	    	[objective]
	    	    #po: Загибель Аси
                description= _ "Death of Asa"
                condition=lose
            [/objective]
            [gold_carryover]
                carryover_percentage=0
            [/gold_carryover]
        [/objectives]
		
		{UNLOCK_SPELL id=Haralin skill_summon,skill_summon_air}
	    {RESELECT_SKILLS id=Haralin}
		
		{DELAY 500}
	    
	    [/else][/if]
	    
	    [if]
	    [variable]
	    name=s10_tree_visited
	    not_equals=true
	    [/variable]
	    [then]
	        {SPEAK Zeham _"Що це тут пролетіло, Гараліне? Виглядало як якась магічна завірюха!"}
	        {SPEAK Haralin _"Здається, це був один з природних духів повітря, проте чому ж він просто втік кудись?"}
			{DELAY 500}
			{MODIFY_UNIT id=Haralin facing se}{DELAY 500}
			{MODIFY_UNIT id=Haralin facing sw}{DELAY 500}
			{SPEAK Haralin _"Ні, ім'ям Світла, він не втік, а перебрався до іншого місця сили! Я відчуваю... нам треба одночасно зайняти всі дерева, щоб йому просто не лишилося куди тікати."}
			
			{CHECK_EQUIPPED_SPELL id=$current_caster skill_summon}
		    [if]
			{VARIABLE_CONDITIONAL equipped_spell_found equals yes}
			[then]
				{VARIABLE summon_equipped _"true"}
			[/then][/if]
			
			{CHECK_EQUIPPED_SPELL id=$current_caster skill_find_familiar}
		    [if]
			{VARIABLE_CONDITIONAL equipped_spell_found equals yes}
			[then]			
				{VARIABLE familiar_equipped _"true"}
			[/then][/if]
			
			[if]
			{VARIABLE_CONDITIONAL familiar_equipped not_equals true}
			[and]
			{VARIABLE_CONDITIONAL summon_equipped not_equals true}
			[/and]
			[then]			
			    {RESELECT_SKILLS id=Haralin}
			[/then][/if]
	        
	        {VARIABLE s10_tree_visited _"true"}
	    
	    [/then][/if]

	[/event]
	#enddef
	
