#textdomain wesnoth-ctl
[scenario]
    id=10_Priorities
    name= _ "Priorities"
    map_data="{~add-ons/Chasing_the_Light/maps/10_Priorities.map}"

    victory_when_enemies_defeated=no
	#next_scenario=11_Duty
	turns={ON_DIFFICULTY 8 6 4}
	carryover_percentage=0
	theme=Cutscene

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg into_the_shadows.ogg}
	
	[story]
        [part]
		    story= _ "Поки Даеола готувалася прийняти участь у поході, що мав остаточно визначати долю цієї війни, на іншому кінці Зеленого Острову події складалися зовсім не на користь сторони Світла..."
            {CTL_GREEN_ISLE_BIGMAP}
		[/part]
		[part]
		    story= _ "Війську Південної Бухти не лише не вдалося відігнати ворогів від Чистих Вод, навпаки — воно зазнало нищівної поразки через могуть західняцьких чаклунів та їхнє число, а його головнокомандувача було поранено. І тепер залишки цього війська відчайдушно відступали вглиб Вічноосіннього Лісу, тікаючи від орд мерців та проклятих острів'ян на чолі з самим Владикою-Лічом Карором."
            {CTL_GREEN_ISLE_BIGMAP}
		[/part]
	[/story]
	
	{CTL_GI_TRACK {JOURNEY_10} }
	
	{DEFAULT_SCHEDULE_DUSK}
	
	[side]
	    side=1
		color=red
	    id,defeat_condition=Haralin,never
        {GOLD 100 75 50}
        {INCOME 20 15 10}
        controller=human
        team_name=Islefolk
        shroud=yes
        fog=no
        {FLAG_VARIANT long}
        user_team_name=_"Haralin's Army"
    [/side]
	{STARTING_VILLAGES_ALL 1}

    [side]
        side=2
		controller=ai
        shroud=yes
        fog=no
        team_name=Wesfolk
		#po: Західняцькі загарбники
        user_team_name=_ "Wesfolk Invaders"
        {FLAG_VARIANT undead}
        recruit=Wesfolk Fighter, Skeleton, Skeleton Archer, Footpad, Walking Corpse
		[ai]
            aggression=1.0
        [/ai]
    [/side]
	
	[side]
        side=3
		controller=ai
		color=red
        shroud=yes
        fog=no
        team_name=Wesfolk,Islefolk
        user_team_name=_ "Cursed Army"
        {FLAG_VARIANT undead}
        recruit=Wesfolk Fighter, Skeleton, Skeleton Archer, Footpad, Walking Corpse
		[ai]
            aggression=1.0
        [/ai]
    [/side]
	
	[side]
        side=4
		controller=null
		color=red
        shroud=yes
        fog=no
		hidden=yes
        team_name=Islefolk
    [/side]
	
    [event]
    name=prestart
	
        [objectives]
			[objective]
                description=_ "Знищіть авангард ворожої армії"
                condition=win
            [/objective]
			[objective]
			    #po: Загибель Гараліна
                description= _ "Death of Haralin"
                condition=lose
            [/objective]
			[objective]
			    #po: Загибель Аси
                description= _ "Death of Asa"
                condition=lose
            [/objective]
            [gold_carryover]
                carryover_percentage=0
            [/gold_carryover]
        [/objectives]
		
		##starting spawns
		
		{RECALL_XY Haralin 49 4}
	    [store_unit]
            {FILTER id=Haralin}
            variable,kill=Haralin,yes
        [/store_unit]
		[unit]
            type,name=Haralin_L3,_"Haralin"
			id=Haralin
			hitpoints=35
			gander=male
			canrecruit=yes
            unrenamable=yes
            x,y,profile=$Haralin.x,$Haralin.y,portraits/haralin/Haralin_L3.png
			[modifications]
                [trait]
                    id,name,description=cursed_dummy,_"cursed",_""
                [/trait]
				[trait]
                    id,name,description=intelligent_dummy,intelligent,""
                [/trait]
            [/modifications]
        [/unit]
        {CLEAR_VARIABLE Haralin}
        {MODIFY_UNIT id=Haralin facing sw}
		{MODIFY_UNIT id=Haralin experience ({ON_DIFFICULTY 80 70 60})}
        [set_extra_recruit]
            id=Haralin
            extra_recruit=Apprentice, Mage, Bowman, Fencer, Spearman
        [/set_extra_recruit]
		
		{VARIABLE Haralin_unlocked_spells $caster_Haralin.spell_unlocked}
		
		##Додати тут нові закляття та реорганізувати
		[modify_caster]
		[filter]
		id=Haralin
		[/filter]
		spell_group_1 = skill_magic_blast,  skill_summon,           skill_shield,         skill_stasis,        skill_panacea
		spell_group_2 = skill_levitate,     skill_chill_touch,        skill_mnemonic,       skill_find_familiar, skill_bend
		spell_group_3 = skill_fireball2,    skill_glamour,          skill_enervate,       skill_blizzard,      skill_counterspell, skill_polymorph
		spell_group_4 = skill_fireball3,    skill_dancing_daggers,  skill_illusion,       skill_animate_fire,  skill_contingency
		spell_group_5 = skill_fireball4,    skill_lightning,        skill_time_dilation,  skill_cataclysm
		unlocked_spells = $Haralin_unlocked_spells
		#spellcasting_allowed = false
		[/modify_caster]
		{REFRESH_CASTER_ANIMATIONS id=Haralin}
		{CASTER_STATUS id=Haralin false}
		
		[assign_caster]
		[filter]
		id=Dolmannumbil
		[/filter]
		spell_group_1 = skill_nature_revenge
		unlocked_spells = skill_nature_revenge
		equipped_spells = skill_nature_revenge
		#spellcasting_allowed = false
		[/assign_caster]
		{REFRESH_CASTER_ANIMATIONS id=Dolmannumbil}
		{CASTER_STATUS id=Dolmannumbil false}
		
		{RECALL_XY Asa 50 4}
		
	    [modify_unit]
		    [filter]
		        id=Asa
		    [/filter]
		    name=_"Lieutenant Asa"
			facing=sw
	    [/modify_unit]
		
		{RECALL_XY Zeham 50 2}
		[if]
		[have_unit]
		id=Zeham
	    [/have_unit]
		[then]
		
		[store_unit]
            {FILTER id=Zeham}
            variable,kill=Zeham,no
        [/store_unit]
		
		[if]
		[variable]
		name=Zeham.level
		less_than_equal_to=2
		[/variable]
		[then]
		    {TRANSFORM_UNIT id=Zeham Knight}
		[/then]
		[else]
		    {TRANSFORM_UNIT id=Zeham (Grand Knight)}
		[/else][/if]
		{FULL_HEAL id=Zeham}
		[/then][/if]
		{MODIFY_UNIT id=Zeham name _"Sir Zeham"}
		{MODIFY_UNIT id=Zeham facing sw}
		{MODIFY_UNIT id=Zeham moves Zeham.max_moves}
		{CLEAR_VARIABLE Zeham}
		
		{RECALL_XY Dolmannumbil 52 4}
		[object]
            silent=yes
            duration=forever
	    	[filter]
	    	    id=Dolmannumbil
	    	[/filter]
            [effect]
                apply_to=image_mod
	          	add=PAL(fefe72,f5da30,0b7a6d,235355,b3f08b,68c552,4cc934,81a435,718204,466818,3b5f0e,0d3d02,1f4b1f > f5c37a,e7805e,826e2f,47213c,f6d39b,e7c767,e7c767,ae6a42,904d39,75491e,75491e,321d0b,75491e)	
            [/effect]
        [/object]
		{MODIFY_UNIT id=Dolmannumbil facing sw}
		{MODIFY_UNIT id=Dolmannumbil type "Wose Shaman"}
		
		{RECALL_XY Juangh 5 5}
		##якщо він підбирав молоток у S6, то він загинув під Чистими Водами, інакше просто пішов на пенсію та помер біля Південної Бухти
		[if]
		[have_unit]
		id=Juangh
		[/have_unit]
		[then]
		
		{VARIABLE juangh_alive _"true"}
		
		[kill]
		id=Juangh
		[/kill]
		
		[/then][/if]
		
	    ##вбиваємо копії з S8 та Даеолу
		[kill]
		id=Daeola, father_copy, faisim_copy, zeham_copy, wose_copy, daeola_copy, asa_copy
		search_recall_list=yes
		[/kill]
		
		[hide_unit][/hide_unit]
		
		[scroll_to]
	        x,y=50,3
	    	immediate=yes
	    [/scroll_to]
		
    [/event]
	  
