		variable=s10_units_saved
		mode=append
		kill=yes
	[/store_unit]
	
	[if]
	[variable]
	name=s10_retreat_reacted
	not_equals=true
	[/variable]
	[then]
	    {SPEAK Asa _"..."}
		
		{VARIABLE_OP asa_advice_ignored add 1}
		[progress_achievement]
            content_for=Chasing_the_Light
            id="ctl_asa"
            amount=1
            limit=$asa_advice_ignored
        [/progress_achievement]

        {VARIABLE s10_retreat_reacted _"true"}		

    [/then][/if]
	
	[/event]
	
	[event]
	name=moveto	
	first_time_only=no
	[filter]
		x=1
		id=Dolmannumbil
	[/filter]
	{FILTER_CONDITION(
	    {VARIABLE_CONDITIONAL s10_last_stand_active equals true}
    )}
	
	{SPEAK Dolmannumbil _"Leave this battle, forced we are. For see we do, that our roots shall perish by the foul two-legged. Warn the forest of my kin, we will as well..."}
	
	[kill]
        id=Dolmannumbil
        animate=no
    [/kill]	

    {SPEAK Asa _"..."}	
	
	{VARIABLE s10_wose_escaped _"true"}
	
	[/event]
[/scenario]