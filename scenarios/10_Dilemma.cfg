#textdomain wesnoth-ctl
[scenario]
    id=10_Dilemma
    name= _ "Dilemma"
    map_data="{~add-ons/Chasing_the_Light/maps/02_Invasion.map}"

    victory_when_enemies_defeated=no
	#next_scenario=11_Duty
	turns={ON_DIFFICULTY 16 14 12}
	carryover_percentage=0

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg into_the_shadows.ogg}
	
	[story]
        [part]
		    story= _ "TODO"
            {CTL_GREEN_ISLE_BIGMAP}
		[/part]
	[/story]
	
	{CTL_GI_TRACK {JOURNEY_10} }
	
	{DEFAULT_SCHEDULE_DUSK}
	
	[side]
	    side=1
		color=red
	    id,defeat_condition=Haralin,never
        {GOLD 100 75 50}
        {INCOME -5 -10 -15}
        controller=human
        team_name=Islefolk
        shroud=no
        fog=no
        {FLAG_VARIANT long}
        user_team_name=_"Haralin's Army"
    [/side]

    [side]
        side=2
		controller=ai
        shroud=yes
        fog=no
        team_name=Wesfolk
		#po: Західняцькі загарбники
        user_team_name=_ "Wesfolk Invaders"
        {FLAG_VARIANT undead}
        recruit=Wesfolk Fighter, Skeleton, Skeleton Archer, Footpad, Walking Corpse
    [/side]
	
	[side]
        side=3
		controller=ai
        shroud=yes
        fog=no
        team_name=Wesfolk
		#po: Прислужники Файсім
        user_team_name=_ "Faisim's Minions"
        {FLAG_VARIANT undead}
        recruit=Wesfolk Fighter, Skeleton, Skeleton Archer, Footpad, Walking Corpse
    [/side]
	
	[side]
        side=4
		controller=null
		color=red
        shroud=yes
        fog=no
		hidden=yes
        team_name=Islefolk
    [/side]
	
    [event]
    name=prestart
	
        [objectives]
			[objective]
                description=_ "Знищіть авангард ворожої армії"
                condition=win
            [/objective]
			[objective]
			    #po: Загибель Гараліна
                description= _ "Death of Haralin"
                condition=lose
            [/objective]
			[objective]
			    #po: Загибель Аси
                description= _ "Death of Asa"
                condition=lose
            [/objective]
            [gold_carryover]
                carryover_percentage=0
            [/gold_carryover]
        [/objectives]
		
		##starting spawns
		
		{RECALL_XY Haralin 1 2}
	    [store_unit]
            {FILTER id=Haralin}
            variable,kill=Haralin,yes
        [/store_unit]
		[unit]
            type,name=Haralin_L3,_"Haralin"
			id=Haralin
			hitpoints=35
			gander=male
			canrecruit=yes
            unrenamable=yes
            x,y,profile=$Haralin.x,$Haralin.y,portraits/haralin/Haralin_L3.webp
			[modifications]
                [trait]
                    id,name,description=naive_dummy,_"cursed",_""
                [/trait]
				[trait]
                    id,name,description=intelligent_dummy,intelligent,""
                [/trait]
            [/modifications]
        [/unit]
        {CLEAR_VARIABLE Haralin}
        {MODIFY_UNIT id=Haralin facing ne}
		{MODIFY_UNIT id=Haralin experience ({ON_DIFFICULTY 80 70 60})}
        [set_extra_recruit]
            id=Haralin
            extra_recruit=Apprentice, Mage, Bowman, Fencer, Spearman
        [/set_extra_recruit]
		
		##Додати тут нові закляття та реорганізувати
		#[modify_caster]
		#[filter]
		#id=Haralin
		#[/filter]
		#spell_group_1 = skill_magic_blast,  skill_summon,           skill_shield,         skill_stasis,        skill_panacea
		#spell_group_2 = skill_levitate,     skill_chill_touch,        skill_mnemonic,       skill_find_familiar, skill_bend
		#spell_group_3 = skill_fireball2,    skill_glamour,          skill_enervate,       skill_blizzard,      skill_counterspell, skill_polymorph
		#spell_group_4 = skill_fireball3,    skill_dancing_daggers,  skill_illusion,       skill_animate_fire,  skill_contingency
		#spell_group_5 = skill_fireball4,    skill_lightning,        skill_time_dilation,  skill_cataclysm
		#unlocked_spells = 
		#equipped_spells = 
		#spellcasting_allowed = false
		#[/modify_caster]
		{REFRESH_CASTER_ANIMATIONS id=Haralin}
		
		{RECALL_XY Asa 1 3}
		
	    [modify_unit]
		    [filter]
		        id=Asa
		    [/filter]
		    name=_"Lieutenant Asa"
	    [/modify_unit]
		
		{RECALL_XY Zeham 1 4}
		[if]
		[have_unit]
		id=Zeham
	    [/have_unit]
		[then]
		
		[store_unit]
            {FILTER id=Zeham}
            variable,kill=Zeham,no
        [/store_unit]
		
		[if]
		[variable]
		name=Zeham.level
		less_than_equal_to=2
		[/variable]
		[then]
		    {TRANSFORM_UNIT id=Zeham Knight}
		[/then]
		[else]
		    {TRANSFORM_UNIT id=Zeham (Grand Knight)}
		[/else][/if]
		{FULL_HEAL id=Zeham}
		[/then][/if]
		{RECALL_XY Dolmannumbil 1 5}
		
		{RECALL_XY Juangh 5 5}
		##якщо він підбирав молоток у S6, то він загинув під Чистими Водами, інакше просто пішов на пенсію та помер біля Південної Бухти
		[if]
		[have_unit]
		id=Juangh
		[/have_unit]
		[then]
		
		{VARIABLE juangh_alive _"true"}
		
		[kill]
		id=Juangh
		[/kill]
		
		[/then][/if]
		
	    ##вбиваємо копії з S8 та Даеолу
		[kill]
		id=Daeola, father_copy, faisim_copy, zeham_copy, wose_copy, daeola_copy, asa_copy
		search_recall_list=yes
		[/kill]
		
		{RECALL_XY Guard_1 1 6}
	    {RECALL_XY Guard_2 1 7}
	    {RECALL_XY Guard_3 1 8}
		
		{S10_RECALL_UNITS 1 9  Spearman  }
		{S10_RECALL_UNITS 1 10 Spearman  }
		{S10_RECALL_UNITS 1 11 Fencer    }
		{S10_RECALL_UNITS 1 12 Bowman    }
		{S10_RECALL_UNITS 1 13 Mage      }
		{S10_RECALL_UNITS 1 14 Spearman  }
		{S10_RECALL_UNITS 1 15 Bowman    }
		{S10_RECALL_UNITS 1 16 Spearman  }
		{S10_RECALL_UNITS 1 17 Spearman  }
		{S10_RECALL_UNITS 1 18 Bowman    }
		{S10_RECALL_UNITS 1 19 Thug      }
		{S10_RECALL_UNITS 1 20 Mage      }
		
		##воно мало призвати найсильніших юнітів бійця, видаляємо всіх інших, типу вони загинули під Чистими Водами
		[kill]
		x,y=recall,recall
		[not]
		id=familiar_Haralin
		[/not]
		[/kill]
		
		[hide_unit]
		[not]
		id=Haralin,Asa,Zeham,Dolmannumbil
		[/not]
		[/hide_unit]
		
    [/event]
	  
	[event]
	name=start
	
	    ##початкова катсцена
		##приходять Гаралін, Аса, Зегам та Дуб
		
		#move_unit_fake
		
		[move_unit_fake]
		type=Haralin_L3
		x=1,2,3
		y=1,2,3
		side=1
		[/move_unit_fake]
		
		[unhide_unit]
		id=Haralin
		[/unhide_unit]
		
		{DELAY 1000}
		
		[store_unit]
		[filter]
		id=Asa
		[/filter]
		variable=asa_type
		[/store_unit]
		
		[move_unit_fake]
		type=$asa_type.type
		x=1,2,3
		y=1,2,3
		side=1
		image_mods=PAL(FFFFFF,C6E7E7,94C6C6,638C94,31526B,182931,C5CFDA,66A5B2 > FFFFFF,92D2BB,5BB19E,2D8569,125756,0A293B,5BB19E,2D8569)
		[/move_unit_fake]
		
		[unhide_unit]
		id=Asa
		[/unhide_unit]
		
		{CLEAR_VARIABLE asa_type}
		
		##якщо є зегам
		[if]
		[have_unit]
		id=Zeham
		[/have_unit]
		[then]
		
		{DELAY 1000}
		
		[store_unit]
		[filter]
		id=Zeham
		[/filter]
		variable=zeham_type
		[/store_unit]
		
		[move_unit_fake]
		type=$zeham_type.type
		x=1,2,3
		y=1,2,3
		side=9
		image_mods=PAL(FFFFFF,C6E7E7,94C6C6,638C94,31526B,182931,C5CFDA,66A5B2 > ECECEC,A8A098,78655A,4D4541,2C2623,1F1C1A,78655A,4D4541)~RC(magenta>reef)
		[/move_unit_fake]
		
		[unhide_unit]
		id=Zeham
		[/unhide_unit]
		
		{CLEAR_VARIABLE zeham_type}
		
		[/then][/if]
		
		#якщо є лісовик
		[if]
		[have_unit]
		id=Dolmannumbil
		[/have_unit]
		[then]
		
		{DELAY 1000}
		
		[store_unit]
		[filter]
		id=Dolmannumbil
		[/filter]
		variable=wose_type
		[/store_unit]
		
		[move_unit_fake]
		type=$wose_type.type
		x=1,2,3
		y=1,2,3
		side=1
		[/move_unit_fake]
		
		[unhide_unit]
		id=Dolmannumbil
		[/unhide_unit]
		
		{CLEAR_VARIABLE wose_type}
		
		[/then][/if]
		
		##розмови
		
		{DELAY 500}
		
		{SPEAK Haralin _"TEST"}
		
		[hide_unit][/hide_unit]
		
		{FADE_TO_BLACK}
		
		{DELAY 700}
		
		{TELEPORT_UNIT id=Haralin      1 1}
		{TELEPORT_UNIT id=Asa          1 2}
		{TELEPORT_UNIT id=Zeham        1 3}
		{TELEPORT_UNIT id=Dolmannumbil 1 4}
	
	    ##додати ворожу армію на чолі з чаклуном
		##мерці, колісниці
		
		{DELAY 500}
		
		[message]
		speaker,image=narrator,wesnoth-icon.png
		message=_"Через якийсь невеликий час..."
		[/message]
		
		{DELAY 500}
	
	    {FADE_IN}

        [unhide_unit]
            side=1
        [/unhide_unit]
	    
        [redraw][/redraw]
		
	[/event]
	
	##Гаралін відчуває духів
	[event]
	name=turn 2
	{SPEAK Haralin _"Відколи ми опинилися тут, <i>я відчуваю</i>... щось дуже дивне..."}
	{DELAY 300}
	{SPEAK Asa _"Все добре, Гараліне? Може, це прокляття?..."}
	{DELAY 300}
	{SPEAK Haralin _"Не хвилюйся, люба, це щось... щось інше... Наче навколо мене є одразу кілька місць, сповнених магією духів..."}
	
	#місце 1
	[remove_shroud]
	    [filter_side]
            side=1
        [/filter_side]
        x,y=20,15
        radius=1
    [/remove_shroud]
	
	[scroll_to]
	    x,y=20,15
	[/scroll_to]
	
	{DELAY 1500}
	
	#місце 2
	[remove_shroud]
	    [filter_side]
            side=1
        [/filter_side]
        x,y=18,15
        radius=1
    [/remove_shroud]
	
	[scroll_to]
	    x,y=18,15
	[/scroll_to]
	
	{DELAY 1500}
	
	#місце 3
	[remove_shroud]
	    [filter_side]
            side=1
        [/filter_side]
        x,y=16,15
        radius=1
    [/remove_shroud]
	
	[scroll_to]
	    x,y=16,15
	[/scroll_to]
	
	{DELAY 1500}
	
	[scroll_to_unit]
	id=Haralin
	[/scroll_to_unit]
	
	[set_variable]
        name=tree_objective_var
		#po: (додатково) Дослідити загадкові місця сили
        value=_ "(optional) Explore the mysterious places of force"
    [/set_variable]
	
	[objectives]
		[objective]
            description=_ "Знищіть авангард ворожої армії"
            condition=win
        [/objective]
		[objective]
            description=$tree_objective_var
            condition=win
        [/objective]
		[objective]
		    #po: Загибель Гараліна
            description= _ "Death of Haralin"
            condition=lose
        [/objective]
		[objective]
		    #po: Загибель Аси
            description= _ "Death of Asa"
            condition=lose
        [/objective]
        [gold_carryover]
            carryover_percentage=0
        [/gold_carryover]
		[note]
            description= _ "Ці місця сили мають обмежений час доступу, тому не зволікайте з ними."
        [/note]
    [/objectives]
	
	[/event]
	
	#tree macro
	#define S10_TREE_EVENT X1 Y1 X2 Y2 PATH_X2 PATH_Y2 X3 Y3 PATH_X3 PATH_Y3
	[event]
	name=moveto
	first_time_only=no
	[filter]
	type=Wose, Wose Shaman, Spirit Light, Mage, Red Mage, White Mage, Mage, Haralin_L3, Apprentice, Mage Healer, Mudcrawler, Giant Mudcrawler, Elemental Rock, Elemental Water, familiar_Haralin
	x,y={X1},{Y2}
    [/filter]
	[filter_condition]
	    {VARIABLE_CONDITIONAL s10_last_stand_active not_equals true}
	[/filter_condition]
	
	[if]
	[variable]
	name=s10_tree_visited
	equals=true
	[/variable]
	[or]
	[variable]
	name=unit.id
	equals=Haralin
	[/variable]
	[/or]
	[then]
	
	    [if]
	    [variable]
	    name=s10_tree_visited
	    not_equals=true
	    [/variable]
	    [then]
		    {MODIFY_UNIT id=Haralin facing sw}
	        {SPEAK Haralin _"Ось одне з місць сили... Мені лиш треба зосередити всі свої чуття та...  ...!"}
	    [/then][/if]
	    
	    #moveto до наступного вільного дерева, якщо нема, то перемога
	    [if]
	    [not]
	    [have_unit]
	    x,y={X2},{Y2}
	    type=Wose, Wose Shaman, Spirit Light, Mage, Red Mage, White Mage, Mage, Haralin_L3, Apprentice, Mage Healer, Mudcrawler, Giant Mudcrawler, Elemental Rock, Elemental Water, familiar_Haralin
	    [/have_unit]
	    [/not]
	    [then]
	    [move_unit_fake]
	    type=Elemental Air
	    x=1,2,3
	    y=1,2,3
	    side=1
	    [/move_unit_fake]
	    
	    [/then]
	    [elseif]
	    [not]
	    [have_unit]
	    x,y={X3},{Y3}
	    type=Wose, Wose Shaman, Spirit Light, Mage, Red Mage, White Mage, Mage, Haralin_L3, Apprentice, Mage Healer, Mudcrawler, Giant Mudcrawler, Elemental Rock, Elemental Water, familiar_Haralin
	    [/have_unit]
	    [/not]
	    [then]
	    [move_unit_fake]
	    type=Elemental Air
	    x=1,2,3
	    y=1,2,3
	    side=1
	    [/move_unit_fake]
	    [/then]
	    [/elseif]
	    [else]
	    
	    {SPEAK Haralin _"Тепер духам нікуди тікати, їм  не залишається жодного вибору, окрім як підкоритися мені!"}
		
		{FLASH_LIGHTNING ()}
	
	    [unit]
		type=Elemental Air
		side=1
		x,y={X1},{Y1}
		[/unit]
		
		[unit]
		type=Elemental Air
		side=1
		x,y={X2},{Y2}
		[/unit]
		
		[unit]
		type=Elemental Air
		side=1
		x,y={X3},{Y3}
		[/unit]
	
	    [reset_fog][/reset_fog]
	    [redraw]
	    side=1
	    clear_shroud = yes
	    [/redraw]
	
	    {DELAY 600}

	    {VARIABLE_OP avatar add 1}
	    [progress_achievement]
            content_for=Chasing_the_Light
            id="ctl_avatar"
            amount=1
            limit=$avatar
        [/progress_achievement]
	    
	    [set_variable]
            name=tree_objective_var
	    	#po: (додатково) Дослідити загадкові місця сили
            value=_ "<span strikethrough='true'>(optional) Explore the mysterious places of force</span>"
        [/set_variable]
		
	    {SPEAK Zeham _"Чудово, Гараліне, тепер ти зможеш дути на ворогів вітерцем, щоб їм не було спекотно. Жартую, духи повітря нам і справді знадобляться."}
		
		[objectives]
	    	[objective]
                description=_ "Знищіть авангард ворожої армії"
                condition=win
            [/objective]
	    	[objective]
                description=$tree_objective_var
                condition=win
            [/objective]
	    	[objective]
	    	    #po: Загибель Гараліна
                description= _ "Death of Haralin"
                condition=lose
            [/objective]
	    	[objective]
	    	    #po: Загибель Аси
                description= _ "Death of Asa"
                condition=lose
            [/objective]
            [gold_carryover]
                carryover_percentage=0
            [/gold_carryover]
        [/objectives]
		
		{UNLOCK_SPELL id=Haralin skill_summon,skill_summon_air}
	    {RESELECT_SKILLS id=Haralin}
	    
	    [/else][/if]
	    
	    [if]
	    [variable]
	    name=s10_tree_visited
	    not_equals=true
	    [/variable]
	    [then]
		
		    {DELAY 500}
	        {SPEAK Zeham _"Що це тут пролетіло, Гараліне? Виглядало як якась магічна завірюха!"}
	        {SPEAK Haralin _"Здається, це був один з природних духів повітря, проте чому ж він просто втік від мене?"}
			{DELAY 500}
			{MODIFY_UNIT id=Haralin facing se}{DELAY 500}
			{MODIFY_UNIT id=Haralin facing sw}{DELAY 500}
			{SPEAK Haralin _"Ні, ім'ям Світла, він не втік, а перебрався до іншого місця сили! Я відчуваю... мені треба одночасно зайняти всі дерева, щоб йому просто не лишилося куди тікати."}
			{SPEAK Haralin _"<b>Я не можу бути в кількох місцях одночасно</b>, тож інші маги можуть допомогти. Також я наділю частиною своєї магії своїх духів та Фамільяра, щоб ми впоралися з цим швидше."}
			
			{CHECK_EQUIPPED_SPELL id=$current_caster skill_summon}
		    [if]
			{VARIABLE_CONDITIONAL equipped_spell_found equals yes}
			[then]
				{VARIABLE summon_equipped _"true"}
			[/then][/if]
			
			{CHECK_EQUIPPED_SPELL id=$current_caster skill_find_familiar}
		    [if]
			{VARIABLE_CONDITIONAL equipped_spell_found equals yes}
			[then]			
				{VARIABLE familiar_equipped _"true"}
			[/then][/if]
			
			[if]
			{VARIABLE_CONDITIONAL familiar_equipped not_equals true}
			[and]
			{VARIABLE_CONDITIONAL summon_equipped not_equals true}
			[/and]
			[then]			
			    {RESELECT_SKILLS id=Haralin}
			[/then][/if]
	        
	        {VARIABLE s10_tree_visited _"true"}
	    
	    [/then][/if]
	[/then][/if]
	
	[/event]
	#enddef
	
	{S10_TREE_EVENT 20 15 18 15 (1,2,3) (1,2,3) 16 15 (1,2,3) (1,2,3)}
	{S10_TREE_EVENT 18 15 20 15 (1,2,3) (1,2,3) 16 15 (1,2,3) (1,2,3)}
	{S10_TREE_EVENT 16 15 18 15 (1,2,3) (1,2,3) 20 15 (1,2,3) (1,2,3)}
	
	##вороги бачать засідку
	[event]
        name=sighted
        [filter]
            side=1
        [/filter]
        [filter_second]
            side=2
        [/filter_second]
		
		[scroll_to_unit]
		    id = s10_necromancer
		[/scroll_to_unit]
		
		{DELAY 500}
		
		{SPEAK s10_necromancer _"Прокляття, це засідка! Слуги, не вагайтеся віддати свої жалюгідні життя заради перемоги, в ім'я нашого Владики Карора!!!"}
	[/event]
	
	#kill enemy sorceress.  Це буде західняцька принцеса Карора
	[event]
	name=last breath
	[filter]
	id=s10_necromancer
	[/filter]
	
	{SPEAK s10_necromancer _"Укг... Мій Володарю Кароре, я підвела тебе..."}
	
	[/event]
	
	##смерть некромансера.
	[event]
	name=die
	[filter]
	id=s10_necromancer
	[/filter]
	
	{CTL_NEW_REACTION
	({SPEAK Haralin _"Дякую Світлу, що захистило мене від цієї потвори. Гадаю, у неї має бути книга з цим страшним закляттям..."})#Haralin
	()#Faisim
	({SPEAK Zeham _"Це була шалена чаклунка, я б навіть сказав, навіжена. Вона, випадково, це закляття у книжку не записала?"})#Zeham
	()#Synyr
	()#Monkey
	()#Saoiric
	([if]
	[variable]
	name=unit.id
	equals=Asa
	[/variable]
	[then]
	    {SPEAK Asa _"Билася краще багатьох воїнів, але не встояла проти мене."}
	[/then]
	[else]
	    {SPEAK unit _"Ця чаклунка точно користувалася якимось дивним закляттям, але яким?..."}
	[/else][/if])#Others
	}
	
	#спавн темної книги
	{VARIABLE book_6_x $unit.x}
	{VARIABLE book_6_y $unit.y}
	{PLACE_IMAGE (items/book5.png) $book_6_x $book_6_y}
	
	[/event]
	
	#pick up book
	[event]
	name=moveto
	first_time_only=no
	[filter]
	    side=1
	    x=$book_6_x
	    y=$book_6_y
	[/filter]
	
	[if]
	[variable]
	name=$unit.id
	equals=Haralin
	[/variable]
	[then]
	
	    [if]
	    [variable]
	    name=$unit.id
	    equals=Haralin
	    [/variable]
	    [then]
	    
	    
        ##Гаралін магією може миттєво читати книжки		
	    [message]
	        speaker,image=narrator,wesnoth-icon.png
	        message= _ "Тільки доторкнувшись до книги, Гаралін миттю осягнув усе, що було описано в ній, та дізнався про нове закляття — Шалений Берсерк."
	    [/message]
	    
	    
	    {UNLOCK_SPELL id=Haralin skill_berserker}
	    {EQUIP_SPELL  id=Haralin skill_berserker}
	    
        ##вибір заклять
	    {RESELECT_SKILLS id=Haralin}
	    
	    [remove_item]
            x,y=$book_6_x,$book_6_y
            image="items/book5.png"
        [/remove_item]
	    
	    {CLEAR_VARIABLE book_6_x}
	    {CLEAR_VARIABLE book_6_y}
	    
	    {VARIABLE_OP book add 1}
	    [progress_achievement]
            content_for=Chasing_the_Light
            id="ctl_book"
            amount=1
            limit=$book
        [/progress_achievement]
	    
	    [/then]
	    [else]
	    
	    ##коментар інших юнітів
		{CTL_NEW_REACTION
		()#Haralin
		()#Faisim
		({SPEAK Zeham _"Диви, що я знайшов для тебе, Гараліне — чаклунську книжку. Тож візьми себе в руки, йди сюди та використай її закляття, щоб зупинити західняків!"})#Zeham
		()#Synyr
		()#Monkey
		()#Saoiric
		([if]
		[variable]
		name=unit.id
		equals=Asa
		[/variable]
		[then]
		    {SPEAK Asa _"Гараліне, поглянь — книга магії."}
		[/then]
		[else]
		    {SPEAK unit _"Майстре Гараліне, у того чаклуна була чергова західняцька книга, обов'язково подивіться на неї."}
		[/else][/if])#Others
	    }
	    
	    [/else][/if]
		
	[/then]
	[else]
	
	    ##якщо Гараліна нема, Аса може забрати книгу для нього. І потім біля Південної Бухти ї можна вбити та забрати книгу
	    [if]
	    [variable]
	    name=unit.id
	    equals=Asa
	    [/variable]
	    [then]
	        {SPEAK Asa _"Якщо ми вистоїмо, я передам цю книгу Гараліну."}
	    [/then]
	    [else]
	        {SPEAK Asa _"Воїне, передай цю книгу мені. Я збережу її для Гараліна."}
	    [/else][/if]
		
		{VARIABLE Asa_has_book _"true"}
		
		[remove_item]
            x,y=$book_6_x,$book_6_y
            image="items/book5.png"
        [/remove_item]
	    
	    {CLEAR_VARIABLE book_6_x}
	    {CLEAR_VARIABLE book_6_y}
	
	[/else][/if]
	
	[/event]
	
