	##діалог про кристал та ідею щось з ним зробити, різний в залежності чи балакала вона вже з ювеліром
	#po: (роздивляється) Ох, невже це... магічний кристал? Певно, він і є причиною всіх цих химерних тварин, однак хто залишив його тут, і коли?
	{SPEAK Daeola _"(examines it) Oh, could it be... a magic crystal? It must be the reason for all these bizarre animals, but who left it here, and when?"}
	{DELAY 500}
	#po: Хоча хай, це зовсім не те, про над чим я маю замислюватися... Все ж це просто шматок магічного каміння, який тепер треба якось використати...
	{SPEAK Daeola _"Although that's not really something I need to worry about... Still, it's just a piece of magic stone that now needs to be put to use somehow..."}
	{DELAY 500}
	[if]
	[variable]
	name=s9_jeweler_accepted
	equals=true
	[/variable]
	[then]
	#po: Я можу завітати до того золотаря в замку — якщо він зробить з нього намисто, а я накладу якесь закляття, вийде непоганий магічний оберіг...
	{SPEAK Daeola _"I can visit that jeweler in the castle — if he makes a necklace out of it and I cast a spell on it, it will make a pretty good magical amulet..."}
	
	#po: Віднести магічний кристал золотарю
	{VARIABLE s9_quest_5 _"Bring the magic crystal to the jeweler"}
	[/then]
	[else]
	#po: Якщо я знайду в Долині Штормів вправного золотаря, можна зробити з кристалу намисто та накласти якесь закляття; тоді вийде непоганий магічний оберіг...
	{SPEAK Daeola _"If I find a skilled jeweler in the Stormvale, I can make a necklace out of the crystal and cast a spell on it; then it will make a good magical amulet..."}
	
	#po: Знайти вправного майстра-золотаря
	{VARIABLE s9_quest_5 _"Find a skilled jeweler"}
	[/else][/if]
	
    [object]
	    [filter]
            id=Daeola
        [/filter]
        name= _ "Magic crystal"
        image=misc/ruby.png
		#po: Незвичайний кристал, від якого відчувається сильна магічна енергія. Можливо, якщо віднести його майстру-золотарю, він зможе виготовити з нього щось корисне?
        description= _ "An unusual crystal that radiates powerful magical energy. Perhaps if taken to a jeweler, he could make something useful out of it?"
    [/object]
	
	{VARIABLE s9_found_gem _"true"}
    {VARIABLE s9_item_gem _"Magic crystal"}
	
	[if]
	[variable]
	name=s9_basement_cleared
	equals=true
	[/variable]
	[then]
	    {S9_BASEMENT_EXIT}
	[/then][/if]
	
	{S9_UPDATE_OBJECTIVES yes}
	
	[/event]
	
	[event]
	name=die
	first_time_only=no
	[filter]
	    side=4
	    [not]
    	    type=Eyestalk,Leech
	    [/not]
	[/filter]
	[filter_condition]
	    [variable]
		    name=s9_current_location
			equals=_"Basement"
		[/variable]
		[and]
		[variable]
		    name=s9_basement_cleared
			not_equals=true
		[/variable]
		[/and]
	[/filter_condition]
	
	{VARIABLE_OP s9_basement_kills add 1}
	
	[if]
	[variable]
	name=s9_basement_kills
	equals=19
	[/variable]
	[then]
	#po: Це було останнє печерне чудовисько, яке становила хоч якусь загрозу для селян. Всі інші потвори прив'язані до землі й не нападатимуть, якщо їх не чіпати.
	    {SPEAK Daeola _"It was the last cave monster that posed any threat to the villagers. All other creatures are tied to the ground and will not attack if left alone."}
		
		{DELAY 500}
		
		{VARIABLE s9_basement_cleared _"true"}
		{VARIABLE is_Daeola_free_move _"true"}
		
		[store_unit]
		[filter]
		side=1
		[not]
		id=Daeola
		[/not]
		[/filter]
		variable=s9_basement_stored_units
		[/store_unit]
		
		[if]
		[variable]
		name=s9_found_gem
		equals=true
		[/variable]
		[then]
		#po: Я вже знайшла у цій печері магічний кристал, тому тут вже не лишилося нічого цікавого, й мені час йти звідси...
		    {SPEAK Daeola _"I have already found a magical crystal in this cave, so there is nothing interesting left here, and it's time for me to leave..."}
		
		    {S9_BASEMENT_EXIT}
		[/then]
		[else]
		#po: Проте, ім'ям Світла, я все ще відчуваю щось магічне в цій печері. Звісно, я можу просто піти звідси, проте все ж краще буде ще трохи дослідити це місце.
		    {SPEAK Daeola _"However, in the name of Light, I still feel something magical in this cave. Of course, I could just leave, but it would be better to explore this place a little more."}
		[/else][/if]
		
		#update quest objectives
		#po: Повернутись до переляканого селянина
		{VARIABLE s9_quest_4 _"Return to the frightened peasant"}
		{S9_UPDATE_OBJECTIVES no}
	[/then][/if]
	
	[/event]




























