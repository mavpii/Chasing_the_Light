	{SPEAK Magdalena _"I thought you had all perished that night, until a few years ago I heard stories about magic, ‘Light,’ and a prophetess named Daeola who performs miracles and saves people. I didn't know if it was you, but the familiar name gave me hope, and here you are."}
	{DELAY 500}
	#po: А як щодо тебе, Даеоло? У тєбє теж, певно, вже є сім'я?
	{SPEAK Magdalena _"What about you, Daeola? You probably have a family too, right?"}
	#po: Я слуга Світла, Магдалино — весь свій час я витрачаю на війну з Темрявою, тому не маю ні спокою, ні дому, ні сім'ї, ні коханої людини...
	{SPEAK Daeola _"I am a servant of Light, Magdalena — I spend all my time fighting Darkness, so I have no peace, no home, no family, no loved one..."}
	{DELAY 500}
	#po: Ох, тобі не позаздриш...
	{SPEAK Magdalena _"Oh, I can't envy you..."}
	#po: Так... Це страшний тягар, проте я змушена продовжувати боротьбу, щоб інші могли мати спокійні життя, далеко від мерців та темних чаклунів...
	{SPEAK Daeola _"Yes... It's a terrible burden, but I must continue to fight so that others can live peaceful lives, far from the undead and dark sorcerers..."}
	#po: І за це ми всі навіки вдячні тєбє, Даеоло. Ви, маги, врятували багато життів і зараз успєшно звільнюєте Зелений Острів.
	{SPEAK Magdalena _"And for that, we are all thankful to you forever, Daeola. You and other mages, have saved many lives and are now successfully reclaiming the Green Isle."}
	#po: Магдалино... Я-... Хоча хай, тобі зараз потрібна хоч якась допомога?
	{SPEAK Daeola _"Magdalena... I-... Anyway, do you need any help right now?"}
