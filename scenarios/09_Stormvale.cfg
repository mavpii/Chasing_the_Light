	##про шахи
	#define S9_CHESS_EXPLAIN
	{SPEAK Eldaric _"Невже ти проводиш стільки часу, борячись про проклятих західняків, і жодного разу не натрапляла на шахи, оцю їхню гру?"}
	{SPEAK Daeola _"(насторожено дивиться на дошку) Тобто... ви запозичили <i>це</i> в західняків?..."}
	{SPEAK Eldaric _"Не зовсім, проте зроблено їх було за західняцьким задумом та дано в дар мені кілька днів тому. Відчуваєш чи ти якусь злісну магію від них?"}
	
	{MODIFY_UNIT id=Daeola facing nw} {DELAY 500}
	{UNIT_LOOK_AT_UNIT Daeola Eldaric}
	{UNIT_LOOK_AT_UNIT Eldaric Daeola} {DELAY 500}
	
	{SPEAK Daeola _"Ні, це лише вирізьблені шматки дерева. Однак все ж розкажіть мені більше про ці 'шахи'. Як в них грати?"}
	{SPEAK Eldaric _"Тут потрібен неабиякий розум та терпіння, Пророчице. Як ти бачити можеш, є дошка у формі кривої зірки та по десять воїнів для кожного з гравців.
П'ять з них це звичайні солдати, що ходять прямо та рубають мечем навскоси. Якщо вони дійдуть до протилежного краю дошки, зможуть стати сильніше."}
    {SPEAK Eldaric _"Інші же п'ятеро це чаклун, чаклунка, лейтенант, лицар та важкий піхотинець."}
	{SPEAK Daeola _"Цікавий вибір. А як ходять вони?"}
	{SPEAK Eldaric _"Просто дослухай до кінця, Пророчице, й не перебивай Короля. Отож:
- Чаклун дуже повільний та вразливий;
- Чаклунка найсильніша, тому вона може рухатися у всі боки;
- Лейтенант старший над солдатами, тож ходить навскоси;
- Лицар перестрибує через своїх та ворогів;
- А важкий піхотинець просто йде навпролом."}
	{SPEAK Daeola _"Ох, це занадто багато речей, які треба пам'ятати. Але нехай, що треба зробити, щоб перемогти?"}
	{SPEAK Eldaric _"Чаклун є наймудрішим з усієї десятки й керує іншими, тому, щоб перемогти, потрібно знешкодити його. Тобто підставити його під удар, щоб він здався та змусив свій загін скласти зброю."}
	#enddef
	
	
