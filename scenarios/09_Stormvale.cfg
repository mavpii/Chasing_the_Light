	##cursed tiara event
	[event]
	name=moveto
	first_time_only=no
	[filter]
	id=Daeola
	x,y=11,4
	[/filter]
	[filter_condition]
	    [variable]
		    name=s9_current_location
			equals=_"Suspicious house"
		[/variable]
		[and]
		    [variable]
	            name=cursed_tiara
	            not_equals=true
	        [/variable]
		[/and]
	[/filter_condition]
	
	[if]
	[variable]
	    name=s9_tiara_explained
		not_equals=true
	[/variable]
	[then]
	
	[message]
            speaker,image=narrator,wesnoth-icon.png
			#po: У віддаленій кімнаті зруйнованої хатини Даеола знаходить простий золотистий обруч, від якого відчувається якась ледь вловима, але вкрай підозріла магія. Це може бути як і якесь корисне закляття, так і страшне прокляття.
            message= _ "In a remote room of a ruined hut, Daeola finds a simple golden tiara that emits a subtle but highly suspicious magic. It could be either a useful spell or a terrible curse."
	[/message]
	
	{VARIABLE s9_tiara_explained _"true"}
	[/then][/if]
	
	[message]
            speaker=Daeola
			#po: Напевне цю річ тут для мене залишила Файсім... Вчитель завжди казав, що треба обережно досліджувати будь-яку магію, щоб не пропустити корисних заклятть, проте чи варто зараз взагалі ризикувати?
            message= _ "I'm sure Faisim left this thing here for me... Teacher always said that I should research any magic, so I wouldn't miss any useful spells, but is it worth the risk right now?"
            [option]
			#po: Я візьму цю діадему з собою, щоб розгадати та використати її чари.
                label= _ "I will take this tiara with me to uncover and use its magic."
                [command]
				
				{REMOVE_IMAGE 11 4}
				
                [object]
	                [filter]
                        id=Daeola
                    [/filter]
                    name= _ "Suspicious tiara"
                    image=items/tiara.png
                    description= _ "It might have some effects in the future, but right now it's just a suspicious piece of jewelry."
                [/object]
				
				{VARIABLE cursed_tiara _"true"}
			
		        [/command]
            [/option]
            [option]
			#po: Брати з собою підозрілу річ, що належить ворогу Острову, надто необачно.
			    label= _ "It's too reckless to take a suspicious item from an enemy of the Isle."
                [command]
				[/command]
            [/option]
        [/message]
		
    {VARIABLE s9_item_tiara _"Suspicious tiara"}
	
	{S9_UPDATE_OBJECTIVES yes}
	
	[/event]
	
	[event]
	name=09_Stormvale_Faisim_House.map_post
