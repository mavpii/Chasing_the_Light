	{SPEAK Daeola _"Так... Це страшний тягар, проте я змушена продовжувати боротьбу, щоб інші могли мати спокійні життя, далеко від мерців та темних чаклунів..."}
	{SPEAK Magdalena _"І за це ми всі навіки вдячні тєбє, Даеоло. Ви, маги, врятували багато життів і зараз успєшно звільнюєте Зелений Острів."}
