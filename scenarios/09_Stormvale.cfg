		{SPEAK Eldaric _"Про в'язня у підземеллі моєму? Які справи Та, що несе Світло, може мати зі злочинцями та волоцюгами?"}
		{SPEAK Daeola _"Один з них стверджує, що його кинули за ґрати лише через схожість до західняків, нічого іншого він не вчиняв."}
		{SPEAK Eldaric _"Маєш чи ти хоч аби які докази, що він і справді не є західняком? Чому маємо ми вірити йому?"}
		{SPEAK Daeola _"Ми не можемо знати напевне, однак я <i>відчуваю</i>, що в його серці немає Темряви. Тож якщо схожість на західняка його єдиний 'злочин', чому б просто не відпустити його?"}
		{SPEAK Eldaric _"Я візьму слова твої за правду, тому що Пророчицею є ти, проте я не можу звільнити в'язня, не отримавши нічого з цього. Я помилую його, якщо вдастся тобі перемогти мене в шахах."}
		
		[if]
