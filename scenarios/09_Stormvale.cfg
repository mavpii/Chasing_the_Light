	{SPEAK Magdalena _"Моя сім'я втекла звідти до Південної Бухти, де ми багато років жили у бідному таборі неподалік від міста. А потім ми з чоловіком та його двома братами перебралися до Долини Штормів, бо тутешній Король обіцяв багато гарної землі переселенцям."}
	{SPEAK Magdalena _"Ми живемо тут вже більше двадцяти років і, хоч я час від часу згадую про рідне село, я повністю щаслива тут: маю велику сім'ю, гарний будинок та поле, а Королівські війська надійно охороняють усі входи в Долину, тому тут ніколи не було жодного західняка."}
	{SPEAK Daeola _"Я рада, що хоч когось з нашого села все склалося добре. Інші або загинули на війні, або ще продовжують боротися..."}
	{SPEAK Magdalena _"Я гадала, шо ви всі й загинули тієї ночі, поки кілька років тому нє почула розповіді про магію, 'Світло' та якусь Пророчицю на ім'я Даеола, що творить чудеса та рятує людей. Я не знала чи це ти, проте знайоме ім'я дало мнє надію, і ось ти тут."}
