				    #правильна відповідь
				    _"Наймудріші з них схотіли відкрити таємниці безсмертя та правити разом." (
					    {DELAY 500}
					
					    {S9_HISTORIAN_QUIZ _"'Наймудріші', пхм. Наступне питання — свідки кажуть, що мерці вирізали усю Північну Гавань, що здалась без бою. Це правда?"
				
