    id=09_Stormvale
	#po: Долина Штормів
    name= _ "Stormvale"
    map_data="{~add-ons/Chasing_the_Light/maps/09_Stormvale_Castle_Main.map}"
	{INDOORS}
	
	turns=-1
	carryover_percentage=0
    victory_when_enemies_defeated=no
	theme=Cutscene
	next_scenario=10_Priorities

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg journeys_end.ogg}
	
	[story]
		[part]
            #po: newlines at the beginning help to (depending on the screne size) center this vertically. The space at the end stops the last letter from getting cut off
			#po: В пошуках Світла  Частина Третя
            title=_"<span font_family='Oldania ADF Std' size='90000'>


<i>Chasing the Light </i>
Chapter Three 
</span>"
            title_alignment=center
        [/part]
		[part]
            #po: newlines at the beginning help to (depending on the screne size) center this vertically. The space at the end stops the last letter from getting cut off
			#po: Частина Третя    Складні рішення
            title=_"<span font_family='Oldania ADF Std' size='90000'>


Chapter Three 
Tough Choices<i>(157 BW) </i>
</span>"
            title_alignment=center
        [/part]
		[part]
		    #po: Витяг з щоденника Даеоли, Першої Пророчиці Світла. Прямо кидаємо гравцю потужний натяк
			title=_"210 BW"
			#po: Люди кажуть, що колись давно, ще до мого народження, на Зеленому Острові не було ні магії, ні мерців, а лише безліч багатих королівст, родючі землі та нестійкий, проте тривалий мир. Хоч і не все з цього правда, час від часу я гадаю, що було б, якби одного дня з-за океану не прийшли ці чудовиська?
			story = {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _"People say that once upon a time, long before I was born, there was neither magic nor undead on the Green Isle, but only countless rich kingdoms, fertile lands, and an unstable, yet long-lasting peace. Although not all of this is true, from time to time I wonder what would have happened if these monsters hadn't come from across the ocean one day?"
            {CTL_GREEN_ISLE_ESTEN_BIGMAP}
		[/part]
		[part]
	        title=_"201 BW"
			#po: Коли західняки висадилися на півночі, вони поширювалися в усі сторони, наче якась хвороба. Їм пощастило натрапити на напівдикі, малозаселені землі, тому спочатку вони не зустріли великого спротиву, а в інших землях їхні мерці та чаклунство вважались ледь не чутками.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "When the Wesfolk landed in the north, they spread in all directions like some disease. They were lucky to stumble upon semi-wild, sparsely populated lands, so at first they did not meet much resistance, and in other lands, their undead and so-called 'witchcraft' were considered almost rumors."
            {CTL_GREEN_ISLE_ESTEN_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 1}
		[/part]
		[part]
		    title=_"188 BW"
			#po: А потім почався великий наступ, під час якого загинула моя сім'я, було знищено моє рідне село і, коли всім вже здалося, що клятих мерців неможливо зупинити, вони просто відступили. Лише згодом, через багато років, нам вдалося дізнатися, що тоді серед західняків почалася міжусобиця — двоє Владик-Лічів не змогли поділити могутній артефакт, який вони називають Рубіном Вогню.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _"And then the great offensive began, during which my family died, my village was destroyed, and when everyone thought that the cursed undead could not be stopped, they simply retreated. Only later, after many years, we managed to find out that at that time an internal strife began among the Wesfolk - two Lich-Lords could not divide a powerful artifact that they call the Ruby of Fire."
            {CTL_GREEN_ISLE_ESTEN_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 2}
		[/part]
		[part]
		    title=_"169 BW"
			#po: Через дев'ятнацять років, незадовго до того як я стала Магом Світла, західняки відновили свої спроби захопити весь Зелений Острів, швидко підкоривши майже все Чорнотопське Графство, землі Вудлендору та проклявши Естен, а стародавнє місто Скархейн було взято в тривалу облогу. За наказом Короля, <b>ми</b> разом з кількома служителями Світла та загоном воїнів вирушили на допомогу скархейнцям таємними шляхами.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Nineteen years later, shortly before I became a Mage of Light, the Wesfolk renewed their attempts to seize the entire Green Isle, quickly conquering almost all of Blackmore County, the lands of Woodlandor, cursing Esten, and the ancient city of Skarheim was put under a long siege. By order of the King of Southbay, <b>we</b>, together with several servants of Light and a squad of soldiers, set out to help the Scarhane people using secret paths."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 3}
		[/part]
		[part]
		    title=_"168 BW"
			#po: І хоча місто було втрачено, ми змогли врятувати частину його жителів, а також Графа Чорнотопу. Це була невелика, проте все ж дуже важлива перемога: ми довели всьому Зеленому Острову, що саме магія стане ключем для перемоги над ворогами.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "And although the city was lost, we were able to save some of its inhabitants, as well as the Count of Blackmore. It was a small, but still very important victory: we proved to the entire the Green Isle that magic would be the key to defeating the enemies."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 4}
		[/part]
		[part]
		    title=_"163 BW"
			#po: Протягом наступних кількох років, на полі болі стало з'являтися все більше магів, а міста й поселення наповнюватися цілителями, котрі лікували та зцілювали всіх постраждалих від цієї війни, тож з часом нам вдалося значно сповільнити просування мерців, а потім й взагалі майже зупинити їх.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Over the next few years, more and more mages began to appear on the battlefield, and cities and settlements began to fill with healers who treated and cured everyone affected by this war, so over time we managed to significantly slow down the advance of the undead, and then almost stop them altogether."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 5}
		[/part]
		[part]
		    title=_"162 BW"
			#po: Ось так і настало затишшя, під час якого на лінії зіткнення майже кожного дня гинули воїни, а в тилу не відбувалося майже нічого, окрім рідкісних появ Владики-Ліча Карора, подібних до тої, що він вчинив у Естені. У нас просто не було достатньо сил прогнати західняків, а в них — захопити щось більше, ніж кілька клаптиків землі на місяць.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Thus came a lull, during which fighters died on the frontline almost every day, and almost nothing happened in the rear of the frontlines, except for rare appearances of Lich-Lord Caror, similar to the one he made in Esten. We simply did not have enough strength to drive out the Wesfolk, and they did not have enough to seize more than a few patches of land per month."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 5}
		[/part]
		[part]
		    title=_"157 BW"
			#po: Це могло продовжуватися століттями, проте одного дня жителі Чистих Вод з жахом побачили як з моря до них почали підійматися легіони мерців на чолі з Владикою Карором, а потім причалили кораблі з могутніми некромантами. Як вони опинилися там? Деякі кажуть, що вони обійшли весь Зелений Острів під водою, а інші, що їх привезли на кораблях, однак одне було зрозуміло точно — нас застали зненацька.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "This could have continued for centuries, but one day the inhabitants of Clearwater Port watched in horror as legions of undead, led by Caror, began to rise from the sea, and then ships with powerful necromancers moored. How did they get there? Some say they bypassed the entire Green Isle underwater, and others say they were brought on ships, but one thing was clear - we were caught by surprise."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 6}
		[/part]
		[part]
		    title=_"157 BW"
			#po: Більшість наших військ перебувала поблизу Долини Штормів, готуючись до великого наступу на ворожу столицю, тому в містах був лише невеликий гарнізон з місцевого ополчення, яке ніколи не воювало проти мерців. Завершилося все передбачувано — не зустрівши майже ніякого спротиву, західнякам вдалося швидко оточити Чисті Води та взяти їх в облогу.
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Most of our troops were near Stormvale, preparing for a major offensive on the enemy's capital, so the city had only a small garrison of local militia who had never fought against the undead. Everything ended predictably - meeting almost no resistance, the Wesfolk managed to quickly surround Clearwater Port and lay siege to it."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 7}
		[/part]
		[part]
		    title=_"157 BW"
			#po: Король Південної Бухти послав туди найсильнішого зі своїх магів разом з великою армією, щоб розгромити західняків. Щодо мене, то я змушена мандрувати до півночі Королівства Долини Штормів, щоб зустрітися з тамтешнім військом та підтримати їх в бою. У мене є певні <i>побоювання</i>, що ця кампанія неодмінно завершиться поразкою, однак я вірю, що моя магія та Світло допоможуть нам нарешті завершити цю криваву війну... принаймні це те, що я кажу людям....
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "The King of Southbay sent his strongest mage there along with a large army to defeat the Wesfolk. As for me, I am forced to travel to the north of the Kingdom of Stormvale to meet with the local army and support them in battle. I have certain fears that this campaign will inevitably end in defeat, but I believe that my magic and the Light will help us finally end this bloody war... at least that's what I tell people."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 7}
		[/part]
	[/story]
	
