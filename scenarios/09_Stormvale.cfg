#po: Вона знову тут, а її поява завжди означає небезпеку...
#po: Ти з'являєшся все частійше й частіше, це... дратує...
	{SPEAK Daeola ({WHISPER _"quietly^<i>She's back, and her arrival always means trouble...</i>"} + _"
You're showing up more and more often, it's... annoying...")}
#po: наближається час великих змін, 'пророчице', але чи усвідомлюєш це ти? невже знову просто стоятимеш і дивитимешся на мене, не нападатимеш...?
	{SPEAK Faisim _"the time of great change is drawing near, 'prophetess', but do you even realize it? will you truly just stand there and stare at me again, without attacking…?"}
	#po: (зітхає) Скажи, який у цьому сенс, Файсім? Який сенс нападати, якщо я не можу вбити тебе — щоб я не робила, ти чомусь завжди повертаєшся...
	{SPEAK Daeola _"(sighs) Tell me, what's the point, Faisim? What's the point of attacking if I can't kill you — no matter what I do, you always come back for some reason..."}
	{DELAY 500}
    #po: багато років я сподіваюся почути це питання й від Гараліна, але він лише прагне знищити 'темряву' та усіх західняків, ні миті не думаючи як цього найкраще досягти...
	{SPEAK Faisim _"for many years i’ve hoped to hear that question from Haralin as well, yet he only wishes to destroy so-called 'darkness' and all wesfollk, never sparing a moment to consider the best way to achieve it…"}
	#po: Якби ж тільки моя магія була здатна знищити тебе... Однак я розумію, що це марно, тому...
	{SPEAK Daeola _"If only my magic could destroy you... However, I understand that it is of no use, so..."}
	{DELAY 500}
	#po: ... поки ти не чиниш зла у цій Долині, я можу знову побалакати з тобою... У тебе є нова інформація про місця перебування Владик-Лічів?
	{SPEAK Daeola _"... as long as you don't do any harm in this Valley, I can talk to you again... Do you have any new information about the whereabouts of the Lords-Lichs?"}
	#po: щоб ще краще уникати їх чи нарешті вступити в бій?
	{SPEAK Faisim _"to avoid them even better, or finally join the battle?"}
	{DELAY 500}
	#po: Ти знаєш відповідь...
	{SPEAK Daeola _"You know the answer..."}
	#po: один у чистих водах, ще один у зламаних горах, всі інші в столиці. ти і справді збираєшся все життя уникати їх, Даеоло? що ти плануєш робити далі?
	{SPEAK Faisim _"one in clearwater, another in the broken mountains, the rest in the capital. are you really planning to avoid them your whole life, daeola? what do you intend to do next?"}
	##facing Даеоли в різні сторони.
	#po: Певно, просто продовжувати боротьбу, сподіваючись, що колись <b>щось</b> зміниться і нарешті настане мир...
	{SPEAK Daeola _"Probably just keep fighting, hoping that someday <b>something</b> will change and peace will finally come..."}
	#po: під час нашої першої зустрічі ти говорила зовсім по-іншому — <b>ти</b> збиралася щось змінити. хіба це не було твоєю метою?
	{SPEAK Faisim _"during our first meeting you spoke quite differently — <i>you</i> wanted to change something. wasn’t that your purpose?"}
	{DELAY 500}
	#po: Я... значно переоцінила свої сили: недостатньо лише надії та бажання, щоб перемогти. Всі ці роки я творила добро, рятувала життя та знищувала мерців, однак... я не відчуваю, що це хоч трохи допомогло...
	{SPEAK Daeola _"I... greatly overestimated my strength: hope and desire alone are not enough to win. All these years I have been doing good, saving lives and destroying undead, but... I don't feel like it helped even a little..."}
	#po: Іноді здається, що проклятих західняків просто неможливо зупинити... Мерці вже знищили кілька великих королівств і навіть взяли в облогу Чисті Води, а я... просто мандрую на північ, щоб...
	{SPEAK Daeola _"Sometimes I think the damned Wesfolk just can't be stopped... The undead have already destroyed several great Kingdoms and even besieged Clearwater Port, and I... I'm just wandering north to..."}
	{DELAY 500}
	#po: ...підтримати нерозумну спробу атакувати столицю владик-лічів. мені та їм вже відомо про це...
	{SPEAK Faisim _"...to support the foolish attempt to attack the lich-lords' capital. they already know of it, and so do i…"}
	#po: проте, як ти гадаєш, Даеоло... невже цього разу ви переможете, однієї твоєї магії 'світла' вистачить для перемоги?
	{SPEAK Faisim _"but tell me, daeola… do you truly think you’ll win this time, that your 'light' magic will be enough?"}
	{DELAY 500}
	#po: Ти знаєш відповідь: моя магія Світла нерівня потворам, що керують вами. Навіть один Владика-Ліч здатен повністю змінити хід битви, а скільки їх у столиці?
	{SPEAK Daeola _"You know the answer: my magic of Light is no match for the monsters that rule you. Even one Lich-Lord is capable of completely changing the tide of battle, and how many of them are there in the capital?"}
	#po: достатньо, щоб знищити все ваше військо.
	{SPEAK Faisim _"enough to wipe out your entire army."}
	#po: Саме так. Найсильніший маг Острову навряд чи зможе знищити найслабшого Владику-Ліча, а про мене й годі казати... Я братиму участь у битві лише, щоб підтримати людей, які поки самі не здогадуються, що за кілька днів помруть та перетворяться на бездушних мерців...
	{SPEAK Daeola _"That's right. I doubt that even the strongest mage of the Isle is able to destroy the weakest Lich-Lord, let alone me... I will take part in the battle only to support people who do not yet realize that in a few days they will die and turn into soulless corpses..."}
	{DELAY 500}  
	#po: Я просто не вірю в наш успіх... і не розумію, чому добро та Світло не панує над злом та Темрявою...!
	{SPEAK Daeola _"I just don't believe in our success... and I don't understand why good and Light don't prevail over evil and Darkness...!"}
	#po: ти жалюгідна, Даеоло.
	{SPEAK Faisim _"you’re pathetic, daeola."}
	{SPEAK Daeola _"I know..."}
	#po: твій відчай ніяк не допоможе нашій справі, тому припини це. невже ти досі не зрозуміла, що якби західняки справді могли перемогти, вони б це вже зробили?
	{SPEAK Faisim _"your despair serves our cause in no way, so stop it. have you still not understood that if the 'wesfolk' were capable of winning, they would have done so long ago?"}
	#po: владики-лічі не всесильні, їх можливо знешкодити й навіть вбити, хоча й дуже важко. а зі знищенням бодай одного з них з'явиться справжня надія на перемогу.
	{SPEAK Faisim _"the lich-lords are not all-powerful; they can be weakened and even killed, though with great difficulty. and if even one of them falls, there will be real hope for victory."}
	{DELAY 500}
	#po: У прямому бою ні я, ні Майстер, не зможемо перемогти цих огидних мерців. Якби ж в нас з'явилася можливість заманити когось з них у пастку...
	{SPEAK Daeola _"In direct combat, neither I nor my Teacher can defeat those disgusting creatures. If only we had the opportunity to lure one of them into a trap..."}
	#po: пастку?
	{SPEAK Faisim _"trap?"}
	{DELAY 500}
	#po: що ти віддаси задля можливості це зробити, Даеоло, чим пожертвуєш?...
	{SPEAK Faisim _"what will you give for the chance to do that, daeola? what will you sacrifice...?"}
	{SPEAK Daeola _"..."}
	{DELAY 500}
	##facing
	{SPEAK Daeola _"My life..."}
	{DELAY 500}
	#po: смілива відповідь, проте чи правдива?
	{SPEAK Faisim _"a bold answer, but is it true?"}
	#po: хай там як — мені час йти. я відчуваю, що нам судилося побачитися знову, тож коли це станеться, будь готова, що я не стану вести дружні розмови.
	{SPEAK Faisim _"either way, it’s time for me to go. i feel we are destined to meet again, and when we do, be prepared — i won’t be in the mood for friendly conversation."}
