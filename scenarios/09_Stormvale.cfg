	{INTRO_AND_SCENARIO_MUSIC revelation.ogg journeys_end.ogg}
	
	[story]
		[part]
            #po: newlines at the beginning help to (depending on the screne size) center this vertically. The space at the end stops the last letter from getting cut off
			#po: В гонитві за Світлом | Женучись за Світлом  Частина Третя
            title=_"<span font_family='Oldania ADF Std' size='90000'>


<i>Chasing the Light </i>
Chapter Three 
</span>"
            title_alignment=center
        [/part]
		[part]
            #po: newlines at the beginning help to (depending on the screne size) center this vertically. The space at the end stops the last letter from getting cut off
			#po: Частина Третя    Складні рішення
            title=_"<span font_family='Oldania ADF Std' size='90000'>


Chapter Three 
Tough Choices<i>(157 BW) </i>
</span>"
            title_alignment=center
        [/part]
		[part]
		    #po: Витяг з щоденника Даеоли, Першої Пророчиці Світла. Прямо кидаємо гравцю потужний натяк
			title=_"210 BW"
			story = {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _"Люди кажуть, що колись давно, ще до мого народження, на Зеленому Острові не було ні магії, ні мерців, а лише безліч багатих королівст, родючі землі та нестійкий, проте тривалий мир. Хоч і не все з цього правда, час від часу я гадаю, що було б, якби одного дня з-за океану не прийшли ці чудовиська?"
            {CTL_GREEN_ISLE_ESTEN_BIGMAP}
		[/part]
		[part]
	        title=_"201 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Коли західняки висадилися на півночі, вони поширювалися в усі сторони, наче якась хвороба. Їм пощастило натрапити на напівдикі, малозаселені землі, тому спочатку вони не зустріли великого спротиву, а в інших землях їхні мерці та чаклунство вважались ледь не чутками."
            {CTL_GREEN_ISLE_ESTEN_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 1}
		[/part]
		[part]
		    title=_"188 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _"А потім почався великий наступ, під час якого загинула моя сім'я, було знищено моє рідне село і, коли всім вже здалося, що клятих мерців неможливо зупинити, вони просто відступили. Лише згодом, через багато років, нам вдалося дізнатися, що тоді серед західняків почалася міжусобиця — двоє Владик-Лічів не змогли поділити могутній артефакт, який вони називають Рубіном Вогню."
            {CTL_GREEN_ISLE_ESTEN_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 2}
		[/part]
		[part]
		    title=_"169 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Через дев'ятнацять років, незадовго до того як я стала Магом Світла, західняки відновили свої спроби захопити весь Зелений Острів, швидко підкоривши майже все Чорнотопське Графство, землі Вудлендору та проклявши Естен, а стародавнє місто Скархейн було взято в тривалу облогу. За наказом Короля, <b>ми</b> разом з кількома служителями Світла та загоном воїнів вирушили на допомогу скархейнцям таємними шляхами."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 3}
		[/part]
		[part]
		    title=_"168 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "І хоча місто було втрачено, ми змогли врятувати частину його жителів, а також Графа Чорнотопу. Це була невелика, проте все ж дуже важлива перемога: ми довели всьому Зеленому Острову, що саме магія стане ключем для перемоги над ворогами."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 4}
		[/part]
		[part]
		    title=_"163 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Протягом наступних кількох років, на полі болі стало з'являтися все більше магів, а міста й поселення наповнюватися цілителями, котрі лікували та зцілювали всіх постраждалих від цієї війни, тож з часом нам вдалося значно сповільнити просування мерців, а потім й взагалі майже зупинити їх."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 5}
		[/part]
		[part]
		    title=_"162 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Ось так і настало затишшя, під час якого на лінії зіткнення майже кожного дня гинули воїни, а в тилу не відбувалося майже нічого, окрім рідкісних появ Владики-Ліча Карора, подібних до тої, що він вчинив у Естені. У нас просто не було достатньо сил прогнати західняків, а в них — захопити щось більше, ніж кілька клаптиків землі на місяць."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 5}
		[/part]
		[part]
		    title=_"157 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Це могло продовжуватися століттями, проте одного дня жителі Чистих Вод з жахом побачили як з моря до них почали підійматися легіони мерців на чолі з Владикою Карором, а потім причалили кораблі з могутніми некромантами. Як вони опинилися там? Деякі кажуть, що вони обійшли весь Зелений Острів під водою, а інші, що їх привезли на кораблях, однак одне було зрозуміло точно — нас застали зненацька."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 6}
		[/part]
		[part]
		    title=_"157 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Більшість наших військ перебувала поблизу Долини Штормів, готуючись до великого наступу на ворожу столицю, тому в містах був лише невеликий гарнізон з місцевого ополчення, яке ніколи не воювало проти мерців. Завершилося все передбачувано — не зустрівши майже ніякого спротиву, західнякам вдалося швидко оточити Чисті Води та взяти їх в облогу."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 7}
		[/part]
		[part]
		    title=_"157 BW"
            story= {CAPTION ( _ "Excerpts from the journal of Daeola, The First Prophetess of Light")} + _ "Король Південної Бухти послав туди найсильнішого зі своїх магів разом з великою армією, щоб розгромити західняків. Щодо мене, то я змушена мандрувати до півночі Королівства Долини Штормів, щоб зустрітися з тамтешнім військом та підтримати їх в бою. У мене є певні <i>побоювання</i>, що ця кампанія неодмінно завершиться поразкою, однак я вірю, що моя магія та Світло допоможуть нам нарешті завершити цю криваву війну... принаймні це те, що я кажу людям...."
            {CTL_GREEN_ISLE_BIGMAP}
			{CTL_GREEN_ISLE_FRONTLINE 7}
		[/part]
	[/story]
	
