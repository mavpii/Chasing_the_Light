    #кінець сценарію
	[event]
	name=moveto
	first_time_only=no
	[filter]
		id=Daeola
		[filter_location]
		    x=8-11
			y=1
		[/filter_location]
	[/filter]
	[filter_condition]
	    [variable]
		    name=s9_current_location
			equals=_"Outskirts of Stormvale"
		[/variable]
	[/filter_condition]
	
	[if]
	[variable]
	name=s9_daeola_faisim_notified
	equals=true
	[/variable]
	[and]
	[variable]
	name=s9_daeola_faisim
	not_equals=true
	[/variable]
	[/and]
	[then]
	
	##відмова уходити
	{SPEAK Daeola _"Я не можу покинути Долину Штормів, поки не поговорю з тією жінкою. Я відчула в ній щось... дуже дивне..."}
	
	[/then]
	[else]
	
	    [if]
		[variable]
		name=s9_all_quests
		equals=true
		[/variable]
		[then]
		    ##виконані всі квести
		    {VARIABLE s9_finish_scenario_question _"Даеола наблизилася до кордону королівства Долини Штормів, за яким знаходилися лише спустошені війною землі, а також примарна надія на перемогу. Схоже, всі можливі завдання вже було виконано, тож чаклунці ніщо не заважає покинути це місце та відправитися до табору об'єднаних військ Зеленого Острову."}
			{VARIABLE s9_finish_scenario_yes _"Мені шкода покидати це місце, однак я <i>мушу</i> продовжувати боротьбу."}
			{VARIABLE s9_finish_scenario_no _"Я хочу ще хоч трохи відпочити, на півночі мене чекає лише війна."}
		[/then]
		[else]
		    ##виконані не всі квести
		    {VARIABLE s9_finish_scenario_question _"Даеола наблизилася до кордону королівства Долини Штормів, за яким знаходилися лише спустошені війною землі, а також примарна надія на перемогу. Хоч і не всі завдання було виконано, чаклунці ніщо не заважає покинути це місце та відправитися до табору об'єднаних військ Зеленого Острову."}
			{VARIABLE s9_finish_scenario_yes _"Я хотіла б зробити щось ще, однак мені справді вже час йти."}
			{VARIABLE s9_finish_scenario_no _"Кільком людям Долини Штормів ще потрібна моя магія, я не можу піти."}
		[/else][/if]
		
		[message]
            speaker=narrator
			image=wesnoth-icon.png
            message= $s9_finish_scenario_question
            [option]
                label= $s9_finish_scenario_yes
                [command]
				    ##якщо не була у Файсім
					[if]
	                [variable]
	                name=s9_daeola_faisim_notified
	                not_equals=true
	                [/variable]
		            [then]
					
					    {NAMED_GENERIC_UNIT 2 (Outlaw_Peasant) 15 12 Faisim ()}
	                    {MODIFY_UNIT x,y=15,12 facing sw}
	                    {MODIFY_UNIT x,y=15,12 name _"???"}
	                    {MODIFY_UNIT x,y=15,12 gender female}
						{MODIFY_UNIT x,y=15,12 profile "portraits/humans/outlaw+female.webp"}
	                    {S9_GIVE_QUEST_ICON Faisim}
						
						[move_unit]
	                    id=Faisim
	                    to_x=11
	                    to_y=4
	                    [/move_unit]
					
					    {SPEAK Faisim _"Пророчице Світла, невже ти просто оминеш мою хатину та підеш далі?"}
						{DELAY 300}
						{UNIT_LOOK_AT_UNIT Faisim Daeola}
	                    {UNIT_LOOK_AT_UNIT Daeola Faisim}
						{SPEAK Faisim _"Мені дуже потрібна чаклунська допомога, пані... і тобі теж..."}
						
						{DELAY 500}
						
						[move_unit]
	                    id=Faisim
	                    to_x=11
	                    to_y=4
	                    [/move_unit]
					
					    [kill]
						id=Faisim
						[/kill]
						
						{SPEAK Daeola ({WHISPER _"quietly^<i>Я відчуваю, що щось з цією жінкою не так, але що саме?... Я маю піти до її будинку та поговорити з нею.</i>"})}
		
		                {VARIABLE s9_daeola_faisim_notified _"true"}
						
						{VARIABLE s9_quest_main _"Поговоріть з дивною жінкою у її хаті"}
	                    {S9_UPDATE_OBJECTIVES no}
					
					[/then]
					##якщо була у Файсім
					[else]
					
					    [if]
						[variable]
						name=stormvale_quests_completed
						equals=$stormvale_quests_max
						[/variable]
						[then]
						
						    [set_achievement]
                                content_for=Chasing_the_Light
                                id="ctl_s9_quests"
                            [/set_achievement]
						
						[/then][/if]
					
					    [endlevel] 
                            result=victory
                        [/endlevel]
					
					[/else][/if]
		        [/command]
            [/option]
            [option]
			    label= $s9_finish_scenario_no
                [command][/command]
            [/option]
        [/message]
	[/else][/if]
	[/event]
	
	[event]
	name=last breath
	[filter]
	    id=Daeola
	[/filter]
	
	{SPEAK Daeola _"Уркгх... Я не можу загинути ось так..."}
	
	[endlevel]
	    result=defeat
	[/endlevel]
	
	[/event]
[/scenario]