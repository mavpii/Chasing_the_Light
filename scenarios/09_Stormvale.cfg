	##розмовляє вкрай офіційно лише тому, що на зустрічі з королем та хоче справити гарне враження, щоб отримати підтримку
	{SPEAK Daeola _"...ось що означає йти шляхом Світла та чинити згідно йому. Бо лише з допомогою нього та <i>магії</i> ми зможемо перемогти страшну хворобу, що відібрала в нас Північ Острову та продовжує нещадно поширюватися у всі боки..."}
	{SPEAK Eldaric _"Воістину мудрою та повчальною була оповідь твоя, о Пророчице Світла, тож з причини цієї приймаю я твої вчення, як і усе моє величне Королівство Долини Штормів."}
	{SPEAK Daeola _"Мій пане, моє серце радіє, що ви без жодних сумнівів стали на бік добра та Світла."}
	{SPEAK Daeola (_"Якщо буде ваша ласка, я лише з вами мого учня, Доуласа, щоб він міг і на далі наставляти це Королівство.
" + {WHISPER _"quietly^<i>І прості, і багаті люди обожнюють чудеса. Присутність такого вправного цілителя як Доулас серед них остаточно зламає будь-який опір магії...</i>"})}
	{MODIFY_UNIT id=Doulas side 2}
	{SPEAK Doulas _"(вклоняється) До вашої служби, володарю."}
	{SPEAK Eldaric _"У такому разі, Доуласе, я призначу тебе своїм радником, а також виділю одну з найкращих кімнат у моєму розкішному замку, щоб ти не знав у цьому місці горя. Це стосується і тебе, Пророчице, ти можеш залишитися тут на стільки, скільки душа твоя забажає та перепочити від тяжких трудів."}
	{SPEAK Daeola _"Для мене це велика честь, однак я не маю часу на зволікання: як слуга Світла, я маю священний обов'язок допомогти усім нуждненним цієї Долини."}
	{SPEAK Daeola (_"Після чого ж одразу мій шлях поведе мене до табору Об'єднаного Війська, щоб взяти участь у <i>спробі</i> знищити столицю західняків.
" + {WHISPER _"quietly^<i>Сподіваюся, його розчулять мої слова та він дасть мені хоч невеликий загін...</i>"})}
	{SPEAK Eldaric _"У разі такому, неприпустимо буде для мене відправити тебе на тебе важливе завдання без належної підтримки: я приєднаюся до інших Королівств та надішлю своїх людей половину на поміч вам."}
	{SPEAK Eldaric _"Також дозволено тобі буде скористатися послугами найманців-арбалетчиків, що засіли на півдні Долини. Буду вкрай вдячний я, якщо переконаєш їх покинути те місце та піти з тобою..."}
	{SPEAK Daeola (_"Дякую, володарю, вашу щедрість неможливо навіть оцінити...
" + {WHISPER _"quietly^<i>Ім'ям Світла, навіть не довелося його вмовляти, на відміну від інших...</i>"})}
    {SPEAK Eldaric _"Хай там як, досить з цієї зустрічі, Пророчице. Я не смію затримувати ту, що несе волю Світла, особливо якщо має вона справи невідкладні."}
	
