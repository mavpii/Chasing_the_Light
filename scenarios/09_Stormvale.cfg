	##розмовляє вкрай офіційно лише тому, що на зустрічі з королем та хоче справити гарне враження, щоб отримати підтримку
	#po: ...ось що означає йти шляхом Світла та чинити згідно йому. Бо лише з допомогою нього та <i>магії</i> ми зможемо перемогти страшну хворобу, що відібрала в нас Північ Острову та продовжує нещадно поширюватися у всі боки...
	{SPEAK Daeola _"...this is what it means to follow the path of Light and act in line with it. Because only with its help and <i>magic</i> can we defeat the terrible disease that has taken the North of the Isle from us and continues to spread mercilessly in all directions..."}
	#po: Воістину мудрою та повчальною була оповідь твоя, о Пророчице Світла, тож з причини цієї приймаю я твої вчення, як і усе моє величне Королівство Долини Штормів.
	{SPEAK Eldaric _"Truly wise and enlightening was your tale, o Prophetess of Light, and for cause I accept your teachings, as does my entire majestic Kingdom of Stormvale."}
	#po: Мій пане, моє серце радіє, що ви без жодних сумнівів стали на бік добра та Світла.
	{SPEAK Daeola _"My lord, my heart rejoices that you have unhesitatingly taken the side of goodness and Light."}
	#po: Якщо буде ваша ласка, я лишу з вами мого учня, Доуласа, щоб він міг і на далі наставляти це Королівство.
	#po: І прості, і багаті люди обожнюють чудеса. Присутність такого вправного цілителя як Доулас серед них остаточно зламає будь-який опір магії...
	{SPEAK Daeola (_"If you would please, I will leave my apprentice, Doulas, with you so that he may continue to guide this Kingdom.
" + {WHISPER _"quietly^<i>Both poor and rich alike adore miracles. The presence of such a skilled healer as Doulas among them will completely break any resistance to magic...</i>"})}
	{MODIFY_UNIT id=Doulas side 2}
	#po: (вклоняється) До вашої служби, володарю.
	{SPEAK Doulas _"(bows) At your service, my lord."}
	#po: У такому разі, Доуласе, я призначу тебе своїм радником, а також виділю одну з найкращих кімнат у моєму розкішному замку, щоб ти не знав у цьому місці горя. Це стосується і тебе, Пророчице, ти можеш залишитися тут на стільки, скільки душа твоя забажає та перепочити від тяжких трудів.
	{SPEAK Eldaric _"If so, Doulas, I'll make you my advisor and give you one of the best rooms in my magnificent castle so you won't have any trouble here. That goes for you too, Prophetess. You can stay here as long as you want and take a break from your hard days."}
	#po: Для мене це велика честь, однак я не маю часу на зволікання: як слуга Світла, я маю священний обов'язок допомогти усім нуждненним цієї Долини.
	{SPEAK Daeola _"It is a great honour for me, but I have no time to delay: as a servant of Light, I have a sacred duty to help all those in need in this Valley."}
	#po: Після чого ж одразу мій шлях поведе мене до табору Об'єднаного Війська, щоб взяти участь у <i>спробі</i> знищити столицю західняків.
	#po: Сподіваюся, його розчулять мої слова та він дасть мені хоч невеликий загін...
	{SPEAK Daeola (_"After that, my path will immediately lead me to the camp of the United Army to take part in the <i>attempt</i> to destroy the capital of the Wesfolk.
