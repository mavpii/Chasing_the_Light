	##про шахи
	#define S9_CHESS_EXPLAIN
	{SPEAK Eldaric _"Is it truly possible that you have spent so much time battling those accursed Wesfolk, and yet have never once encountered chess — their peculiar little game?"}
	#po: Невже ти проводиш стільки часу, борячись про проклятих західняків, і жодного разу не натрапляла на шахи, оцю їхню гру?
	#po: (насторожено дивиться на дошку) Тобто... ви запозичили <i>це</i> в західняків?...
	{SPEAK Daeola _"(looks at the board suspiciously) So... you borrowed <i>this</i> from the Wesfolk?"}
	#po: Не зовсім, проте зроблено їх було за західняцьким задумом та дано в дар мені кілька днів тому. Відчуваєш чи ти якусь злісну магію від них?
	{SPEAK Eldaric _"Not quite, though they were crafted according to Wesfolk design and gifted to me only a few days ago. Tell me, do you sense any magic within them?"}
	
	{MODIFY_UNIT id=Daeola facing nw} {DELAY 500}
	{UNIT_LOOK_AT_UNIT Daeola Eldaric}
	{UNIT_LOOK_AT_UNIT Eldaric Daeola} {DELAY 500}
	
	#po: Ні, це лише вирізьблені шматки дерева. Однак все ж розкажіть мені більше про ці 'шахи'. Як в них грати?
	{SPEAK Daeola _"No, they're just carved pieces of wood. But tell me more about this 'chess'. How do you play it?"}
	#po:Тут потрібен неабиякий розум та терпіння, Пророчице. Як ти бачити можеш, є дошка у формі кривої зірки та по десять воїнів для кожного з гравців.
#po: П'ять з них це звичайні солдати, що ходять прямо та рубають мечем навскоси. Якщо вони дійдуть до протилежного краю дошки, зможуть стати сильніше.
	{SPEAK Eldaric _"This game requires considerable intellect and patience, Prophetess. As you can see, there is a board shaped like a crooked star, and ten warriors for each player.
Five of them are common soldiers, who advance straight ahead and strike diagonally. Should they reach the opposite edge of the board, they may grow stronger."}
	#po: Інші же п'ятеро це чаклун, чаклунка, лейтенант, лицар та важкий піхотинець.
    {SPEAK Eldaric _"The other five are the sorcerer, the sorceress, the lieutenant, the knight and the heavy infantryman."} ##Гаралін , Даеола , Аса, Зегам та Джуанг
	#po: Цікавий вибір. А як ходять вони?
	{SPEAK Daeola _"An interesting choice. How do they move?"}
	#po: Просто дослухай до кінця, Пророчице, й не перебивай Короля. Отож:
#po: - Чаклун дуже повільний та вразливий;
#po: - Чаклунка найсильніша, тому вона може рухатися у всі боки;
#po: - Лейтенант старший над солдатами, тож ходить навскоси;
#po: - Лицар перестрибує через своїх та ворогів;
#po: - А важкий піхотинець просто йде навпролом.
	{SPEAK Eldaric _"Simply listen until the end, Prophet, and refrain from interrupting King. Now then:
– The sorcerer is exceedingly slow and fragile;
– The sorceress is the mightiest of all, thus she may move in any direction;
– The lieutenant commands the soldiers, and therefore moves diagonally;
– The knight leaps over both allies and foes;
– And the heavy infantryman advances by sheer force, straight ahead."}
#po: Ох, це занадто багато речей, які треба пам'ятати. Але нехай, що треба зробити, щоб перемогти?
	{SPEAK Daeola _"Oh, that's too many things to remember. But anyway, what do I need to do to win?"}
	#po: Чаклун є наймудрішим з усієї десятки й керує іншими, тому, щоб перемогти, потрібно знешкодити його. Тобто підставити його під удар, щоб він здався та змусив свій загін скласти зброю.
	{SPEAK Eldaric _"The sorcerer is the wisest among the ten and leads the rest; thus, to claim victory, one must place him under such threat that he surrenders and compels his aquad to lay down their arms."}
	#enddef
	
	
