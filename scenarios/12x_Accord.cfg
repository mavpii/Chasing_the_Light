#textdomain wesnoth-ctl
{JOURNAL 12x_Accord _"Accord" no}

[scenario]
    id=12x_Accord
	#po: Злагода
    name= _ "Accord"
    map_data="{~add-ons/Chasing_the_Light/maps/09_Stormvale_Meadow.map}"
	{DUSK}

	turns=-1
	carryover_percentage=0
    victory_when_enemies_defeated=no
	theme=Cutscene_Minimal
	next_scenario=13_Cadence

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg sad.ogg}

	{CTL_GI_TRACK {JOURNEY_12x} }

	#############
	## SCENERY ##
	#############
	{PLACE_IMAGE "scenery/signpost.png" 23 18}

	###########
	## SIDES ##
	###########
	[side]
        side=1
        id,defeat_condition=Haralin,never
        no_leader=yes
        controller=human
        team_name=Islefolk
        shroud=no
        fog=no
        {FLAG_VARIANT long}
        {GOLD 0 0 0}
        {INCOME 0 0 0}
		#po: Загін Гараліна
        user_team_name=_"Haralin's Squad"
#ifdef MULTIPLAYER
	    allow_player=yes
	    share_vision=all
#endif
    [/side]

	{CTL_COOP_SIDE_RESERVED}

	[side]
        side=3
        controller=ai
        color=blue
        id=Faisim
        type=Wesfolk Princess
		#po: Файсім
        name= _ "Faisim"
        unrenamable=yes
        profile="portraits/wesfolk/faisim.webp"
        gender=female
        canrecruit=yes
        x,y=11,12
        facing=n
        [modifications]
            {TEAM_COLOR_OVERRIDE (id=Faisim) purple}
        [/modifications]
        team_name=Islefolk
		#po: Файсім
        user_team_name=_ "Faisim"
        defeat_condition=never
        {GOLD 0 0 0}
        {INCOME 0 0 0}
        shroud=no
        fog=no
#ifdef MULTIPLAYER
	    allow_player=no
#endif
    [/side]

	##############
	## PRESTART ##
	##############
	[event]
	    name=prestart

	    [if]
	        [variable]
	            name=s9_highlander_finished
	            equals=true
	        [/variable]
	        [then]
	            [unit]
	                side=1
	                id=Synyr
	                type=Highlander
					#po: Синир
	                name= _ "Synyr"
	                unrenamable=yes
	                random_traits=no
	                x,y=9,11
	                facing=ne
	                [modifications]
	                    {TRAIT_LOYAL}
	                [/modifications]
	            [/unit]
	        [/then]
	    [/if]

	    [if]
	        [variable]
	            name=s9_monkey_recruited
	            equals=true
	        [/variable]
	        [then]
	            [unit]
	                side=1
	                id=Monkey
	                type=Monkey
	                random_traits=no
	                x,y=13,11
	                facing=nw
	                [modifications]
	                    {TRAIT_LOYAL}
	                [/modifications]
	            [/unit]
	        [/then]
	    [/if]

	    [modify_side]
	        side=3
	        scroll_to_leader=no
	    [/modify_side]

	    [scroll_to]
	        x,y=11,11
	        immediate=yes
	    [/scroll_to]
	[/event]

	###########
	## START ##
	###########
	[event]
	    name=start

	    [lock_view][/lock_view]

	    {DELAY 1000}

	    {SPEAK_FAISIM _"TEST"}

	    {DELAY 500}

	    ##magic circle
	    [sound]
	        name=skill-illusion.wav
	    [/sound]
	    {FLASH_WHITE (
	        [item]
	            x,y=11,10
	            halo="halo/soul_merge_aura/ucircle-frames/ucircle-b-[07~23].png:80"
	        [/item]
	        [item]
	            x,y=11,10
	            halo="halo/soul_merge_aura/megacircle2/00[00~71].png:42"
	        [/item]
	    )}
	    [redraw][/redraw]

	    {DELAY 800}

	    {SPEAK_FAISIM _"TEST"}

	    {QUAKE rumble.ogg}

	    {DELAY 600}

	    ##haralin arrives
	    [sound]
	        name=skill-illusion.wav
	    [/sound]
	    {FLASH_WHITE (
	        [if]
	            [have_unit]
	                id=Haralin
	                search_recall_list=yes
	            [/have_unit]
	            [then]
	                {RECALL_XY Haralin 11 10}
	            [/then]
	            [else]
	                [unit]
	                    side=1
	                    id=Haralin
	                    type,name=Haralin_L3,_"Haralin"
	                    unrenamable=yes
	                    x,y=11,10
	                    {CTL_HARALIN_MODIFICATIONS}
	                [/unit]
	            [/else]
	        [/if]
	        {CASTER_STATUS id=Haralin no}
	        {MODIFY_UNIT id=Haralin profile portraits/haralin/Haralin_L3.png}
	        {MODIFY_UNIT id=Haralin hitpoints 3}
	        {MODIFY_UNIT id=Haralin facing s}
	    )}
	    {QUAKE rumble.ogg}
	    [redraw][/redraw]

	    {DELAY 700}

	    ##circle fades
	    [sound]
	        name=skill-illusion.wav
	    [/sound]
	    {FLASH_WHITE (
	        [remove_item]
	            x,y=11,10
	        [/remove_item]
	    )}
	    [redraw][/redraw]

	    {DELAY 1000}

	    {SPEAK Haralin _"TEST"}
	    {SPEAK_FAISIM _"TEST"}
	    {SPEAK Haralin _"TEST"}

	    [if]
	        [have_unit]
	            id=Synyr
	        [/have_unit]
	        [then]
	            {SPEAK Synyr _"TEST"}
	        [/then]
	    [/if]

	    [if]
	        [have_unit]
	            id=Monkey
	        [/have_unit]
	        [then]
	            {SPEAK Monkey _"TEST"}
	        [/then]
	    [/if]

	    {SPEAK_FAISIM _"TEST"}
	    {SPEAK Haralin _"TEST"}

	    {SPEAK_FAISIM _"ТЕСТ s12x_go_after_caror"}
	    {SPEAK Haralin _"ТЕСТ s12x_army_dead"}
	    {SPEAK_FAISIM _"ТЕСТ s12x_offer_undead"}
	    {SPEAK Haralin _"ТЕСТ s12x_refuse_undead"}
	    {SPEAK_FAISIM _"ТЕСТ s12x_illusion"}
	    {SPEAK Haralin _"ТЕСТ s12x_illusion"}

	    ##faisim joins as a hero
	    [modify_unit]
	        [filter]
	            id=Faisim
	        [/filter]
	        side=1
	        canrecruit=no
	        extra_recruit=""
	    [/modify_unit]
	    {CTL_FAISIM_HERO}
	    [assign_caster]
	        [filter]
	            id=Faisim
	        [/filter]
	        spell_group_1 = skill_astral_arms
	        spell_group_2 = skill_shadowstep
	        spell_group_3 = skill_astral_chains
	        spell_group_4 = skill_haste
	        unlocked_spells = skill_astral_arms, skill_arms_astral, skill_arms_blade, skill_arms_spear, skill_arms_mace, skill_arms_daggers, skill_shadowstep, skill_astral_chains, skill_haste
	        equipped_spells = skill_astral_arms, skill_shadowstep, skill_astral_chains, skill_haste
	    [/assign_caster]

	    {DELAY 500}

	    ##leave through the signpost
	    {MOVE_UNIT id=Faisim 23 18}
	    [put_to_recall_list]
	        id=Faisim
	    [/put_to_recall_list]
	    {MOVE_UNIT id=Haralin 23 18}
	    [put_to_recall_list]
	        id=Haralin
	    [/put_to_recall_list]
	    {MOVE_UNIT id=Synyr 23 18}
	    [put_to_recall_list]
	        id=Synyr
	    [/put_to_recall_list]
	    {MOVE_UNIT id=Monkey 23 18}
	    [put_to_recall_list]
	        id=Monkey
	    [/put_to_recall_list]

	    {DELAY 500}

	    {FADE_TO_BLACK}

	    {DELAY 500}

	    [endlevel]
	        result=victory
	        bonus=no
	        carryover_report=no
	        replay_save=no
	        linger_mode=no
	    [/endlevel]
	[/event]
[/scenario]
