#textdomain wesnoth-ctl
[scenario]
	id=15_Guile
	#po: Підступ
	name= _ "Guile"
	map_data="{~add-ons/Chasing_the_Light/maps/14_Requiem.map}"
	{DEFAULT_SCHEDULE_AFTERNOON}

	turns=-1
	carryover_percentage=0
	victory_when_enemies_defeated=no
	theme=Cutscene_Minimal

	{INTRO_AND_SCENARIO_MUSIC revelation.ogg revelation.ogg}

	###########
	## SIDES ##
	###########
	[side]
		side=1
		id,defeat_condition=Haralin,never
		no_leader=yes
		controller=human
		team_name=Islefolk
		shroud=yes
		fog=no
		share_vision=all
		{FLAG_VARIANT long}
		#po: Загін Гараліна
		user_team_name=_"Haralin's Squad"
#ifdef MULTIPLAYER
		allow_player=yes
#endif
	[/side]

	{CTL_COOP_SIDE_RESERVED}

	##############
	## PRESTART ##
	##############
	[event]
		name=prestart
		{FADE_TO_BLACK}
	[/event]

	###########
	## ОУТРО ##
	###########
	[event]
		name=start

		[outro_teaser]
			#po: Гонитва за Світлом: Розділ IV
			title= _ "Chasing the Light: Chapter IV"
		[/outro_teaser]

		{REPLACE_SCENARIO_MUSIC return_to_wesnoth.ogg}

		[endlevel]
			result=victory
			carryover_report=no
			linger_mode=no
			end_credits=no
		[/endlevel]
	[/event]
[/scenario]
